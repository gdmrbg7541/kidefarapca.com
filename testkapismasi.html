<body>
<div id="game-wrapper">
    <button id="fullscreen-btn" data-i18n-title="oyn.tam_ekran" title="Tam Ekran">
        <svg class="icon-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M5 10h2V7h3V5H5v5zM14 5v2h3v3h2V5h-5zM5 19v-5h2v3h3v2H5zM14 19v-2h3v-3h2v5h-5z"/>
        </svg>
        <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
        </svg>
    </button>

    <div class="screen active" id="start-screen">
        <div class="back-button-container">
            <a href="index.html" onclick="return kidefGeriDon(event)" class="back-button" data-i18n-title="sn.siteye_don" title="Siteye Dön" data-kidef-done="1">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </a>
        </div>

        <div class="start-options">
            <div class="option-group">
                <label for="player-select" data-i18n="tk.oyuncu_sayisi">Oyuncu Sayısı:</label>
                <div class="player-buttons" id="player-select">
                    <button class="player-button" data-players="1" data-i18n="oyn.tek">Tek Kişilik</button>
                    <button class="player-button" data-players="2" data-i18n="oyn.iki">İki Kişilik</button>
                </div>
            </div>
            <div class="option-group">
                <label for="lesson-select" data-i18n="tk.ders_secimi">Ders Seçimi:</label>
                <select id="lesson-select" disabled required>
                    <option value="" disabled selected data-i18n="tk.once_mod">Önce Oyuncu Modu Seçin</option>
                </select>
            </div>
            <!-- KAPIŞMA AYARLARI (07.10.2026) — öğretmen: "iki kişinin aynı
                 soruları aynı sırada çözmesi veya aynı soruları farklı
                 sıralama ile çözülmesi, benzer ama farklı sorular sorulması,
                 bi turun kaç soru olacağı, hız puanının etkisi vb açıdan
                 zenginleştirme." Yalnız İKİ KİŞİLİK seçilince görünür; tek
                 kişilikte anlamı yok. Seçimler tarayıcıda saklanır, her
                 oyunda yeniden seçmek gerekmez. -->
            <div class="option-group kap-ayar" id="kapisma-ayar" hidden>
                <label data-i18n="tk.kapisma_ayar">Kapışma Ayarları:</label>

                <div class="kap-satir">
                    <span class="kap-bas" data-i18n="tk.tur_basina">Tur başına soru</span>
                    <div class="kap-secenek" id="kap-soru">
                        <button type="button" data-v="5">5</button>
                        <button type="button" data-v="7">7</button>
                        <button type="button" data-v="10">10</button>
                        <button type="button" data-v="15">15</button>
                    </div>
                </div>

                <div class="kap-satir">
                    <span class="kap-bas" data-i18n="tk.sorular">Sorular</span>
                    <div class="kap-secenek kap-genis" id="kap-kaynak">
                        <button type="button" data-v="ayni"
                            data-i18n-title="tk.ayni_sira_ip" title="İkisi de aynı soruları aynı sırada görür — tam eşit yarış" data-i18n="tk.ayni_sira">Aynı · aynı sıra</button>
                        <button type="button" data-v="karisik"
                            data-i18n-title="tk.ayni_karisik_ip" title="Aynı sorular, farklı sırada — yan tarafa bakmak işe yaramaz" data-i18n="tk.ayni_karisik">Aynı · karışık</button>
                        <button type="button" data-v="farkli"
                            data-i18n-title="tk.farkli_ip" title="Aynı dersten farklı kelimeler — benzer zorlukta, ayrı sorular" data-i18n="tk.farkli">Farklı sorular</button>
                    </div>
                </div>

                <div class="kap-satir">
                    <span class="kap-bas" data-i18n="tk.hiz_puani">Hız puanı</span>
                    <div class="kap-secenek" id="kap-hiz">
                        <button type="button" data-v="0" data-i18n-title="tk.hiz_yok_ip" title="Yalnız doğru cevap sayılır" data-i18n="tk.hiz_yok">Yok</button>
                        <button type="button" data-v="5" data-i18n-title="tk.hiz_az_ip" title="Doğru 10, hız 5" data-i18n="tk.hiz_az">Az</button>
                        <button type="button" data-v="10" data-i18n-title="tk.hiz_normal_ip" title="Doğru 10, hız 10" data-i18n="tk.hiz_normal">Normal</button>
                        <button type="button" data-v="20" data-i18n-title="tk.hiz_cok_ip" title="Doğru 10, hız 20 — hız belirleyici" data-i18n="tk.hiz_cok">Çok</button>
                    </div>
                </div>

                <p class="kap-not" id="kap-not"></p>
            </div>

            <button disabled id="start-game-btn" data-i18n="oyn.basla">Başla</button>
        </div>
    </div>

    <div class="screen" id="quiz-screen">
        <div class="back-button-container">
            <button class="back-button" id="quiz-back-btn" data-i18n-title="nav.menu_don" title="Ana Menüye Dön">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="screen results-screen" id="results-screen"></div>
</div>

<script src="sistem/gorevkopru.js?v=d5377b75"></script>

<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
    <!-- DİL: sayfa seçili dili localStorage'dan okur, başka
         sekmede dil değişirse anında döner (sistem/dil.js). -->
