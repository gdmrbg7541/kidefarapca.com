<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arapça Sözlük Alıştırması</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Harmattan:wght@400;500;700&family=Marhey:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="sozluk/sozluksimulasyon.css">
    <link rel="stylesheet" href="arakom.css?v=1">
</head>
<body>
    
    <div class="aspect-ratio-wrapper">
        <div class="game-container">
            
            <div class="content-wrapper">
                <div class="header">
                    <h1>Arapça Sözlük Alıştırması</h1>
                    <div class="header-buttons">
                        <a href="index.html" onclick="return kidefGeriDon(event)" id="back-btn" target="_blank">&#8592;</a> <button id="joker-btn">Joker (3)</button> <button id="hint-btn">💡 İpuçları</button>
                    </div>
                </div>

                <div class="level-selector">
                    <button class="level-btn active" data-level="0">Seviye 1</button>
                    <button class="level-btn" data-level="1">Seviye 2</button>
                    <button class="level-btn" data-level="2">Seviye 3</button>
                    <button class="level-btn" data-level="3">Seviye 4</button>
                    <button class="level-btn" data-level="4">Seviye 5</button> </div>

                <hr> <div class="main-content-area" id="main-content-area">
                    <div class="sentence-display-area" id="sentence-display-area">
                        </div>

                    <div class="input-area" id="input-area">
                        
                        <div id="start-prompt">
                            <div id="start-rules-container">
                                </div>
                            <button id="start-btn" type="button">Başla</button>
                        </div>

                        <div class="prompt-container" id="prompt-container">
                            <div id="guess-prompt">
                                <p>Türkçe Cümleyi Tahmin Et</p>
                                <button id="guess-prompt-btn" type="button">✓</button>
                            </div>
                            <div class="full-turkish-sentence-container" id="full-turkish-container-static">
                                </div>
                        </div>

                        <div class="input-wrapper" id="input-wrapper">
                            <button id="submit-btn" type="button">✓</button>
                            <input type="text" id="user-input" placeholder="" readonly>
                        </div>
                        
                        <div class="keyboard" id="keyboard">
                            </div>
                    </div>
                </div> </div> </div> </div> <div id="hint-modal" class="modal">
        <div class="modal-content">
            <span id="hint-modal-close" class="close-btn">&times;</span>
            <div class="modal-body" id="modal-body">
                </div>
        </div>
    </div>
    
    <div id="error-modal" class="modal">
        <div class="modal-content">
            <div id="error-modal-body">
                </div>
            <button id="error-modal-close" type="button">Onay</button>
        </div>
    </div>


    <script src="sozluk/sozluksimulasyon.js"></script>
    <script src="sistem/geri.js?v=20260808a"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
</html>
