    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #2c3e50;
            --timer-bg: #ecf0f1;
            --border-color: #eee;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 1. ARAPÇA ALAN --- */
        .arabic-area {
            flex-grow: 1;
            padding: 2vh 3vh;
            overflow-y: auto;
            direction: rtl;
            font-family: 'Scheherazade New', serif;
            font-size: 5.5vh;
            line-height: 2.2;
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            text-align: center;
            gap: 20px;
        }

        /* --- 2. TÜRKÇE ALAN --- */
        .turkish-area {
            height: 20vh;
            padding: 0.5vh 1vh;
            background-color: #fcfcfc;
            border-top: 4px solid var(--border-color);
            overflow-y: auto;
            font-size: 4vh;
            line-height: 1.0;
            text-align: center;
            color: #7f8c8d;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 5px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
        }

        /* --- KELİME STİLLERİ --- */
        .word-span, .tr-word {
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0 2px;
            border-radius: 4px;
        }

        .interact-word {
            font-weight: 700;
        }

        .active-highlight {
            font-weight: 900 !important;
            transform: scale(1.02); 
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .solved {
            font-weight: bold;
            cursor: default;
        }

        /* --- 3. ŞIKLAR ALANI --- */
        .options-area {
            height: 35vh;
            background: #fff;
            padding: 2vh;
            border-top: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .timer-container {
            width: 100%;
            height: 1vh;
            background-color: var(--timer-bg);
            border-radius: 1vh;
            overflow: hidden;
            margin-bottom: 1.5vh;
            flex-shrink: 0;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background-color: #27ae60;
            transition: width 0.1s linear;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1.5vh;
            flex-grow: 1;
        }

        .option-btn {
            background: #fdfdfd;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: 'Scheherazade New', serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(3vh, 5vw, 5vh);
            transition: transform 0.1s;
            color: #333;
        }

        .option-btn:active { transform: scale(0.96); background: #eee; }

        .correct-opt { background: #fff !important; border-color: #27ae60 !important; color: #27ae60 !important; font-weight: bold; }
        .wrong-opt { background: #fff !important; border-color: #c0392b !important; color: #c0392b !important; }

        .next-sentence-btn {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background-color: #2c3e50;
            color: white;
            padding: 2vh 5vh;
            border-radius: 50px;
            font-size: 3vh;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 200;
            transition: transform 0.4s;
        }
        .next-sentence-btn.show { transform: translate(-50%, -50%) scale(1); }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            display: none;
            z-index: 5;
        }
        .overlay.active { display: block; }

/* --- Geri Tuşu Tasarımı --- */
.back-button-container {
    position: absolute; /* Arapça alanının içinde bağımsız konumlanması için */
    top: 2vh;
    left: 2vh;
    z-index: 100;
}

.back-button {
    background: #ffffff;
    color: #2c3e50;
    border: 2px solid #eee;
    border-radius: 12px;
    cursor: pointer;
    width: 50px;
    height: 50px;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}

.back-button:hover {
    background: #f8f9fa;
    border-color: #2c3e50;
    transform: translateX(-3px);
}

.back-button svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
}

/* Mobil cihazlarda butonun içeriği kapatmaması için ayar */
@media (max-width: 768px) {
    .back-button {
        width: 40px;
        height: 40px;
        border-radius: 10px;
    }
    .back-button svg {
        width: 20px;
        height: 20px;
    }
}

                        correct: "الْعَالَمِيُّ",
                        options: ["الْعَالَمِيُّ", "الْعَالَمِيَّ", "الْعَالَمِيِّ", "الْعَالَمِيْ"] 
                    },
                    { 
                        text: "النيزك", isTarget: true, refId: "tr-5-meteor", 
                        correct: "النَّيْزَكَ",
                        options: ["النَّيْزَكَ", "النَّيْزَكُ", "النَّيْزَكِ", "النَّيْزِكَ"] 
                    },
                    { text: "بأنه", isTarget: false, refId: "tr-5-olarak", vowelized: "بِأَنَّهُ" },
                    { 
                        text: "جسم", isTarget: true, refId: "tr-5-cisim", 
                        correct: "جِسْمٌ",
                        options: ["جِسْمٌ", "جِسْمًا", "جِسْمٍ", "جَسْمٌ"] 
                    },
                    { 
                        text: "صلب", isTarget: true, refId: "tr-5-sert", 
                        correct: "صُلْبٌ",
                        options: ["صُلْبٌ", "صُلْبًا", "صُلْبٍ", "صَلْبٌ"] 
                    },
                    { 
                        text: "صغير", isTarget: true, refId: "tr-5-kucuk", 
                        correct: "صَغِيرُ",
                        options: ["صَغِيرُ", "صَغِيرَ", "صَغِيرِ", "صَغَّيرُ"] 
                    },
                    { 
                        text: "الحجم", isTarget: true, refId: "tr-5-hacim", 
                        correct: "الْحَجْمِ",
                        options: ["الْحَجْمِ", "الْحَجْمَ", "الْحَجْمُ", "الْحُجْمِ"] 
                    }
                ]
            }
        ];

        let currentSentenceIndex = 0;
        let currentTargetIndex = -1;
        let solvedCount = 0;
        let totalTargets = 0;
        let questionTimerInterval;
        const QUESTION_TIME_LIMIT = 15;

       function loadSentence(index) {
            // -- YAMA BAŞLANGICI: Panel Görünümlerini Sıfırla --
            document.getElementById('success-panel').style.display = 'none'; // Bitiş panelini gizle
            document.getElementById('options-grid').style.display = 'grid';  // Şıkları göster
            document.getElementById('timer-box').style.visibility = 'visible'; // Sayacı göster
            // -- YAMA BİTİŞİ --

            if (index >= sentences.length) {
                alert("Tebrikler! Bitti.");
                return;
            }

            const data = sentences[index];
            const arContainer = document.getElementById('arabic-container');
            const trContainer = document.getElementById('turkish-container');
            
            arContainer.innerHTML = '';
            trContainer.innerHTML = data.trHtml;
            resetOptionsGrid();
            
            solvedCount = 0;
            totalTargets = data.words.filter(w => w.isTarget).length;
            let colorIndex = 0;

            data.words.forEach((item, idx) => {
                const span = document.createElement('span');
                span.innerText = item.text + " ";
                span.className = 'word-span';
                span.id = `word-${idx}`;
                
                if (item.isTarget) {
                    span.classList.add('interact-word');
                    const myColor = colorPalette[colorIndex % colorPalette.length];
                    span.dataset.color = myColor; 
                    span.style.color = myColor; 
                    colorIndex++;
                } else {
                    span.style.color = '#7f8c8d';
                }
                
                span.onclick = () => handleArabicClick(idx, item.refId, item.isTarget);
                arContainer.appendChild(span);
            });
        }

        function resetOptionsGrid() {
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            for(let i=0; i<4; i++) {
                const div = document.createElement('div');
                div.className = 'option-btn';
                div.innerText = '...';
                div.style.color = '#eee';
                grid.appendChild(div);
            }
        }

        // --- GÜNCELLENMİŞ TIKLAMA MANTIĞI ---
        function handleArabicClick(index, refId, isTarget) {
            clearHighlights();

            const wordEl = document.getElementById(`word-${index}`);
            // Datayı alalım
            const wordData = sentences[currentSentenceIndex].words[index];

            const myColor = wordEl.dataset.color || '#2c3e50';
            wordEl.classList.add('active-highlight');

            // --- YENİ EKLENEN KISIM: GRİ KELİMEYSE HAREKELİ HALİNİ GÖSTER ---
            if (!isTarget && wordData.vowelized) {
                // Sadece metni değiştir, soru sorma.
                wordEl.innerText = wordData.vowelized + " ";
                // Okunduğunu belli etmek için rengi hafif koyulaştırabiliriz
                wordEl.style.color = '#34495e';
            }
            // ----------------------------------------------------------------

            if (refId) {
                const trEl = document.getElementById(refId);
                if(trEl) applyStyle(trEl, myColor);
            }

            if (isTarget && !wordEl.classList.contains('solved')) {
                loadOptions(index);
            } else {
                resetOptionsGrid(); 
            }
        }

        function handleTrClick(refId) {
            const words = sentences[currentSentenceIndex].words;
            let targetIdx = words.findIndex(w => w.refId === refId && w.isTarget);
            
            if (targetIdx === -1) {
                targetIdx = words.findIndex(w => w.refId === refId);
            }

            if (targetIdx !== -1) {
                handleArabicClick(targetIdx, words[targetIdx].refId, words[targetIdx].isTarget);
                const el = document.getElementById(`word-${targetIdx}`);
                el.scrollIntoView({behavior: "smooth", block: "center"});
            }
        }

        function applyStyle(el, color) {
            el.style.color = color;
            el.classList.add('active-highlight');
        }

        function clearHighlights() {
            document.querySelectorAll('.active-highlight').forEach(el => {
                el.classList.remove('active-highlight');
                if(el.classList.contains('tr-word')) el.style.color = '';
            });
            stopQuestionTimer();
        }

        function loadOptions(index) {
            currentTargetIndex = index;
            const wordObj = sentences[currentSentenceIndex].words[index];
            const grid = document.getElementById('options-grid');
            
            let shuffledOptions = [...wordObj.options].sort(() => Math.random() - 0.5);

            grid.innerHTML = '';
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn, wordObj.correct);
                grid.appendChild(btn);
            });

            startQuestionTimer();
        }

       function checkAnswer(selected, btnElement, correct) {
            stopQuestionTimer();

            if (selected === correct) {
                btnElement.classList.add('correct-opt');
                solvedCount++;
                
                const wordEl = document.getElementById(`word-${currentTargetIndex}`);
                wordEl.classList.add('solved');
                wordEl.innerText = correct + " ";

                if (solvedCount === totalTargets) {
                    // -- YAMA BAŞLANGICI: Bitiş Aksiyonu --
                    // 1. Şıkları ve sayacı gizle
                    document.getElementById('options-grid').style.display = 'none';
                    document.getElementById('timer-box').style.visibility = 'hidden';
                    
                    // 2. Bitiş panelini (butonu) göster
                    document.getElementById('success-panel').style.display = 'flex';
                    // -- YAMA BİTİŞİ --
                }
            } else {
                btnElement.classList.add('wrong-opt');
            }
        }

        function startQuestionTimer() {
            const bar = document.getElementById('question-timer-bar');
            let timeLeft = QUESTION_TIME_LIMIT;
            bar.style.width = '100%';
            
            if (questionTimerInterval) clearInterval(questionTimerInterval);

            questionTimerInterval = setInterval(() => {
                timeLeft -= 0.1;
                bar.style.width = (timeLeft / QUESTION_TIME_LIMIT) * 100 + "%";
                if (timeLeft <= 0) clearInterval(questionTimerInterval);
            }, 100);
        }

        function stopQuestionTimer() {
            if (questionTimerInterval) clearInterval(questionTimerInterval);
        }

        function nextSentence() {
            currentSentenceIndex++;
            loadSentence(currentSentenceIndex);
        }

        loadSentence(0);

    </script>
</body>
</html>
