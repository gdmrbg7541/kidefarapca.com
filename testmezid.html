<!DOCTYPE html>
<html lang="tr">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Work+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1a2a3a;
            --arabic-gold: #c5a059;
            --bg-paper: #fdfaf5;
            --correct: #27ae60;
            --wrong: #c0392b;
            --font-base: 16px;
        }

        /* Temel Reset ve Esnek Yapı */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Noto Naskh Arabic';
            background-color: var(--bg-paper);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Sabit Çıkış Butonu */
        .fixed-back-nav {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--primary-dark);
            color: #fff;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 1rem;
            z-index: 1000;
            border: 1px solid var(--arabic-gold);
        }

        #quiz-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
            padding: 5px;
            justify-content: space-between;
        }

        /* Durum Çubuğu */
        .status-bar {
            text-align: center;
            font-size: 1.5rem;
            color: var(--arabic-gold);
            padding-top: 10px;
            margin-bottom: 5px;
        }

        /* Soru Metni Ölçeklendirme */
        .question-text {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            text-align: center;
            padding: 10px;
            line-height: 1.3;
        }

        .arabic-word {
            font-family: 'Noto Naskh Arabic', serif;
            font-size: 2.8rem;
            color: var(--primary-dark);
            margin: 10px 0;
            padding: 5px 15px;
            background: rgba(197, 160, 89, 0.1);
            border-radius: 10px;
            display: inline-block;
        }

        /* Şıklar - Esnek Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr; /* Mobilde tek sütun */
            gap: 12px;
            padding: 10px 0;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .option-btn {
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            background: white;
            border: 2px solid #ddd;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        /* 5. Şık Ortalama */
        .option-btn:nth-child(5) {
            grid-column: 1;
            width: 100%;
        }

        /* Geri-İleri Butonları */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding-top: 10px;
        }

        .nav-btn {
            flex: 1;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        #next-btn { background: var(--primary-dark); color: white; }
        #next-btn:disabled { background: #ccc; }
        #prev-btn { background: #e0e0e0; color: #555; }

        /* --- 10 FARKLI EKRAN SENARYOSU (MEDIA QUERIES) --- */

        /* 1. Küçük Mobil (320px) */
        @media (min-width: 320px) {
            .question-text { font-size: 1.4rem; }
            .arabic-word { font-size: 2.2rem; }
            .option-btn { padding: 12px; font-size: 1rem; }
        }

        /* 2. Orta Boy Mobil (375px) */
        @media (min-width: 375px) {
            .question-text { font-size: 1.6rem; }
            .option-btn { padding: 14px; }
        }

        /* 3. Büyük Mobil / iPhone Plus (414px) */
        @media (min-width: 414px) {
            .question-text { font-size: 1.8rem; }
            .arabic-word { font-size: 2.5rem; }
        }

        /* 4. Küçük Tablet / Portre (600px) */
        @media (min-width: 600px) {
            .options-grid { grid-template-columns: 1fr 1fr; } /* İki sütuna geçiş */
            .option-btn:nth-child(5) { grid-column: 1 / span 2; width: 60%; justify-self: center; }
            .question-text { font-size: 2.2rem; }
        }

        /* 5. Standart Tablet (768px) */
        @media (min-width: 768px) {
            #quiz-container { padding: 40px; }
            .question-text { font-size: 2.6rem; }
            .arabic-word { font-size: 3.5rem; }
            .nav-btn { font-size: 1.5rem; }
        }

        /* 6. Düşük Çözünürlüklü Laptop (1024px) */
        @media (min-width: 1024px) {
            .question-text { font-size: 3rem; }
            .option-btn { padding: 10px; font-size: 3rem; }
        }

        /* 7. Standart Masaüstü (1280px) */
        @media (min-width: 1280px) {
            .question-text { font-size: 3.2rem; }
            .arabic-word { font-size: 4.5rem; }
        }

        /* 8. Full HD Ekran / Projeksiyon (1920px) */
        @media (min-width: 1920px) {
            .question-text { font-size: 4rem; }
            .arabic-word { font-size: 6rem; }
            .option-btn { padding: 10px; font-size: 3.5rem; }
        }

        /* 9. 2K Ekran (2560px) */
        @media (min-width: 2560px) {
            .question-text { font-size: 5rem; }
            .arabic-word { font-size: 8rem; }
        }

        /* 10. Yatay (Landscape) Mobil Modu */
        @media (max-height: 500px) and (orientation: landscape) {
            .question-text { font-size: 1.2rem; flex-direction: row; }
            .arabic-word { font-size: 1.8rem; margin: 0 10px; }
            .options-grid { grid-template-columns: 1fr 1fr; gap: 5px; }
            .option-btn { padding: 8px; font-size: 0.9rem; }
            .status-bar { padding-top: 10px; font-size: 1rem; }
        }

        /* Doğru/Yanlış Efektleri */
        .correct { background-color: var(--correct) !important; color: white !important; }
        .wrong { background-color: var(--wrong) !important; color: white !important; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    </style>
</head>
<body>

<a href="mezidfiiller.html" class="fixed-back-nav">←</a>

<div id="quiz-container">
    <div class="status-bar" id="counter">Soru: 1 / 30</div>
    <div id="question" class="question-text"></div>
    <div id="options" class="options-grid"></div>
    <div class="bottom-nav">
        <button id="prev-btn" class="nav-btn">GERİ</button>
        <button id="next-btn" class="nav-btn" disabled>İLERİ</button>
    </div>
</div>

<script>
// Web Audio API Sinüs Dalgası Sistemi
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, type, duration) {
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + duration);
}

const sounds = {
    correct: () => { playTone(880, 'sine', 0.4); },
    wrong: () => { playTone(150, 'sawtooth', 0.3); },
    click: () => { playTone(440, 'sine', 0.05); }
};

const rawData = [
    { q: "'اِقْتِـرَان' kelimesi hangi kalıptandır?", a: "İfti’âl", options: ["İf’âl", "Tef’îl", "Müfâ’ale", "İnfi’âl", "İfti’âl"] },
    { q: "'يَصْفَرُّ' kelimesi hangi kalıptandır?", a: "İf’ilâl", options: ["Müfâ’ale", "İnfi’âl", "İfti’âl", "İf’ilâl", "Tefâul"] },
    { q: "'تَفَضَّلْ' kelimesi hangi kalıptandır?", a: "Tefe’ul", options: ["Müfâ’ale", "İnfi’âl", "İfti’âl", "Tefe’ul", "Tefâul"] },
    { q: "'مُتَشَائِم' kelimesi hangi kalıptandır?", a: "Tefâul", options: ["Müfâ’ale", "İfti’âl", "Tefe’ul", "Tefâul", "İstif’âl"] },
    { q: "'اِسْتِـرْحَام' kelimesi hangi kalıptandır?", a: "İstif’âl", options: ["Müfâ’ale", "İnfi’âl", "İfti’âl", "İf’ilâl", "İstif’âl"] },
    { q: "'يُدْرِكُ' kelimesi hangi kalıptandır?", a: "İf’âl", options: ["İf’âl", "Tef’îl", "Müfâ’ale", "İnfi’âl", "İfti’âl"] },
    { q: "'مُدَرِّس' kelimesi hangi kalıptandır?", a: "Tef’îl", options: ["İf’âl", "Tef’îl", "Müfâ’ale", "İnfi’âl", "İfti’âl"] },
    { q: "'مُحَاسَبَة' kelimesi hangi kalıptandır?", a: "Müfâ’ale", options: ["İf’âl", "Tef’îl", "Müfâ’ale", "İnfi’âl", "İfti’âl"] },
    { q: "'يَرْتَبِطُ' kelimesi hangi kalıptandır?", a: "İfti’âl", options: ["İf’âl", "Tef’îl", "Müfâ’ale", "İnfi’âl", "İfti’âl"] },
    { q: "Sadece şedde ( ّ ) alarak türeyen kelimeler hangi kalıptadır?", a: "Tef’îl", options: ["Tef’îl", "Müfâ’ale", "İfti’âl", "Tefe’ul", "Tefâul"] },
    { q: "T ( تَـ ) ve şedde ( ّ ) alarak türeyen kelimeler hangi kalıptadır?", a: "Tefe’ul", options: ["Tef’îl", "Müfâ’ale", "İfti’âl", "Tefe’ul", "Tefâul"] },
    { q: "Sadece hemze ( أ ) alarak türeyen kelimeler hangi kalıptadır?", a: "İf’âl", options: ["İf’âl", "Tef’îl", "Müfâ’ale", "İnfi’âl", "İfti’âl"] },
    { q: "Sadece elif ( ــا ) alarak türeyen kelimeler hangi kalıptadır?", a: "Müfâ’ale", options: ["İf’âl", "Tef’îl", "Müfâ’ale", "İnfi’âl", "İfti’âl"] },
    { q: "'حَافَظَ' kelimesi hangi kalıptandır?", a: "Müfâ’ale", options: ["İf’âl", "Tef’îl", "Müfâ’ale", "İnfi’âl", "İfti’âl"] },
    { q: "'مُنْحَرِف' kelimesi hangi kalıptandır?", a: "İnfi’âl", options: ["İf’âl", "Tef’îl", "Müfâ’ale", "İnfi’âl", "İfti’âl"] },
    { q: "'اِحْتَمَلَ' kelimesi hangi kalıptandır?", a: "İfti’âl", options: ["Müfâ’ale", "İnfi’âl", "İfti’âl", "İf’ilâl", "İstif’âl"] },
    { q: "'اِحْمَـرَّ' kelimesi hangi kalıptandır?", a: "İf’ilâl", options: ["İf’âl", "İnfi’âl", "İfti’âl", "İf’ilâl", "İstif’âl"] },
    { q: "'تَحَكُّم' kelimesi hangi kalıptandır?", a: "Tefe’ul", options: ["Müfâ’ale", "İnfi’âl", "İfti’âl", "Tefe’ul", "Tefâul"] },
    { q: "'يَتَمَايَلُ' kelimesi hangi kalıptandır?", a: "Tefâul", options: ["Müfâ’ale", "İfti’âl", "Tefe’ul", "Tefâul", "İstif’âl"] },
    { q: "'اِسْتَخْبَـرَ' kelimesi hangi kalıptandır?", a: "İstif’âl", options: ["İnfi’âl", "İfti’âl", "Tefe’ul", "İf’âl", "İstif’âl"] },
    { q: "'إِقْنَاع' kelimesi hangi kalıptandır?", a: "İf’âl", options: ["İf’âl", "Tef’îl", "Müfâ’ale", "İnfi’âl", "İfti’âl"] },
    { q: "'تَثْبِـيت' kelimesi hangi kalıptandır?", a: "Tef’îl", options: ["İf’âl", "Tef’îl", "Müfâ’ale", "İnfi’âl", "İfti’âl"] },
    { q: "'يُمَارِسُ' kelimesi hangi kalıptandır?", a: "Müfâ’ale", options: ["İf’âl", "Tef’îl", "Müfâ’ale", "İnfi’âl", "İfti’âl"] },
    { q: "'اِنْحِصَار' kelimesi hangi kalıptandır?", a: "İnfi’âl", options: ["İf’âl", "Tef’îl", "Müfâ’ale", "İnfi’âl", "İfti’âl"] },
    { q: "'مُتَفَكِّر' kelimesi hangi kalıptandır?", a: "Tefe’ul", options: ["Müfâ’ale", "İfti’âl", "Tefe’ul", "Tefâul", "İstif’âl"] },
    { q: "Hemze ( ا ) ve te harfi ( تـ ) alarak türeyen kelimeler hangi kalıptadır?", a: "İfti’âl", options: ["İf’âl", "İfti’âl", "İf’ilâl", "İnfi’âl", "İstif’âl"] },
    { q: "Hemze ( ا ) ve şedde ( ّ ) alarak türeyen bir fiil hangi kalıptandır?", a: "İf’ilâl", options: ["İf’âl", "İfti’âl", "İf’ilâl", "İnfi’âl", "İstif’âl"] },
    { q: "Hemze ( ا ), sin ( ـسـ ) ve t ( ـتـ ) alarak türeyen bir fiil hangi kalıptandır?", a: "İstif’âl", options: ["İf’âl", "İfti’âl", "İf’ilâl", "İnfi’âl", "İstif’âl"] },
    { q: "'نَسْتَقْبِلُ' kelimesini sözlükte nasıl aramalıyız?", a: "اِسْتَقْبَلَ", options: ["اِسْتَقْبِلُ", "يَسْتَقْبِلُ", "أَسْتَقْبِلُ", "مُسْتَقْبَلٌ", "اِسْتَقْبَلَ"] },
    { q: "'تَمَتَّعْتُمْ' kelimesini sözlükte nasıl aramalıyız?", a: "تَمَتَّعَ", options: ["تَعْتُمْ", "تَمَتَّعَ", "مَتَعَ", "مَتَّعْتُ", "يَتَمَتَّعُ"] }
];

let questions = [...rawData].sort(() => Math.random() - 0.5);
let currentIdx = 0;
let userAnswers = new Array(questions.length).fill(null);

function updateUI() {
    const data = questions[currentIdx];
    document.getElementById('counter').innerText = `Soru: ${currentIdx + 1} / ${questions.length}`;
    document.getElementById('question').innerHTML = data.q.replace(/'([^']+)'/g, '<br><span class="arabic-word">$1</span><br>');

    const optionsEl = document.getElementById('options');
    optionsEl.innerHTML = '';
    data.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        if (userAnswers[currentIdx]) {
            if (opt === data.a) btn.classList.add('correct');
            else if (opt === userAnswers[currentIdx]) btn.classList.add('wrong');
            btn.disabled = true;
        }
        btn.onclick = () => {
            userAnswers[currentIdx] = opt;
            if (opt === data.a) { sounds.correct(); btn.classList.add('correct'); }
            else { sounds.wrong(); btn.classList.add('wrong'); 
                   Array.from(optionsEl.children).forEach(b => { if(b.innerText === data.a) b.classList.add('correct'); });
            }
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
            document.getElementById('next-btn').disabled = false;
        };
        optionsEl.appendChild(btn);
    });
    document.getElementById('next-btn').disabled = !userAnswers[currentIdx];
    document.getElementById('prev-btn').disabled = currentIdx === 0;
}

document.getElementById('next-btn').onclick = () => { if (currentIdx < questions.length - 1) { sounds.click(); currentIdx++; updateUI(); } };
document.getElementById('prev-btn').onclick = () => { if (currentIdx > 0) { sounds.click(); currentIdx--; updateUI(); } };

updateUI();
</script>
</body>
</html>
