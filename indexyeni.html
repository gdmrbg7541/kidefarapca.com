<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kidef Arapça — Harften Hikâyeye</title>
<meta name="description" content="Arapçayı hissederek öğren.">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="indexyeni.css">
</head>
<body>

<div id="okCubuk"></div>
<div class="acilis-kanat" id="acilisSol"><div class="kulp"></div></div>
<div class="acilis-kanat" id="acilisSag"><div class="kulp"></div></div>
<div id="gecis"></div>
<div id="hale"></div>
<a id="iceriKapi" href="index.html" title="Animasyonu atla, doğrudan siteye gir">
  <svg width="34" height="34" viewBox="0 0 34 34">
    <rect x="4" y="3" width="22" height="28" rx="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M12,3 L26,7 L26,31 L12,31 Z" fill="rgba(255,255,255,.28)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="16" cy="18" r="1.8" fill="#ffffff"/>
    <g class="ok-g">
      <line x1="20" y1="17" x2="31" y2="17" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M27,12.5 L32,17 L27,21.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </svg>
</a>
<nav id="noktalar">
  <a href="#hero" data-hedef="hero"></a>
  <a href="#kokPerde" data-hedef="kokPerde"></a>
  <a href="#oyunPerde" data-hedef="oyunPerde"></a>
  <a href="#gizemPerde" data-hedef="gizemPerde"></a>
  <a href="#finalPerde" data-hedef="finalPerde"></a>
</nav>

<!-- 1 · HERO -->
<section id="hero">
  <canvas id="heroTuval"></canvas>
  <div class="hero-ic">
    <div class="hero-ar arabic">الْعَرَبِيَّة</div>
    <h1 class="hero-tr" id="heroBaslik"></h1>
    <div class="hero-hos">أَهْلًا وَسَهْلًا بِكُمْ</div>
  </div>
</section>

<!-- 2 · KELİME FABRİKASI -->
<section class="perde" id="kokPerde">
  <div class="sabit" id="kokSahne">
    <div id="agac"></div>
    <div class="fabrika">
      <div class="cark-kutu" id="carkSol"></div>
      <div class="kadran" id="kadran">
        <div class="ibre"></div>
        <div class="halka" id="kadranHalka"></div>
        <div class="gobek">كـ ـتـ ـب</div>
      </div>
      <div class="cark-kutu" id="carkSag"></div>
    </div>
    <div class="dovme" id="dovme"></div>
  </div>
</section>

<!-- 4 · OYUN SAHASI -->
<section class="perde" id="oyunPerde">
  <div class="sabit" id="oyunSahne">
    <canvas id="oyunTuval"></canvas>
    <div class="oyun-ic">
      <div id="lunapark"></div>
      <div class="saha">
        <div id="takimA"></div>
        <div id="kumKart"></div>
        <div id="takimB"></div>
      </div>
    </div>
  </div>
</section>

<!-- 5 · SİS ODASI -->
<section class="perde" id="gizemPerde">
  <div class="sabit" id="gizemSahne">
    <div id="sisKelimeler"></div>
    <div id="gizemMetin">
      <div class="ar">اُطْلُبُوا الْعِلْمَ مِنَ الْمَهْدِ إِلَى اللَّحْدِ</div>
      <div class="tr">“Beşikten mezara kadar ilmi isteyin.”</div>
    </div>
    <div id="sisOrtusu"></div>
    <div id="gizemIpucu">sisin içinde gez… kaydırdıkça dağılır</div>
  </div>
</section>

<!-- 6 · ŞAFAK FİNALİ -->
<section class="perde" id="finalPerde">
  <div class="sabit" id="finalSahne">
    <div id="isik"></div>
    <div class="kapi-kanat" id="kapiSol"><div class="kulp"></div></div>
    <div class="kapi-kanat" id="kapiSag"><div class="kulp"></div></div>
    <div class="final-ic">
      <h2 class="baslik">Kısa sürede, <span class="vurgu2">etkili</span> ve <span class="vurgu">konsantre</span>…</h2>
      <div class="ozellikler" style="margin-top:5vh">
        <div class="ozellik" id="ozKron"></div>
        <div class="ozellik" id="ozHedef"></div>
        <div class="ozellik" id="ozOdak"></div>
      </div>
    </div>
  </div>
</section>

<footer>kidefarapca.com · Harften hikâyeye, hep birlikte.</footer>

<script src="indexyeni.js"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
</html>
