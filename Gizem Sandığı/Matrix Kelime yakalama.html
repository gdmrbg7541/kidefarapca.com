<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix: Hunter & Glitch</title>
    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FV9JD15KLW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FV9JD15KLW');
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=VT323&display=swap');

        :root {
            --matrix-green: #0F0;
            --matrix-dark: #003300;
            --bg-black: #000;
            --glitch-red: #ff3333;
        }

        body {
            margin: 0;
            background: var(--bg-black);
            color: var(--matrix-green);
            font-family: 'VT323', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }

        /* --- BACKGROUND CANVAS --- */
        #matrixCanvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            opacity: 0.3; /* Arka planı biraz soluk yapalım ki oyun karışmasın */
        }

        /* --- UI KATMANI --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100%;
            pointer-events: none; /* Tıklamalar arkaya geçsin (oyun için) */
        }

        /* --- ÜST MENÜ --- */
        nav {
            background: rgba(0, 20, 0, 0.9);
            border-bottom: 2px solid var(--matrix-green);
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: auto;
        }

        .nav-btn {
            background: black;
            color: var(--matrix-dark);
            border: 1px solid var(--matrix-dark);
            padding: 10px 20px;
            font-size: 1.5rem;
            cursor: pointer;
            font-family: 'VT323';
            text-transform: uppercase;
            transition: 0.3s;
        }

        .nav-btn:hover { color: var(--matrix-green); border-color: var(--matrix-green); box-shadow: 0 0 10px var(--matrix-green); }
        .nav-btn.active { background: var(--matrix-green); color: black; font-weight: bold; }

        /* --- OYUN ALANLARI --- */
        .game-container {
            flex-grow: 1;
            position: relative;
            display: none;
            pointer-events: auto;
        }
        .game-container.active { display: flex; }

        /* --- OYUN 1: RAIN HUNTER --- */
        #rain-game-area {
            width: 100%; height: 100%;
            position: relative;
            overflow: hidden;
        }

        .falling-word {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            padding: 5px 15px;
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            cursor: crosshair;
            box-shadow: 0 0 10px var(--matrix-green);
            animation: glow 1s infinite alternate;
        }

        .score-board {
            position: absolute;
            top: 20px; right: 20px;
            font-size: 2rem;
            text-shadow: 0 0 5px var(--matrix-green);
        }

        /* --- OYUN 2: THE GLITCH --- */
        #glitch-game-area {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            width: 100%;
        }

        .terminal-box {
            border: 2px solid var(--matrix-green);
            padding: 40px;
            width: 80%;
            max-width: 800px;
            text-align: center;
            background: #050505;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
        }

        .glitch-sentence {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            margin: 40px 0;
            direction: rtl;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .word-span {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            transition: 0.3s;
            position: relative;
        }

        .word-span:hover {
            background: rgba(0, 255, 0, 0.2);
            text-shadow: 2px 0 var(--glitch-red), -2px 0 blue;
        }

        /* Hata bulunduğunda */
        .patched {
            color: black !important;
            background: var(--matrix-green) !important;
            animation: patchAnim 0.5s ease;
        }

        .status-log {
            color: #666;
            font-size: 1.2rem;
            margin-top: 20px;
            min-height: 30px;
        }

        /* --- ANİMASYONLAR --- */
        @keyframes glow { from { box-shadow: 0 0 5px var(--matrix-green); } to { box-shadow: 0 0 20px var(--matrix-green); } }
        @keyframes patchAnim { 
            0% { transform: scale(1); filter: blur(5px); } 
            50% { transform: scale(1.2); filter: blur(0); } 
            100% { transform: scale(1); } 
        }

    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="ui-layer">
        <nav>
            <button class="nav-btn active" onclick="switchGame('rain')">RAIN HUNTER</button>
            <button class="nav-btn" onclick="switchGame('glitch')">THE GLITCH</button>
        </nav>

        <div id="rain-game-area" class="game-container active">
            <div class="score-board">DATA COLLECTED: <span id="score">0</span></div>
            <div id="game-field"></div>
            <div style="position:absolute; bottom:20px; width:100%; text-align:center; color:#444;">
                [ANLAMLI KELİMELERİ YAKALA]
            </div>
        </div>

        <div id="glitch-game-area" class="game-container">
            <div class="terminal-box">
                <h2 style="margin:0; border-bottom:1px dashed #333; padding-bottom:10px;">SYSTEM DIAGNOSTIC TOOL</h2>
                <p style="color:#aaa;">Gramatik hata (Glitch) tespit edildi. Onarmak için hatalı veriye tıkla.</p>
                
                <div class="glitch-sentence" id="sentence-container">
                    </div>

                <div class="status-log" id="glitch-log">SCANNING SYSTEM...</div>
                <button class="nav-btn" id="next-glitch-btn" onclick="nextGlitchLevel()" style="display:none; margin-top:20px;">NEXT SECTOR >></button>
            </div>
        </div>
    </div>

    <script>
        // --- MATRIX ARKA PLAN EFEKTİ ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        
        const chars = "أبتثجحخدذرزسشصضطظعغفقكلمنهوي١٢٣٤٥٦٧٨٩٠";
        const drops = Array(Math.floor(canvas.width / 20)).fill(1);

        function drawBg() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = "15px arial";
            drops.forEach((y, i) => {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * 20, y * 20);
                if (y * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawBg, 50);

        // --- GLOBAL KONTROLLER ---
        let activeGame = 'rain';
        function switchGame(game) {
            document.querySelectorAll('.game-container').forEach(d => d.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            if(game === 'rain') {
                document.getElementById('rain-game-area').classList.add('active');
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
                activeGame = 'rain';
                startRainGame();
            } else {
                document.getElementById('glitch-game-area').classList.add('active');
                document.querySelectorAll('.nav-btn')[1].classList.add('active');
                activeGame = 'glitch';
                stopRainGame();
                loadGlitchLevel();
            }
        }

        // ==========================================
        // OYUN 1: RAIN HUNTER (KELİME AVI)
        // ==========================================
        const words = ["كِتَاب", "قَلَم", "بَاب", "مُعَلِّم", "طَالِب", "شَمْس", "قَمَر", "نَجْم", "بَحْر"];
        const gameField = document.getElementById('game-field');
        const scoreEl = document.getElementById('score');
        let score = 0;
        let rainInterval;
        let fallingElements = [];

        function createFallingWord() {
            const word = words[Math.floor(Math.random() * words.length)];
            const el = document.createElement('div');
            el.className = 'falling-word';
            el.innerText = word;
            
            // Rastgele X konumu (ekran genişliği içinde)
            const xPos = Math.random() * (window.innerWidth - 100);
            el.style.left = xPos + 'px';
            el.style.top = '-50px';
            
            // Tıklama Olayı
            el.onmousedown = () => {
                score += 10;
                scoreEl.innerText = score;
                scoreEl.style.color = "#fff";
                setTimeout(()=> scoreEl.style.color = "#0F0", 200);
                
                // Efekt ve silme
                el.style.background = "#fff";
                el.style.color = "#000";
                el.innerText = "CAPTURED";
                setTimeout(() => el.remove(), 200);
            };

            gameField.appendChild(el);
            fallingElements.push({ el: el, speed: 2 + Math.random() * 3, y: -50 });
        }

        function updateRainGame() {
            fallingElements.forEach((item, index) => {
                item.y += item.speed;
                item.el.style.top = item.y + 'px';

                // Ekrandan çıkarsa sil
                if (item.y > window.innerHeight) {
                    item.el.remove();
                    fallingElements.splice(index, 1);
                }
                // Tıklanıp silinenleri listeden temizle
                if (!document.body.contains(item.el)) {
                    fallingElements.splice(index, 1);
                }
            });
        }

        function startRainGame() {
            if (rainInterval) clearInterval(rainInterval);
            // Saniyede bir yeni kelime üret
            rainInterval = setInterval(() => {
                createFallingWord();
            }, 1000);
            
            // 60fps hareket döngüsü
            function loop() {
                if (activeGame === 'rain') {
                    updateRainGame();
                    requestAnimationFrame(loop);
                }
            }
            loop();
        }

        function stopRainGame() {
            clearInterval(rainInterval);
            gameField.innerHTML = '';
            fallingElements = [];
        }

        // ==========================================
        // OYUN 2: THE GLITCH (HATA AYIKLAMA)
        // ==========================================
        const glitchLevels = [
            { 
                sentence: ["ذَهَبَتْ", "أَحْمَدُ", "إِلَى", "السُّوقِ"], // Hata: Zehebet (Dişil) - Ahmed (Eril)
                wrongIndex: 0,
                correction: "ذَهَبَ",
                explanation: "ERROR: Fail 'Ahmed' eril olduğu için fiil 'Zehebe' olmalı."
            },
            { 
                sentence: ["هَذَا", "بِنْتٌ", "جَمِيلَةٌ"], // Hata: Haza (Eril) - Bint (Dişil)
                wrongIndex: 0,
                correction: "هَذِهِ",
                explanation: "ERROR: 'Bint' dişil olduğu için işaret zamiri 'Hazihi' olmalı."
            },
            {
                sentence: ["الطَّالِبُ", "مُجْتَهِدَةٌ", "جِدًّا"], // Hata: Müctehidetun (Dişil) - Talib (Eril)
                wrongIndex: 1,
                correction: "مُجْتَهِدٌ",
                explanation: "ERROR: Mübteda eril, Haber de eril olmalı."
            },
            {
                sentence: ["أَيْنَ", "قَلَمِ", "؟"], // Hata: Qalami (Kesra) - Mübteda merfu olmalı (Basit hata)
                wrongIndex: 1,
                correction: "الْقَلَمُ",
                explanation: "ERROR: Belirtili isim (Marife) El takısı almalı."
            }
        ];

        let currentGlitch = 0;

        function loadGlitchLevel() {
            if(currentGlitch >= glitchLevels.length) {
                document.getElementById('sentence-container').innerHTML = "<span style='color:#0F0'>SYSTEM RESTORED 100%</span>";
                document.getElementById('glitch-log').innerText = "Simülasyon Tamamlandı.";
                document.getElementById('next-glitch-btn').style.display = 'none';
                return;
            }

            const level = glitchLevels[currentGlitch];
            const container = document.getElementById('sentence-container');
            container.innerHTML = '';
            document.getElementById('glitch-log').innerText = "Hatalı bileşeni bul...";
            document.getElementById('glitch-log').style.color = "#666";
            document.getElementById('next-glitch-btn').style.display = 'none';

            level.sentence.forEach((word, index) => {
                const span = document.createElement('span');
                span.className = 'word-span arabic-text';
                span.innerText = word;
                
                span.onclick = () => {
                    if (index === level.wrongIndex) {
                        // DOĞRU HAMLE
                        span.innerText = level.correction;
                        span.classList.add('patched');
                        document.getElementById('glitch-log').innerText = "PATCH APPLIED: " + level.explanation;
                        document.getElementById('glitch-log').style.color = "#0F0";
                        document.getElementById('next-glitch-btn').style.display = 'inline-block';
                        
                        // Diğer kelimelerin tıklanabilirliğini kaldır
                        const allSpans = container.querySelectorAll('.word-span');
                        allSpans.forEach(s => s.onclick = null);
                    } else {
                        // YANLIŞ HAMLE
                        span.style.color = "red";
                        span.style.textDecoration = "line-through";
                        document.getElementById('glitch-log').innerText = "ACCESS DENIED: Bu bileşen sağlam.";
                        document.getElementById('glitch-log').style.color = "red";
                    }
                };
                container.appendChild(span);
            });
        }

        function nextGlitchLevel() {
            currentGlitch++;
            loadGlitchLevel();
        }

        // Başlangıç
        startRainGame();

    </script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
</html>
