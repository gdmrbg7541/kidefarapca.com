<body dir="ltr">

    <div class="activity-container">
        
        <header class="header">
            <h1>Kısa Sureleri Pekiştirelim</h1>
<div class="back-button-container">
                <a href="index.html" onclick="return kidefGeriDon(event)" class="back-button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                </a>
            </div>
            
            <button id="fullscreen-btn" title="Tam Ekran">
                <svg class="icon-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M5 10h2V7h3V5H5v5zM14 5v2h3v3h2V5h-5zM5 19v-5h2v3h3v2H5zM14 19v-2h3v-3h2v5h-5z"/>
                </svg>
                <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
                </svg>
            </button>
            
            <div class="secim-alani">
                <select id="sure-secici"></select>
            </div>
        </header>

        <nav class="aktivite-nav">
            <button class="nav-btn aktif" data-mod="mod1">Kelime Anlamı</button>
            <button class="nav-btn" data-mod="mod2">Meal Testi</button>
            <button class="nav-btn" data-mod="mod3">Bilgi Kartları</button>
            <button class="nav-btn" data-mod="mod4">Ezber Modu</button>
        </nav>

        <div class="aktivite-penceresi">
            
            <div id="mod1" class="mod-icerik aktif">
                <p class="sirala-aciklama">Arapça kelimeye tıklayarak anlamını öğrenin. "Sonraki" tuşuyla diğer ayete geçin.</p>
                <div id="mod1-ayet-soru"></div>
                <div id="anlam-kutusu">...</div>
                <div class="kart-navigasyon">
                    <span id="mod1-sayac" class="kart-sayac">Ayet 1 / 7</span>
                    <button class="kart-nav-btn" id="mod1-sonraki-btn">Sonraki Ayet</button>
                </div>
            </div>
            
            <div id="mod2" class="mod-icerik">
                <div id="mod2-ayet-soru"></div>
                <div class="test-secenekleri" id="mod2-secenekler"></div>
                <button class="kontrol-butonu" id="mod2-sonraki-btn" style="display:none;">Sonraki Soru</button>
                <div id="mod2-sonuc" class="sonuc-mesaji" style="display:none;"></div>
            </div>
            
            <div id="mod3" class="mod-icerik">
                <p class="sirala-aciklama">Arapça kelimenin anlamını görmek için karta tıklayın.</p>
                
                <div id="mod3-kart-grid">
                    </div>
                
                <button class="kontrol-butonu" id="mod3-restart-btn">Kartları Yenile</button>
            </div>
            
            <div id="mod4" class="mod-icerik">
                <p class="sirala-aciklama">Ayetin başı verilmiştir. Devamını ezberden okuyun ve "Sonraki Ayet" tuşuna basın.</p>
                <div id="mod4-ayet-soru">...</div>
                <div class="kart-navigasyon">
                    <button class="kart-nav-btn" id="mod4-sonraki-btn">Sonraki Ayet</button>
                </div>
            </div>

        </div>
    </div>

    <script src="degerler/kisasureler.js"></script>
        <script src="sistem/geri.js"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
</html>
