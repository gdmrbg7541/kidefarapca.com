<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinle ve Yaz | اِسْتَمِعْ وَاكْتُبْ</title>
     <script async src="https://www.googletagmanager.com/gtag/js?id=G-FV9JD15KLW"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Harmattan:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="alfabe/dinleveyaz.css">
    <link rel="stylesheet" href="arakom.css?v=2">
</head>
<body>
<script>
/* GÖMÜLÜ KİP — "?gomulu=1" ile açılınca (alfabe.html'deki Dinle ve Yaz
   sekmesi bu şekilde çağırır) sayfa gömülü olduğunu bilir; süre köprüsü
   burada çalışmaz, çünkü süreyi alfabe.html adına sekme işliyor.
   NOT: sayfanın kendi "geri" tuşu TAMAMEN KALDIRILDI — oyun artık
   alfabe.html'in bir sekmesi; ana sayfaya dönüş kumandadaki Ana Sayfa
   düğmesiyle yapılıyor, ikinci bir çıkış tuşu kafa karıştırıyordu. */
(function () {
  try {
    if (new URLSearchParams(location.search).get('gomulu') === '1') {
      document.documentElement.className += ' dvy-gomulu';
    }
  } catch (e) { }
})();
</script>

    <div id="gameWrapper">

        <div id="homeScreen" class="screen active">
             <div class="title-container">
                <div class="title-text">
                    <h1>Dinle Ve Yaz!</h1>
                    <h2>اِسْتَمِعْ وَاكْتُبْ</h2>
                </div>
            </div>
            <div id="seviyeAkordiyon" class="seviye-akordiyon acik">
                <button type="button" id="seviyeBaslik" class="seviye-baslik" aria-expanded="true">
                    <span class="sb-metin">Seviyeler</span>
                    <span id="seviyeSecili" class="sb-secili"></span>
                    <svg class="ico ico-chevron sb-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div id="levelSelect" class="button-grid">
                    <button class="level-btn key-button" data-level="1">Seviye 1</button>
                    <button class="level-btn key-button" data-level="2">Seviye 2</button>
                    <button class="level-btn key-button" data-level="3">Seviye 3</button>
                    <button class="level-btn key-button" data-level="4">Seviye 4</button>
                    <button class="level-btn key-button" data-level="5">Seviye 5</button>
                    <button class="level-btn key-button" data-level="6">Seviye 6</button>
                    <button class="level-btn key-button" data-level="7">Seviye 7</button>
                    <button class="level-btn key-button" data-level="8">Seviye 8</button>
                </div>
            </div>

            <!-- Modlar: yan yana 3 sütun, yalnız içeriği yansıtan SVG'ler (metin yok) -->
            <div id="modSecim" class="mod-secim">
                <label id="clickToggle" class="mod-btn" title="Alıştırma — tıklayarak yaz" aria-label="Alıştırma modu (tıklayarak yaz)">
                    <input type="checkbox" id="clickCheckbox" checked>
                    <svg class="ico ico-click" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5l0 11.5 2.9-2.7 1.8 4.2 2.1-0.9-1.8-4.1 3.9-0.3L9 3.5z" fill="currentColor"/><path class="click-spark s1" d="M5 6.5l-1.6-1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path class="click-spark s2" d="M4.5 11h-2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path class="click-spark s3" d="M6 15.5l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                </label>
                <label id="examToggle" class="mod-btn" title="Sınav — cevap gizli" aria-label="Sınav modu (cevap gizli)">
                    <input type="checkbox" id="examCheckbox">
                    <svg class="ico ico-exam" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.7" fill="currentColor"/><line x1="4" y1="3.5" x2="20" y2="20.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </label>
                <label id="autoToggle" class="mod-btn" title="Otomatik — harfler kendiliğinden çıkar" aria-label="Otomatik yazım (harfler kendiliğinden çıkar)">
                    <input type="checkbox" id="autoCheckbox">
                    <svg class="ico ico-auto" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l1.7 4.1 4.1 1.7-4.1 1.7L12 14l-1.7-4L6.2 8.3l4.1-1.7L12 2.5z" fill="currentColor"/><circle cx="18.5" cy="16.5" r="1.9" fill="currentColor"/><circle cx="6" cy="16" r="1.3" fill="currentColor"/></svg>
                </label>
            </div>

            <!-- Zaman ve tekrar ayarları: seviyeye göre hazır gelir, elle değiştirilebilir -->
            <div id="ayarlar" class="ayarlar">
                <div class="ayar-satir">
                    <span class="ayar-label"><svg class="ico ico-clock" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><line class="clock-hand" x1="12" y1="12" x2="12" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="12" x2="15" y2="13.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Harf başına saniye</span>
                    <div class="stepper">
                        <button type="button" class="step-btn" data-target="saniyeInput" data-delta="-1">−</button>
                        <input id="saniyeInput" class="ayar-input" type="number" min="1" max="30" value="9" inputmode="numeric">
                        <button type="button" class="step-btn" data-target="saniyeInput" data-delta="1">+</button>
                    </div>
                </div>
                <div class="ayar-satir">
                    <span class="ayar-label"><svg class="ico ico-speaker" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path class="wave w1" d="M16 8.7a4 4 0 010 6.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="wave w2" d="M18.6 6.2a7.5 7.5 0 010 11.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Tekrar sayısı</span>
                    <div class="stepper">
                        <button type="button" class="step-btn" data-target="tekrarInput" data-delta="-1">−</button>
                        <input id="tekrarInput" class="ayar-input" type="number" min="1" max="15" value="4" inputmode="numeric">
                        <button type="button" class="step-btn" data-target="tekrarInput" data-delta="1">+</button>
                    </div>
                </div>
            </div>
            <button id="baslaButton" class="action-btn key-button" disabled><span>Başla</span><svg class="ico ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
            </div>

        <div id="gameScreen" class="screen">
            <!-- Kelime seçilince 3-2-1 geri sayım -->
            <div id="geriSayim" class="geri-sayim" aria-hidden="true"></div>
            <header id="gameHeader" class="game-header">
                <button id="backToHomeButton" class="back-button key-button" title="Geri" aria-label="Geri"></button>
                <button id="pauseButton" class="pause-button key-button" title="Duraklat" aria-label="Duraklat">
                    <svg class="ico ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>
                    <svg class="ico ico-resume" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
                </button>
                <!-- Yalnız ses/zaman çizgisi (sayısal kronometre kaldırıldı; çizgi
                     zaten süreyi/geri sayımı gösteriyor) -->
                <div id="zamanWidget" class="zaman-widget">
                    <div id="sesCizelgesi" class="ses-cizelgesi" aria-hidden="true"></div>
                </div>
                <div id="levelScoreDisplay" class="header-info">Puan: 0</div>
                <div id="pointsBurst"></div>
                <div id="mistakeCounter" class="header-info" style="display:none"></div>
            </header>

            <main id="gameMain" class="game-main slayt-mod">
                <!-- 1) Birleşik tuş konteynırı: harf tuşları (her biri 4 hâl) + hareke tuşları -->
                <div id="tusKonteyner" class="slayt-tuslar">
                    <div id="harfTuslar" class="tus-grup harfler"></div>
                    <div id="harekeTuslar" class="tus-grup harekeler"></div>
                </div>

                <!-- 2) İki sütun kelime listesi: her Türkçe kelimenin sağında Arapça
                     yazım kutusu. Sıradaki kelime vurgulu; doğru yazılınca kaybolur,
                     alttaki kelimeler yukarı kayar. -->
                <div id="kelimeListe" class="kelime-liste"></div>

                <!-- eski oyun mantığının beklediği gizli elemanlar -->
                <div id="turkishWord" style="display:none"></div>
                <div id="arabicOutputContainer" style="display:none">
                    <div id="arabicOutputDisplay" class="arabic-output empty" dir="rtl" lang="ar"></div>
                </div>
                <div id="letterBankContainer" style="display:none"><div id="letterBank"></div></div>
                <span id="slideAnswer" style="display:none" dir="rtl" lang="ar"></span>
            </main>

            <footer id="gameFooter" class="game-footer">
                <div id="kelimeGosterge" class="kelime-gosterge">–</div>
                <!-- eski oyun mantığının beklediği gizli elemanlar -->
                <button id="playAudioButton" style="display:none"></button>
                <button id="nextButton" style="display:none"></button>
            </footer>
        </div>

        <div id="scoreScreen" class="screen">
            <h2 id="scoreTitle">Seviye Tamamlandı!</h2>
            <p id="singlePlayerScoreText">
                Puanınız: <span id="finalScoreValue">0</span> / <span id="totalPossibleScore">100</span>
            </p>
            <div id="incorrectList" style="display: none;">
                <h3>Yanlış Kelimeler:</h3>
                <ul id="incorrectWordsUl"></ul>
            </div>
            <button id="scoreToHomeButton" class="action-btn key-button">Ana Menü</button>
        </div>

    </div>

    <script src="alfabe/dinleveyaz.js?v=2"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
<script src="sistem/gorevkopru.js?v=7"></script>
<script>/* SURE TAKIBI (Beceri - Ogretmen Ozel): puan degil, sayfada GORUNUR
   kalinan sure raporlanir; Etkinlikler sekmesinde saat satiri olarak gorunur. */
/* Gömülü kipte süre YAZILMAZ: sayfa alfabe.html içinde açılmıştır ve
   süre orada zaten işleniyor; iki kez sayılmasın. */
try {
  var gomulu = false;
  try { gomulu = new URLSearchParams(location.search).get('gomulu') === '1'; } catch (e) { }
  if (!gomulu && window.KidefGorev) KidefGorev.sureTakibiBaslat();
} catch (e) { }</script>
</body>
</html>
