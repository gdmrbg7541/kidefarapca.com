<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arapça Simultane & Diyalog Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pdf-red: #b30b00;
            --pdf-dark: #8b0000;
            --p1-color: #2563eb; 
            --p2-color: #059669; 
            --bg-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
    font-family: 'Inter', sans-serif; 
    background: var(--bg-color); 
    /* Mobil tarayıcı çubukları için dvh kullanımı: */
    height: 100vh; /* Eski tarayıcılar için yedek */
    height: 100dvh; /* Modern mobil tarayıcılar için tam uyum */
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
}

        /* Üst Bar */
       .navbar { 
    display: none; /* Başlangıçta gizle */
    background: var(--pdf-red); 
    min-height: 60px; 
    align-items: center; 
    padding: 5px 15px; 
    z-index: 3000; 
}
        .back-btn { background: var(--pdf-dark); color: white; text-decoration: none; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-weight: bold; cursor: pointer; border: none; font-size: 1.5rem; }
        .pdf-links { display: flex; gap: 10px; overflow-x: auto; flex-grow: 1; justify-content: center; }
        .pdf-links::-webkit-scrollbar { display: none; }
        .pdf-link, .nav-trigger { color: white; text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 4px; background: rgba(0,0,0,0.2); white-space: nowrap; cursor: pointer; border: none; }

        /* POPUP SİSTEMİ */
       /* Paneli ekranın ortasına değil, navbar'ın hemen altına sabitliyoruz */
.overlay { 
    position: fixed; 
    top: 60px; /* Navbar yüksekliği kadar üstten boşluk */
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 2000; 
    display: none; 
    justify-content: center;
    align-items: flex-start; /* Üstten başlaması için */
}
        .popup-header { background: var(--pdf-red); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .close-popup { background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
        /* POPUP SİSTEMİ GÜNCELLEME */
          .popup { 
    background: rgba(255, 255, 255, 0.52); /* %92 opaklık - Arkası hafif görünür */
    backdrop-filter: blur(5px);
    width: 100%;            
    height: 100vh; /* Ekranın %70'ini kaplasın, alt taraf çalışma alanı kalsın */
    margin: 0; 
    border-radius: 0 0 20px 20px; /* Sadece alt köşeler yuvarlak */
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
    position: relative; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* İçerik alanını biraz daha genişletelim */
.popup-body { 
    flex: 1; 
    padding: 15px; 
    overflow-y: auto; 
}
/* PDF iframe'inin kutuyu tam kaplamaya devam etmesi için */
#popup-content iframe {
    width: 100% !important;
    height: 100% !important;
    border: none;
    flex: 1; /* Esnemeyi sağlar */
}
        

        /* Tablo Stilleri */
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f8fafc; font-weight: bold; }
       .ar-txt { 
    font-family: 'IBM Plex Sans Arabic', sans-serif; 
    font-size: 1.3rem; 
    direction: rtl;
    line-height: 1.6; /* Harf çıkıntıları için alan açar */
}

        /* Kelimeler Özel Bölümü */
        .verbs-col { flex: 2; border-right: 2px solid #eee; padding-right: 15px; }
        .nouns-col { flex: 1; }

        /* Giriş Paneli */
        #entry-panel { position: fixed; inset: 0; background: white; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
        .mode-btn { width: 350px; padding: 50px 20px; border-radius: 25px; border: 4px solid var(--pdf-red); background: white; color: var(--pdf-red); font-size: 2rem; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .mode-btn:hover { background: var(--pdf-red); color: white; transform: scale(1.05); }

        /* Çalışma Alanı Hizalama */
        .workspace { 
    flex: 1; /* Kalan tüm boşluğu kapla */
    display: flex; 
    flex-direction: column; 
    padding: 10px; 
    gap: 10px; 
    /* Sabit yükseklik yerine kaydırma özelliği veriyoruz */
    overflow-y: auto; 
    width: 100%;
}
        #sentence-mode { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; }
        .tr-container { display: flex; flex-wrap: wrap; gap: 30px; margin-bottom: 40px; justify-content: center; width: 100%; }
       .ar-output { 
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    direction: rtl; 
    display: block; /* Flex yerine block kullanarak kelime akışını doğal bırakıyoruz */
    text-align: center;
    width: 100%; 
    min-height: 1.2em;
}

.ar-output span {
    display: inline-block;
    margin-left: 8px; /* Kelimeler arası boşluk */
}

        #sentence-mode .word { font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 800; cursor: pointer; transition: 0.2s; }
        #sentence-mode .ar-output { font-size: clamp(3.5rem, 8vw, 6rem); color: #1e293b; margin-top: 10px; }

        #dialog-mode { display: none; flex-direction: column; height: 100%; gap: 15px; }
        .dialog-row { flex: 1; display: flex; flex-direction: column; border-radius: 20px; padding: 20px; justify-content: center; align-items: center; }
        .p1-row { background: #f0f7ff; border: 3px solid var(--p1-color); }
        .p2-row { background: #ecfdf5; border: 3px solid var(--p2-color); }
        #dialog-mode .word { font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 800; }
        #dialog-mode .ar-output { font-size: clamp(2.5rem, 6vw, 4.5rem); margin-top: 20px; }

        .passive { color: #e2e8f0; pointer-events: none; }
        .active { color: #000; transform: scale(1.1); animation: bounce 1.2s infinite; }
        .completed { color: var(--pdf-red); }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .controls { 
    display: flex; 
    justify-content: center; 
    gap: 40px; 
    padding: 20px; 
    background: #f8fafc; 
    border-top: 2px solid #eee;
    flex-shrink: 0; /* Bu alanın sıkışmasını engeller */
    /* iPhone alt çubuğu için güvenli boşluk: */
    padding-bottom: max(20px, env(safe-area-inset-bottom)); 
}
        .nav-btn { padding: 15px 40px; border-radius: 40px; border: 3px solid var(--pdf-red); background: white; color: var(--pdf-red); font-weight: 900; cursor: pointer; font-size: 1.2rem; }

        .entry-back-btn { position: absolute; top: 15px; left: 15px; background: var(--pdf-dark); color: white; width: 45px; height: 45px; border-radius: 50%; border: none; font-size: 1.5rem; cursor: pointer; }

.word.active {
    border: 2.5px solid #64748b !important;
    transform: scale(1.05);
    color: #475569 !important; /* Sırası geldiğinde biraz daha koyu gri */
}
.word.completed {
    background-color: transparent !important;
    font-weight: bold;
    transform: scale(1);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
   
.word.passive, .word.active {
    background-color: transparent !important;
    color: #94a3b8 !important;            /* Gri yazı rengi */
    border: none !important;
}
/* --- GENİŞLETİLMİŞ MOBİL YAMA (Giriş, Popup, Tablolar) --- */
@media screen and (max-width: 768px), 
       screen and (orientation: landscape) and (max-height: 600px) {

    /* 1. GİRİŞ SAYFASI (Entry Panel) */
    #entry-panel {
        padding: 10px !important;
        gap: 15px !important; /* Öğeler arası boşluğu azalt */
    }
    
    #entry-panel h1 {
        font-size: 1.8rem !important; /* Başlığı küçült */
        margin-bottom: 10px !important;
    }

    .mode-btn {
        width: 90% !important; /* Ekranı tam kaplamasın */
        padding: 15px !important; /* Buton şişkinliğini al */
        font-size: 1.2rem !important; /* Buton yazısını küçült */
        border-width: 3px !important;
    }
    
    .entry-back-btn {
        width: 35px !important;
        height: 35px !important;
        font-size: 1rem !important;
        top: 10px !important;
        left: 10px !important;
    }

    /* 2. POPUP PENCERESİ */
    .popup-header {
        padding: 8px 15px !important; /* Başlık alanını daralt */
        min-height: 45px !important;
    }

    .popup-header h2 {
        font-size: 1.1rem !important; /* Başlık fontunu küçült */
    }

    .close-popup {
        font-size: 1.8rem !important;
        line-height: 1 !important;
    }

    /* 3. TABLOLAR VE İÇERİK */
    /* Tablo hücre boşluklarını sıkıştır */
    th, td {
        padding: 4px !important; 
        font-size: 0.85rem !important; /* Türkçe metinleri küçült */
    }

    /* HTML içinde 'style="font-size:2.2rem"' gibi verilen inline stilleri EZMEK için: */
    /* Tablo içindeki Arapça yazılar */
    .popup-body .ar-txt, 
    .popup-body span[style*="font-size"] { 
        font-size: 1.3rem !important; /* Hepsini standart boyuta getir */
        line-height: 1.3 !important;
    }
    
    /* Tablo altındaki küçük açıklamalar (Hastalar, Doktorlar vb.) */
    .popup-body small {
        font-size: 0.65rem !important;
        color: #555 !important;
    }

    /* Popup içindeki başlıklar (H3) */
    .popup-body h3 {
        font-size: 1.1rem !important;
        margin: 10px 0 5px 0 !important;
        padding-bottom: 5px !important;
    }
    
    /* Yan yana duran (flex) kutuları alt alta al veya sıkıştır */
    .popup-body > div[style*="display: flex"] {
        flex-direction: column-reverse !important; /* Mobilde alt alta olsun */
        gap: 15px !important;
    }
    
    /* Sütun çizgilerini düzelt */
    .verbs-col, .nouns-col {
        border: none !important; /* Dikey çizgiyi kaldır */
        border-bottom: 2px solid #eee !important; /* Yatay çizgi ekle */
        padding: 0 !important;
    }
}
/* --- YAMA SONU --- */
/* Kelime Paneli Yan Yana Dizilim ve Kaydırma */
.words-container {
    display: flex !important;
    flex-direction: row-reverse !important;
    gap: 20px !important;
    width: 100% !important;
    /* Mobilde dikey kaydırmayı ana kapsayıcıya veriyoruz */
    height: auto !important; 
    max-height: 85vh !important;
    overflow-y: auto !important; 
    overflow-x: auto !important;
    padding: 10px !important;
    -webkit-overflow-scrolling: touch;
}
.words-container .verbs-col, 
.words-container .nouns-col {
    min-width: 320px !important; /* Mobilde sütun genişliği */
    flex-shrink: 0 !important;
    display: block !important; /* Flex dikeyde sorun çıkarabilir, block daha güvenli */
}

/* Tablo içindeki ekstra kaydırma alanlarını iptal edin (çakışmayı önler) */
.words-container div[style*="overflow-y: auto"] {
    overflow-y: visible !important;
    height: auto !important;
}

/* Mobil için özel dikey yükseklik ayarı */
@media screen and (max-width: 768px) {
    .words-container {
        max-height: 75vh !important;
    }
}
/* Mobil Cihazlar İçin Yazı Boyutu Düzenlemesi */
@media screen and (max-width: 768px) {
    /* Cümle Modu Ayarları */
    #sentence-mode .word { 
        font-size: 1.5rem !important; /* Türkçe kelimeleri küçültür */
    }
    #sentence-mode .ar-output { 
        font-size: 2.2rem !important; /* Arapça cümleyi küçültür */
    }

    /* Diyalog Modu Ayarları */
    #dialog-mode .word { 
        font-size: 1.2rem !important; /* Diyalogdaki Türkçe kelimeler */
    }
    #dialog-mode .ar-output { 
        font-size: 1.8rem !important; /* Diyalogdaki Arapça cümleler */
    }
    
    /* Satır aralarını ve kutu boşluklarını daraltma */
    .dialog-row {
        padding: 10px !important;
        gap: 5px !important;
    }
    .tr-container {
        gap: 10px !important;
        margin-bottom: 15px !important;
    }
}
/* Popup açıkken kontrolleri tamamen yok eden yardımcı sınıf */
.controls-hidden {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
}
/* Popup açıkken butonları tamamen devre dışı bırakan kilit sınıfı */
.force-hide {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
}
 </style>
</head>
<body>

<div id="popup-overlay" class="overlay" onclick="closePopup(event)">
    <div class="popup" onclick="event.stopPropagation()">
        <div class="popup-header">
            <h2 id="popup-title">Bilgi Paneli</h2>
            <button class="close-popup" onclick="togglePopup(false)">×</button>
        </div>
        <div id="popup-content" class="popup-body">
            </div>
    </div>
</div>

<div id="entry-panel">
    <button class="entry-back-btn" onclick="window.location.href='muhadese.html'">❮</button>

    <button class="mode-btn" onclick="startMode('sentence')">CÜMLE PRATİĞİ</button>
    <button class="mode-btn" onclick="startMode('dialog')">DİYALOG PRATİĞİ</button>
</div>

<nav class="navbar">

        <button class="nav-trigger" onclick="showPopup('sulasi')">3</button>
        <button class="nav-trigger" onclick="showPopup('mezid')">+3</button>
    </div>
</nav>

<main class="workspace">

            <div id="p2-tr" class="tr-container"></div>
            <div id="p2-ar" class="ar-output"></div>
        </div>
    </div>
</main>

<div class="controls">
    <button class="nav-btn" onclick="changeSentence(-1)">❮ GERİ</button>

</div>

    function startMode(m) {
        mode = m;
        document.getElementById('entry-panel').style.display = 'none';
        document.querySelector('.navbar').style.display = 'flex';
        document.getElementById('sentence-mode').style.display = (m === 'sentence' ? 'flex' : 'none');
        document.getElementById('dialog-mode').style.display = (m === 'dialog' ? 'flex' : 'none');
        render();
    }

    function goHome() {
        document.getElementById('entry-panel').style.display = 'flex';
        document.querySelector('.navbar').style.display = 'none';
        currentIdx = 0;
    }

    function render() {
        step = 1;
        pTurn = 1;
        colorCounter = 0; // Her yeni slaytta renk sayacını sıfırla

        if (mode === 'sentence') {
            renderContent(data.sentence[currentIdx].words, 's-tr', 's-ar');
        } else {
            renderContent(data.dialog[currentIdx].p1, 'p1-tr', 'p1-ar', 1);
            renderContent(data.dialog[currentIdx].p2, 'p2-tr', 'p2-ar', 2);
        }
    }

function renderContent(words, trId, arId, playerNum = null) {
        const trCont = document.getElementById(trId);
        const arCont = document.getElementById(arId);
        trCont.innerHTML = ''; arCont.innerHTML = '';
        
        words.forEach((w, index) => { // Index parametresi eklendi
            const span = document.createElement('span');
            
            // Sadece 1. Oyuncunun 1. sıradaki kelimeleri aktif başlar
            // Not: w.order === 1 olan TÜM kelimeler (Bende ve var) aktif başlar
            const isActive = (playerNum === null || playerNum === 1) && w.order === 1;
            
            span.className = `word ${isActive ? 'active' : 'passive'}`;
            
            // --- DEĞİŞİKLİK BURADA ---
            // ID artık benzersiz (s-tr-item-0, s-tr-item-1 gibi)
            span.id = `${trId}-item-${index}`;
            // Sıra bilgisini data attribute olarak ekliyoruz
            span.setAttribute('data-order', w.order);
            // Kapsayıcı ID'sini de saklayalım ki handleMove'da bulabilelim
            span.setAttribute('data-container', trId);
            
            span.innerText = w.tr;
            
            // Parametreleri güncelledik
            span.onclick = () => handleMove(w.order, w.ar, trId, arId, playerNum);
            
            trCont.appendChild(span);
        });
    }

    // Renk Havuzu
    const wordColors = [
        '#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', 
        '#46f0f0', '#f032e6', '#008080', '#e6beff', '#9a6324', 
        '#800000', '#aaffc3', '#808000', '#000075', '#d2691e'
    ];

function handleMove(order, ar, trId, arId, playerNum) {
        // Sıra kontrolü
        if (order !== step) return;
        
        // --- GRUPLAMA MANTIĞI ---
        // O anki sıraya (order) sahip olan AYNI konteynerdaki TÜM kelimeleri bul
        // Örneğin order=1 ise hem "Bende" hem "var" seçilir.
        const allCurrentWords = document.querySelectorAll(`[data-container="${trId}"][data-order="${order}"]`);
        
        // Eğer bu sıraya ait kelime bulunamazsa dur (Hata önlemi)
        if (allCurrentWords.length === 0) return;

        // 1. RENK SEÇİMİ
        const colorIndex = colorCounter % wordColors.length;
        const activeColor = wordColors[colorIndex];

        // 2. BULUNAN TÜM KELİMELERİ BOYA (Senkronize Animasyon)
        allCurrentWords.forEach(wordEl => {
            wordEl.className = 'word completed';
            wordEl.style.color = activeColor;
            wordEl.style.borderColor = activeColor;
            wordEl.style.backgroundColor = 'transparent';
            // Tıklama özelliğini kaldır ki tekrar basılmasın
            wordEl.onclick = null;
        });

        // 3. ARAPÇA KELİMEYİ EKRANA BAS
        // Arapça kelime, tıklanan veriden gelir. 
        // "Bende" ve "var" aynı Arapça kelimeye ("عِنْدي") sahip olduğu için
        // sadece bir kez ekrana basılır.
        const arCont = document.getElementById(arId);
        arCont.innerHTML += `<span style="color: ${activeColor}; font-family: 'IBM Plex Sans Arabic'; margin-left:8px;">${ar}</span> `;

        // Sayaçları ilerlet
        step++;
        colorCounter++;
        
        // --- SONRAKİ KELİMELERİ AKTİF ET ---
        // Bir sonraki sıraya (step) sahip tüm kelimeleri bul
        const nextWords = document.querySelectorAll(`[data-container="${trId}"][data-order="${step}"]`);

        if (nextWords.length > 0) {
            // Sonraki kelime(ler) varsa hepsini aktif et
            nextWords.forEach(next => {
                next.className = 'word active';
            });
        } 
        // DİYALOG GEÇİŞİ: Kelime bittiyse ve sıra 1. kişideyse
        else if (mode === 'dialog' && playerNum === 1) {
            pTurn = 2; // Sıra 2. kişiye geçti
            step = 1;  // Adım sayısını 1'e çek
            
            // 2. Kişinin 1. sıradaki kelimelerini bul ve aktif et
            const p2NextWords = document.querySelectorAll(`[data-container="p2-tr"][data-order="1"]`);
            p2NextWords.forEach(w => w.className = 'word active');
        }
    }

    function changeSentence(dir) {
        currentIdx = (currentIdx + dir + data[mode].length) % data[mode].length;
        render();
    }
