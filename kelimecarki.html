<script>
/* ===== GÖRÜNÜM SEÇİMİ — İLK BOYAMADAN ÖNCE =====
   Sayfanın iki görünümü var: ŞIK (tam tasarım) ve SADE (güçsüz
   cihazlar için yalın çizim; gölge, gradient damar ve döngülü
   animasyon yok). Seçim <html> üzerindeki "kc-sade" sınıfıyla
   taşınır ve localStorage'da saklanır.

   NİÇİN BURADA, <head> İÇİNDE? kelimecarki.js sayfanın sonunda
   yükleniyor; sınıfı orada eklemek ilk kareden sonraya kalırdı ve
   ekran bir an şık görünümü çizip sonra sadeye atlardı. Bu üç satır
   ilk boyamadan önce çalışır, zıplama olmaz.

   HİÇ SEÇİM YOKSA: cihaz zayıf görünüyorsa (çekirdek ≤ 4 ya da
   bellek ≤ 4 GB) veya kullanıcı işletim sisteminde "hareketi azalt"
   demişse SADE, aksi hâlde ŞIK. Otomatik karar SAKLANMAZ; kalıcı
   olan yalnız kullanıcının anahtardan yaptığı seçimdir. */
(function () {
  try {
    var m = localStorage.getItem('kidefKcGorunum');
    if (m !== 'sade' && m !== 'sik') {
      var cek = navigator.hardwareConcurrency || 8;
      var bel = navigator.deviceMemory || 8;
      var az = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      m = (cek <= 4 || bel <= 4 || az) ? 'sade' : 'sik';
    }
    if (m === 'sade') document.documentElement.className += ' kc-sade';
  } catch (e) { }
})();
</script>

<!-- ================= KELİME ÇARKI: vezin simülasyonu =================
     Ekran "active" doğar: menü yok, sayfa açılır açılmaz çark kurulur.
     İçeriği (başlık, geri tuşu, kök şeridi, oklar, tekerler) tamamen
     sarf/kelimecarki.js doldurur. -->
<main class="screen active" id="kc-screen"></main>

<script>
/* Tek başına sayfa köprüsü: kelimecarki.js sarf.html içinde çalışmak
   üzere yazıldı ve App'in iki işlevini kullanır. Burada App yok, o
   yüzden minik bir karşılık koyuyoruz:
     playSound  → sessiz (sarf.html'deki ses motoru burada yüklü değil)
     showScreen → geri tuşu: menü ekranı olmadığı için siteye/önceki
                  sayfaya döner (geri.js'teki kidefGeri).
   Böylece kelimecarki.js'e HİÇ dokunmadan iki yerde de çalışır. */
/* Geri tuşunun ok simgesi normalde sarf.js'te tanımlıdır (BACK_SVG).
   Bu sayfa sarf.js'i YÜKLEMEZ (oradaki dört oyun, Firebase ve kök veri
   dosyaları burada gereksiz), o yüzden aynı simgeyi burada tanımlıyoruz.
   var kullanılır: kelimecarki.js'teki çıplak BACK_SVG bu şekilde görür. */
var BACK_SVG = '<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path></svg>';

window.App = window.App || {
    playSound: function () { },
    showScreen: function () {
        if (typeof kidefGeri === 'function') return kidefGeri();
        if (typeof kidefGeriDon === 'function') return kidefGeriDon();
        window.location.href = 'index.html';
    }
};
</script>

<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
