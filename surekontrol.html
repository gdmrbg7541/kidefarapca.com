<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Süre Takibi Kontrol — kidefarapca</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
  body{ font-family:-apple-system, "Segoe UI", sans-serif; background:#FFF8F2; color:#5A4034; margin:0; padding:18px; }
  .kap{ max-width:860px; margin:0 auto; }
  h1{ font-size:1.25rem; color:#9C3B0C; display:flex; align-items:center; gap:8px; }
  .kart{ background:#fff; border:1px solid #F3E2D3; border-radius:13px; padding:14px 16px; margin-bottom:14px;
         box-shadow:0 2px 7px rgba(216,67,21,.06); }
  .baslik{ font-weight:800; color:#7B1FA2; margin:0 0 8px; font-size:.95rem; }
  table{ width:100%; border-collapse:collapse; font-size:.85rem; }
  th{ text-align:left; color:#8B6A57; font-size:.75rem; border-bottom:2px solid #F3E2D3; padding:6px 8px; }
  td{ border-bottom:1px dashed #F3E2D3; padding:7px 8px; }
  .rozet{ display:inline-block; padding:2px 10px; border-radius:999px; font-weight:800; font-size:.72rem; }
  .sure{ background:#EBF5FB; color:#2471A3; } .puan{ background:#E8F8F0; color:#1E8449; }
  .uyari{ background:#FDEDEC; color:#C0392B; border:1px dashed #F5B7B1; border-radius:10px; padding:10px 13px;
          font-size:.85rem; margin:8px 0; }
  .iyi{ background:#E8F8F0; color:#1E8449; border:1px dashed #A9DFBF; border-radius:10px; padding:10px 13px;
        font-size:.85rem; margin:8px 0; }
  .kucuk{ color:#A6836E; font-size:.78rem; }
  code{ background:#FFF6EC; padding:1px 6px; border-radius:6px; }
</style>
    <link rel="stylesheet" href="arakom.css?v=2">
</head>
<body>
<div class="kap">
  <h1>🕐 Süre Takibi Kontrol Sayfası</h1>
  <p class="kucuk">Bu sayfa hiçbir kayıt <b>üretmez</b>; yalnız buluttaki kayıtları okuyup gösterir.
  Öğretmen hesabıyla açarsan bütün öğrencilerinin kayıtlarını, öğrenci hesabıyla açarsan o öğrencinin kendi kayıtlarını listeler.</p>
  <div id="govde"><div class="kart">Yükleniyor…</div></div>
</div>
<script>
(function () {
  var CFG = {
    apiKey: "AIzaSyBGIQPJ_Bjm5I3-QmrrGpLR5MqmG3S5F8w",
    authDomain: "kidefarapca-98f9c.firebaseapp.com",
    projectId: "kidefarapca-98f9c",
    storageBucket: "kidefarapca-98f9c.firebasestorage.app",
    messagingSenderId: "503317118211",
    appId: "1:503317118211:web:a9c8cf15b854597e0b3d36"
  };
  if (!firebase.apps.length) firebase.initializeApp(CFG);
  var db = firebase.firestore();
  var g = document.getElementById('govde');

  function sureYaz(sn) {
    sn = parseInt(sn); if (!isFinite(sn) || sn < 0) return '—';
    if (sn < 60) return sn + ' sn';
    var dk = Math.floor(sn / 60), k = sn % 60;
    return dk + ' dk' + (k ? ' ' + k + ' sn' : '');
  }
  function tarih(ts) {
    if (!ts) return '—';
    var d = new Date(ts), i = function (n) { return String(n).padStart(2, '0'); };
    return i(d.getDate()) + '.' + i(d.getMonth() + 1) + ' ' + i(d.getHours()) + ':' + i(d.getMinutes());
  }
  function kacis(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  function tablo(docs, benlik) {
    if (!docs.length) return '<p class="kucuk">Hiç kayıt yok.</p>';
    docs.sort(function (a, b) { return (b.sonTarih || 0) - (a.sonTarih || 0); });
    return '<table><tr><th>' + (benlik ? '' : 'Öğrenci</th><th>') + 'Dosya</th><th>Tür</th>' +
      '<th>Değer</th><th>Oturum/Oynama</th><th>Son</th></tr>' +
      docs.map(function (r) {
        var sureMi = r.tur === 'sure';
        return '<tr>' + (benlik ? '' : '<td>' + kacis(r.ad || r.email || r.ogrenciUid) + '</td>') +
          '<td><code>' + kacis(r.oyun) + '</code></td>' +
          '<td><span class="rozet ' + (sureMi ? 'sure">SÜRE' : 'puan">PUAN') + '</span></td>' +
          '<td><b>' + (sureMi ? sureYaz(r.toplamSureSn) : ('%' + (r.rekor != null ? r.rekor : (r.yuzde || 0)))) + '</b></td>' +
          '<td>' + (r.oynama != null ? r.oynama : (r.deneme || 0)) + '</td>' +
          '<td>' + tarih(r.sonTarih || r.bitis) + '</td></tr>';
      }).join('') + '</table>';
  }

  firebase.auth().onAuthStateChanged(function (u) {
    if (!u || !u.email) {
      g.innerHTML = '<div class="kart"><div class="uyari">Giriş yapılmamış. Önce sitede e-posta ile giriş yap,' +
        ' sonra bu sayfayı aynı tarayıcıda yeniden aç.</div></div>';
      return;
    }
    var html = '<div class="kart"><div class="baslik">👤 Oturum</div>' +
      '<div>' + kacis(u.email) + ' <span class="kucuk">(' + u.uid.slice(0, 8) + '…)</span></div></div>';
    var isler = [];

    /* Ogrenci bagi (varsa) */
    isler.push(db.collection('ogrenciBaglari').doc(u.uid).get().then(function (doc) {
      if (doc.exists) {
        var v = doc.data() || {};
        html += '<div class="kart"><div class="baslik">🎓 Öğrenci Bağı</div>' +
          '<div>Durum: <b>' + kacis(v.durum) + '</b> · Öğretmen: ' + kacis(v.ogretmenAd || v.ogretmenUid || '—') +
          ' · Sınıf: ' + kacis((v.seviyeAd || '') + ' / ' + (v.sinifAd || '')) + '</div>' +
          (v.durum !== 'onayli' ? '<div class="uyari">Bağ <b>onaylı değil</b> — köprü bu hesap için kayıt YAZMAZ.</div>'
            : '<div class="iyi">Bağ onaylı — köprü bu hesap için kayıt yazabilir.</div>') + '</div>';
      }
    }).catch(function () { }));

    /* Kendi kayitlarim (ogrenci gozu) */
    isler.push(db.collection('ogrenciIlerleme').where('ogrenciUid', '==', u.uid).get().then(function (s) {
      var d = []; s.forEach(function (x) { d.push(x.data() || {}); });
      html += '<div class="kart"><div class="baslik">📁 Bu hesabın kendi kayıtları (' + d.length + ')</div>' + tablo(d, true) + '</div>';
    }).catch(function (e) {
      html += '<div class="kart"><div class="uyari">Kendi kayıtları okunamadı: ' + kacis(e && (e.code || e.message)) + '</div></div>';
    }));

    /* Ogretmen gozu: bana bagli TUM kayitlar */
    isler.push(db.collection('ogrenciIlerleme').where('ogretmenUid', '==', u.uid).get().then(function (s) {
      var d = []; s.forEach(function (x) { d.push(x.data() || {}); });
      if (d.length || true) {
        var sureN = d.filter(function (r) { return r.tur === 'sure'; }).length;
        html += '<div class="kart"><div class="baslik">🧑‍🏫 Öğretmen görünümü — öğrencilerimin kayıtları (' +
          d.length + ' kayıt, ' + sureN + ' tanesi SÜRE)</div>' + tablo(d, false) +
          (sureN === 0 ? '<div class="uyari">Hiç SÜRE kaydı yok: ya öğrenci sarf.html\'i güncel köprüyle hiç açmadı,' +
            ' ya 15 sn\'den kısa kaldı, ya da dosyalar siteye yüklenmedi.</div>' : '') + '</div>';
      }
    }).catch(function (e) {
      html += '<div class="kart"><div class="uyari">Öğretmen sorgusu okunamadı: ' + kacis(e && (e.code || e.message)) + '</div></div>';
    }));

    Promise.all(isler).then(function () { g.innerHTML = html; });
  });
})();
</script>
</body>
</html>
