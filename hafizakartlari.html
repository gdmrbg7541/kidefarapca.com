<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>Hafıza Kartları</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FV9JD15KLW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-FV9JD15KLW');
</script>
    <link rel="stylesheet" href="hafizakartlari.css">
</head>
<body>


<!-- Giriş Menü Ekranı -->
<div id="menu-screen" style="display: flex; flex-direction: column; align-items: center; text-align: center;">
    
    <!-- Sabitlenen Bölüm -->
    <div class="sticky-header">
        <!-- Anasayfa İkon Butonu -->
        <a href="index.html" onclick="return kidefGeriDon(event)" class="home-btn" title="Anasayfa">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </a>
        <h1 class="menu-title">Konu Seç!</h1>
    </div>

    <!-- Kaydırılabilir Bölüm -->
    <div id="topics-list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; padding: 20px;">
        <!-- Konular JavaScript ile buraya dolacak -->
    </div>
</div>

<!-- Mevcut oyun alanınızı bu div içine alın -->
<div id="game-screen" style="display: none; flex-direction: column;">

<div class="header">
    <div class="controls" style="display: flex; align-items: center; justify-content: center; position: relative; width: 100%; min-height: 50px;">
        
        <!-- Sabit ve Tek Geri Tuşu -->
        <button class="btn" id="btn-back" onclick="showMenu()" style="position: absolute; left: 10px; background: #f1f3f5; font-weight: bold; display: flex; align-items: center; gap: 5px;">
            <span>❮</span>
        </button>

        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="btn active" id="btn-study" onclick="setMode('study')">Kartlar</button>
            <button class="btn" id="lang-btn-main" onclick="toggleLang()" style="background:var(--accent); color:white;"> T ⇄ ع</button>
            <button class="btn" id="btn-memory-start" onclick="setMode('mem1')" style="background: #e9ecef;">Hafıza Oyunu</button>

            <!-- Hafıza Oyunu Özel Kontrolleri -->
            <div id="memory-controls" style="display: none; align-items: center; gap: 8px;">
                <div class="switch-wrapper" style="display: flex; align-items: center; background: white; padding: 4px 8px; border-radius: 50px; border: 2px solid #eee; gap: 5px;">
                    <span style="font-size: 1.1rem; cursor: pointer;" onclick="toggleSwitch(false)">👤</span>
                    <label class="switch" style="position: relative; display: inline-block; width: 44px; height: 22px;">
                        <input type="checkbox" id="mode-toggle" onchange="toggleMemoryMode(this)" style="opacity:0; width:0; height:0;">
                        <span class="slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--p1); transition: .4s; border-radius: 34px;"></span>
                    </label>
                    <span style="font-size: 1.1rem; cursor: pointer;" onclick="toggleSwitch(true)">👥</span>
                </div>

                <div id="pair-selection-area">
                    <select id="pairCount" class="btn" onchange="init()" style="border: 2px solid var(--primary); padding: 4px 6px;">
                        <option value="6">6</option>
                        <option value="9" selected>9</option>
                        <option value="12">12</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="game-area">
    <div id="score-board-container" class="score-board">
        <div id="p1-box" class="player-box" style="color: var(--p1)">
            <span class="p-label">P1</span>
            <span id="s1" class="p-score">0</span>
        </div>
        <div id="grid" class="grid"></div>
        <div id="p2-box" class="player-box" style="color: var(--p2)">
            <span class="p-label">P2</span>
            <span id="s2" class="p-score">0</span>
        </div>
    </div>
</div>

<!-- Mevcut audio etiketlerini bu linklerle güncelleyin -->
<audio id="snd-flip" src="https://cdn.pixabay.com/audio/2022/03/15/audio_5073041913.mp3"></audio>
<audio id="snd-match" src="https://cdn.pixabay.com/audio/2021/08/04/audio_bbfa83e354.mp3"></audio>
<audio id="snd-click" src="https://cdn.pixabay.com/audio/2022/03/10/audio_c350780443.mp3"></audio>

<script src="hafizakartlari.js"></script>

    <script src="geri.js"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
</html>
