        /* Mevcut @font-face kısmını bununla değiştirin */
@font-face {
    font-family: 'arakom';
    /* Dosya yolu hatasını önlemek için göreceli yol kullanın */
    src: url('./arakom.ttf') format('truetype'); 
    font-weight: normal; 
    font-style: normal;
}

        :root {
            --bg-gradient: linear-gradient(135deg, #f3f0ff 0%, #e5dbff 100%);
            --primary: #5c7cfa;
            --accent: #ff922b;
            --p1: #4dabf7;
            --p2: #ff8787;
            --shadow: 0 12px 25px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'arakom', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            padding: 10px;
            text-align: center;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 1000;
        }

        h1 { margin: 0 0 5px 0; color: #4b2cc5; font-size: 1.5rem; font-weight: normal; }
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

        .btn {
            border: none; padding: 8px 14px; border-radius: 10px; cursor: pointer;
            font-family: 'arakom'; background: white; box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: 0.3s; font-size: 0.9rem;
        }
        .btn.active { background: var(--primary); color: white; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .game-area { flex-grow: 1; padding: 15px; display: flex; justify-content: center; align-items: stretch; }

        .score-board {
    display: flex;
    flex-direction: row;
    align-items: stretch; /* Kutuların boyunu uzatır */
    justify-content: space-between;
    gap: 20px;
    width: 100%;
    max-width: 100%; /* 4K'da tam yayılma için */
    height: 85vh; /* Header dışında kalan alanın çoğu */
    margin: 0 auto;
}

.player-box {
    flex: 0 0 80px; /* Kutuların genişliğini sabitledik */
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 25px;
    box-shadow: var(--shadow);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 5px solid transparent;
    margin: 10px 0; /* Animasyon ve nefes alma payı */
}

/* Aktif oyuncu animasyonu */
.active-p { 
    background: #fff; 
    border-color: currentColor; 
    transform: scale(1.05); /* Hafif büyüme animasyonu */
    box-shadow: 0 0 40px rgba(0,0,0,0.15);
}

        .p-label { font-size: 1.1rem; font-weight: bold; opacity: 0.6; }
        .p-score { font-size: 2.5rem; font-weight: 900; margin-top: 5px; }

        
.grid { 
    display: grid; 
    gap: 15px; 
    flex-grow: 1; /* Sağ ve sol kutu arasındaki tüm boşluğu doldurur */
    width: 100%;
    height: 100%;
} .grid { display: grid; gap: 10px; flex-grow: 1; width: 100%; }

        .grid:not(.memory-mode) {
    grid-template-columns: repeat(5, 1fr) !important;
    /* Sabit 180px yerine, ekran yüksekliğinin %80'ini 4 satıra bölüyoruz */
    grid-auto-rows: 1fr;
    gap: 15px;
    width: 100%;
}

.grid.memory-mode {
    display: grid;
    gap: 10px;
    flex-grow: 1;
    height: 100%; /* Kutu yüksekliğini sona kadar zorlar */
    /* Satırları içeriğe göre değil, mevcut boşluğa göre eşit paylaştırır */
    grid-template-rows: repeat(auto-fit, minmax(100px, 1fr)); 
    align-content: stretch;
}
        .grid.memory-mode[data-total="12"] { grid-template-columns: repeat(4, 1fr); }
        .grid.memory-mode[data-total="18"] { grid-template-columns: repeat(6, 1fr); }
        .grid.memory-mode[data-total="20"] { grid-template-columns: repeat(5, 1fr); }
        .grid.memory-mode[data-total="24"] { grid-template-columns: repeat(6, 1fr); }

        .card { perspective: 1000px; cursor: pointer; width: 100%; height: 100%; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
 /* GENEL KART YÜZÜ */
.card-face {
    position: absolute; 
    width: 100%; 
    height: 100%; 
    backface-visibility: hidden; 
    border-radius: 15px;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    box-shadow: var(--shadow); 
    border: 4px solid white; 
    box-sizing: border-box; 
    text-align: center; 
    padding: 10px;
    word-break: break-word;
}

/* ARAPÇA BOYUT AYARI */
.lang-ar {
    font-family: 'arakom', sans-serif !important;
    font-size: clamp(1.4rem, 5vw, 3rem) !important;
    line-height: 1.2;
}

/* TÜRKÇE BOYUT AYARI */
.lang-tr {
    font-family: 'arakom', sans-serif !important;
    font-size: clamp(0.85rem, 3vw, 2rem) !important;
    font-weight: normal !important;
    line-height: 1.1;
}

/* KARTLAR (STUDY) MODU ÖZEL RENK AYARLARI */
/* Ön Yüz (Açık Hali): Yazı her zaman BEYAZ */
.grid:not(.memory-mode) .card-front span {
    color: white !important;
}

/* Arka Yüz (Dönünce): Yazı her zaman SİYAH */
.grid:not(.memory-mode) .card-back span {
    color: #000 !important;
}

/* HAFIZA OYUNU MODU (Mevcut halini korur) */
.grid.memory-mode .card-back {
    color: #333 !important;
}
        .card-front { color: white; }
        .card-back { transform: rotateY(180deg); background: #ffffff; color: #333; }
        .memory-mode .card-front::after { content: "؟"; font-size: 2rem; opacity: 0.3; }
        .matched { opacity: 0; pointer-events: none; transition: 0.6s; transform: scale(0.8); }

        /* Switch Tasarımı */
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--p2) !important; }
        input:checked + .slider:before { transform: translateX(22px); }

        @media (max-width: 768px) {
            .score-board { flex-direction: column; align-items: center; }
            .player-box { flex-direction: row; flex: none; width: 90%; height: 45px; gap: 5px; margin: 5px 0; }
            .p-score { font-size: 1.4rem; margin-top: 0; }
            .p-label { font-size: 0.8rem; }
            .grid:not(.memory-mode) { grid-template-columns: repeat(3, 1fr) !important; grid-auto-rows: 90px; }

            @media (orientation: portrait) {
                #pair-selection-area { display: none !important; }
                .grid.memory-mode { grid-template-columns: repeat(3, 1fr) !important; grid-auto-rows: minmax(75px, 1fr) !important; gap: 5px !important; }
                .card-face { font-size: 0.9rem !important; border-width: 2px !important; padding: 4px !important; }
                .memory-mode .card-front::after { font-size: 1.2rem; }
            }
        }

 
/* --- MOBİL ÖZEL AYARLARI --- */
@media (max-width: 768px) {
    
    /* 1. ÇALIŞMA MODU KART BOYUTLARI */
    /* Sütun sayısını 3 yerine 2 yaparsan kelimeler çok daha geniş bir alana yayılır ve taşma yapmaz */
    .grid:not(.memory-mode) {
        grid-template-columns: repeat(3, 1fr) !important; 
        grid-auto-rows: 120px !important; /* Yazı büyüyeceği için yüksekliği biraz artırdık */
        gap: 10px !important;
    }

    /* 2. HAFIZA OYUNU KART BOYUTLARI */
    @media (orientation: portrait) {
        .grid.memory-mode {
            grid-template-columns: repeat(3, 1fr) !important;
            grid-auto-rows: minmax(90px, 1fr) !important;
            gap: 6px !important;
        }
    }

    /* 3. ARAPÇA KELİME BOYUTLARI (Tüm Modlar) */
    .lang-ar {
        font-family: 'arakom', sans-serif !important;
        /* Arapça karakterlerin detayları (harekeler) için 2.2rem oldukça büyük ve okunaklıdır */
        font-size: 1.8rem !important; 
        color: #000 !important;
        line-height: 1.1 !important;
        /* Uzun kelimelerin sığması için harf arası daraltma (isteğe bağlı) */
        letter-spacing: -0.5px;
    }

    /* 4. TÜRKÇE KELİME BOYUTLARI (Tüm Modlar) */
    .lang-tr {
        font-family: 'arakom', sans-serif !important;
        font-size: 1.2rem !important; /* Türkçe kelimeler Arapçaya göre daha küçük kalarak hiyerarşi sağlar */
        font-weight: normal !important;
        color: #333 !important;
        line-height: 1.2;
    }

    /* 5. KART İÇİ DOLGU VE HİZALAMA */
    .card-face {
        padding: 5px !important;
        /* Kelime çok uzunsa kelimeyi bölerek kutudan taşmasını engeller */
        word-break: break-word !important;
        overflow: hidden;
    }
}

// --- DEĞİŞKENLER VE AYARLAR ---
const cardColors = ["#364fc7", "#63e6be", "#ff922b", "#f06595", "#845ef7", "#51cf66", "#fcc419", "#339af0"];
let mode = 'study', isAr = true, scores = [0, 0], currentPlayer = 1, activeFlipped = [];
let currentWords = []; // Seçilen konunun kelimeleri

// --- SİSTEM BAŞLATICI ---
window.onload = () => {
    renderMenu(); 
};

// --- MENÜ YÖNETİMİ ---
function renderMenu() {
    const list = document.getElementById('topics-list');
    if (!list) return;
    list.innerHTML = '';
    
    Object.keys(topics).forEach(key => {
        const topic = topics[key];
        const card = document.createElement('div');
        card.style = "background:white; padding:25px; border-radius:20px; box-shadow:0 12px 25px rgba(0,0,0,0.1); cursor:pointer; border:3px solid transparent; transition:0.3s;";
        card.innerHTML = `<div style="font-size:3rem;">${topic.icon}</div><h3>${topic.title}</h3><span>${topic.words.length} Kelime</span>`;
        
        card.onclick = () => {
            currentWords = [...topic.words]; // Referans hatasını önlemek için kopya al
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            setMode('study'); // Varsayılan olarak çalışma moduyla başla
        };
        list.appendChild(card);
    });
}

function showMenu() {
    if (typeof playSound === 'function') playSound('snd-click');
    document.getElementById('menu-screen').style.display = 'flex';
    document.getElementById('game-screen').style.display = 'none';
    currentWords = []; // Seçimi temizle[cite: 3]
}

// --- OYUN MODU YÖNETİMİ ---
function setMode(m) {
    if (typeof playSound === 'function') playSound('snd-click');
    mode = m; 
    scores = [0, 0]; 
    currentPlayer = 1; 
    activeFlipped = [];

    const studyBtn = document.getElementById('btn-study');
    const mainLangBtn = document.getElementById('lang-btn-main');
    const memStartBtn = document.getElementById('btn-memory-start');
    const memControls = document.getElementById('memory-controls');
    const toggle = document.getElementById('mode-toggle');

    // "Kartlar" butonu hafıza modundayken de görünür kalmalı (talebiniz üzerine)[cite: 3]
    studyBtn.style.display = 'inline-block';

    if (m === 'study') {
        studyBtn.classList.add('active');
        memStartBtn.classList.remove('active');
        mainLangBtn.style.display = 'inline-block';
        memStartBtn.style.display = 'inline-block';
        memControls.style.display = 'none';
    } else {
        studyBtn.classList.remove('active');
        memStartBtn.classList.add('active');
        mainLangBtn.style.display = 'none';
        memStartBtn.style.display = 'none'; // Hafıza modunda başlat butonunu gizle
        memControls.style.display = 'flex';
        if (toggle) toggle.checked = (m === 'mem2');
    }
    init(); // Kartları yeniden oluştur[cite: 3]
}

// --- GRID VE KART OLUŞTURMA (Hataların Giderildiği Bölüm) ---
function init() {
    if (!currentWords || currentWords.length === 0) {
        console.warn("Lütfen önce bir konu seçin.");
        return;
    }

    const grid = document.getElementById('grid');
    const p1Box = document.getElementById('p1-box');
    const p2Box = document.getElementById('p2-box');
    const pairCountInput = document.getElementById('pairCount');
    const pairCount = pairCountInput ? parseInt(pairCountInput.value) : 9;
    const isMobile = window.innerWidth <= 768;
    
    grid.innerHTML = '';
    const isStudy = mode === 'study';
    const isMem2 = mode === 'mem2';

    if (p1Box) p1Box.style.display = isMem2 ? 'flex' : 'none';
    if (p2Box) p2Box.style.display = isMem2 ? 'flex' : 'none';
    grid.className = `grid ${isStudy ? '' : 'memory-mode'}`;

    let selectedWords = isStudy ? currentWords : currentWords.slice(0, pairCount);
    let displayList = [];

    if (isStudy) {
        displayList = selectedWords;
        grid.style.height = "auto"; 
        grid.style.gridTemplateColumns = isMobile ? "repeat(2, 1fr)" : "repeat(5, 1fr)";
        grid.style.gridAutoRows = isMobile ? "120px" : "minmax(180px, auto)"; 
    } else {
        selectedWords.forEach(w => {
            displayList.push({ text: w.ar, pairId: w.ar, lang: 'ar' });
            displayList.push({ text: w.tr, pairId: w.ar, lang: 'tr' });
        });
        displayList.sort(() => Math.random() - 0.5);
        
        let colCount = isMobile ? 3 : (displayList.length <= 12 ? 4 : 6);
        let rowCount = Math.ceil(displayList.length / colCount);
        grid.style.height = "100%"; 
        grid.style.gridTemplateColumns = `repeat(${colCount}, 1fr)`;
        grid.style.gridTemplateRows = `repeat(${rowCount}, 1fr)`; 
        grid.style.gridAutoRows = "none";
    }

    grid.setAttribute('data-total', displayList.length);

    displayList.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = isStudy ? item.ar : item.pairId;
        
        const isBackAr = isStudy ? !isAr : (item.lang === 'ar');
        const color = isStudy ? cardColors[index % cardColors.length] : "#5c7cfa";

        card.innerHTML = `
            <div class="card-inner">
                <div class="card-face card-front" style="background-color: ${color}">
                    <span class="${isStudy && isAr ? 'lang-ar' : 'lang-tr'}">
                        ${isStudy ? (isAr ? item.ar : item.tr) : ""}
                    </span>
                </div>
                <div class="card-face card-back ${isBackAr ? 'lang-ar' : 'lang-tr'}">
                    <span>${isStudy ? (isAr ? item.tr : item.ar) : item.text}</span>
                </div>
            </div>`;
        
        card.onclick = () => handleFlip(card);
        grid.appendChild(card);
    });
    updateUI();
}

// --- OYUN MANTIĞI VE YARDIMCI FONKSİYONLAR ---
function handleFlip(card) {
    if (card.classList.contains('matched') || (mode !== 'study' && activeFlipped.length >= 2)) return;

    if (mode === 'study') {
        if (card.classList.contains('flipped')) {
            playSound('snd-flip');
            clearTimeout(card.studyTimer);
            card.classList.remove('flipped');
        } else {
            playSound('snd-flip');
            card.classList.add('flipped');
            card.studyTimer = setTimeout(() => {
                if(card.classList.contains('flipped')) {
                    playSound('snd-flip'); 
                    card.classList.remove('flipped');
                }
            }, 3000);
        }
        return;
    }

    if (card.classList.contains('flipped')) return;
    playSound('snd-flip');
    card.classList.add('flipped');
    activeFlipped.push(card);
    if (activeFlipped.length === 2) checkMatch();
}

function checkMatch() {
    const [a, b] = activeFlipped;
    const isMatch = a.dataset.id === b.dataset.id;

    setTimeout(() => {
        if (isMatch) {
            playSound('snd-match');
            a.classList.add('matched');
            b.classList.add('matched');
            if (mode === 'mem2') scores[currentPlayer - 1]++; else scores[0]++;
        } else {
            if (typeof playSound !== 'undefined') playSound('snd-wrong'); 
            a.classList.remove('flipped');
            b.classList.remove('flipped');
            if (mode === 'mem2') currentPlayer = (currentPlayer === 1) ? 2 : 1;
        }
        activeFlipped = [];
        updateUI();
    }, 800);
}

function updateUI() {
    const s1 = document.getElementById('s1');
    const s2 = document.getElementById('s2');
    if (s1) s1.innerText = scores[0];
    if (s2) s2.innerText = scores[1];
    document.getElementById('p1-box').classList.toggle('active-p', currentPlayer === 1);
    document.getElementById('p2-box').classList.toggle('active-p', currentPlayer === 2);
}

function playSound(id) {
    const s = document.getElementById(id);
    if (!s) return;
    s.pause();
    s.currentTime = 0;
    s.volume = 0.15;
    s.play().catch(() => {});
}

function toggleLang() {
    playSound('snd-click');
    isAr = !isAr;
    init();
}

function toggleSwitch(isCheck) {
    const toggle = document.getElementById('mode-toggle');
    if (toggle) {
        toggle.checked = isCheck;
        toggleMemoryMode(toggle);
    }
}

function toggleMemoryMode(checkbox) {
    setMode(checkbox.checked ? 'mem2' : 'mem1');
}
