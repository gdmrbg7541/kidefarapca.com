<!DOCTYPE html>
<html lang="tr" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title data-i18n="kt.sayfa_baslik">Kelimenin Serüveni - Seviye 2</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FV9JD15KLW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FV9JD15KLW');
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Harmattan:wght@400;700&family=Marhey:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="kaliplartablosudijital.css?v=98f3d3da">
</head>
<body>
    <div id="game-container">
        <main id="level2-container">
            <div class="back-button" id="game-back-button">&#8617;</div>
            <div id="l2-turkish-words-progress"></div>
            
            <div id="l2-root-area"> 
                <div id="l2-draggable-root-wrapper"></div> 
            </div>
            
            <div id="l2-mistakes"></div>
            
            <div id="l2-patterns-wrapper"></div>
            
            <div id="l2-global-result"></div>

            <div id="l2-bottom-area">
                <div class="l2-passive-suffixes">  ـ ـ ـة - ـ ـ ة   |   ـ ـ ـيّ - ـ ـ ـيَّة   |   ـ ـ ـات  |   ـ ـ ـًا </div>
                <button id="next-button" class="hidden" data-i18n="kt.ilerle">İlerle ▶</button>
            </div>
        </main>

        <div id="start-screen" class="overlay"> 
            <div class="overlay-content"> 
                <div class="back-button" id="start-back-button">&#8617;</div>
                <h1 data-i18n="kt.serven">Kelimenin Serüveni</h1> 
                <h2 data-i18n="kt.seviye2">Seviye 2: Kökü Kalıba Yerleştir</h2> 
                <div class="image-previews"> 
                     <div class="image-preview"> <img src="sayfa1.png" data-i18n-alt="kt.tablo1" alt="Kalıp Tablosu Sayfa 1"> <p data-i18n="kt.tablo1">Kalıp Tablosu 1</p> </div> 
                     <div class="image-preview"> <img src="sayfa2.png" data-i18n-alt="kt.tablo2" alt="Kalıp Tablosu Sayfa 2"> <p data-i18n="kt.tablo2">Kalıp Tablosu 2</p> </div> 
                </div> 
                <div class="start-options"> 
                    <button class="start-button-option" data-mode="1"> Kendini Dene!</button> 
                </div> 
            </div> 
        </div>

        <div id="results-screen" class="overlay hidden"> 
            <div class="overlay-content"> 
                <div class="back-button" id="results-back-button">&#8617;</div> 
                <h2 id="results-title">Oyun Bitti!</h2> 
                <div id="results-details"></div> 
                <button id="play-again-button" data-i18n="nav.menu_don">Ana Menüye Dön</button> 
            </div> 
        </div>
    
        <div id="orientation-warning" class="overlay">
            <div class="overlay-content">
                <h2 data-i18n="oyn.dik_tut">Lütfen Cihazı Dik Tutun</h2>
                <p data-i18n="oyn.dikey_not">Bu oyun en iyi dikey modda çalışır.</p>
            </div>
        </div>
    </div>

    <script src="kaliplartablosudijital.js?v=caf60d70"></script>
    <script src="geri.js?v=66ae34be"></script>
    <!-- DİL: sayfa seçili dili localStorage'dan okur, başka
         sekmede dil değişirse anında döner (sistem/dil.js). -->
    <script src="sistem/dil.js?v=a9253d84"></script>
</body>
</html>
