<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aksam-ı Seba: Master Sürüm</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d35400;
            --success: #27ae60;
            --error: #c0392b;
            --bg: #eef2f3;
            --card: #ffffff;
            --btn-disabled: #bdc3c7;
            --shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            margin: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            overflow: hidden;
            padding: 10px;
        }

        /* --- ANA KONTEYNER --- */
        .container {
            background-color: var(--card);
            width: 100%;
            height: 100%;
            max-width: 1600px; 
            max-height: 98vh;
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- HEADER --- */
        .header-bar {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-title {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        .icon-btn {
            background: #f0f2f5;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: var(--primary);
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .icon-btn:hover { background: #e2e6ea; transform: scale(1.05); }
        .icon-svg { width: 28px; height: 28px; fill: currentColor; }

        /* --- PROGRESS --- */
        .progress-wrapper {
            background-color: #eee;
            height: 8px;
            width: 100%;
            flex-shrink: 0;
        }
        .progress-fill {
            background-color: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* --- SCROLL EDİLEBİLİR İÇERİK ALANI --- */
        .content-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            scrollbar-width: thin;
            scrollbar-color: var(--primary) #eee;
        }

        /* --- SORU ALANI --- */
        .question-area {
            width: 100%;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 30px;
            text-align: center;
        }

        .quran-text {
            font-family: 'Amiri', serif;
            font-size: clamp(3rem, 6vw, 5.5rem); 
            color: var(--primary);
            line-height: 1.8;
            direction: rtl;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .highlight-word {
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
            display: inline-block;
            padding-bottom: 5px;
        }

        .translation {
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            color: #555;
            font-style: italic;
            max-width: 85%;
            line-height: 1.5;
        }

        /* --- ŞIKLAR (FLEXBOX) --- */
        .interaction-stage {
            width: 100%;
            max-width: 1300px;
        }

        .options-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            width: 100%;
        }

        .option-card {
            flex: 0 1 calc(30% - 25px); 
            min-width: 250px;
            max-width: 350px;
            
            background-color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            padding: 20px 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .opt-title { 
            font-weight: 700; 
            font-size: 1.5rem;
            color: var(--primary); 
            margin-bottom: 8px;
        }

        .opt-desc {
            font-size: 1rem;
            color: #7f8c8d;
            line-height: 1.3;
        }

        .option-card:hover {
            border-color: var(--primary);
            background-color: #f8f9fa;
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }
        
        .option-card:active {
            transform: translateY(-2px);
        }

        /* --- SONUÇ ALANI --- */
        .result-view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: fadeIn 0.4s ease;
        }

        .answer-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            text-align: center;
            background: #fff;
            padding: 15px 40px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }

        .answer-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .answer-desc {
            font-size: 1.3rem;
            color: #7f8c8d;
        }

        /* SONUÇ TABLOSU */
        .sarf-table {
            width: 100%;
            max-width: 900px;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #eee;
            direction: rtl;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }

        .sarf-table th {
            background: var(--primary);
            color: white;
            padding: 15px;
            font-size: 1.4rem;
            font-family: 'Amiri', serif;
        }

        .sarf-table td {
            background: #fff;
            padding: 15px;
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            color: #2c3e50;
            text-align: center;
            border-bottom: 1px solid #eee;
            border-left: 1px solid #eee;
        }
        .sarf-table td:last-child { border-left: none; }

        /* --- FOOTER (NAVİGASYON) --- */
        .control-bar {
            padding: 20px 40px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            flex-shrink: 0;
            z-index: 10;
        }

        .nav-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 140px;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(44, 62, 80, 0.2);
        }
        .nav-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(44, 62, 80, 0.3);
        }
        .nav-btn:disabled { background-color: var(--btn-disabled); cursor: not-allowed; box-shadow: none; }
        
        .nav-btn.pulse-active {
            background-color: var(--accent);
            animation: pulse 1.5s infinite;
        }

        /* --- FEEDBACK İKONLARI --- */
        .feedback-icon {
            position: absolute;
            top: 50%;
            transform: translate(0, -50%) scale(0);
            font-size: 5rem;
            font-weight: bold;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            pointer-events: none;
        }
        .icon-left { left: 40px; }
        .icon-right { right: 40px; }
        .feedback-icon.show { transform: translate(0, -50%) scale(1); opacity: 1; }
        .icon-success { color: var(--success); text-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); }
        .icon-error { color: var(--error); text-shadow: 0 4px 10px rgba(192, 57, 43, 0.3); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(211, 84, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(211, 84, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(211, 84, 0, 0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========================================= */
        /* MOBİL UYUMLULUK (RESPONSIVE RULES)        */
        /* ========================================= */

        @media screen and (max-width: 768px) {
            body { padding: 0; background-color: var(--card); }
            .container {
                max-width: 100%;
                max-height: 100%;
                border-radius: 0;
                box-shadow: none;
            }

            .content-scroll-area { padding: 15px; justify-content: flex-start; }
            .question-area { min-height: 150px; margin-bottom: 20px; }
            .quran-text { font-size: 2.5rem; }
            .translation { font-size: 1rem; }
            .header-bar { padding: 10px 15px; }

            .answer-row { flex-direction: column; gap: 5px; padding: 0; background: none; border: none; box-shadow: none; }
            .answer-title { font-size: 1.8rem; }
            .answer-desc { font-size: 1.1rem; }

            .sarf-table, .sarf-table tbody, .sarf-table tr, .sarf-table td {
                display: block;
                width: 100%;
                border: none;
            }
            .sarf-table thead { display: none; }
            .sarf-table tbody tr {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-top: 10px;
            }
            .sarf-table td {
                border: 1px solid #eee;
                border-radius: 8px;
                padding: 15px 5px;
                position: relative;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                font-size: 2rem;
            }
            .sarf-table td:nth-of-type(1)::before { content: "Mazi"; }
            .sarf-table td:nth-of-type(2)::before { content: "Muzari"; }
            .sarf-table td:nth-of-type(3)::before { content: "Emir"; }
            .sarf-table td:nth-of-type(4)::before { content: "Mastar"; }
            .sarf-table td::before {
                font-family: 'Poppins', sans-serif;
                font-size: 0.75rem;
                color: #95a5a6;
                text-transform: uppercase;
                margin-bottom: 5px;
                letter-spacing: 1px;
                font-weight: 600;
            }

            .icon-left { left: 10px; font-size: 3rem;}
            .icon-right { right: 10px; font-size: 3rem;}

            /* --- MOBİL İÇİN DÜZENLEME --- */
            .options-grid {
                gap: 15px;
            }
            .option-card { 
                min-height: 90px;
                flex: 0 1 calc(50% - 15px);
                min-width: auto;
            }
            .opt-title { font-size: 1.2rem; }
            .opt-desc { font-size: 0.85rem; }
        }

        /* --- MOBİL YATAY (LANDSCAPE) ÖZEL AYARLAR --- */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            
            /* Header ARTIK GÖRÜNÜYOR ama ince */
            .header-bar { 
                display: flex; 
                padding: 5px 15px; /* Boşluk azaltıldı */
                height: 45px; /* Sabit ince yükseklik */
                min-height: auto;
            }
            .header-title { font-size: 1rem; } /* Başlık küçüldü */
            .icon-btn { padding: 5px; width: 35px; height: 35px; } /* Butonlar küçüldü */
            .icon-svg { width: 20px; height: 20px; }

            .question-area { 
                min-height: 70px; 
                margin-bottom: 5px; 
                margin-top: 5px;
            }
            .quran-text { 
                font-size: 1.6rem; 
                margin-bottom: 0; 
                line-height: 1.2;
            }
            .translation { 
                font-size: 0.85rem; 
                margin-top: 3px; 
                line-height: 1.1;
            }
            
            .options-grid { gap: 10px; }
            .option-card { 
                flex: 0 1 calc(33% - 10px);
                min-height: 45px; 
                padding: 5px; 
            }
            .opt-title { font-size: 0.9rem; margin:0;}
            .opt-desc { display: none; } 

            .control-bar { padding: 5px 20px; min-height: 40px;}
            .nav-btn { padding: 5px 15px; font-size: 0.8rem; min-width: auto; height: 30px; }
        }

    </style>
</head>
<body>

<div class="container" id="main-container">
    <div class="header-bar">
        <a href="aksamiseba.html" class="icon-btn" title="Ana Sayfa">
            <svg class="icon-svg" viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </a>
        
        <div class="header-title">Kelime Tahlili</div>

        <button class="icon-btn" onclick="toggleFullScreen()" title="Tam Ekran">
            <svg class="icon-svg" viewBox="0 0 24 24">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
        </button>
    </div>

    <div class="progress-wrapper">
        <div class="progress-fill" id="progress-bar"></div>
    </div>

    <div class="content-scroll-area">
        <div class="question-area">
            <div id="feedback-left" class="feedback-icon icon-left"></div>
            
            <div class="quran-text" id="verse-text">...</div>
            <div class="translation" id="verse-translation">...</div>
            
            <div id="feedback-right" class="feedback-icon icon-right"></div>
        </div>

        <div class="interaction-stage">
            
            <div class="options-grid" id="options-container"></div>

            <div class="result-view" id="result-container">
                <div class="answer-row">
                    <div id="correct-answer-title" class="answer-title"></div>
                    <div style="font-size: 1.5rem; color: var(--primary);">:</div> 
                    <div id="correct-answer-desc" class="answer-desc"></div>
                </div>
                
                <table class="sarf-table">
                    <thead>
                        <tr>
                            <th>Mazi</th>
                            <th>Muzari</th>
                            <th>Emir</th>
                            <th>Mastar</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="res-mazi"></td>
                            <td id="res-muzari"></td>
                            <td id="res-emir"></td>
                            <td id="res-mastar"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="control-bar">
        <button class="nav-btn" onclick="prevQuestion()">
            <span>&#8592;</span> Geri
        </button>
        
        <button class="nav-btn" id="next-btn" onclick="nextQuestion()" disabled>
            İleri <span>&#8594;</span>
        </button>
    </div>
</div>

<script>
    const definitions = {
        "Salim": "İlletli veya şeddeli değil",
        "Mehmuz": "Asli harflerinde hemze var",
        "Mudaaf": "Aynı cinsten harf şeddeli",
        "Misal": "İlk harfi illetli",
        "Ecvef": "Ortadaki harfi illetli",
        "Nakıs": "Son harfi illetli",
        "Lefif": "İki harfi birden illetli"
    };

   const questions = [
        // --- FATİHA SURESİ ---
        {
            verse: "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",
            target: "نَعْبُدُ",
            tr_target: "kulluk ederiz",
            translation: "Yalnız sana kulluk ederiz.",
            correct: "Salim",
            conjugation: { mazi: "عَبَدَ", muzari: "يَعْبُدُ", emir: "اُعْبُدْ", mastar: "عِبَادَةً" }
        },
        {
            verse: "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ",
            target: "اهْدِنَا",
            tr_target: "Bizi ilet",
            translation: "Bizi dosdoğru yola ilet.",
            correct: "Nakıs",
            conjugation: { mazi: "هَدَى", muzari: "يَهْدِي", emir: "اِهْدِ", mastar: "هِدَايَةً" }
        },
        
        {
            verse: "لَا تَأْخُذُهُ سِنَةٌ",
            target: "تَأْخُذُهُ",
            tr_target: "tutmaz",
            translation: "O'nu bir uyuklama tutmaz.",
            correct: "Mehmuz",
            conjugation: { mazi: "أَخَذَ", muzari: "يَأْخُذُ", emir: "خُذْ", mastar: "أَخْذًا" }
        },
        {
            verse: "مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ",
            target: "يَشْفَعُ",
            tr_target: "şefaat edebilir",
            translation: "O'nun katında kim şefaat edebilir?",
            correct: "Salim",
            conjugation: { mazi: "شَفَعَ", muzari: "يَشْفَعُ", emir: "اِشْفَعْ", mastar: "شَفَاعَةً" }
        },

        {
            verse: "أَلَمْ يَجْعَلْ كَيْدَهُمْ",
            target: "يَجْعَلْ",
            tr_target: "kılmadı mı",
            translation: "Onların tuzaklarını boşa çıkarmadı (kılmadı) mı?",
            correct: "Salim",
            conjugation: { mazi: "جَعَلَ", muzari: "يَجْعَلُ", emir: "اِجْعَلْ", mastar: "جَعْلًا" }
        },
        
        {
            verse: "تَرْمِيهِمْ بِحِجَارَةٍ",
            target: "تَرْمِيهِمْ",
            tr_target: "atıyorlardı",
            translation: "Onlara taşlar atıyorlardı.",
            correct: "Nakıs", 
            conjugation: { mazi: "رَمَى", muzari: "يَرْمِي", emir: "اِرْمِ", mastar: "رَمْيًا" }
        },

        // --- KUREYŞ SURESİ ---
        {
            verse: "فَلْيَعْبُدُوا رَبَّ هَذَا الْبَيْتِ",
            target: "فَلْيَعْبُدُوا",
            tr_target: "kulluk etsinler",
            translation: "Şu Ev'in (Kabe'nin) Rabbine kulluk etsinler.",
            correct: "Salim",
            conjugation: { mazi: "عَبَدَ", muzari: "يَعْبُدُ", emir: "اُعْبُدْ", mastar: "عِبَادَةً" }
        },
        
        {
            verse: "فَذَلِكَ الَّذِي يَدُعُّ الْيَتِيمَ",
            target: "يَدُعُّ",
            tr_target: "itip kakan",
            translation: "İşte o, yetimi itip kakan kimsedir.",
            correct: "Mudaaf",
            conjugation: { mazi: "دَعَّ", muzari: "يَدُعُّ", emir: "دُعَّ", mastar: "دَعًّا" }
        },

        {
            verse: "فَصَلِّ لِرَبِّكَ وَانْحَرْ",
            target: "فَصَلِّ",
            tr_target: "namaz kıl",
            translation: "O halde Rabbin için namaz kıl.",
            correct: "Nakıs", 
            conjugation: { mazi: "صَلَّى", muzari: "يُصَلِّي", emir: "صَلِّ", mastar: "صَلَاةً" }
        },

        // --- KAFİRUN SURESİ ---
        {
            verse: "قُلْ يَا أَيُّهَا الْكَافِرُونَ",
            target: "قُلْ",
            tr_target: "De ki",
            translation: "De ki: Ey kafirler!",
            correct: "Ecvef",
            conjugation: { mazi: "قَالَ", muzari: "يَقُولُ", emir: "قُلْ", mastar: "قَوْلًا" }
        },
        {
            verse: "لَا أَعْبُدُ مَا تَعْبُدُونَ",
            target: "أَعْبُدُ",
            tr_target: "kulluk etmem",
            translation: "Ben sizin taptıklarınıza kulluk etmem.",
            correct: "Salim",
            conjugation: { mazi: "عَبَدَ", muzari: "يَعْبُدُ", emir: "اُعْبُدْ", mastar: "عِبَادَةً" }
        },

        {
            verse: "وَرَأَيْتَ النَّاسَ يَدْخُلُونَ",
            target: "يَدْخُلُونَ",
            tr_target: "girdiğini",
            translation: "İnsanların Allah'ın dinine girdiğini gördüğünde...",
            correct: "Salim",
            conjugation: { mazi: "دَخَلَ", muzari: "يَدْخُلُ", emir: "اُدْخُلْ", mastar: "دُخُولًا" }
        },
        
        {
            verse: "تَبَّتْ يَدَا أَبِي لَهَبٍ",
            target: "تَبَّتْ",
            tr_target: "kurusun",
            translation: "Ebu Leheb'in elleri kurusun!",
            correct: "Mudaaf",
            conjugation: { mazi: "تَبَّ", muzari: "يَتِبُّ", emir: "تِبَّ", mastar: "تَبًّا" }
        },
        
        {
            verse: "سَيَصْلَى نَارًا ذَاتَ لَهَبٍ",
            target: "سَيَصْلَى",

    let currentIdx = 0;

    function loadQuestion() {
        const data = questions[currentIdx];
        const nextBtn = document.getElementById('next-btn');
        
        // --- İkonları ve Arayüzü Sıfırla ---
        document.getElementById('feedback-left').className = 'feedback-icon icon-left';
        document.getElementById('feedback-right').className = 'feedback-icon icon-right';
        document.getElementById('feedback-left').innerHTML = '';
        document.getElementById('feedback-right').innerHTML = '';

        document.getElementById('progress-bar').style.width = ((currentIdx) / questions.length * 100) + "%";
        document.getElementById('options-container').style.display = 'flex'; // Flex ile göster
        document.getElementById('result-container').style.display = 'none';
        
        nextBtn.disabled = true;
        nextBtn.classList.remove('pulse-active');

        // --- ARAPÇA METİN (Renklendirme) ---
        document.getElementById('verse-text').innerHTML = data.verse.replace(
            data.target, 
            `<span class="highlight-word">${data.target}</span>`
        );

        // --- TÜRKÇE MEAL ---
        let trHtml = data.translation;
        if (data.tr_target) {
            trHtml = trHtml.replace(
                data.tr_target, 
                `<span class="highlight-word">${data.tr_target}</span>`
            );
        }
        document.getElementById('verse-translation').innerHTML = trHtml;

        // --- Şıkları Hazırla ---
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        let opts = [data.correct];
        const allTypes = Object.keys(definitions);
        const distractors = allTypes.filter(t => t !== data.correct).sort(() => 0.5 - Math.random()).slice(0, 4); 
        opts = opts.concat(distractors).sort(() => 0.5 - Math.random());

        opts.forEach(type => {
            const btn = document.createElement('div');
            btn.className = 'option-card';
            btn.innerHTML = `
                <div class="opt-title">${type}</div>
                <div class="opt-desc">${definitions[type]}</div>
            `;
            btn.onclick = () => handleAnswer(type);
            container.appendChild(btn);
        });
    }

    function handleAnswer(selected) {
        const data = questions[currentIdx];
        const isCorrect = selected === data.correct;
        
        // Şıkları Gizle
        document.getElementById('options-container').style.display = 'none';

        // İkonlar
        const leftIcon = document.getElementById('feedback-left');
        const rightIcon = document.getElementById('feedback-right');
        
        if (isCorrect) {
            const content = '✓';
            leftIcon.innerHTML = content;
            rightIcon.innerHTML = content;
            leftIcon.classList.add('show', 'icon-success');
            rightIcon.classList.add('show', 'icon-success');
        } else {
            const content = '✗';
            leftIcon.innerHTML = content;
            rightIcon.innerHTML = content;
            leftIcon.classList.add('show', 'icon-error');
            rightIcon.classList.add('show', 'icon-error');
        }

        // Sonuç Ekranı
        document.getElementById('correct-answer-title').innerText = data.correct;
        document.getElementById('correct-answer-desc').innerText = definitions[data.correct];
        
        document.getElementById('res-mazi').innerText = data.conjugation.mazi;
        document.getElementById('res-muzari').innerText = data.conjugation.muzari;
        document.getElementById('res-emir').innerText = data.conjugation.emir;
        document.getElementById('res-mastar').innerText = data.conjugation.mastar;

        document.getElementById('result-container').style.display = 'flex';
        const nextBtn = document.getElementById('next-btn');
        nextBtn.disabled = false;
        nextBtn.classList.add('pulse-active');
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            document.querySelector('.content-scroll-area').innerHTML = `
                <div style="text-align:center; padding:50px;">
                    <h1 style="color:var(--success)">Tebrikler!</h1>
                    <p style="font-size:1.5rem;">Çalışma tamamlandı.</p>
                    <button class="nav-btn" onclick="location.reload()" style="margin:20px auto;">Başa Dön</button>
                </div>
            `;
        }
    }

    function prevQuestion() {
        if (currentIdx > 0) {
            currentIdx--;
            loadQuestion();
        }
    }

    function toggleFullScreen() {
        var container = document.getElementById("main-container");
        if (!document.fullscreenElement) {
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
            } else if (container.msRequestFullscreen) {
                container.msRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    window.onload = loadQuestion;
</script>
