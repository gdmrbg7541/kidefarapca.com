<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aksam-ı Seba: Master Sürüm</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d35400;
            --success: #27ae60;
            --error: #c0392b;
            --bg: #eef2f3;
            --card: #ffffff;
            --btn-disabled: #bdc3c7;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        /* --- ANA KUTU --- */
        .container {
            background-color: var(--card);
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            
            /* Masaüstü Varsayılan */
            width: 95vw;
            height: 95vh;
            margin: auto;
            overflow-y: auto; /* İçerik taşarsa scroll olsun */
        }

        /* --- HEADER --- */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-shrink: 0; /* Header küçülmesin */
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--primary);
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-svg { width: 28px; height: 28px; fill: currentColor; }

        /* --- İLERLEME ÇUBUĞU --- */
        .progress-wrapper {
            background-color: #eee;
            border-radius: 10px;
            height: 6px;
            width: 100%;
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        .progress-fill {
            background-color: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* --- İÇERİK DÜZENİ --- */
        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto; /* İçerik kaydırma */
            padding-bottom: 10px;
        }

        /* SORU ALANI */
        .question-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 150px;
            position: relative;
            padding: 10px 0;
        }

        .quran-text {
            font-family: 'Amiri', serif;
            font-size: 4rem; /* Masaüstü boyutu */
            color: var(--primary);
            line-height: 1.6;
            direction: rtl;
        }

        .highlight-word {
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
        }

        .translation {
            font-size: 1.5rem;
            color: #666;
            font-style: italic;
            margin-top: 20px;
        }

        /* --- SAHNE --- */
        .interaction-stage {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-shrink: 0;
        }

        /* ŞIKLAR */
        .options-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .option-card {
            background-color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px 10px;
            cursor: pointer;
            width: 30%; /* Masaüstü: 3 tane sığar */
            min-width: 180px;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .opt-title { 
            font-weight: 700; 
            font-size: 1.8rem; 
            color: var(--primary); 
            line-height: 1.2;
        }

        .opt-desc {
            font-size: 1rem; 
            color: #666;
            margin-top: 5px;
        }

        .option-card:hover {
            border-color: var(--primary);
            background-color: #fcfcfc;
            transform: translateY(-2px);
        }

        /* SONUÇ EKRANI */
        .result-view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: fadeIn 0.4s ease;
        }

        .answer-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .answer-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .answer-desc {
            font-size: 1.5rem;
            color: #7f8c8d;
            font-style: italic;
        }

        /* TABLO (Masaüstü Standart) */
        .sarf-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #eee;
            direction: rtl;
            margin-bottom: 10px;
        }

        .sarf-table th {
            background: var(--primary);
            color: white;
            padding: 10px;
            font-size: 1.4rem;
        }

        .sarf-table td {
            background: #fff;
            padding: 10px;
            font-family: 'Amiri', serif;
            font-size: 3rem;
            color: #2c3e50;
            border-bottom: 1px solid #eee;
            border-left: 1px solid #eee;
        }
        .sarf-table td:last-child { border-left: none; }

        /* --- FOOTER --- */
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-top: 10px;
            border-top: 1px solid #eee;
            margin-top: auto;
            flex-shrink: 0;
        }

        .nav-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 25px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 120px;
            justify-content: center;
        }
        .nav-btn:disabled { background-color: var(--btn-disabled); cursor: not-allowed; }
        
        .nav-btn.pulse-active {
            background-color: var(--accent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(211, 84, 0, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(211, 84, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(211, 84, 0, 0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* GERİ BİLDİRİM İKONLARI */
        .feedback-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) scale(0);
            font-size: 5rem;
            font-weight: bold;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            pointer-events: none; /* Tıklamayı engellemesin */
        }
        .icon-left { left: 10px; }
        .icon-right { right: 10px; }
        .feedback-icon.show { transform: translateY(-50%) scale(1); opacity: 1; }
        .icon-success { color: var(--success); }
        .icon-error { color: var(--error); }
/* ============================================================ */
/* 1. MOBİL DİKEY (PORTRAIT) - ŞIKLAR 2 SÜTUN OLSUN */
/* ============================================================ */
@media screen and (max-width: 768px) and (orientation: portrait) {
    .options-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px; /* Kartlar arası boşluk */
        justify-content: center;
    }

    .option-card {
        /* Yan yana 2 tane sığması için (Boşluk payı düşüldü) */
        width: 30% !important;
        margin-bottom: 0; /* Ekstra marjini sıfırla */
        min-height: 60px; /* Yükseklik standardı */
    }
    
    .opt-desc {
        font-size: 0.8rem; /* Açıklama yazısını mobilde biraz küçülttük */
    }
}

/* ============================================================ */
/* 2. MOBİL YATAY (LANDSCAPE) - YAZILAR KÜÇÜK, EKRANA SIĞSIN */
/* ============================================================ */
@media screen and (max-height: 500px) and (orientation: landscape) {
    /* Ana kutuyu tam ekran yap ve boşlukları al */
    .container {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        padding: 5px 15px; /* Kenar boşluklarını azalttık */
        margin: 0;
        justify-content: flex-start; /* İçeriği yukarı yasla */
    }

    /* Header ve Progress barı sıkıştır */
    .header-bar { margin-bottom: 5px; }
    .progress-wrapper { height: 4px; margin-bottom: 5px; }

    /* Soru Alanını Küçült */
    .question-area {
        min-height: auto;
        padding: 0;
        margin: 0;
        flex-grow: 0; /* Gereksiz büyümesin */
    }

    /* Ayet ve Meal Yazı Boyutları */
    .quran-text {
        font-size: 4rem !important; /* Ciddi oranda küçültüldü */
        line-height: 1;
        margin-bottom: 10px;
    }

    .translation {
        font-size: 1rem !important;
        margin-top: 2px;
        margin-bottom: 5px;
    }

    /* Şıklar Yan Yana Dizilsin (5 Sütun veya sığdığı kadar) */
    .options-grid {
        gap: 5px;
        margin-top: 5px;
    }

    .option-card {
        width: 18% !important; /* 5 tane yan yana sığar */
        padding: 5px 2px;
        min-height: 60px;
        min-width: auto; /* Genişlik kısıtlamasını kaldır */
    }

    .opt-title {
        font-size: 0.9rem !important;
    }

    .opt-desc {
        font-size: 0.8rem !important; /* Açıklamayı çok küçült */
        line-height: 1;
        margin-top: 2px;
    }

    /* Alt Kontrol Barı */
    .control-bar {
        padding-top: 2px;
        margin-top: 5px;
    }
    .nav-btn {
        padding: 5px 15px;
        font-size: 0.9rem;
        min-width: auto;
    }
    
    /* Gereksiz ikonları gizle veya küçült */
    .icon-svg { width: 20px; height: 20px; }
}
            .sarf-table thead { display: none; } /* Başlıkları gizle */
            
            .sarf-table tr {
                display: grid;
                grid-template-columns: 1fr 1fr; /* 2 Sütun */
                gap: 8px;
            }

            .sarf-table td {
                display: flex;
                flex-direction: column;
                align-items: center;
                border: 1px solid #eee;
                border-radius: 8px;
                font-size: 2.2rem; /* Mobilde daha makul boyut */
                padding: 15px 5px;
                position: relative;
            }

            /* Hücrelerin içine yapay başlık ekle */
            .sarf-table td::before {
                content: attr(data-label);
                font-family: 'Poppins', sans-serif;
                font-size: 0.8rem;
                color: #95a5a6;
                text-transform: uppercase;
                margin-bottom: 5px;
                letter-spacing: 1px;
            }

            /* İkonları mobilde biraz küçült */
            .feedback-icon { font-size: 4rem; }
        }

        /* Çok küçük ekranlar için ekstra önlem (iPhone SE vb.) */
        @media screen and (max-width: 380px) {
            .quran-text { font-size: 1.8rem; }
            .opt-title { font-size: 1.2rem; }
            .nav-btn { min-width: auto; padding: 10px 15px; font-size: 0.9rem; }
        }
        
        /* Yatay ekran (Landscape) için düzenleme */
        @media screen and (max-height: 500px) {
            .container { height: auto; min-height: 100vh; }
            .question-area { min-height: 100px; }
        }

    </style>
</head>

        "Ecvef": "Ortadaki harfi illetli",
        "Nakıs": "Son harfi illetli",
        "Lefif": "İki harfi birden illetli"
    };

   const questions = [
        // --- FATİHA SURESİ ---
        {
            verse: "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",

            conjugation: { mazi: "عَبَدَ", muzari: "يَعْبُدُ", emir: "اُعْبُدْ", mastar: "عِبَادَةً" }

        // --- KUREYŞ SURESİ ---

        {

        },

        // --- İHLAS SURESİ ---
        {
            verse: "لَمْ يَلِدْ وَلَمْ يُولَدْ",
            target: "يَلِدْ",
            tr_target: "doğurmamıştır",
            translation: "O doğurmamıştır.",
            correct: "Misal", // Welede
            conjugation: { mazi: "وَلَدَ", muzari: "يَلِدُ", emir: "لِدْ", mastar: "وِلَادَةً" }

            translation: "Azgınlıkları içinde onlara süre verir.",

    ];
    let currentIdx = 0;

    function loadQuestion() {
        const data = questions[currentIdx];
        const nextBtn = document.getElementById('next-btn');
        
        // --- İkonları ve Arayüzü Sıfırla ---
        document.getElementById('feedback-left').className = 'feedback-icon icon-left';
        document.getElementById('feedback-right').className = 'feedback-icon icon-right';
        document.getElementById('feedback-left').innerHTML = '';
        document.getElementById('feedback-right').innerHTML = '';

        document.getElementById('progress-bar').style.width = ((currentIdx) / questions.length * 100) + "%";
        document.getElementById('options-container').style.display = 'flex';
        document.getElementById('result-container').style.display = 'none';
        
        nextBtn.disabled = true;
        nextBtn.classList.remove('pulse-active');

        // --- ARAPÇA METİN (Renklendirme) ---
        document.getElementById('verse-text').innerHTML = data.verse.replace(
            data.target, 
            `<span class="highlight-word">${data.target}</span>`
        );

        // --- TÜRKÇE MEAL (Renklendirme - YENİ KISIM) ---
        // Türkçe hedef kelimeyi bulup aynı stil ile sarmalıyoruz
        let trHtml = data.translation;
        if (data.tr_target) {
            trHtml = trHtml.replace(
                data.tr_target, 
                `<span class="highlight-word">${data.tr_target}</span>`
            );
        }
        // ÖNEMLİ: innerText yerine innerHTML kullanıyoruz ki renk kodları çalışsın
        document.getElementById('verse-translation').innerHTML = trHtml;

        // --- Şıkları Hazırla ---
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        let opts = [data.correct];
        const allTypes = Object.keys(definitions);
        const distractors = allTypes.filter(t => t !== data.correct).sort(() => 0.5 - Math.random()).slice(0, 4); // 4 yanlış + 1 doğru
        opts = opts.concat(distractors).sort(() => 0.5 - Math.random());

        opts.forEach(type => {
            const btn = document.createElement('div');
            btn.className = 'option-card';
            // Hem Başlık Hem Açıklama
            btn.innerHTML = `
                <div class="opt-title">${type}</div>
                <div class="opt-desc">${definitions[type]}</div>
            `;
            btn.onclick = () => handleAnswer(type);
            container.appendChild(btn);
        });
    }

    function handleAnswer(selected) {
    const data = questions[currentIdx];
    const isCorrect = selected === data.correct;
    
    // Şıkları Gizle
    document.getElementById('options-container').style.display = 'none';

    // --- YENİ İKON MANTIĞI ---
    const leftIcon = document.getElementById('feedback-left');
    const rightIcon = document.getElementById('feedback-right');
    
    if (isCorrect) {
        // Doğru ise Yeşil TİK (✓)
        const content = '✓';
        leftIcon.innerHTML = content;
        rightIcon.innerHTML = content;
        leftIcon.classList.add('show', 'icon-success');
        rightIcon.classList.add('show', 'icon-success');
    } else {
        // Yanlış ise Kırmızı ÇARPI (✗)
        const content = '✗';
        leftIcon.innerHTML = content;
        rightIcon.innerHTML = content;
        leftIcon.classList.add('show', 'icon-error');
        rightIcon.classList.add('show', 'icon-error');
    }
    // --------------------------

    // Sonuç Ekranını Doldur
    document.getElementById('correct-answer-title').innerText = data.correct;
    document.getElementById('correct-answer-desc').innerText = definitions[data.correct];
    
    document.getElementById('res-mazi').innerText = data.conjugation.mazi;
    document.getElementById('res-muzari').innerText = data.conjugation.muzari;
    document.getElementById('res-emir').innerText = data.conjugation.emir;
    document.getElementById('res-mastar').innerText = data.conjugation.mastar;

    // Banner kodunu kaldırdık çünkü artık ikon kullanıyoruz.
    
    document.getElementById('result-container').style.display = 'flex';
    const nextBtn = document.getElementById('next-btn');
    nextBtn.disabled = false;
    nextBtn.classList.add('pulse-active');
}

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            // Bitiş
            document.querySelector('.content-wrapper').innerHTML = `
                <div style="text-align:center; padding:50px;">
                    <h1 style="color:var(--success)">Tebrikler!</h1>
                    <p style="font-size:1.5rem;">Çalışma tamamlandı.</p>
                    <button class="nav-btn" onclick="location.reload()" style="margin:20px auto;">Başa Dön</button>
                </div>
            `;
        }
    }

    function prevQuestion() {
        if (currentIdx > 0) {
            currentIdx--;
            loadQuestion();
        }
    }

    function toggleFullScreen() {
    // Konteynır elemanını seçiyoruz
    var container = document.getElementById("main-container");

    if (!document.fullscreenElement) {
        // Tüm sayfa yerine sadece konteynırı tam ekran yapıyoruz
        if (container.requestFullscreen) {
            container.requestFullscreen();
        } else if (container.webkitRequestFullscreen) { /* Safari */
            container.webkitRequestFullscreen();
        } else if (container.msRequestFullscreen) { /* IE11 */
            container.msRequestFullscreen();
        }
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

    window.onload = loadQuestion;
</script>
