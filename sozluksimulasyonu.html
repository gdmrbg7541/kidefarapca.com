</div>

    <!-- SINIF KİPİ — ?sinif=5|6|7|9|10 ile açıldığında oyunun verisi o
         sınıfın MUHÂDESE ders cümleleridir. Veri dosyası ANA BETİKTEN
         ÖNCE, belge yazılırken (document.write) yükleniyor; böylece
         gameData hazırlanırken window.SOZLUK_SINIF yerinde olur.
         (Aynı kalıp muhadese.html'de de kullanılıyor.)
         ⚠️ Yeni sınıf eklerken AŞAĞIDAKİ LİSTEYE de eklenmeli; yoksa
            veri dosyası hiç yüklenmez ve sayfa boş açılır. -->
    <script>
    (function () {
      try {
        var s = (new URLSearchParams(location.search).get('sinif') || '').trim();
        if (['5', '6', '7', '9', '10'].indexOf(s) < 0) return;
        document.write('<scr' + 'ipt src="sozluk/veri/sozluk_' + s + '.js?v=20260816a"><\/scr' + 'ipt>');
      } catch (e) {}
    })();
    </script>
    <script src="sozluk/sozluksimulasyonu.js?v=20260816b"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
