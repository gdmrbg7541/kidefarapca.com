<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metin Tahlilleri</title>
<!-- METİNLERLE ARAPÇA SİTEYE (14.11.2026) — öğretmen: "sitede var olan metin tahlilleri sistemini tamamen bu şekilde
     ayarlıcaz, onların yerine bunları ekleyelim". Eski liste/okuma sayfası artık Metinlerle Arapça kitabına yönlendirir:
     ?sinif=N  ya da  ?ders=N_…  → kitabın N. sınıf bölümü. Eski sayfa: _kaynak/yedekler/2026-11-14-metinlerle-arapca-siteye/ -->
<script>
(function () {
  var B = {5: 3, 6: 8, 7: 17, 8: 38, 9: 60, 10: 74};
  var p = new URLSearchParams(location.search), s = parseInt(p.get('sinif'), 10);
  if (!B[s]) { var d = /^([0-9]+)_/.exec(p.get('ders') || ''); if (d) s = +d[1]; }
  location.replace('kitap/metinlerle-arapca/index.html' + (B[s] ? '?s=' + B[s] : ''));
})();
</script>
</head>
<body style="font-family:sans-serif;padding:24px">
<a href="kitap/metinlerle-arapca/index.html">Metinlerle Arapça — Metin Tahlilleri</a>
</body>
</html>
