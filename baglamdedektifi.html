<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YDT Analiz: Bağlam Dedektifi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #2c3e50;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #e74c3c;
            --success: #27ae60;
            --info-bg: #34495e; 
            --info-strip-bg: #ecf0f1;
            --text-gray: #7f8c8d;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* --- HEADER --- */
        .header {
            background-color: var(--primary);
            color: white;
            text-align: center;
            font-size: 3vh;
            font-weight: 800;
            flex: 0 0 8vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 2vh;
            z-index: 100;
        }

        /* --- PDF ARAÇLARI (MOBİLDE GİZLİ) --- */
        .pdf-tools {
            position: absolute;
            right: 2vh;
            display: flex;
            gap: 1vh;
        }
        
        @media (max-width: 1024px) {
            .pdf-tools { display: none !important; }
        }

        .pdf-btn {
            background: #e74c3c;
            border-radius: 1vh;
            padding: 0.5vh 1.5vh;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.6vh;
        }

        /* --- CÜMLE ALANI --- */
        .sentence-area {
            flex: 1; /* Dinamik alan */
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            direction: rtl;
            padding: 2vh;
            overflow-y: auto;
            background: #fdfdfd;
        }

        .word-group {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 1.5vh;
            margin-top: 4vh; /* Üstteki anlam için alan */
            cursor: pointer;
        }

        .arabic-word {
            font-family: 'Scheherazade New', serif;
            font-size: 6.5vh;
            color: var(--primary);
            font-weight: 700;
            line-height: 1.2;
            margin-top: 1vh; /* Kelime ile anlam arasındaki boşluk */
        }

        .tr-meaning {
            position: absolute;
            top: -3.5vh; /* Arapça kelimenin yukarısında konum */
            white-space: nowrap;
            font-size: 2.2vh;
            color: var(--text-gray);
            font-weight: 700;
            opacity: 0;
            transition: transform 0.2s, opacity 0.2s;
        }

        .word-group.show-tr .tr-meaning {
            opacity: 1;
            transform: translateY(-0.5vh);
        }

        /* --- TÜRKÇE TAM CÜMLE --- */
        .full-sentence-box {
            flex: 0 0 8vh;
            background-color: #f1f2f6;
            color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 2.8vh;
            font-weight: 800;
            padding: 0 2vh;
            border-top: 1px solid #ddd;
        }

        /* --- ŞIKLAR ALANI --- */
        .options-area {
            flex: 0 0 45vh; /* Şıklar için ayrılan sabit/dengeli alan */
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2vh;
            padding: 2vh;
            background: #fff;
            overflow-y: auto;
        }

        .option-card {
            background: #f8f9fa;
            border: 0.3vh solid #e0e0e0;
            border-radius: 1.5vh;
            display: flex;
            height: 18vh;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .answer-zone {
            flex: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .opt-arabic {
            font-family: 'Scheherazade New', serif;
            font-size: 6vh;
            color: var(--primary);
        }

        .info-zone {
            flex: 1;
            background-color: var(--info-strip-bg);
            border-left: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* --- FEEDBACK BUTONU --- */
        .feedback-box {
            position: absolute;
            bottom: 2vh;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 200;
        }

        .next-btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 2vh 10vh;
            border-radius: 5vh;
            font-size: 3vh;
            cursor: pointer;
            font-weight: 800;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* MOBİL DİKEY UYARISI */
        #rotate-device-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            color: white;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        @media screen and (orientation: portrait) {
            #rotate-device-overlay { display: flex; }
            .container { display: none; }
        }

        .info-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--info-bg);
            color: white;
            padding: 1.5vh;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .show-info { opacity: 1; visibility: visible; }
        
        .correct { background-color: #d4efdf !important; border-color: var(--success) !important; }
        .wrong { background-color: #fadbd8 !important; border-color: #c0392b !important; }

        .back-button svg { width: 4vh; height: 4vh; fill: white; }
        .back-button-container { position: absolute; left: 2vh; }
    </style>
</head>
<body>

<div id="rotate-device-overlay">
    <div style="font-size: 50px; margin-bottom: 20px;">🔄</div>
    <p>Lütfen devam etmek için cihazınızı yan çevirin.</p>
</div>

<div class="container">
    <div class="header">
        <div class="back-button-container">
            <a href="ydtarapca.html" class="back-button">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </a>
        </div>
        Bağlam Dedektifi 🕵️‍♂️
        <div class="pdf-tools">
            <div onclick="openPdf('tablo1.pdf')" class="pdf-btn">SÜLASİ</div>
            <div onclick="openPdf('tablo2.pdf')" class="pdf-btn">MEZİD</div>
        </div>
    </div>

    <div id="sentence-container" class="sentence-area"></div>
    <div id="full-sentence-display" class="full-sentence-box"></div>
    <div id="options-container" class="options-area"></div>

    <div id="feedback-overlay" class="feedback-box">
        <button id="next-btn" class="next-btn" onclick="nextQuestion()">Sıradaki Soru</button>
    </div>
</div>

<script>
    // [Burada orijinal dosyanızdaki "questions" dizisi ve script mantığı aynı şekilde yer almalı]
    // Örnek soru yapısı (Kısa tutulmuştur, orijinal verilerinizi buraya ekleyin)
    const questions = [
        {
            fullTr: "Arapça dersi az önce bitti.",
            words: [
                { ar: "انتهى", tr: "Bitti", hk: "اِنْتَهَى" },
                { ar: "_______", tr: "???", hk: "_______" },
                { ar: "اللغة", tr: "Dili", hk: "اَللُّغَةِ" },
                { ar: "العربية", tr: "Arap", hk: "اَلْعَرَبِيَّةِ" },
                { ar: "قبل", tr: "Önce", hk: "قَبْلَ" },
                { ar: "قليل", tr: "Az", hk: "قَلِيلٍ" }
            ],
            targetIndex: 1,
            options: [
                { ar: "دَرَسَ", correct: false, features: ["Zaman kavramı barındırır", "Fiil formundadır"], type: "Fiil (Mazi)" },
                { ar: "دَرْSُ", ar: "دَرْسُ", correct: true, features: ["Zaman kavramından soyuttur", "İsim tamlaması öğesidir"], type: "İsim (Mastar)" }
            ]
        }
        // ... Diğer sorularınızı buraya ekleyin
    ];

    let currentQIndex = 0;
    let isAnswered = false;

    function loadQuestion() {
        const q = questions[currentQIndex];
        const container = document.getElementById('sentence-container');
        const optionsBox = document.getElementById('options-container');
        const fullSentBox = document.getElementById('full-sentence-display');
        const feedbackOverlay = document.getElementById('feedback-overlay');
        
        isAnswered = false;
        container.innerHTML = '';
        optionsBox.innerHTML = '';
        feedbackOverlay.style.display = 'none';
        fullSentBox.innerHTML = `"${q.fullTr}"`;

        q.words.forEach((item, index) => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'word-group';
            groupDiv.innerHTML = `
                <span class="tr-meaning">${item.tr}</span>
                <span class="arabic-word">${item.ar}</span>
            `;
            groupDiv.onclick = () => {
                const isShowing = groupDiv.classList.toggle('show-tr');
                groupDiv.querySelector('.arabic-word').innerText = isShowing ? item.hk : item.ar;
            };
            container.appendChild(groupDiv);
        });

        q.options.forEach((opt, idx) => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.id = `opt-card-${idx}`;
            card.innerHTML = `
                <div class="answer-zone" onclick="checkAnswer(${idx})">
                    <span class="opt-arabic">${opt.ar}</span>
                </div>
                <div class="info-zone" onclick="toggleInfo(event, '${card.id}')">
                    <div style="font-size:3vh">💡</div>
                </div>
                <div class="info-overlay">
                    <div style="font-weight:800; color:#f1c40f; margin-bottom:1vh" onclick="toggleInfo(event, '${card.id}')">✖ ${opt.type}</div>
                    <ul style="font-size:1.8vh; padding-left:2vh">${opt.features.map(f => `<li>${f}</li>`).join('')}</ul>
                </div>
            `;
            optionsBox.appendChild(card);
        });
    }

    function checkAnswer(idx) {
        if(isAnswered) return;
        isAnswered = true;
        const q = questions[currentQIndex];
        const card = document.getElementById(`opt-card-${idx}`);
        card.classList.add(q.options[idx].correct ? 'correct' : 'wrong');
        document.getElementById('feedback-overlay').style.display = 'block';
    }

    function toggleInfo(e, id) {
        e.stopPropagation();
        document.getElementById(id).querySelector('.info-overlay').classList.toggle('show-info');
    }

    function nextQuestion() {
        currentQIndex++;
        if (currentQIndex < questions.length) loadQuestion();
        else alert("Tüm sorular bitti!");
    }

    function openPdf(file) {
        // PDF işlevi mobilde butonlar gizli olduğu için sadece masaüstünde tetiklenebilir
        window.open(file, '_blank');
    }

    loadQuestion();
</script>
</body>
</html>
