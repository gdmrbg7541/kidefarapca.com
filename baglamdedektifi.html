        /* --- BÖLÜMLER --- */
        
        .header {
    background-color: var(--primary);
    color: white;
    text-align: center;

    font-weight: 800;

        .sentence-area {
    flex: 3.0;

    flex-direction: row;
    justify-content: center;
    align-items: flex-end;

    width: 100%;
}
#pdf-iframe {
    width: 100%;
    flex: 1; 100%;
    border: none;
}

/* Eğer PDF bir modal içindeyse modalı da genişletin */
.modal-content {
    width: 95vw; /* Kenarlarda çok az boşluk bırakır */
    height: 90vh;
    max-width: none;
}

        /* Mevcut kodda satır ~103 civarı */
.word-group {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0 0.8vh; /* Boşluğu biraz azalttık */
    flex-shrink: 0;  /* Yeni: Kelimelerin sıkışıp bozulmasını engeller */
}

        .arabic-word {
    font-family: 'Scheherazade New', serif;
    font-size: 6.5vh; /* Boyutu 8vh'den 6.5vh'ye çektik (Daha iyi sığması için) */
    color: var(--primary);
    font-weight: 700;
    line-height: 1.2;
    z-index: 2; 
    white-space: nowrap; /* Kelimenin kendi içinde bölünmesini engeller */
}
       .tr-meaning {
    position: absolute;
    left: 50%;
    top: -5vh;
    transform: translate(-50%, -50%); /* Döndürmeyi (rotate) kaldırdık, daha okunaklı olması için */
    white-space: nowrap;
    text-align: center; /* Merkeze hizala */
    font-size: 2.2vh; 
    color: #7f8c8d;
    font-weight: 700;
    pointer-events: none; 
    z-index: 1;
    opacity: 0; 
    transition: all 0.3s ease;
}
/* Hareke için ek stil */
.hk-info {
    display: block;
    font-size: 1.8vh;
    color: var(--accent); /* Hareke bilgisini farklı renk yapalım */
    font-style: italic;
}

/* Dokunulduğunda/Tıklandığında görünür yapacak sınıf */
.word-group.show-tr .tr-meaning {
    opacity: 1;
    top: -7vh; /* Hafif yukarı zıplama efekti */
}

/* Arapça kelimenin üzerine gelindiğinde imleci değiştir */
.word-group {
    cursor: pointer;
}

        .target-group .arabic-word {
            color: var(--accent);
            cursor: pointer;
        }
        .target-group .tr-meaning {
            color: var(--accent);
            font-size: 3.2vh; 
            font-weight: 900;
        }

        .full-sentence-box {
            flex: 0 0 auto;
            min-height: 15%; 
            width: 100%;
            background-color: #f1f2f6;
            color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 4.2vh; 
            font-weight: 800;
            padding: 2vh;

            border-bottom: 2px solid #e0e0e0;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            z-index: 5;
        }
        
        .highlight {
            color: var(--accent);
            text-decoration: none; 
            font-weight: 900;
        }

        /* Seçenekler Alanı */
        .options-area {
    flex: 3;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5vh;
    padding: 1vh 2vh 15vh 2vh; /* Alt boşluğu 15vh yaparak butona yer açtık */
    width: 100%;
    overflow-y: auto; /* Şıklar sığmazsa kendi içinde kaydırılabilir */
}

        /* --- ŞIK KARTI (Dış Çerçeve) --- */
        .option-card {
            background: #f8f9fa;
            border: 0.4vh solid #e0e0e0;
            border-radius: 1.5vh;
            display: flex; /* Flex yapısı ile yatay bölme */
            flex-direction: row; 
            height: 20vh; 
            position: relative; 
            overflow: hidden; 
            transition: transform 0.1s;
            min-height: 120px;
        }

        /* --- SOL TARAF: CEVAP ALANI (%80) --- */
        .answer-zone {
            flex: 4; /* Geniş alan */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: transparent;
        }

        .answer-zone:active {
            background-color: rgba(0,0,0,0.05);
        }

        /* --- SAĞ TARAF: İPUCU ŞERİDİ (%20) --- */
        .info-zone {
            flex: 1.2; /* Dar alan */
            background-color: var(--info-strip-bg);
            border-left: 2px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .info-zone:active {
            background-color: #d5dbdb;
        }

        .opt-arabic {
            font-family: 'Scheherazade New', serif;
            font-size: 8vh; 
            min-size: 40px;
            color: var(--primary);
            line-height: 1;
        }

        /* --- DEVASA AMPUL --- */
        .info-icon {
            font-size: 5vh; /* Ampul büyüdü */
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
            transition: transform 0.2s;
        }
        
        .info-zone:active .info-icon {
            transform: scale(0.85);
        }

        /* --- BİLGİ KUTUSU (OVERLAY) --- */
        .info-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--info-bg);
            color: white;
            padding: 2vh;
            display: flex; 
            flex-direction: column;
            justify-content: center;
            align-items: flex-start; 
            text-align: left;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 50; /* Yazıların üstüne çıksın */
        }

        .show-info {
            opacity: 1;
            visibility: visible;
        }

        .info-overlay ul {
            margin: 0;
            padding-left: 3vh;
            list-style-type: disc;
        }

        .info-overlay li {
            font-size: 2vh;
            margin-bottom: 1vh;
            line-height: 1.4;
        }

        .info-title {
            align-self: center;
            font-weight: 800;
            color: #f1c40f;
            margin-bottom: 1.5vh;
            font-size: 2.2vh;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            width: 100%;
            text-align: center;
            padding-bottom: 0.5vh;
        }

        .close-info {
            position: absolute;
            top: 1vh;
            right: 1.5vh;
            font-size: 3.5vh;
            color: #e74c3c;
            cursor: pointer;
        }

        /* Geri Bildirim Butonu */
         .feedback-box {

.pdf-tools {

.pdf-btn:hover {

.pdf-label {

}

#pdf-viewer-container {
    display: none;

}

/* Kapatma Butonu */
.close-pdf {
    position: absolute;
    top: 5px;
    right: 10px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    cursor: pointer;
    z-index: 160;
    font-weight: bold;
}

/* PDF iframe ayarları */
#pdf-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* PDF açıkken ana konteynerın taşmasını engelle */
body.pdf-open .container {
    overflow: hidden;
}
/* PDF Butonlarını güncelleme (JavaScript ile çalışması için a yerine div) */
.pdf-btn {
    cursor: pointer;
}

/* --- Dikey Mod Uyarı Ekranı --- */
#rotate-device-overlay {
    display: none; /* Varsayılan kapalı */
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #2c3e50;
    color: white;
    z-index: 99999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.rotate-icon {
    font-size: 80px;
    margin-bottom: 20px;
    animation: rotate-anim 2s infinite ease-in-out;
}

@keyframes rotate-anim {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
    100% { transform: rotate(0deg); }
}

/* Sadece telefonlarda (max-width: 1024px) ve dikey modda çalışır */
@media screen and (max-width: 1024px) and (orientation: portrait) {
    #rotate-device-overlay {
        display: flex;
    }
    .container {
        display: none !important;
    }
}

/* Mobilde PDF Butonlarını Gizle */
@media screen and (max-width: 1024px) {
    .pdf-tools {
        display: none !important;
    }
}

/* --- Başlangıç Ekranı --- */
#start-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--bg-color);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 20000;
}

/* --- Tam Ekran Düğmesi Tasarımı --- */
#fullscreen-btn {
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 1.2vh;
    cursor: pointer;
    width: 5vh;
    height: 5vh;
    min-width: 35px;
    min-height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 1vh;
    transition: all 0.2s;
}

#fullscreen-btn:hover { background: rgba(255, 255, 255, 0.3); }
#fullscreen-btn svg { width: 3.5vh; height: 3.5vh; fill: currentColor; }

/* Simge Değişimi */
#fullscreen-btn .icon-close { display: none; }
body.fullscreen-mode #fullscreen-btn .icon-open { display: none; }
body.fullscreen-mode #fullscreen-btn .icon-close { display: block; }

/* Konteynırın tam ekranda köşelerini düzeltme */
body.fullscreen-mode .container { border-radius: 0; }
    
</style>

        let currentQIndex = 0;
        let isAnswered = false; // O anki sorunun cevaplanıp cevaplanmadığını tutar

        function loadQuestion() {
    const q = questions[currentQIndex];
    const container = document.getElementById('sentence-container');
    const optionsBox = document.getElementById('options-container');
    const fullSentBox = document.getElementById('full-sentence-display');
    const feedbackOverlay = document.getElementById('feedback-overlay');
    
    isAnswered = false; // Yeni soruda bayrağı sıfırla

    container.innerHTML = '';
    optionsBox.innerHTML = '';
    feedbackOverlay.style.display = 'none'; 
    
    fullSentBox.innerHTML = `"${q.fullTr}"`;

    // --- YENİ: Dinamik Yazı Boyutu (Tek satıra sığdırmak için) ---
    let fontSize = "6.5vh"; 
    if (q.words.length > 8) fontSize = "5.2vh";
    if (q.words.length > 11) fontSize = "4.2vh";
    if (q.words.length > 14) fontSize = "3.5vh";
    // ---------------------------------------------------------

    q.words.forEach((item, index) => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'word-group';
        
        groupDiv.innerHTML = `
            <span class="tr-meaning">${item.tr}</span>
            <span class="arabic-word" style="font-size: ${fontSize}">${item.ar}</span>
        `;

        groupDiv.onclick = () => {
            const isShowing = groupDiv.classList.toggle('show-tr');
            const arabicSpan = groupDiv.querySelector('.arabic-word');
            
            if (isShowing) {
                arabicSpan.innerText = item.hk;
                arabicSpan.style.color = "#e74c3c"; // Harekeli olduğunu belli etmek için kırmızımsı ton
            } else {
                arabicSpan.innerText = item.ar;
                arabicSpan.style.color = "inherit";
            }
        };

        container.appendChild(groupDiv);
    });

    q.options.forEach((opt, idx) => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.id = `opt-card-${idx}`;

        let featuresHtml = "";
        opt.features.forEach(f => {
            featuresHtml += `<li>${f}</li>`;
        });

        card.innerHTML = `
            <div class="answer-zone" id="ans-${idx}">
                <span class="opt-arabic">${opt.ar}</span>
            </div>
            
            <div class="info-zone" onclick="toggleInfo(event, 'opt-card-${idx}')">
                <div class="info-icon">💡</div>
            </div>

            <div class="info-overlay">
                <div class="close-info" onclick="toggleInfo(event, 'opt-card-${idx}')">✖</div>
                <div class="info-title">${opt.type}</div>
                <ul>${featuresHtml}</ul>
            </div>
        `;
        
        optionsBox.appendChild(card);

        const ansZone = document.getElementById(`ans-${idx}`);
        ansZone.onclick = () => checkAnswer(opt, card, ansZone);
    });
} // <--- FONKSİYON TAM OLARAK BURADA BİTİYOR
        function toggleInfo(event, cardId) {
            event.stopPropagation(); // Kartın diğer tıklama olaylarını durdur
            const card = document.getElementById(cardId);
            const overlay = card.querySelector('.info-overlay');
            
            if (overlay.classList.contains('show-info')) {
                overlay.classList.remove('show-info');
            } else {
                // Diğer açık olanları kapat
                document.querySelectorAll('.show-info').forEach(el => el.classList.remove('show-info'));
                overlay.classList.add('show-info');
            }
        }

        function checkAnswer(selectedOpt, cardElement, ansZoneElement) {
    if(isAnswered) return;
    
    const feedbackOverlay = document.getElementById('feedback-overlay');
    isAnswered = true;

    // Tüm cevap alanlarını pasif yap
    document.querySelectorAll('.answer-zone').forEach(zone => {
        zone.classList.add('disabled-answer');
    });

    if (selectedOpt.correct) {
        cardElement.classList.add('correct');
        // Kelimeyi siyah yapma özelliği
        const targetWord = document.querySelector('.target-group .arabic-word');
        if(targetWord) {
            targetWord.innerHTML = selectedOpt.ar;
            targetWord.style.color = "#000000"; 
        }
    } else {
        cardElement.classList.add('wrong');
    }

    // Butonu görünür yap
    feedbackOverlay.style.display = 'block'; 
}

            currentQIndex++;
            if (currentQIndex < questions.length) {
                loadQuestion();
            } else {

                        <p style="font-size:3vh;">Tüm alıştırmalar bitti.</p>
                        <button class="next-btn" onclick="location.reload()">Tekrar Oyna</button>
                    </div>
                `;
            }
        }

        loadQuestion();

function openPdf(fileName) {
    // Mobil kontrolü (Genişlik 1024px'den küçükse açma)
    if (window.innerWidth <= 1024) {
        return; 
    }
    
    const container = document.getElementById('pdf-viewer-container');
    const frame = document.getElementById('pdf-frame');
    const fullSentence = document.getElementById('full-sentence-display');
    const optionsArea = document.getElementById('options-area');

    // 1. AÇIK OLAN TÜM İPUCU (OVERLAY) PENCERELERİNİ KAPAT
    document.querySelectorAll('.show-info').forEach(el => {
        el.classList.remove('show-info');
    });

    // 2. PDF kutusunu görünür yap ve sınıf ekle
    container.style.display = 'block';
    document.body.classList.add('pdf-open');

    // 3. Konumlandırma
    const sentenceTop = document.getElementById('full-sentence-display').offsetTop;
    container.style.top = sentenceTop + "px";
    container.style.height = (window.innerHeight - sentenceTop) + "px";

    // 4. PDF dosyasını yükle (GÜNCELLENEN KISIM)
    // #view=FitH: PDF'i yatay genişliğe tam sığdırır.
    // toolbar=0: Gereksiz araç çubuklarını gizleyerek alandan tasarruf sağlar.
    frame.src = fileName + "#view=FitH&toolbar=0&navpanes=0&scrollbar=1";

    // 5. Arkadaki öğeleri gizle
    if(fullSentence) fullSentence.style.visibility = 'hidden';
    if(optionsArea) optionsArea.style.visibility = 'hidden';
}
function closePdf() {
    const container = document.getElementById('pdf-viewer-container');
    const fullSentence = document.getElementById('full-sentence-display');
    const optionsArea = document.getElementById('options-container');
    
    // Kapatma işlemleri
    container.style.display = 'none';
    document.getElementById('pdf-frame').src = ""; 
    document.body.classList.remove('pdf-open');

    // Gizlenen öğeleri geri getir
    if(fullSentence) fullSentence.style.visibility = 'visible';
    if(optionsArea) optionsArea.style.visibility = 'visible';
}


function startActivity() {
    // Başlangıç ekranını kaldır
    document.getElementById('start-overlay').style.display = 'none';
    // Tam ekrana geçiş yap
    enterFullscreen();
}

function enterFullscreen() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) { /* Safari */
        elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) { /* IE11 */
        elem.msRequestFullscreen();
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        enterFullscreen();
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

// Tam ekran değişimini dinleyip ikonları/sınıfları güncelle
document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
        document.body.classList.add('fullscreen-mode');
    } else {
        document.body.classList.remove('fullscreen-mode');
    }
});
// Soruları rastgele karıştırmak için Fisher-Yates algoritması
function shuffleQuestions(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}
