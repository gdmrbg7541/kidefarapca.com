<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evrensel Kök Veri Üretici</title>
    <script src="veri/veri_vezin_numaralari.js"></script>
    <script src="veri/veri_kokler.js"></script>
    <script src="veri/veri_sozluk.js"></script>
    <link rel="stylesheet" href="sozluk/sozluk_veri_giris.css">
    <link rel="stylesheet" href="arakom.css?v=1">
</head>
<body>

<!-- GLOBAL LOADING SCREEN -->
<div id="global-loading-screen" style="position: fixed; top:0; left:0; width:100vw; height:100vh; background:white; z-index:9999999; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#333; transition: opacity 0.3s ease;">
    <div style="width: 50px; height: 50px; border: 4px solid rgba(41, 128, 185, 0.2); border-left-color: #2980b9; border-radius: 50%; animation: spin-loader 1s linear infinite;"></div>
    <h2 style="margin-top:20px; font-family:'Arakom', 'Arial', sans-serif; font-size: 20px; font-weight: normal; color: #7f8c8d;">Yükleniyor...</h2>
    
</div>


<div class="container">
    <div class="header">
        <h1 id="main-title">Evrensel Kök & Sözlük Üretici</h1>
        <p>Tüm 105 kalıbı ve ekleri destekleyen dinamik veri üretim aracı.</p>
    </div>

    
    <div class="mode-switch" style="display:flex; justify-content:center; gap:20px; margin-bottom:20px;">
        <button id="btn-mode-kok" onclick="switchMode('kok')" style="flex:1; padding:20px; font-size:1.5rem; background:var(--primary); color:white; border:none; border-radius:12px; cursor:pointer; font-weight: normal; transition:0.2s; box-shadow:0 4px 10px rgba(0,0,0,0.2);">Kök (Fiil) Modu</button>
        <button id="btn-mode-isim" onclick="switchMode('isim')" style="flex:1; padding:20px; font-size:1.5rem; background:#e2e8f0; color:#475569; border:none; border-radius:12px; cursor:pointer; font-weight: normal; transition:0.2s;">Bağımsız İsim Modu</button>
    </div>

    <!-- Master Info -->
    <div class="master-panel">
        <div class="form-row">
            <div class="form-group" style="flex: 2;">
                <label>Kök Harfleri (Örn: ب ق ي)</label>
                <div style="display:flex; gap:10px;">
                    <div class="autocomplete-container">
                        <input type="text" id="root-ar" class="ar-input" style="width: 100%; font-family: 'Arakom', sans-serif; font-size: 1.5rem; direction: rtl;" placeholder="Kök yazın veya seçin..." autocomplete="off">
                        <div id="root-autocomplete-list" class="autocomplete-list"></div>
                    </div>
                    <button onclick="loadExistingRoot()" style="background:var(--info); color:white; border:none; border-radius:8px; padding:0 20px; cursor:pointer; font-weight: normal; transition:0.2s;">🔍 Kökü Yükle</button>
                </div>
            </div>
            <div class="form-group">
                <label>Kök Anlamı (Örn: Kalmak / Devam Etmek)</label>
                <input type="text" id="root-tr">
            </div>
            <div class="form-group">
                <label>Gramer Türü & Detay (Örn: Nakıs Fiil)</label>
                <input type="text" id="root-type">
            </div>
        </div>
        
        <div id="kok-mode-controls" class="add-kalip-bar" style="flex-wrap: wrap;">
            <label>Kalıp Numarası (1-105):</label>
            <input type="text" inputmode="numeric" id="kalip-id-input" placeholder="Örn: 33" onkeypress="if(event.key === 'Enter') addKalip();" style="border: 2px solid #3498db;">
            <button onclick="addKalip()">+ Kalıbı Ekle</button>
            <button onclick="addKalip('?')" style="background: #f39c12;">+ ? Kutu Ekle</button>
        </div>
    </div>

    <!-- Dynamic Cards Container -->
    <div id="kok-container" class="kalip-list">
        <div id="kalip-container"></div>
    </div>
    
    <div id="isim-container" class="kalip-list" style="display:none;">
        <div class="kalip-card" style="border-color:#8e44ad;">
            <h3 style="color:#8e44ad; margin-top:0; font-size:1.5rem;">Bağımsız İsim: Tekil <span style="font-size:1rem; color:#666;">(Zorunlu)</span></h3>
            <div class="entry-grid">
                <input type="text" id="isim-tekil-ar" class="ar-input" placeholder="Arapça Metin">
                <input type="text" id="isim-tekil-em" class="kalip-em ar-input" placeholder="Emoji Seç" style="width: 100px; cursor:pointer; text-align:center; font-size:1.5rem;" onclick="openEmojiPicker(this)" readonly>
                <input type="text" id="isim-tekil-tr" class="tr-input" placeholder="Türkçe Anlamı">
            </div>
            
            <hr style="border:1px dashed #cbd5e1; margin:25px 0;">
            
            <h3 style="color:#3498db; margin-top:0; font-size:1.5rem;">Bağımsız İsim: Çoğul <span style="font-size:1rem; color:#666;">(Opsiyonel)</span></h3>
            <div class="entry-grid">
                <input type="text" id="isim-cogul-ar" class="ar-input" placeholder="Çoğul Arapça Metin">
                <input type="text" id="isim-cogul-tr" class="tr-input" placeholder="Çoğul Türkçe Anlamı (Örn: Kalemler)">
            </div>
        </div>
    </div>

    <button class="generate-btn" onclick="generateCustomCode()">Kodu Üret & Görüntüle</button>
    
    <div id="code-container">
        <button class="copy-btn" onclick="copyCode()">Kopyala</button>
        <textarea id="code-output" spellcheck="false" readonly></textarea>
    </div>
</div>

<!-- Emoji Picker Overlay -->

</div>

<script src="sozluk/sozluk_veri_giris.js"></script>


    <!-- Emoji Picker Modal -->
    <div id="emoji-modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter:blur(5px); z-index:9998;" onclick="closeEmojiPicker()"></div>
    <div id="emoji-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#fff; width:95%; max-width:1200px; height:85vh; border-radius:20px; box-shadow:0 20px 50px rgba(0,0,0,0.4); z-index:9999; flex-direction:column; overflow:hidden; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
        
        <div style="display:flex; justify-content:space-between; align-items:center; padding:20px 30px; background:#f8fafc; border-bottom:1px solid #e2e8f0;">
            <h2 style="margin:0; font-size:2rem; color:#1e293b;">✨ Emoji Seç</h2>
            <button onclick="closeEmojiPicker()" style="background:#ef4444; color:white; border:none; width:40px; height:40px; border-radius:50%; font-size:1.5rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">&times;</button>
        </div>
        
        <div id="emoji-nav" style="display:flex; gap:10px; padding:15px 30px; overflow-x:auto; background:#fff; border-bottom:2px solid #f1f5f9; position:sticky; top:0; z-index:10;">
            <!-- Nav buttons will be injected here -->
        </div>

        <div id="emoji-container" style="padding:20px 30px; overflow-y:auto; flex:1; scroll-behavior: smooth;">
            <!-- Emojis will be injected here -->
        </div>
    </div>

    


<!-- GLOBAL LOADING SCRIPT -->


<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
</html>
