*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Arakom','Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#004D40,#00695C,#00897B);min-height:100vh;color:#004D40;padding:20px;font-size:clamp(20px,2.4vw,32px)}
.box{background:#fff;border-radius:24px;padding:24px;max-width:780px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{text-align:center;color:#004D40;font-size:2.2em;margin-bottom:6px}
.sub{text-align:center;color:#00897B;margin-bottom:14px;font-size:1.2em}
.bar{display:flex;justify-content:space-between;background:#E0F2F1;border-radius:12px;padding:10px 16px;margin-bottom:16px;font-weight:bold;color:#004D40;flex-wrap:wrap;gap:6px}
.tip{background:#FFF8E1;border-right:4px solid #FFC107;border-radius:8px;padding:10px 14px;margin-bottom:14px;color:#5D4037;font-size:1.15em;line-height:1.55}
.tip b{color:#004D40}
.scene{background:linear-gradient(135deg,#00897B,#004D40);color:#fff;border-radius:16px;padding:22px 18px;text-align:center;margin-bottom:14px;box-shadow:0 8px 22px rgba(0,137,123,.35)}
.scene .who{font-size:2.2em}
.scene .item-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.scene .pic{font-size:3em;background:#fff;border-radius:14px;padding:6px 12px;color:#004D40}
.scene .item-label{background:rgba(255,255,255,.18);padding:4px 14px;border-radius:18px;font-weight:bold;font-size:1.35em}
.scene .ask{font-size:1.6em;margin-top:10px;line-height:1.55}
.scene .tr{font-size:.82em;color:rgba(255,255,255,.75);margin-top:6px;font-style:italic}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.btn-ans{background:#fff;border:3px solid;border-radius:16px;padding:18px;cursor:pointer;font-family:inherit;font-size:1.5em;font-weight:bold;transition:all .2s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.btn-yes{border-color:#4CAF50;color:#1B5E20}
.btn-yes:hover{background:#C8E6C9}
.btn-no{border-color:#F44336;color:#B71C1C}
.btn-no:hover{background:#FFCDD2}
.btn-ans .em{font-size:1.6em}
.btn-ans.selected{transform:scale(.96)}
.btn-ans.correct{background:#C8E6C9;border-color:#4CAF50;color:#1B5E20}
.btn-ans.wrong{background:#FFCDD2;border-color:#F44336;color:#B71C1C}
.btn-ans.disabled{pointer-events:none;opacity:.55}
.fb{text-align:center;margin-top:10px;min-height:30px;font-size:1.1em;font-weight:bold}
.exp{text-align:center;color:#00695C;margin-top:4px;font-size:1.15em;background:#E0F2F1;padding:10px 12px;border-radius:10px;line-height:1.55}
.btn{display:inline-block;background:#00897B;color:#fff;border:none;border-radius:25px;padding:12px 28px;font-family:inherit;font-size:1em;cursor:pointer;margin:8px 4px;font-weight:bold}
.btn:hover{background:#004D40}
.btn.alt{background:#9c88ff}
.result{text-align:center}
.result .score{font-size:3em;color:#00897B;font-weight:bold;margin:12px 0}
.result .stars{font-size:2.2em;margin:8px 0}
.hidden{display:none}
/* Oyun bitince (sonuç ekranı) başlık altındaki yönerge/altyazıyı gizle */
.box:has(#result:not(.hidden)) .sub{display:none}
.back{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:25px;padding:10px 18px;cursor:pointer;font-family:inherit;backdrop-filter:blur(8px);z-index:10}
.back:hover{background:rgba(0,0,0,.85)}

/* yatay-öncelik */
@media (orientation:landscape) and (min-width:1000px){
  .box{max-width:min(1480px,94vw)}
  #game{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:center}
  #game>.bar,#game>.tip,#game>.fb,#game>.exp{grid-column:1/-1}
}

        /* --- CİHAZ DÖNDÜRME UYARISI VE MOBİL YATAY KLAVYE DESTEĞİ --- */
        #rotate-message {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #2c3e50; 
            z-index: 99999; 
            flex-direction: column;
            align-items: center; justify-content: center;
            color: white; text-align: center;
        }
        .phone-animation {
            width: 60px; height: 100px;
            border: 4px solid white; border-radius: 10px;
            animation: rotate-phone 2s infinite ease-in-out;
            margin-bottom: 20px; position: relative;
        }
        .phone-animation::before {
            content: ''; position: absolute;
            top: 10px; left: 50%; transform: translateX(-50%);
            width: 20%; height: 4px; background: white; border-radius: 2px;
        }
        @keyframes rotate-phone {
            0% { transform: rotate(0deg); opacity: 1; }
            25% { transform: rotate(90deg); opacity: 1; }
            70% { transform: rotate(90deg); opacity: 1; }
            100% { transform: rotate(90deg); opacity: 0; }
        }
        .rotate-text { font-size: 2.5rem; font-family: 'Arakom', Tahoma, sans-serif; }

        @media only screen and (max-width: 900px) and (orientation: portrait) {
            #rotate-message { display: flex !important; }
        }

        @media screen and (max-height: 500px) {
            body {
                overflow-y: auto !important;
                height: auto !important;
                min-height: 100vh;
                align-items: flex-start;
                padding-top: 15px; padding-bottom: 15px;
            }
        }

    </style>
</head>

<div class="box">
<h1>❓ أَجِبْ بِـ «نَعَمْ» أَوْ «لا»</h1>
<div class="sub">أَداة الاسْتِفْهام «هَل» — الجَوابُ: نَعَمْ أَوْ لا</div>
<div id="game">
<div class="bar"><span>النَّتيجَة: <span id="sc">0</span></span><span>السُّؤال: <span id="qn">1</span>/10</span></div>
<div class="scene">
<div class="who" id="who">🧑</div>
<div class="item-row"><span class="pic" id="pic">🧆</span><span class="item-label" id="item">الكُفْتَة</span></div>
<div class="ask" id="q"></div>
</div>
<div class="options">
<div class="btn-ans btn-yes" id="yesBtn"><span class="em">👍</span>نَعَمْ</div>
<div class="btn-ans btn-no" id="noBtn"><span class="em">👎</span>لا</div>
</div>
<div class="fb" id="fb"></div>
<div class="exp" id="exp"></div>
</div>
<div id="result" class="result hidden">
<h2 style="color:#004D40">🎉 رائِع!</h2>
<div class="stars" id="stars"></div>
<div class="score" id="final"></div>
<div id="msg" style="color:#00695C;margin-bottom:14px"></div>
<button class="btn" onclick="init()">إِعادَة 🔄</button>
<button class="btn alt" onclick="location.reload()">القائِمَة ↩</button>
</div>
</div>
<script>

var ALL=
[{"who": "🧑", "pic": "✈️", "item": "الطّائِرَة", "q": "هَل الطّائِرَة أَسْرَع مِن السَّفينَة؟", "ans": "yes", "exp": "نَعَمْ، الطّائِرَة أَسْرَع مِن السَّفينَة"}, {"who": "👧", "pic": "🚲", "item": "الدَّرّاجَة", "q": "هَلْ تَرْكَبينَ الدَّرّاجَة كُلّ صَباح؟", "ans": "yes", "exp": "نَعَمْ، أَرْكَبُ الدَّرّاجَة كُلّ صَباح"}, {"who": "🧔", "pic": "🚆", "item": "القِطار", "q": "هَل القِطار أَسْرَع مِن الطّائِرَة؟", "ans": "no", "exp": "لا، القِطار أَبْطَأ مِن الطّائِرَة"}, {"who": "👩", "pic": "🩺", "item": "المُسْتَشْفى", "q": "هَلْ تَذْهَبينَ إِلى المُسْتَشْفى بِالسَّيّارَة؟", "ans": "yes", "exp": "نَعَمْ، أَذْهَبُ إِلى المُسْتَشْفى بِالسَّيّارَة"}, {"who": "🧑", "pic": "🚇", "item": "المِتْرو", "q": "هَل المِتْرو أَسْرَع مِن الدَّرّاجَة؟", "ans": "yes", "exp": "نَعَمْ، المِتْرو أَسْرَع مِن الدَّرّاجَة"}, {"who": "🧔", "pic": "🕌", "item": "المَسْجِد", "q": "هَلْ تَتَّجِه إِلى المَسْجِد مَشْيًا؟", "ans": "yes", "exp": "نَعَمْ، أَتَّجِه إِلى المَسْجِد مَشْيًا"}, {"who": "👧", "pic": "🚌", "item": "الحافِلَة", "q": "هَل الحافِلَة أَسْرَع مِن المِتْرو؟", "ans": "no", "exp": "لا، الحافِلَة أَبْطَأ مِن المِتْرو"}, {"who": "👩", "pic": "🚢", "item": "السَّفينَة", "q": "هَلْ تُسافِرينَ إِلى بورْصَة بِالسَّفينَة؟", "ans": "yes", "exp": "نَعَمْ، أُسافِرُ إِلى بورْصَة بِالسَّفينَة"}, {"who": "🧑", "pic": "🔴", "item": "الضَّوْء الأَحْمَر", "q": "هَلْ تَعْبُرُ الطَّريق عِنْد الضَّوْء الأَحْمَر؟", "ans": "no", "exp": "لا، أَقِفُ عِنْد الضَّوْء الأَحْمَر"}, {"who": "🧔", "pic": "🟢", "item": "الضَّوْء الأَخْضَر", "q": "هَلْ تَعْبُرُ الطَّريق عِنْد الضَّوْء الأَخْضَر؟", "ans": "yes", "exp": "نَعَمْ، أَعْبُرُ عِنْد الضَّوْء الأَخْضَر"}, {"who": "👧", "pic": "🎒", "item": "المَدْرَسَة", "q": "هَلْ تَذْهَبينَ إِلى المَدْرَسَة بِالطّائِرَة؟", "ans": "no", "exp": "لا، أَذْهَبُ إِلى المَدْرَسَة بِالحافِلَة"}, {"who": "👩", "pic": "🚗", "item": "السَّيّارَة", "q": "هَل السَّيّارَة أَحْدَث مِن القِطار؟", "ans": "yes", "exp": "نَعَمْ، السَّيّارَة أَحْدَث مِن القِطار"}];
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var qs,cur,sc;
function init(){qs=shuf([...ALL]).slice(0,10);cur=0;sc=0;document.getElementById('game').classList.remove('hidden');document.getElementById('result').classList.add('hidden');loadQ()}
function loadQ(){
var q=qs[cur];
document.getElementById('who').textContent=q.who;
document.getElementById('pic').textContent=q.pic;
document.getElementById('item').textContent=q.item;
document.getElementById('q').textContent=q.q;
document.getElementById('qn').textContent=cur+1;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='';document.getElementById('exp').textContent='';
['yesBtn','noBtn'].forEach(function(id){var b=document.getElementById(id);b.classList.remove('correct','wrong','disabled')});
document.getElementById('yesBtn').onclick=function(){answer('yes',this,q)};
document.getElementById('noBtn').onclick=function(){answer('no',this,q)};
}
function answer(choice,btn,q){
document.getElementById('yesBtn').classList.add('disabled');
document.getElementById('noBtn').classList.add('disabled');
if(choice===q.ans){btn.classList.add('correct');sc+=10;document.getElementById('sc').textContent=sc;
document.getElementById('fb').textContent='✅ صَحيح!';document.getElementById('fb').style.color='#4CAF50';}
else{btn.classList.add('wrong');
var corId=q.ans==='yes'?'yesBtn':'noBtn';document.getElementById(corId).classList.add('correct');
document.getElementById('fb').textContent='❌ الصَّواب: '+(q.ans==='yes'?'نَعَمْ':'لا');document.getElementById('fb').style.color='#F44336';}
document.getElementById('exp').textContent='💡 '+q.exp;
cur++;setTimeout(function(){if(cur<qs.length)loadQ();else end()},2000);
}
function end(){
var fs=Math.round(sc/(qs.length*10)*100);
document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
document.getElementById('final').textContent=fs+'%';
document.getElementById('stars').textContent=fs>=90?'⭐⭐⭐':fs>=70?'⭐⭐':'⭐';
document.getElementById('msg').textContent=fs>=90?'مُمْتاز!':fs>=70?'جَيِّد جِدًّا!':'حاوِلْ مَرَّةً أُخْرى!';
}
init();
</script>
<script>/* tek-ekran sigdirma v3: HER ZAMAN ekrana tam uyar, scroll kilitli */(function(){var SEL='.box';function tgt(){var a=document.querySelector('.game-screen.active');if(a)return a.firstElementChild;var els=document.querySelectorAll(SEL);for(var i=0;i<els.length;i++){if(els[i].offsetParent)return els[i]}return null}function fit(){var el=tgt();if(!el)return;el.style.transform='';var r=el.getBoundingClientRect();var availH=innerHeight-Math.max(6,r.top)-8;var availW=innerWidth-12;var needW=Math.max(el.scrollWidth,r.width);var f=Math.min(1,availH/Math.max(1,r.height),availW/Math.max(1,needW));el.style.transformOrigin='top center';el.style.transform=(f<0.999)?('scale('+f.toFixed(4)+')'):'';document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden'}try{new MutationObserver(fit).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});addEventListener('resize',fit);addEventListener('load',fit);setInterval(fit,700);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit)}catch(e){}fit();setTimeout(fit,250);setTimeout(fit,900)})();</script>
</body>
</html>
