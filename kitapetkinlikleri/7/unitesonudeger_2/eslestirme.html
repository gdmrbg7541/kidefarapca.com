        /* --- CİHAZ DÖNDÜRME UYARISI VE MOBİL YATAY KLAVYE DESTEĞİ --- */
        #rotate-message {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #2c3e50; 
            z-index: 99999; 
            flex-direction: column;
            align-items: center; justify-content: center;
            color: white; text-align: center;
        }
        .phone-animation {
            width: 60px; height: 100px;
            border: 4px solid white; border-radius: 10px;
            animation: rotate-phone 2s infinite ease-in-out;
            margin-bottom: 20px; position: relative;
        }
        .phone-animation::before {
            content: ''; position: absolute;
            top: 10px; left: 50%; transform: translateX(-50%);
            width: 20%; height: 4px; background: white; border-radius: 2px;
        }
        @keyframes rotate-phone {
            0% { transform: rotate(0deg); opacity: 1; }
            25% { transform: rotate(90deg); opacity: 1; }
            70% { transform: rotate(90deg); opacity: 1; }
            100% { transform: rotate(90deg); opacity: 0; }
        }
        .rotate-text { font-size: 2.5rem; font-family: 'Arakom', Tahoma, sans-serif; }

        @media only screen and (max-width: 900px) and (orientation: portrait) {
            #rotate-message { display: flex !important; }

        @media screen and (max-height: 500px) {

<script>
    // E-Öğrenme Mükemmel Ölçekleme Mantığı
    function updateDynamicUnits() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var effectiveWidth = w;
        
        if (w / h > 1.5) {
            effectiveWidth = h * 1.5;
        }
        
        document.documentElement.style.setProperty('--dvw', (effectiveWidth / 100) + 'px');
        document.documentElement.style.setProperty('--dvh', (h / 100) + 'px');
    }
    window.addEventListener('resize', updateDynamicUnits);
    document.addEventListener('DOMContentLoaded', updateDynamicUnits);
    updateDynamicUnits();
</script>

                initAudio();
                const yonergeSes = new Audio('yonergeeslestirme.wav');
                yonergeSes.play().catch(e => console.log("Ses dosyası bulunamadı:", e));
                startScreen.style.display = 'none';
                loadRound(0);
            });

            function playSound(type) {
                if (!audioCtx) return; 
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                gainNode.gain.setValueAtTime(0.3, now); 
                if (type === 'drop') {
                    oscillator.type = 'triangle'; oscillator.frequency.setValueAtTime(300, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    oscillator.start(now); oscillator.stop(now + 0.2);
                } else if (type === 'wrong') {
                    oscillator.type = 'square'; oscillator.frequency.setValueAtTime(150, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    oscillator.start(now); oscillator.stop(now + 0.2);
                } else if (type === 'win') {
                    oscillator.type = 'sine'; oscillator.frequency.setValueAtTime(500, now);
                    oscillator.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    oscillator.start(now); oscillator.stop(now + 0.5);
                }
            }

            function loadRound(roundIdx) {
                questionsBox.innerHTML = '';
                optionsBox.innerHTML = '';
                checkBtn.style.display = 'none';
                doluSlotSayisi = 0;
                
                if (roundIdx >= gameData.length) {
                    let totalQuestions = 0;
                    gameData.forEach(r => totalQuestions += r.questions.length);
                    let percentage = Math.round((totalQuestions / (totalQuestions + totalMistakes)) * 100);
                    endScreen.innerHTML = `
                        <h2>مُمْتاز!</h2>
                        <p>لَقَدْ أَنْهَيْتَ كُلّ المَراحِل بِنَجاح.</p>
                        <p style="font-size: 3rem; color: #0f172a; margin-top: -2vh;">نِسْبَة النَّجاح: %${percentage}</p>
                        <div style="font-size: 2rem; color: #dc3545; margin-bottom: 2vh;">عَدَدُ الأَخْطاء: ${totalMistakes}</div>
                        <button class="buton" onclick="location.reload()">إِعادَة</button>
                    `;
                    endScreen.style.display = "flex";
                    playSound('win');
                    return;
                }

                levelIndicator.textContent = `الجَوْلَة ${roundIdx + 1} / ${gameData.length}`;
                
                const currentData = gameData[roundIdx];
                const questions = currentData.questions;
                
                questions.forEach((item, index) => {
                    const row = document.createElement('div');
                    row.className = 'cumle-satiri';
                    
                    const textDiv = document.createElement('div');
                    textDiv.className = 'cumle-baslangic';
                    textDiv.textContent = item.q;
                    
                    const dropZone = document.createElement('div');
                    dropZone.className = 'birakma-alani';
                    dropZone.dataset.id = index; 
                    
                    row.appendChild(textDiv);
                    row.appendChild(dropZone);
                    questionsBox.appendChild(row);
                });

                let optionsArr = questions.map((item, index) => ({ text: item.a, id: index }));
                optionsArr.push({ text: currentData.distractor, id: 99 });
                optionsArr.sort(() => Math.random() - 0.5);

                optionsArr.forEach(opt => {
                    const card = document.createElement('div');
                    card.className = 'kart-bitis';
                    card.draggable = true;
                    card.dataset.id = opt.id;
                    card.textContent = opt.text;
                    
                    card.addEventListener('dragstart', dragStartHandler);
                    card.addEventListener('dragend', dragEndHandler);
                    card.addEventListener('touchstart', dragStartHandler, {passive: false});
                    
                    optionsBox.appendChild(card);
                });

                const zones = document.querySelectorAll('.birakma-alani');
                zones.forEach(zone => {
                    zone.addEventListener('dragover', dragOver);
                    zone.addEventListener('dragleave', dragLeave);
                    zone.addEventListener('drop', dropHandler);
                });
                
                optionsBox.addEventListener('dragover', (e) => e.preventDefault());
                optionsBox.addEventListener('drop', dropToContainer);
            }

            let draggedCard = null;
            let ghostElement = null;

            function dragStartHandler(e) {
                if (e.target.classList.contains('siluet') || e.target.classList.contains('dogru')) {
                    e.preventDefault(); return;
                }
                draggedCard = e.target;
                if (e.dataTransfer) e.dataTransfer.setData('text/plain', e.target.dataset.id);
                
                if (!('ontouchstart' in window)) {
                    ghostElement = e.target.cloneNode(true);
                    ghostElement.classList.add('drag-ghost');
                    document.body.appendChild(ghostElement);
                    e.dataTransfer.setDragImage(ghostElement, e.offsetX, e.offsetY);
                }
                setTimeout(() => { if(draggedCard) draggedCard.classList.add('dragging'); }, 0);
            }

            function dragEndHandler(e) {
                if (ghostElement) ghostElement.remove();
                if (draggedCard) draggedCard.classList.remove('dragging');
                draggedCard = null;
            }

            function dragOver(e) {
                e.preventDefault();
                if (!this.querySelector('.kart-bitis')) {
                    this.classList.add('drag-over');
                }
            }

            function dragLeave(e) {
                this.classList.remove('drag-over');
            }

            function dropHandler(e) {
                e.preventDefault();
                this.classList.remove('drag-over');
                
                if (!draggedCard || this.querySelector('.kart-bitis')) return;
                
                if (draggedCard.parentElement.classList.contains('secenekler-kutusu')) {
                    this.appendChild(draggedCard);
                    doluSlotSayisi++;
                } else {
                    this.appendChild(draggedCard);
                }
                
                playSound('drop');
                checkButtonState();
            }

            function dropToContainer(e) {
                e.preventDefault();
                if (draggedCard && draggedCard.parentElement.classList.contains('birakma-alani')) {
                    optionsBox.appendChild(draggedCard);
                    doluSlotSayisi--;
                    checkButtonState();
                }
            }

            function checkButtonState() {
                const currentQuestionCount = gameData[currentRoundIndex].questions.length;
                if (doluSlotSayisi === currentQuestionCount) {
                    checkBtn.style.display = 'block';
                } else {
                    checkBtn.style.display = 'none';
                }
            }

            checkBtn.addEventListener('click', () => {
                let tumuDogru = true;
                const zones = document.querySelectorAll('.birakma-alani');
                
                zones.forEach(zone => {
                    const card = zone.querySelector('.kart-bitis');
                    if (!card) return;

                    card.classList.remove('yanlis-anim', 'dogru');

                    if (card.dataset.id === zone.dataset.id) {
                        card.classList.add('dogru');
                        card.draggable = false;
                        card.style.cursor = 'default';
                        zone.classList.add('dogru'); 
                    } else {
                        tumuDogru = false;
                        totalMistakes++;
                        card.classList.add('yanlis-anim');
                        playSound('wrong');
                        
                        setTimeout(() => {
                            card.classList.remove('yanlis-anim');
                            optionsBox.appendChild(card);
                            doluSlotSayisi--;
                            checkButtonState();
                        }, 800);
                    }
                });

                if (tumuDogru) {
                    playSound('win');
                    checkBtn.style.display = 'none';
                    
                    setTimeout(() => {
                        currentRoundIndex++;
                        loadRound(currentRoundIndex);
                    }, 1500); 
                }
            });
        });
    </script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const backBtns = document.querySelectorAll('.back-button');
    backBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            const target = btn.getAttribute('href') || 'index.html';
            try {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            } catch(err) {}
            setTimeout(() => { window.location.href = target; }, 150);
        });
    });
});
</script>

<script>
function exitToHome() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
        let isNavigating = false;
        function goHome() {
            if (!isNavigating) {
                isNavigating = true;
                window.location.href = 'index.html';
            }
        }
        
        document.addEventListener("fullscreenchange", goHome);
        document.addEventListener("webkitfullscreenchange", goHome);
        
        setTimeout(goHome, 500);

        try {
            if (document.exitFullscreen) {
                let promise = document.exitFullscreen();
                if (promise) promise.catch(goHome);
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        } catch (e) {
            goHome();
        }
    } else {
        window.location.href = 'index.html';
    }
}
</script>
