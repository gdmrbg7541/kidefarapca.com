/* 1. ARAKOM.TTF dosyasını sisteme tanıtıyoruz */

    /* 2. Tanımladığımız fontu değişkenlere atıyoruz */
    :root {
        --font-poppins: 'Poppins', sans-serif;

        --font-harmattan: 'Arakom', serif;

        --color-text-secondary: #7b88a1;

        }

        .screen {
            width: 100%; height: 100%;

            padding: 2rem; box-sizing: border-box;
            display: none; flex-direction: column; align-items: center; justify-content: flex-start;

        /* Mevcut #levelSelect stilini bununla güncelleyin */
#levelSelect {

        /* Mevcut .level-btn stilini silip bunu yapıştırın */
.level-btn {
    font-size: 3.5rem; /* Rakamları büyüt */
    gap: 0.2rem;
    font-weight: 400;
    display: flex;
    font-family: var(--font-poppins); /* Rakamlar okunaklı olsun */

    overflow: hidden;

}

}
/* 1 ve 2: KOLAY (Yeşil Tonları) */
.level-btn[data-level="1"] { background: #2ecc71; box-shadow: 0 4px 0 #27ae60; }
.level-btn[data-level="2"] { background: #5ab55e; box-shadow: 0 4px 0 #4ca350; }

/* 3: ORTA-KOLAY (Fıstık Yeşili) */

/* 4 ve 5: ORTA (Sarı ve Kehribar) */

.level-btn[data-level="5"] { background: #f39c12; box-shadow: 0 4px 0 #d68910; }

/* 6: ORTA-ZOR (Turuncu) */

/* 7 ve 8: ZOR (Kırmızı Tonları) */
.level-btn[data-level="7"] { background: #e74c3c; box-shadow: 0 4px 0 #c0392b; }
.level-btn[data-level="8"] { background: #c0392b; box-shadow: 0 4px 0 #96281b; }

/* Tıklanınca gölgeyi ezme efekti (Hepsinde çalışır) */
.level-btn:active:not(:disabled) {
    box-shadow: none !important;

}

        .choice-btn {

            transition: all 0.2s ease-out;
            color: var(--color-text-primary);
            background: var(--color-surface);

            justify-content: center;
            align-items: center;
            user-select: none;

            transform: scale(0.98); 
        }
        .choice-btn[lang="ar"] { font-family: var(--font-harmattan); }

        .choice-btn.correct-form { 
    background-color: transparent !important; /* Arka plan rengini şeffaf yap veya var(--color-surface) kullan */
    color: var(--color-correct) !important;   /* Yazı rengi yeşil olsun */
    box-shadow: none !important;              /* GÖLGEYİ VE BASIKLIĞI TAMAMEN KALDIR */
    border: 2px solid var(--color-correct);   /* Sadece ince yeşil bir çerçeve olsun (isteğe bağlı) */
    cursor: default; 
    transform: none !important; 
    opacity: 1 !important;
}
        .choice-btn.error-form { 
            background-color: var(--color-error-light) !important; color: var(--color-error) !important;

            animation: shake 0.3s ease-in-out; 
            transform: none !important; 
        }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        :disabled {

        /* Dikey ekran için düzenlemeler */
        @media (orientation: portrait) {
            html { font-size: min(calc(100vw / 33.75), calc(100dvh / 60)); }
            
            /* YENİ: Dikey tam ekran ayarı */
            body.fullscreen #gameWrapper {
                width: 100vw;

            }
            
            #gameWrapper { width: 33.75rem; height: 60rem; }

            /* YENİ: Ana sayfa üst kontrol butonları (Dikey) */
            .header-controls-left {
                top: 1rem;
                left: 1rem;
                gap: 0.5rem;
            }
            .icon-button {
                width: 3.5rem;
                height: 3.2rem;

            }

            .choice-row { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }

                height: 4.5rem;
            }
        }

         /* Dikey modda DEĞİLKEN (yani yatay modda) */
        @media (orientation: landscape) {
            
            /* Bu seçici, 'choice-row-centered-options' sınıfına sahip bir satırın
              DOĞRUDAN altındaki 'choice-btn'leri hedefler.
              
              ':first-child:nth-last-child(2)' kısmı:
              Bu butonun hem ilk çocuk (first-child) 
              HEM DE sondan ikinci (nth-last-child(2)) olmasını şart koşar.

            width: 15rem;
            height: 15rem;
            
            cursor: pointer;

            /* --- ORTALAMA AYARLARI --- */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;

/* --- YAMA: Sade Vurgu (Büyümeden) --- */

/* 1. Sırası gelmeyen satırları grileştir ve dondur */
.choice-row:not(.active-step) {
    opacity: 0.4;              /* İyice şeffaflaşsın */
    filter: grayscale(100%);   /* Renkleri tamamen gitsin (Siyah-beyaz olsun) */
    pointer-events: none;      /* Tıklanması MÜMKÜN OLMASIN */
    border: 2px solid transparent; /* Çerçeve yok */
}

/* 2. Sırası gelen satır normal ve net dursun */
.choice-row.active-step {
    opacity: 1 !important;     /* Tam netlik */
    filter: none !important;   /* Renkleri canlı kalsın */
    pointer-events: auto;      /* Tıklanabilir olsun */
    transform: none !important; /* ASLA BÜYÜMESİN (Sabit boyut) */
    
    /* Etrafına "Ben buradayım" diyen turuncu bir çerçeve */
    border: 3px solid var(--color-accent-1); 
    border-radius: var(--border-radius-small);
    
    /* Hafif bir gölge (derinlik katmak için, boyut katmaz) */
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
    background-color: #ffffff; /* Arka planı temiz beyaz olsun */
}

/* 3. Aktif satırdaki butonların üzerine gelince tepki versin */
.choice-row.active-step .choice-btn:hover:not(:disabled) {
    background-color: var(--color-accent-1); /* Turuncu olsun */
    color: white; /* Yazı beyaz olsun */
    cursor: pointer;
}
/* --- YAMA: Dokunmatik Ekran (Mobil) Uyumluluğu --- */

/* 1. PASİF SATIRLAR: Tamamen sönük ve dümdüz */
.choice-row:not(.active-step) {
    opacity: 0.3;
    filter: grayscale(100%);
    pointer-events: none; /* Tıklamayı engelle */
    transform: scale(0.95); /* Biraz küçük dursun */
    transition: all 0.5s ease;
}

/* 2. AKTİF SATIR: Canlı ve öne çıkmış */
.choice-row.active-step {
    opacity: 1 !important;
    filter: none !important;
    pointer-events: auto;
    transform: scale(1);
    background: transparent; /* Arka plan şeffaf kalsın */
    border: none; /* Çerçeveyi kaldırdık, butonlar konuşsun */
    padding: 10px 0; /* Butonlara yer aç */
}

/* 3. AKTİF BUTONLAR: 3 Boyutlu (Havada) Görünüm */
.choice-row.active-step .choice-btn {
    background-color: #ffffff;
    color: var(--color-text-primary);
    border: 2px solid #e0e0e0; /* İnce gri çerçeve */
    
    /* ÖNEMLİ: 3D Efekti veren alt gölge */
    box-shadow: 0 8px 0 #c2d9f0, 0 15px 20px rgba(0,0,0,0.1);
    
    transform: translateY(0); /* Normal duruş */
    transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); /* Çok hızlı tepki ver */
    
    /* Mobil dokunma gecikmesini kaldır */
    touch-action: manipulation; 
    -webkit-tap-highlight-color: transparent; /* Gri tıklama arka planını kaldır */
}

/* 4. BASMA EFEKTİ (:active): Parmak dokunduğu an */
.choice-row.active-step .choice-btn:active:not(:disabled) {
    background-color: var(--color-accent-1) !important; /* Turuncu ol */
    color: white !important;
    border-color: var(--color-accent-1) !important;
    
    /* Gölgeyi yok et (içeri göçme hissi) */
    box-shadow: 0 0 0 #c2d9f0, inset 0 3px 5px rgba(0,0,0,0.2) !important;
    
    /* Butonu fiziksel olarak aşağı it */
    transform: translateY(8px) !important; 
}

/* 5. DOĞRU BİLİNEN BUTON (Basılı kalmış gibi dursun) */
.choice-btn.correct-form {
    background-color: transparent !important;
    color: var(--color-correct) !important;
    box-shadow: none !important; /* Gölge yok */
    transform: translateY(8px) !important; /* Aşağıda kalsın */
    border: 2px solid var(--color-correct) !important;
    opacity: 1 !important;
}

/* 6. YANLIŞ BİLİNEN BUTON (Titreme) */
.choice-btn.error-form {
    transform: translateY(8px); /* Basılmış gibi */
    box-shadow: none !important;
}

        let audioContext;
        let audioInitialized = false;

        function initAudioContext() {
            if (audioInitialized || !(window.AudioContext || window.webkitAudioContext)) return;
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    audioInitialized = true;
                    const buffer = audioContext.createBuffer(1, 1, 22050); const source = audioContext.createBufferSource();
                    source.buffer = buffer; source.connect(audioContext.destination); source.start(0);
                    audioContext.resume();
                } catch (e) { console.error("Web Audio API başlatılamadı.", e); }
            }
        }
        
        function playSound(soundKey) {
            if (!audioInitialized || !audioContext || audioContext.state !== 'running') {
                 if (audioContext && audioContext.state === 'suspended') audioContext.resume();
                 return;
            }
            const sounds = {
                touch:     { f: 300,   t: 'sine',   d: 0.05 },
                correct:   { f: 523.25,t: 'sine',   d: 0.2 },
                incorrect: { f: 164.81,t: 'square', d: 0.2 }
            };
            const sound = sounds[soundKey]; if (!sound) return;
            try {
                const g = audioContext.createGain(); g.connect(audioContext.destination);
                g.gain.setValueAtTime(0, audioContext.currentTime);
                g.gain.linearRampToValueAtTime(0.1, audioContext.currentTime + 0.01);
                g.gain.linearRampToValueAtTime(0, audioContext.currentTime + sound.d);
                const o = audioContext.createOscillator(); o.type = sound.t;
                o.frequency.setValueAtTime(sound.f, audioContext.currentTime);
                o.connect(g); o.start(audioContext.currentTime); o.stop(audioContext.currentTime + sound.d);
            } catch (e) { console.error(`Ses (${soundKey}) hatası:`, e); }

        // --- DOM Elementleri ---
        const homeScreen = document.getElementById('homeScreen');
        const gameScreen = document.getElementById('gameScreen');
        const levelSelect = document.getElementById('levelSelect');
        const backToHomeButton = document.getElementById('backToHomeButton');
        
        const playAudioButton = document.getElementById('playAudioButton');
        const arabicOutputEl = document.getElementById('arabicOutputDisplay');
        const choiceBank = document.getElementById('choiceBank');
        
        const fullscreenBtnHome = document.getElementById('fullscreen-btn-home');
        const fullscreenBtnGame = document.getElementById('fullscreen-btn-game');

        // YENİ: Başlangıç Elemanları
        const startOverlay = document.getElementById('startOverlay');
        const startButton = document.getElementById('startButton');

        // --- Yönerge Sesi ---
        const instructionAudio = new Audio('yonerge.wav');
        
        // --- Oyun Değişkenleri ---
        let selectedLevel = null;
        let selectedLevelBtn = null;
        let levelWords = [];
        let currentWord = {};
        let currentWordIndex = 0;
        let currentStepIndex = 0;
        let gameActive = false;
        let audio = new Audio();
        
        // --- YENİ: Başlangıç Butonu Mantığı ---
        startButton.addEventListener('click', () => {
            // 1. Web Audio API kilidini aç
            initAudioContext();

            // 2. Tam ekrana geç (Kullanıcı tıkladığı için tarayıcı izin verir)
            toggleFullScreen();

            // 3. Perdeyi kaldır
            startOverlay.classList.add('hidden');
            setTimeout(() => {
                startOverlay.style.display = 'none'; // Tamamen yok et
            }, 500);

            // 4. Çeyrek saniye (250ms) sonra yönerge sesini çal
            setTimeout(() => {
                instructionAudio.play().catch(e => console.log("Ses hatası:", e));
            }, 250);
        });

        // --- Ana Oyun Fonksiyonları ---

        levelSelect.addEventListener('click', (e) => {
            const btn = e.target.closest('.level-btn');
            if (btn) {
                // Oyun başlayınca yönerge sesini sustur
                instructionAudio.pause();
                instructionAudio.currentTime = 0;

                initAudioContext();
                if (selectedLevelBtn) { selectedLevelBtn.classList.remove('selected'); }
                selectedLevel = btn.dataset.level;
                selectedLevelBtn = btn;
                selectedLevelBtn.classList.add('selected');
                startGame();
            }
        });

        function startGame() {
            if (!gameData[selectedLevel]) {
                console.error("Veri yok"); return;
            }
            
            levelWords = [...gameData[selectedLevel].words].sort(() => Math.random() - 0.5);
            currentWordIndex = 0;
            gameActive = true;
            
            homeScreen.classList.remove('active');
            gameScreen.classList.add('active');
            
            loadWord();
        }

        function loadWord() {
            if (currentWordIndex >= levelWords.length) {
                alert("اِكْتَمَلَت المَرْحَلَة!");
                showHomeScreen();
                return;
            }

            currentWord = levelWords[currentWordIndex];
            currentStepIndex = 0; 

            arabicOutputEl.textContent = '';
            arabicOutputEl.classList.add('empty');
            choiceBank.innerHTML = '';
            
            const outputContainer = document.getElementById('arabicOutputContainer');
            if(outputContainer) outputContainer.scrollLeft = 2000;

            playAudioButton.disabled = false;
            loadAllSteps();
            
            setTimeout(() => {
                playWordAudio();
            }, 500);
        }

        function loadAllSteps() {
            currentWord.steps.forEach((stepData, index) => {
                const row = document.createElement('div');
                row.className = 'choice-row';
                row.dataset.stepIndex = index; 

                if (stepData.options.length < 4) {
                    row.classList.add('choice-row-centered-options');
                }

                if (index === 0) {
                    row.classList.add('active-step');
                }

                const shuffledOptions = [...stepData.options].sort(() => Math.random() - 0.5);

                shuffledOptions.forEach(optionText => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = optionText;
                    btn.dataset.value = optionText;
                    btn.dataset.correct = stepData.correct;
                    btn.setAttribute('lang', 'ar');
                    row.appendChild(btn);
                });
                
                choiceBank.appendChild(row);
            });
        }
        
        // --- Olay Dinleyicileri ---

        playAudioButton.addEventListener('click', () => {
            initAudioContext();
            playWordAudio();
        });

        function playWordAudio() {
             if (!currentWord || !currentWord.audioSrc) return;
             if (!audio.paused) { audio.pause(); audio.currentTime = 0; }
             audio.src = currentWord.audioSrc;
             audio.play().catch(e => console.error("Kelime sesi çalınamadı:", e));
        }

        choiceBank.addEventListener('click', (e) => {
            if (!gameActive) return;
            
            const clickedButton = e.target.closest('.choice-btn:not(:disabled)');
            if (!clickedButton) return;
            
            const clickedRow = clickedButton.closest('.choice-row');
            if (!clickedRow) return;

            const clickedStepIndex = parseInt(clickedRow.dataset.stepIndex);
            const selectedValue = clickedButton.dataset.value;
            const correctValue = clickedButton.dataset.correct;

            initAudioContext();

            if (clickedStepIndex !== currentStepIndex) {
                playSound('incorrect');
                clickedButton.classList.add('error-form');
                setTimeout(() => clickedButton.classList.remove('error-form'), 300);
                
                const correctRow = choiceBank.querySelector(`.choice-row[data-step-index="${currentStepIndex}"]`);
                if (correctRow) {
                    correctRow.classList.add('error-form');
                    setTimeout(() => correctRow.classList.remove('error-form'), 300);
                }
                return;
            }

            if (selectedValue === correctValue) {
                clickedButton.blur();
                playSound('correct');
                
                arabicOutputEl.classList.remove('empty');
                arabicOutputEl.textContent += selectedValue;
                
                clickedRow.querySelectorAll('.choice-btn').forEach(btn => btn.disabled = true);
                clickedButton.classList.add('correct-form');
                clickedRow.classList.add('disabled');
                clickedRow.classList.remove('active-step');

                currentStepIndex++; 
                
                if (currentStepIndex >= 3) {
                    const nextRow = choiceBank.querySelector(`.choice-row[data-step-index="${currentStepIndex}"]`);
                    if (nextRow) {
                        setTimeout(() => {
                            nextRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 100);
                    }
                }

                if (currentStepIndex >= currentWord.steps.length) {
                    gameActive = false;
                    setTimeout(() => {
                        currentWordIndex++;
                        gameActive = true;
                        loadWord();
                    }, 1500);
                } else {
                    const nextRow = choiceBank.querySelector(`.choice-row[data-step-index="${currentStepIndex}"]`);
                    if (nextRow) {
                        nextRow.classList.add('active-step');
                    }
                }

            } else {
                playSound('incorrect');
                clickedButton.classList.add('error-form');
                setTimeout(() => clickedButton.classList.remove('error-form'), 300);
            }
        });

        backToHomeButton.addEventListener('click', (e) => {
            e.preventDefault();
            showHomeScreen();
        });

        function showHomeScreen() {
            gameActive = false;
            instructionAudio.pause(); 
            instructionAudio.currentTime = 0; 

            gameScreen.classList.remove('active');
            homeScreen.classList.add('active');
            
            if (selectedLevelBtn) { 
                selectedLevelBtn.classList.remove('selected'); 
                selectedLevelBtn = null; 
            }
            selectedLevel = null;
        }

        // --- Tam Ekran Fonksiyonları ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Tam ekran hatası veya iptali:", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function updateFullscreenState() {
            if (document.fullscreenElement) {
                document.body.classList.add('fullscreen');
            } else {
                document.body.classList.remove('fullscreen');
            }
        }

        document.addEventListener('fullscreenchange', updateFullscreenState);
        if(fullscreenBtnHome) fullscreenBtnHome.addEventListener('click', toggleFullScreen);
        if(fullscreenBtnGame) fullscreenBtnGame.addEventListener('click', toggleFullScreen);
    </script>
