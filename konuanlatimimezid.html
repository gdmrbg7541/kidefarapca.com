/* Yeni Header Alanı Stilleri */
.top-header {
    background: var(--primary);
    display: grid;
    grid-template-columns: 80px 1fr 80px;
    justify-content: space-between;

/* Header içindeki ana başlık stili */

    pointer-events: none; /* Tıklamayı tamamen devre dışı bırakır */

.nav-links {

.header-btn {

    cursor: pointer;
display: flex;
    align-items: center;

    text-align: center;

}

.header-btn:hover {

    border-color: var(--accent);
}

.back-btn {
    justify-self: start; /* Geri tuşunu en sola yaslar */

}

/* Dikey Boşluk Azaltma (Mazi-Muzari Satırı) */
.header-sub { 
    background: #dfe6e9 !important;

    justify-content: center !important;

}

.pattern-label {
    margin-top: 8px; /* Buradaki değeri artırarak boşluğu açabilirsin */
    font-size: clamp(1rem, 2.5vw, 3rem);
    color: #7f8c8d;
}

/* Grid yüksekliğini header'a göre ayarla */
.grid-container { 
    height: calc(100vh - 180px); /* Üstteki iki bar sonrası alan */
}
        /* 9 Vezin Üst Menü - Ekranı Kaplar */
        .vezin-selector { 
            display: grid; 
            grid-template-columns: repeat(9, 1fr); 
            gap: 5px; 
            margin-bottom: 30px !important;
            direction: rtl; 
        }
        .vezin-btn { 
            padding: 10px 5px; 
            border: 2px solid var(--primary); 
            background: white; 
            border-radius: 10px; 
            cursor: pointer; 
            font-family: 'Noto Naskh Arabic'; 
            font-size: 1.5rem; 
            font-weight: bold;
            transition: 0.3s; 
            color: var(--primary);
        }
        /* Seçili (aktif) butonun kırmızı dolgulu hali */
.vezin-btn.active {
    position: relative;
    background-color: var(--accent) !important; /* Tam kırmızı dolgu */
    color: white !important;                    /* Yazı beyaz */
    border-color: var(--accent);
    border-bottom: 3px solid gold;              /* Altın sarısı çizgi */
}

/* Seçili butondaki info simgesi */
.vezin-btn.active .info-icon {
    font-size: 1.2rem;
    margin-right: 5px;
    color: gold;
    animation: pulse-info 2s infinite;
}

/* Sağ üstteki küçük info yazısı */
.vezin-btn.active::after {
   
    position: absolute;
    top: 0;
    right: 0;
    background: gold;
    color: black;
    font-size: 0.7rem;
    padding: 1px 4px;
    font-family: 'Noto Naskh Arabic', monospace;
    font-weight: bold;
    border-bottom-left-radius: 5px;
    text-transform: uppercase;
}
@keyframes pulse-info {
    0% { opacity: 0.4; }
    50% { opacity: 1; }
    100% { opacity: 0.4; }
}

        .grid-container {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: auto repeat(3, 1fr); /* Başlık + 3 Kök satırı */
    gap: 8px;
    flex-grow: 1; /* Header'dan kalan tüm alanı doldur */
    width: 100%;
    height: 100%;
}

        .cell {
            border: 3px solid var(--border-color);
            padding: 5px 10px !important;
            margin-bottom: 5px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--cell-bg);
            border-radius: 15px;
            font-size: clamp(1.2rem, 3vw, 5rem);
            position: relative;
            transition: all 0.3s;
min-height: 0;
        }

        .header-sub { 
            background: #dfe6e9; 
            font-weight: 700; 
            font-size: 1.8rem;
            color: #2d3436;
            border-bottom: 6px solid var(--primary);
            margin-bottom: 10px;
        }

        /* Vezinlerin Kırmızı Olması */
        .pattern-label { 
            font-size: 2.2rem; 
            color: var(--accent); 
            margin-top: 5px; 
            font-weight: bold;
        }

        /* Kök kelime kutularını dikey olarak daraltır */
.root-word { 
    cursor: pointer; 
    font-weight: bold; 
    font-size: clamp(1.5rem, 3.5vw, 4.5rem) !important;
    border: 4px dashed var(--root-color); 
    color: var(--root-color); 
    background: #ebf5ff;
   padding: 0 !important; /* Üst-alt boşluk 10px'den 2px'e düşürüldü */
    line-height: 1 !important;    /* Yazının etrafındaki satır boşluğu sıfırlandı */
    min-height: 40px !important;  /* Kutunun gereksiz uzamasını engeller */
    height: auto !important;      /* İçeriğe tam oturmasını sağlar */
    display: flex;
    align-items: center;
    justify-content: center;
}
        .root-word:hover { transform: scale(1.02); background: #d6eaff; }

     .flying-text {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    font-size: 2.5rem; /* Hücre içindeki font boyutuyla aynı olmalı */
    color: var(--root-color);
    font-weight: bold;
    line-height: 1;
    transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
}

    .cell div {
    display: inline-flex; /* Harflerin yan yana bitişik durmasını sağlar */
    align-items: center;
    justify-content: center;
    direction: rtl;
}

        .zaid-drop { 
    display: inline-block; 
    color: var(--accent); 
    opacity: 0; /* Başlangıçta gizli, JS ile görünecek */
    line-height: 1;
    /* Sadece uçuş geçiş efekti kalsın */
    transition: all 0.8s cubic-bezier(0.2, 1, 0.3, 1);
}
        @keyframes dropIn {
        from { transform: translateY(-20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

       .word-complete { 
    border: 4px solid #2ecc71 !important; 
    background: white;
    transition: border 0.4s ease; /* Çerçevenin yumuşak dönmesi için */
}
        
        .meaning-popup {
    
    bottom: 5px;
    background: rgba(231, 76, 60, 0.9);
    color: white;
    padding: 5px 5px;
    border-radius: 8px;
    font-size: 1.4rem;
    display: none; /* JS tetikleyene kadar kesinlikle gizli */
    z-index: 100;
    width: 90%;
    text-align: center;
    opacity: 0;
/* Absolute yerine relative kullanarak dikey akışı daha kolay kontrol ederiz */
    position: relative; 
    /* Kelime ile Türkçe anlam arasındaki boşluk (burayı artırabilirsin) */
    /* JS tetikleyene kadar gizli tutan ayarlar */
    display: none; 
    opacity: 0;
    z-index: 100;
    width: fit-content; /* Kutunun kelime kadar olmasını sağlar */
}


.info-overlay {
    position: fixed;
    top: 0; left: 0;

    justify-content: center;
    align-items: center;

}

.info-content {
    background: rgba(255, 255, 255, 0.95); /* Panel %95 opak beyaz */

    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);

    overflow-y: auto;
    direction: ltr !important; 
    text-align: left !important;
}

.info-text h2 { 
    color: var(--accent); 
    font-size: 3rem !important; /* Başlık büyütüldü */
    margin-bottom: 20px;
    border-bottom: 3px solid var(--accent);
    padding-bottom: 10px;
}
.info-text p { 
    font-size: 2.2rem !important; /* Metin boyutu ciddi oranda büyütüldü */
    line-height: 1.4;
    color: #2c3e50;
    font-weight: 500;
}

.close-info {
    position: absolute;
    top: 15px; left: 15px;
    background: var(--accent);
    color: white; border: none;
    padding: 8px 15px; border-radius: 8px;
    cursor: pointer; font-weight: bold;
}

@media (min-width: 2000px) {
    html {
        font-size: 24px; /* Tüm rem birimlerini temelden büyütür */
    }
    .grid-container {

    }
    .cell {

    }

/* --- MOBİL YATAY VE DİKEY DÜZENLEME --- */

/* 1. Telefonu Yan Çevir Uyarısı (Sadece Dikey Modda Görünür) */
#orientation-warning {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--primary);
    color: white;
    z-index: 99999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

/* Telefon döndürme animasyonu */
.phone-icon {
    width: 50px;
    height: 80px;
    border: 3px solid white;
    border-radius: 10px;
    margin-bottom: 20px;
    animation: rotatePhone 2s infinite ease-in-out;
    position: relative;
}
.phone-icon::after {
    content: "";
    position: absolute;
    bottom: 5px; left: 50%;
    transform: translateX(-50%);
    width: 5px; height: 5px;
    background: white;
    border-radius: 50%;
}

@keyframes rotatePhone {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
    100% { transform: rotate(0deg); }
}

/* Sadece dikey konumda uyarısı göster, içeriği gizle */
@media screen and (orientation: portrait) and (max-width: 950px) {
    #orientation-warning { display: flex; }
    body { overflow: hidden; }
}

/* 2. Yatay Modda (Landscape) Alan Optimizasyonu */
@media screen and (orientation: landscape) and (max-height: 600px) {
    :root {
        --font-size-base: 1rem;
    }

    body {
        padding: 5px;
        overflow-y: auto; /* Gerektiğinde kaydırılabilsin */
    }

    .top-header {
        padding: 4px 10px;
        margin-bottom: 5px;
    }

    .header-title-main {
        font-size: 0.7rem;
    }

    .vezin-selector {
        gap: 3px;
        margin-bottom: 10px !important;
    }

    .vezin-btn {
        padding: 2px 2px;
        font-size: 0.7rem;
    }

    .grid-container {
        height: auto; /* Mobilde sıkışmaması için yüksekliği serbest bırakıyoruz */
        gap: 4px;
        grid-template-columns: 80px repeat(6, 1fr); /* Kök hücresini biraz daraltıyoruz */
    }

    .cell {
        font-size: 1.1rem !important;
        padding: 2px !important;
        min-height: 60px;
    }

    .header-sub {
        font-size: 0.7rem;
        min-height: 25px !important;
    }

    .pattern-label {
        font-size: 1rem;
        margin-top: 2px;
    }

    .root-word {
        font-size: 1.2rem !important;
    }

    .final-word {
        font-size: 0.8rem !important;
    }

    .meaning-popup {
        font-size: 0.5rem;
        padding: 2px;
    }

    /* Uçan metin mobilde daha küçük olmalı */
    .flying-text {
        font-size: 1.2rem !important;
    }
}

    let activeVezin = "İf'al";
    let rowStates = [0, 0, 0];// Dinamik olması için obje yaptık


    function buildGrid() {
    const grid = document.getElementById('mainGrid');
    const data = vezinData[activeVezin];
    grid.innerHTML = "";
    rowStates = [0, 0, 0];

    // 1. Başlıkları Oluştur
    const headers = ["Kökler", "Mazi", "Muzari", "Emir", "Mastar", "İsmi Fail", "İsmi Meful"];
   headers.forEach((h, i) => {
    const headerCell = document.createElement('div');
    headerCell.className = "cell header-sub";
    
    // Yazı içeriği aynı, sadece dikey hizalamayı kontrol altına alıyoruz
    const sub = i > 0 ? `<div class="pattern-label">${data.labels[i-1]}</div>` : "";
    
    // 'h' (Mazi vb.) yazısını bir span içine alarak satır yüksekliğini kontrol ediyoruz
    headerCell.innerHTML = `<span style="line-height:1; display:block;">${h}</span>${sub}`;
    
    grid.appendChild(headerCell);
});

    // 2. Satırları Oluştur
    data.roots.forEach((root, rIdx) => {
        // Kök Hücresi (Event listener kaybolmaması için createElement ile yapıyoruz)
        const rCell = document.createElement('div');
        rCell.className = 'cell root-word';
        rCell.innerText = root.word;
        
        // ÖNEMLİ: e.target yerine e.currentTarget kullanmak daha sağlıklıdır
        rCell.onclick = (e) => startAnim(rIdx, root, e.currentTarget);
        grid.appendChild(rCell);

        // Boş Hedef Hücreleri
        for (let i = 0; i < 6; i++) {
            const cell = document.createElement('div');
            cell.className = "cell";
            cell.id = `cell-${rIdx}-${i}`; // startAnim bu ID'yi arar
            // Anlam popup'ı başlangıçta boş ve gizli
            cell.innerHTML = `<div class="meaning-popup"></div>`; 
            grid.appendChild(cell);
        }
    });

    
}
    function startAnim(row, rootObj, sourceElem) {
    let col = rowStates[row];
    if (col >= 6) return;

    const target = document.getElementById(`cell-${row}-${col}`);
    if (target.dataset.animating === "true") return;
    target.dataset.animating = "true";

    // 1. Kök Kelime Uçuşu (Mavi Kök)
    const flyingRoot = document.createElement('div');
    flyingRoot.className = 'flying-text';
    flyingRoot.innerText = rootObj.word;
    
   // ... startAnim içindeki ilgili kısım ...
const sRect = sourceElem.getBoundingClientRect();
const tRect = target.getBoundingClientRect();

Object.assign(flyingRoot.style, {
    left: sRect.left + 'px',
    top: sRect.top + 'px',
    width: sRect.width + 'px',
    height: sRect.height + 'px',
    position: 'fixed',
    zIndex: 1000,
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'center',
    background: 'transparent', // Arkaplanı temizledik
    pointerEvents: 'none'
});
    document.body.appendChild(flyingRoot);

    setTimeout(() => {
        flyingRoot.style.left = tRect.left + 'px';
        flyingRoot.style.top = tRect.top + 'px';
    }, 50);

    // 2. Kök Varınca Zaid Harfleri Uçur
    setTimeout(() => {
        if(flyingRoot.parentNode) document.body.removeChild(flyingRoot);
        
        const patternFn = vezinData[activeVezin].patterns[col];
        target.innerHTML = `
            <div class="temp-layer">${patternFn(rootObj.word)}</div>
            <div class="meaning-popup">${rootObj.mean[col]}</div>
        `;

        // Zaid harfleri yukarıdan süzme efekti (Görsel şov kısmı)
        const zaidElements = target.querySelectorAll('.zaid-drop');
        zaidElements.forEach(zaid => {
            zaid.style.transform = 'translateY(-50px)';
            zaid.style.opacity = '0';
            setTimeout(() => {
                zaid.style.transition = 'all 0.6s ease-out';
                zaid.style.transform = 'translateY(0)';
                zaid.style.opacity = '1';
            }, 100);
        });

        // 3. ASIL ÇÖZÜM: Harfler birleşsin (İllüzyon)
        // 3. Harfler Varınca: Bitişik Kelimeyi ve Türkçe Anlamı Göster
        setTimeout(() => {
            // Veriden o vezne, o satıra ve o sütuna ait TAM BİTİŞİK KELİMEYİ çekiyoruz
            const fullWord = vezinData[activeVezin].roots[row].derived[col];
            const turkishMean = rootObj.mean[col]; // Türkçe anlamı buradan alıyoruz

            target.innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; width:100%; height:100%;">
                    <div class="final-word">${fullWord}</div>
                </div>
                <div class="meaning-popup" style="display: block; opacity: 1; transform: translateY(0);">
                    ${turkishMean}
                </div>`;

            target.classList.add('word-complete');
            delete target.dataset.animating; // Animasyon kilidi açıldı
        }, 900);

        rowStates[row]++;
    }, 1500);
}

// 1. Bilgi Panelini Açan Fonksiyon (Eksiksiz Hali)
function showUsageInfo(vName) {
    let overlay = document.getElementById('usageOverlay');
    if(!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'usageOverlay';
        overlay.className = 'info-overlay';
        overlay.onclick = (e) => { if(e.target === overlay) overlay.style.display = 'none'; };
        document.body.appendChild(overlay);
    }
    
    overlay.innerHTML = `
        <div class="info-content">
            <button class="close-info" onclick="document.getElementById('usageOverlay').style.display='none'">X</button>
            <div class="info-text">
                <h2>${vName} Bâbı Kullanımı</h2>
                <p>${usageInfo[vName] || "Bu vezin için kullanım bilgisi eklenmemiş."}</p>
            </div>
        </div>
    `;
    overlay.style.display = 'flex';
}

function init() {
    const sel = document.getElementById('selector');
    if (!sel) return;
    sel.innerHTML = ""; 
    
    Object.keys(vezinData).forEach(v => {
        const btn = document.createElement('button');
        // Aktif olan butona 'active' sınıfını ekle
        btn.className = `vezin-btn ${v === activeVezin ? 'active' : ''}`;
        
        if (v === activeVezin) {
            btn.innerHTML = `${v} <span class="info-icon">ⓘ</span>`;
        } else {
            btn.innerText = v;
        }

        btn.onclick = () => { 
            if (activeVezin === v) {
                // Zaten aktifse hem bilgiyi aç hem de kırmızı kalmaya devam et
                showUsageInfo(v); 
            } else {
                // Yeni bir vezne geçiliyorsa
                activeVezin = v; 
                buildGrid(); 
                init(); // Menüyü yeniden çiz ki yeni buton kırmızı olsun
            }
        };
        sel.appendChild(btn);
    });
    buildGrid();
}

init();
</script>
