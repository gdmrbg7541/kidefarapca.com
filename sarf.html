<div class="floating-emojis">
    <span class="fe-1">📖</span>
    <span class="fe-2">✍️</span>
    <span class="fe-3">⚙️</span>
    <span class="fe-4">🕌</span>
    <span class="fe-5">📚</span>
    <span class="fe-6">🎓</span>
</div>

<!-- ================= GİRİŞ EKRANI ================= -->
<main class="screen active" id="start-screen">
    <!-- Siteye donus. data-kidef-done="1" sayesinde geri.js ayrica
         "Anasayfa" (ev) tusu EKLEMEZ; tek geri tusu yeterli. -->
    <a href="index.html" class="back-btn kidef-siteye" id="start-back-button"
       data-kidef-done="1" onclick="return kidefGeriDon(event)" title="Geri" aria-label="Geri">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <div class="menu-wrap">
        <div class="menu-grid">
            <!-- "Kökten görsele" oyunu artık ayrı sayfada: koktengorsele.html.
                 Burada tek kart var: birleşik Kelime Fabrikası. -->
            <!-- Birleşik "Kelime Fabrikası": öğütücü + usta atölyesi tek oyunda.
                 İkon: çark pencereli makine, üstünde çekiç, altında altın külçe. -->
            <div class="menu-card" data-goto="game2-screen">
                <!-- Önizleme sahnesi sarf.js tarafından doldurulur:
                     mini vitrin + usta/örs + öğütücü makine (oyunun kendi SVG'leri). -->
                <div class="mf-onizleme" id="mfOnizleme"></div>
                <h2>مَصْنَعُ الْكَلِمَاتِ</h2>
            </div>
            <!-- Dijital yarışma (Firebase) girişi: kartla aynı genişlikte,
                 yarı yükseklikte mor bar. "اِتَّصِلْ" = bağlan -->
            <button type="button" class="menu-connect" data-goto="quiz-screen">
                <span class="mc-nokta"></span>
                <span class="mc-ar">اِتَّصِلْ</span>
                <span class="mc-ikon">🏆</span>
            </button>
        </div>
    </div>
</main>

<main class="screen" id="game1-screen"></main>
