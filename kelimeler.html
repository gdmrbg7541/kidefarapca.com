<!-- =====================================================================
     KELİME DAĞARCIĞI                              (kelimeler.html)
     ---------------------------------------------------------------------
     Konu listeleri ekranının kendi sayfası. Motor kalıplar tablosuyla
     ORTAK: sarf/kelimeler.js. Veri de ortak — veri_sozluk.js ve
     veri_kokler.js. Burada tablo yok, o yüzden bir kelimeden köke
     gidilmek istenirse kaliplartablosu.html?kok=… açılıyor.

     ÜÇ GİRİŞ
       1) Kalıplar tablosundaki kitap ikonu   → ?donus=tablo
       2) index → Öğretmen Özel → Kelime Dağarcığı kartı
       3) index → İmam Hatip → N. Sınıf Kelime Listeleri  → ?liste=ih-N
     KAPANIŞ
     `donus` parametresi nereye dönüleceğini söyler; İmam Hatip'ten
     gelindiyse index'te o sınıf yeniden açılır (kalınan yere dönülür).
     ===================================================================== -->

<style>
    html, body { margin: 0; padding: 0; background: #EEF2F7; min-height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; }

    /* Üst şerit: geri düğmesi + başlık. Kalıplar tablosunun araç
       çubuğuyla aynı dili konuşsun diye aynı yuvarlak/gölge ölçüleri. */
    .kd-bar {
        position: sticky; top: 0; z-index: 40;
        display: flex; align-items: center; gap: 14px;
        padding: 12px 18px; background: rgba(255, 255, 255, .92);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid #E3EAF3;
    }
    .kd-geri {
        display: inline-flex; align-items: center; gap: 8px;
        border: 1px solid #DDE4EE; background: #fff; color: #374151;
        padding: 9px 16px; border-radius: 999px; cursor: pointer;
        font-size: .95rem; font-weight: 700; font-family: inherit;
        transition: background .15s, border-color .15s, transform .12s;
    }
    .kd-geri:hover { transform: translateY(-1px); border-color: #2980B9; color: #2980B9; }
    .kd-bas { display: flex; align-items: baseline; gap: 10px; }
    .kd-bas b { font-size: 1.08rem; color: #1F2937; letter-spacing: .01em; }
    .kd-bas span { font-size: .86rem; color: #8A93A3; }
    .kd-govde { padding: 18px 22px 60px; }

    /* Motor, listeyi #thematic-accordion-container içine çiziyor;
       tablo sayfasında bu bir kaplamanın içindeydi, burada sayfanın
       kendisi. Kaplamaya ait ölçüler sıfırlanıyor. */
    /* ---- "TELEFONU YATAY ÇEVİR" KURALI BURAYA GEÇMESİN ----
       Ortak stil dosyası (sarf/kaliplartablosu.css) dikey ve 1024px'ten
       dar ekranlarda `body > div:not(#mobile-portrait-warning)` ları
       gizliyor; o uyarı KALIPLAR TABLOSU içindir — tablo dar ekrana
       sığmadığı için oradan mobil sürüme yönlendiriliyor. Bu sayfa
       yalnızca liste; telefonda dikey de gayet rahat okunuyor. Uyarı
       kutusu da burada yok, o yüzden kural devrede kalınca sayfa
       TAMAMEN BOŞ görünüyordu (telefonda ve dikey tablette).
       Seçici, gizleyen kuralın aynısı + sınıf: `:not(#id)` kimlik
       ağırlığı taşıdığı için düz `body > .kd-govde` yenilemiyordu. */
    @media screen and (max-width: 1024px) and (orientation: portrait) {
        body > div:not(#mobile-portrait-warning).kd-bar   { display: flex  !important; }
        body > div:not(#mobile-portrait-warning).kd-govde { display: block !important; }
    }

    /* TAM EKRAN AÇIKKEN ÜST ŞERİT GİZLENİR. Hafıza oyunu ve test tam
       ekrana geçince (.fullscreen-accordion) yapışkan şerit ekranın
       tepesinde kalıp altındaki mod düğmelerinin üstüne biniyor,
       "Liste Modu"na basılamıyordu. Tam ekranda zaten geri düğmesine
       gerek yok; çıkış ✕ ve Esc ile.
       Seçici, bir üstteki dikey-ekran kuralını da yenecek ağırlıkta
       yazıldı; yoksa telefonda şerit tam ekranda da duruyordu. */
    body.has-fullscreen-accordion > div:not(#mobile-portrait-warning).kd-bar {
        display: none !important;
    }

    #thematic-words-content { width: 100%; }
    .kd-govde .verb-close-btn { display: none; }   /* kapatma üstteki geri düğmesi */
    @media (max-width: 820px) {
        .kd-bar { padding: 10px 12px; }
        .kd-govde { padding: 12px 10px 50px; }
        .kd-bas span { display: none; }
    }
</style>
</head>
<body>

<div class="kd-bar">
    <button type="button" class="kd-geri" onclick="kdGeri()">
        <span aria-hidden="true">←</span><span id="kd-geri-yazi">Geri</span>
    </button>
    <div class="kd-bas"><b data-i18n="kl.baslik">Kelime Dağarcığı</b><span id="kd-alt" data-i18n="kl.alt">konu konu kelime listeleri</span></div>
</div>

<div class="kd-govde">
    <div id="thematic-words-content" class="thematic-words-content">
        <div id="thematic-accordion-container" dir="rtl"></div>
    </div>
</div>

<!-- ihkelime.js ders dosyasının yolunu KidefSinifVeri.dersYolu()
     ile kuruyor (öğretim yılı öneki); bu yüzden ondan ÖNCE. -->
<script src="sistem/sinifveri.js?v=6baf2d98"></script>
<script src="sarf/ihkelime.js?v=a63b06fd"></script>
<script src="sarf/kelimecikar.js?v=3973f480"></script>
<script src="sarf/kelimeindir.js?v=3c052ebb"></script>
<script>
/* ---- GERİ DÖNÜŞ ----
   donus=tablo        → kalıplar tablosuna
   liste=ih-N…        → index'te İmam Hatip, o sınıf açık (kalınan yer)
   ötekiler           → index'te Öğretmen Özel bölümü               */
/* ÇOK DİLLİ SİTE (15.10.2026) — kodun yazdığı yazılar seçilen dilde.
   Yazı sistem/dil.js sözlüğünden gelir; dil Türkçeyse, sözlük henüz
   yüklenmemişse ya da çeviri yoksa Türkçesi kalır.
     kdMetin(anahtar, türkçe, {ad: değer})  yazıyı verir, {…} yerlerini doldurur
     kdYaz(öğe, anahtar, türkçe, {…})        öğeye anahtarıyla yazar; sözlük sonradan
                                             yüklense de dil değişse de yazı döner
     kdIsaretli(anahtar, türkçe)             innerHTML içine konacak işaretli <span>
     kdSerbest(öğe)                          öğenin işaretini kaldırır (kod oraya her
                                             an başka yazı yazıyorsa)
     kdDil()                                 sayfanın o anki dili */
function kdDoldur(m, yer) {
    if (!yer || m == null) return m;
    return String(m).replace(/\{([A-Za-z0-9_]+)\}/g, function (t, ad) {
        return Object.prototype.hasOwnProperty.call(yer, ad) ? String(yer[ad]) : t;
    });
}
function kdMetin(k, tr, yer) {
    var m = (window.KidefDil && window.KidefDil.metin) ? window.KidefDil.metin(k, tr) : tr;
    return kdDoldur(m, yer);
}
function kdYaz(el, k, tr, yer) {
    if (!el) return;
    if (window.KidefDil && window.KidefDil.yaz) { window.KidefDil.yaz(el, k, tr, yer); return; }
    el.setAttribute('data-i18n', k);
    el.setAttribute('data-i18n-tr', tr);
    if (yer) el.setAttribute('data-i18n-yer', JSON.stringify(yer)); else el.removeAttribute('data-i18n-yer');
    el.textContent = kdDoldur(tr, yer);
}
function kdIsaretli(k, tr) {
    var e = function (x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };
    return '<span data-i18n="' + k + '" data-i18n-tr="' + e(tr) + '">' + e(kdMetin(k, tr)) + '</span>';
}
function kdSerbest(el) {
    if (el && el.removeAttribute) el.removeAttribute('data-i18n');
    return el;
}
function kdDil() {
    return document.documentElement.getAttribute('lang') || 'tr';
}
function kdHedef() {
    var p = new URLSearchParams(location.search);
    if (p.get('donus') === 'tablo') return { url: 'kaliplartablosu.html', ad: 'Kalıplar Tablosu', k: 'kt.ad' };
    var l = p.get('liste') || '';
    var m = /^ih-(\d+)/.exec(l);
    if (m) return { url: 'index.html?ihsinif=' + m[1] + '#imam-hatip', ad: m[1] + '. Sınıf', k: 'sin.' + m[1] };
    return { url: 'index.html#ogretmen-ozel', ad: 'Ana Sayfa', k: 'nav.anasayfa' };
}
/* ÇIKIŞTA SEKMEYİ KAPAT. Bu sayfa index'ten YENİ SEKMEDE açılıyor;
   geri gitmek yerine yönlendirince ikinci bir index açılıyordu ve
   ilkindeki (İmam Hatip sınıfı gibi) durum boşa gidiyordu. Sekme
   kapatılamıyorsa — adres çubuğundan açılmış ya da kalıplar
   tablosundan aynı sekmede gelinmişse — eski davranış sürüyor. */
function kdGeri() {
    var h = kdHedef();
    if (window.opener && !window.opener.closed) {
        try { window.opener.focus(); } catch (e) { }
        window.close();
        /* close() engellendiyse hâlâ buradayız: yönlendirerek çık. */
        setTimeout(function () { location.href = h.url; }, 200);
        return;
    }
    location.href = h.url;
}
(function () {
    var h = kdHedef();
    var y = document.getElementById('kd-geri-yazi');
    if (y) kdYaz(y, h.k, h.ad);
    /* İmam Hatip kipinde alt başlık sınıfı söylesin */
    var m = /^ih-(\d+)/.exec(new URLSearchParams(location.search).get('liste') || '');
    var alt = document.getElementById('kd-alt');
    if (m && alt) kdYaz(alt, 'kl.alt_sinif', '{n}. Sınıf müfredatı — ünite ve ders listeleri', { n: m[1] });
    /* İmam Hatip kipi kendi açılışını yapıyor; öteki girişlerde listeyi
       burada çiziyoruz. */
    if (!m && typeof renderThematicLists === 'function') renderThematicLists();
})();
/* Motor tablo sayfasında bu ikisini kaplamayı açıp kapatmak için
   çağırıyor; burada sayfa zaten liste, ikisi de zararsızlaşıyor. */
window.showThematicView = window.showThematicView || function () {};
window.openVerbModal = function () { if (typeof renderThematicLists === 'function') renderThematicLists(); };
window.closeVerbModal = function () { kdGeri(); };
/* Esc = geri. AMA test açıkken Esc önce TESTTEN çıkarır, sayfadan değil;
   yoksa oyunun ortasında tuşa basan doğrudan ana sayfaya düşüyordu.
   Testten çıkışı sarf/kelimetest.js'in kendi dinleyicisi yapıyor. */
document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (window.KidefKelimeTest && KidefKelimeTest.acikVar && KidefKelimeTest.acikVar()) return;
    kdGeri();
});
</script>
    <!-- DİL: sayfa seçili dili localStorage'dan okur, başka
         sekmede dil değişirse anında döner (sistem/dil.js). -->
    <script src="sistem/dil.js?v=a9253d84"></script>
</body>
