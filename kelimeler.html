<!-- =====================================================================
     KELİME DAĞARCIĞI                              (kelimeler.html)
     ---------------------------------------------------------------------
     Konu listeleri ekranının kendi sayfası. Motor kalıplar tablosuyla
     ORTAK: sarf/kelimeler.js. Veri de ortak — veri_sozluk.js ve
     veri_kokler.js. Burada tablo yok, o yüzden bir kelimeden köke
     gidilmek istenirse kaliplartablosu.html?kok=… açılıyor.

     ÜÇ GİRİŞ
       1) Kalıplar tablosundaki kitap ikonu   → ?donus=tablo
       2) index → Öğretmen Özel → Kelime Dağarcığı kartı
       3) index → İmam Hatip → N. Sınıf Kelime Listeleri  → ?liste=ih-N
     KAPANIŞ
     `donus` parametresi nereye dönüleceğini söyler; İmam Hatip'ten
     gelindiyse index'te o sınıf yeniden açılır (kalınan yere dönülür).
     ===================================================================== -->

<link rel="stylesheet" href="sarf/kaliplartablosu.css?v=d0d81a07">
<link rel="stylesheet" href="sarf/kelimetest.css?v=1d76219c">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="arakom.css?v=896e5892">

<style>
    html, body { margin: 0; padding: 0; background: #EEF2F7; min-height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; }

    /* Üst şerit: geri düğmesi + başlık. Kalıplar tablosunun araç
       çubuğuyla aynı dili konuşsun diye aynı yuvarlak/gölge ölçüleri. */
    .kd-bar {
        position: sticky; top: 0; z-index: 40;
        display: flex; align-items: center; gap: 14px;
        padding: 12px 18px; background: rgba(255, 255, 255, .92);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid #E3EAF3;
    }
    .kd-geri {
        display: inline-flex; align-items: center; gap: 8px;
        border: 1px solid #DDE4EE; background: #fff; color: #374151;
        padding: 9px 16px; border-radius: 999px; cursor: pointer;
        font-size: .95rem; font-weight: 700; font-family: inherit;
        transition: background .15s, border-color .15s, transform .12s;
    }
    .kd-geri:hover { transform: translateY(-1px); border-color: #2980B9; color: #2980B9; }
    .kd-bas { display: flex; align-items: baseline; gap: 10px; }
    .kd-bas b { font-size: 1.08rem; color: #1F2937; letter-spacing: .01em; }
    .kd-bas span { font-size: .86rem; color: #8A93A3; }
    .kd-govde { padding: 18px 22px 60px; }

    /* Motor, listeyi #thematic-accordion-container içine çiziyor;
       tablo sayfasında bu bir kaplamanın içindeydi, burada sayfanın
       kendisi. Kaplamaya ait ölçüler sıfırlanıyor. */
    /* ---- "TELEFONU YATAY ÇEVİR" KURALI BURAYA GEÇMESİN ----
       Ortak stil dosyası (sarf/kaliplartablosu.css) dikey ve 1024px'ten
       dar ekranlarda `body > div:not(#mobile-portrait-warning)` ları
       gizliyor; o uyarı KALIPLAR TABLOSU içindir — tablo dar ekrana
       sığmadığı için oradan mobil sürüme yönlendiriliyor. Bu sayfa
       yalnızca liste; telefonda dikey de gayet rahat okunuyor. Uyarı
       kutusu da burada yok, o yüzden kural devrede kalınca sayfa
       TAMAMEN BOŞ görünüyordu (telefonda ve dikey tablette).
       Seçici, gizleyen kuralın aynısı + sınıf: `:not(#id)` kimlik
       ağırlığı taşıdığı için düz `body > .kd-govde` yenilemiyordu. */
    @media screen and (max-width: 1024px) and (orientation: portrait) {
        body > div:not(#mobile-portrait-warning).kd-bar   { display: flex  !important; }
        body > div:not(#mobile-portrait-warning).kd-govde { display: block !important; }
        /* Sonradan gövdeye eklenen kutular da (23.10.2026): İndir menüsü,
           bildirim ve PDF'in çizildiği gizli kâğıtlar. Asıl çözüm aşağıdaki
           betikte (kural bu sayfada tümden sökülüyor); bu satır, betik bir
           sebeple çalışmazsa İndir yine çalışsın diye. */
        body > div:not(#mobile-portrait-warning).kl-indir-menu,
        body > div:not(#mobile-portrait-warning).kl-indir-tost,
        body > div:not(#mobile-portrait-warning).kl-gizli { display: block !important; }
    }

    /* TAM EKRAN AÇIKKEN ÜST ŞERİT GİZLENİR. Hafıza oyunu ve test tam
       ekrana geçince (.fullscreen-accordion) yapışkan şerit ekranın
       tepesinde kalıp altındaki mod düğmelerinin üstüne biniyor,
       "Liste Modu"na basılamıyordu. Tam ekranda zaten geri düğmesine
       gerek yok; çıkış ✕ ve Esc ile.
       Seçici, bir üstteki dikey-ekran kuralını da yenecek ağırlıkta
       yazıldı; yoksa telefonda şerit tam ekranda da duruyordu. */
    body.has-fullscreen-accordion > div:not(#mobile-portrait-warning).kd-bar {
        display: none !important;
    }

    #thematic-words-content { width: 100%; }
    .kd-govde .verb-close-btn { display: none; }   /* kapatma üstteki geri düğmesi */
    @media (max-width: 820px) {
        .kd-bar { padding: 10px 12px; }
        .kd-govde { padding: 12px 10px 50px; }
        .kd-bas span { display: none; }
    }
</style>

<!-- =====================================================================
     TELEFON İÇİN KELİME KARTLARI                            (23.10.2026)
     ---------------------------------------------------------------------
     Öğretmen isteği: "kelime kartlarında kelimeler çok büyük olmuş",
     konu kartları da telefona göre olsun. Ortak stil (sarf/
     kaliplartablosu.css) tahtaya göre ayarlı: kartta Arapça 4rem,
     Türkçe 2,8rem; telefonda 89 px'lik kartta kelime harf harf alt
     satıra iniyordu. Ortak dosyaya ve motora (sarf/kelimeler.js)
     dokunulmadı — kurallar yalnız bu sayfada. Seçiciler kimlikle
     (#thematic-accordion-container) başlıyor: ortak stildeki
     !important'lı sınıf kurallarını ancak öyle geçiyor.
     ===================================================================== -->
<style id="kdMobilStil">
    /* 1) KELİME ORTASINDAN BÖLÜNMESİN — her ekranda.
       Ortak stil kart yüzüne `word-break: break-word` veriyor: dar kartta
       لَكِنْ "لَكِ / نْ" diye bölünüyordu, sığdırma ayarı da taşma
       görmediği için puntoyu hiç küçültmüyordu. Bölünme kalkınca sığmayan
       kelime küçülüyor (kelimeler.js → kartYuzuSigdir; hafıza kartlarına
       aşağıdaki betik bağlıyor). Çok kelimeli Türkçe karşılıklar
       boşluklardan yine alt satıra geçer. */
    #thematic-accordion-container .memory-card-face,
    #thematic-accordion-container .memory-card-face * {
        word-break: normal !important;
        overflow-wrap: normal !important;
    }

    /* ---------------------------------------------------------------
       TELEFON — dikey de yatay da. Yatay telefon (boyu 500 px'ten kısa)
       genişlikte tablete benzese de boyda değil: kartlar 36 px'e
       eziliyor, listeden tek satır görünüyordu.
       --------------------------------------------------------------- */
    @media (max-width: 640px) and (orientation: portrait), (orientation: landscape) and (max-height: 500px) {
        /* 2) KONU KARTLARI: telefonda her biri ekranın beşte biri kadardı */
        #thematic-accordion-container { gap: 10px !important; }
        #thematic-accordion-container .thematic-accordion-item { margin-bottom: 0 !important; border-radius: 14px !important; }
        #thematic-accordion-container .thematic-accordion-header { padding: 12px 16px !important; border-radius: 14px !important; }
        #thematic-accordion-container .thematic-accordion-header > div { gap: 10px !important; }
        #thematic-accordion-container .thematic-accordion-icon { font-size: 1rem !important; }
        /* başlığın puntosu emojinin boyu; yazılar kendi puntosunda */
        #thematic-accordion-container .thematic-accordion-title { font-size: 1.45rem !important; gap: 12px !important; }
        #thematic-accordion-container .thematic-accordion-title > div > span:first-child { font-size: 1.08rem !important; line-height: 1.25; }
        #thematic-accordion-container .thematic-accordion-title > div > span + span { font-size: 1.5rem !important; line-height: 1.3 !important; margin-top: 2px !important; }
        #thematic-accordion-container .ktl-obek { margin-top: 14px; }
        #thematic-accordion-container .kl-sayac-serit { margin-bottom: 4px; padding: 10px 18px; gap: 10px; }
        #thematic-accordion-container .kl-sayac-serit .kls-sayi { font-size: 1.6rem; }
        #thematic-accordion-container .kl-sayac-serit .kls-alt { text-wrap: balance; }

        /* 3) TAM EKRAN: kenarlık ve iç içe iki boşluk kalktı (ekranın
           genişliğinin beşte biri boşa gidiyordu) */
        /* margin: panelin satır içi 15 px alt payı tam ekranda da kalıyor,
           altta arkadaki sayfa şerit hâlinde görünüyordu */
        html body .thematic-accordion-panel.fullscreen-accordion { padding: 0 !important; margin: 0 !important; border: 0 !important; border-radius: 0 !important; }
        html body .thematic-accordion-panel.fullscreen-accordion > .thematic-accordion-content { padding: 10px 8px 8px !important; border-top: 0 !important; }
        #thematic-accordion-container .kl-baslik { font-size: 1.3rem; padding-bottom: 4px; margin-bottom: 8px; }

        #thematic-accordion-container .memory-game-controls .memory-btn {
            margin: 0 !important; min-height: 40px; padding: 8px 10px !important;
            font-size: .95rem !important; line-height: 1.15; border-radius: 11px !important;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #thematic-accordion-container .memory-game-controls .kl-indir,
        #thematic-accordion-container .memory-game-controls .kl-tamekran { min-width: 46px; padding: 8px 11px !important; }
        #thematic-accordion-container .memory-game-controls .p-score-box {
            min-height: 38px !important; padding: 4px 12px !important; margin: 0 !important; width: auto !important;
        }
        /* sıradaki oyuncu yine öne çıksın ama ekran kenarından taşmasın */
        #thematic-accordion-container .memory-game-controls .p-score-box.active-p { transform: scale(1.03) !important; }
        #thematic-accordion-container .memory-game-controls .p-score-box:not(.active-p) { transform: scale(.97) !important; }

        /* 4) ÇALIŞMA KARTLARI: üç sütun kalıyor (öğretmen isteği); kart
           kısaldı, yazı tahtaya göre değil telefona göre. Kelime yine de
           sığmazsa sığdırma ayarı küçültüyor. */
        #thematic-accordion-container .thematic-words-grid:not(.memory-mode):not(.list-mode-grid) {
            gap: 8px !important; grid-auto-rows: minmax(112px, auto) !important; padding-right: 0 !important;
        }
        #thematic-accordion-container .thematic-words-grid:not(.memory-mode):not(.list-mode-grid) .memory-card { min-height: 112px !important; }
        #thematic-accordion-container .thematic-words-grid:not(.memory-mode):not(.list-mode-grid) .memory-card-face {
            padding: 6px !important; border-width: 2px !important; border-radius: 12px !important;
        }
        #thematic-accordion-container .thematic-words-grid:not(.memory-mode):not(.list-mode-grid) .memory-card-face .lang-ar { font-size: 2.25rem !important; line-height: 1.5 !important; }
        #thematic-accordion-container .thematic-words-grid:not(.memory-mode):not(.list-mode-grid) .memory-card-face .lang-tr { font-size: 1.1rem !important; line-height: 1.25 !important; }
        #thematic-accordion-container .thematic-words-grid:not(.memory-mode):not(.list-mode-grid) .memory-card-back > div:not(.lang-tr) {
            font-size: 1.9rem !important; margin-bottom: 4px !important; line-height: 1.15;
        }

        /* 5) HAFIZA OYUNU: yazı karta göre (kartın kendisi aşağıda,
           dikey ve yatay için ayrı) */
        #thematic-accordion-container .thematic-words-grid.memory-mode { gap: 6px !important; }
        #thematic-accordion-container .thematic-words-grid.memory-mode.active-p1-grid,
        #thematic-accordion-container .thematic-words-grid.memory-mode.active-p2-grid { padding: 6px !important; border-width: 3px !important; }
        #thematic-accordion-container .thematic-words-grid.memory-mode .memory-card-face { padding: 4px !important; border-width: 2px !important; border-radius: 10px !important; }
        #thematic-accordion-container .thematic-words-grid.memory-mode .memory-card-face.lang-ar { font-size: 2.2rem !important; line-height: 1.45; }
        #thematic-accordion-container .thematic-words-grid.memory-mode .memory-card-face.lang-tr { font-size: 1.05rem !important; line-height: 1.2; }
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-8 .memory-card-face.lang-ar { font-size: 2rem !important; }
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-8 .memory-card-face.lang-tr { font-size: 1rem !important; }
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-10 .memory-card-face.lang-ar,
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-12 .memory-card-face.lang-ar { font-size: 1.75rem !important; }
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-10 .memory-card-face.lang-tr,
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-12 .memory-card-face.lang-tr { font-size: .92rem !important; }
        #thematic-accordion-container .thematic-words-grid.memory-mode .memory-card-front::after { font-size: 2rem; }
    }

    /* ---- DİKEY TELEFON ---- */
    @media (max-width: 640px) and (orientation: portrait) {
        /* MOD SATIRI: dört-beş satır yerine iki satır — ikişer mod
           düğmesi, sağda Kapat (hep sağ üstte) ve altında İndir; hafıza
           oyununda oyuncu puanları üçüncü satırda. Öbekler (sol / orta /
           sağ) çözülüp düğmeler tek ızgaraya diziliyor (display: contents). */
        #thematic-accordion-container .memory-game-controls {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
            grid-template-areas: "liste kart kapat" "test hafiza indir";
            gap: 8px !important; padding: 0 !important; margin-bottom: 10px !important;
            align-items: stretch; direction: ltr !important;
        }
        #thematic-accordion-container .memory-game-controls > div { display: contents !important; }
        #thematic-accordion-container .memory-game-controls [id^="btn-list-"]  { grid-area: liste; }
        #thematic-accordion-container .memory-game-controls [id^="btn-study-"] { grid-area: kart; }
        #thematic-accordion-container .memory-game-controls [id^="btn-test-"]  { grid-area: test; }
        #thematic-accordion-container .memory-game-controls [id^="btn-mem-"]   { grid-area: hafiza; }
        #thematic-accordion-container .memory-game-controls [id^="btn-indir-"] { grid-area: indir; }
        #thematic-accordion-container .memory-game-controls [id^="btn-fs-"]    { grid-area: kapat; }
        #thematic-accordion-container .memory-game-controls [id^="p1-box-"]    { grid-row: 3; grid-column: 1; }
        #thematic-accordion-container .memory-game-controls [id^="p2-box-"]    { grid-row: 3; grid-column: 2; }
        #thematic-accordion-container .memory-game-controls .kdf-sutun { display: none !important; }

        /* hafıza kartları ince uzundu (62 × 148 px): daha az sütun */
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-6  { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; grid-template-rows: repeat(4, minmax(0, 1fr)) !important; }
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-8  { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; grid-template-rows: repeat(4, minmax(0, 1fr)) !important; }
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-10 { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; grid-template-rows: repeat(5, minmax(0, 1fr)) !important; }
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-12 { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; grid-template-rows: repeat(6, minmax(0, 1fr)) !important; }
    }

    /* ---- YATAY TELEFON ---- */
    @media (orientation: landscape) and (max-height: 500px) {
        #thematic-accordion-container .thematic-accordion-header { padding: 10px 14px !important; }
        html body .thematic-accordion-panel.fullscreen-accordion > .thematic-accordion-content { padding: 6px 10px 6px !important; }
        #thematic-accordion-container .kl-baslik { font-size: 1.1rem; padding-bottom: 2px; margin-bottom: 6px; }
        /* mod satırı tek satır: öbekler yan yana, ortadaki gerekirse sarar */
        #thematic-accordion-container .memory-game-controls {
            flex-wrap: nowrap !important; gap: 8px !important; padding: 0 !important; margin-bottom: 6px !important;
        }
        #thematic-accordion-container .memory-game-controls > div { gap: 6px !important; }
        #thematic-accordion-container .memory-game-controls > div:nth-child(2) { flex: 1 1 auto !important; min-width: 0; }
        #thematic-accordion-container .memory-game-controls > div:nth-child(3) { flex: 0 0 auto !important; }
        #thematic-accordion-container .memory-game-controls .memory-btn { min-height: 34px; padding: 6px 11px !important; font-size: .9rem !important; }
        #thematic-accordion-container .memory-game-controls .kl-indir,
        #thematic-accordion-container .memory-game-controls .kl-tamekran { min-width: 40px; padding: 6px 10px !important; }
        #thematic-accordion-container .memory-game-controls .p-score-box { min-height: 34px !important; padding: 2px 10px !important; min-width: 64px; }
        #thematic-accordion-container .memory-game-controls .kdf-sutun-t { height: 30px; width: 34px; }

        /* hafıza: iki-üç satır, geniş kartlar */
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-6  { grid-template-columns: repeat(6, minmax(0, 1fr)) !important; grid-template-rows: repeat(2, minmax(0, 1fr)) !important; }
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-8  { grid-template-columns: repeat(8, minmax(0, 1fr)) !important; grid-template-rows: repeat(2, minmax(0, 1fr)) !important; }
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-10 { grid-template-columns: repeat(7, minmax(0, 1fr)) !important; grid-template-rows: repeat(3, minmax(0, 1fr)) !important; }
        #thematic-accordion-container .thematic-words-grid.memory-mode.pairs-12 { grid-template-columns: repeat(8, minmax(0, 1fr)) !important; grid-template-rows: repeat(3, minmax(0, 1fr)) !important; }

        /* liste: satır adımı tahtaya göre 150 px'ti, ekrana tek satır
           sığıyordu. Sütun seçici duruyor; ölçüler her sütunda telefona göre. */
        #thematic-accordion-container .kdf-defter.kdf-defter { --kdf-adim: 64px; --kdf-ust: 14px; }
        #thematic-accordion-container .kdf-defter .kdf-izgara { padding: 0 14px; }
        #thematic-accordion-container .kdf-defter .kdf-no { width: 40px; padding-right: 10px; margin-right: 12px; font-size: .85rem; }
        #thematic-accordion-container .kdf-defter .kdf-tr,
        #thematic-accordion-container .kdf-defter .kdf-emoji { font-size: 1.08rem; }
        /* satır boyu bol: "Ü"nün noktaları kutunun tepesinde kesilmesin */
        #thematic-accordion-container .kdf-defter .kdf-tr { line-height: 1.38; }
        #thematic-accordion-container .kdf-defter .kdf-ar { font-size: 1.9rem; }
        #thematic-accordion-container .kdf-defter .kdf-nokta { margin: 0 10px; }

        /* test: soru ile şıklar üst üste sığmıyordu (şıklar sorunun
           üstüne biniyordu) — tek kişide soru solda, şıklar sağda;
           kapışmada iki oyuncu yan yana. Yazı boyunu test kendisi
           kutuya göre buluyor (kelimetest.js → sigdirKapta). */
        #thematic-accordion-container .kt-arena:not(.kt-iki) .kt-oyuncu {
            display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
            grid-template-rows: auto auto minmax(0, 1fr); column-gap: 12px; padding: 8px 10px;
        }
        #thematic-accordion-container .kt-arena:not(.kt-iki) .kt-ust,
        #thematic-accordion-container .kt-arena:not(.kt-iki) .kt-sure { grid-column: 1 / -1; }
        #thematic-accordion-container .kt-arena:not(.kt-iki) .kt-ust { margin-bottom: 4px; }
        #thematic-accordion-container .kt-arena:not(.kt-iki) .kt-sure { margin-bottom: 6px; height: 6px; }
        #thematic-accordion-container .kt-arena:not(.kt-iki) .kt-soru { grid-column: 1; grid-row: 3; padding: 2px; gap: 6px; }
        #thematic-accordion-container .kt-arena:not(.kt-iki) .kt-siklar { grid-column: 2; grid-row: 3; height: 100%; grid-template-columns: 1fr 1fr; }
        #thematic-accordion-container .kt-arena:not(.kt-iki) .kt-noktalar { display: none; }
        #thematic-accordion-container .kt-arena.kt-iki { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 10px; }
    }
</style>

<script>
/* ---- KALIPLAR TABLOSUNUN İKİ TELEFON KURALI BU SAYFADA OLMASIN (23.10.2026) ----
   Ortak stil dosyası (sarf/kaliplartablosu.css) kalıplar tablosu için
   yazılmış iki kural taşıyor; bu sayfaya da sızıyorlardı:
   1) Dikey telefon/tablet: gövdeye doğrudan eklenen BÜTÜN kutular
      gizleniyor (yukarıda anlatılıyor). Şerit ile liste için istisna
      yazılmıştı; sonradan eklenenler — İndir menüsü, "PDF hazırlanıyor"
      bildirimi, PDF'in çizildiği gizli kâğıtlar, hafıza oyununun
      "Tebrikler" kutusu, dil seçici — hiç görünmüyordu. Telefonda
      "İndir"e basınca bir şey olmamasının sebebi buydu.
   2) Yatay telefon/tablet: her `.ar` 28 px'e çakılıyor (!important) —
      testteki Arapça soru, kutusuna göre bulunan puntoyu alamıyor,
      küçücük kalıyordu.
   Kurallar yalnız bu sayfada sökülüyor; ortak dosya ve kalıplar tablosu
   olduğu gibi. Betik başlıkta, stil dosyalarının ardında: tarayıcı onu
   stiller yüklendikten sonra çalıştırır, kurallar o an okunabilir. */
(function () {
    var SOK = {
        'body>div:not(#mobile-portrait-warning)': 1,
        '.ar,#tab1.ar,#tab2.ar': 1
    };
    function tara(liste, sahip) {
        for (var i = liste.length - 1; i >= 0; i--) {
            var k = liste[i];
            if (k.cssRules && k.cssRules.length) { tara(k.cssRules, k); continue; }
            /* yalnız @media içindekiler: üst düzeydeki `.ar` (40 px) kalsın */
            if (sahip.type === 4 && k.selectorText &&
                SOK[k.selectorText.replace(/\s+/g, '')]) {
                try { sahip.deleteRule(i); } catch (e) { }
            }
        }
    }
    try {
        [].forEach.call(document.styleSheets, function (ss) {
            var kk;
            try { kk = ss.cssRules; } catch (e) { return; }   /* başka sitenin stili okunmaz */
            if (kk) tara(kk, ss);
        });
    } catch (e) { }
})();
</script>
</head>

<script>
/* ---- HAFIZA KARTLARI DA SIĞSIN (23.10.2026) ----
   Çalışma kartlarında uzun kelime küçülüyordu (kelimeler.js →
   kartYuzuSigdir), hafıza oyununda küçülmüyordu: telefonda dar kartta
   kelime bölünüyor ya da kenardan taşıyordu. Aynı ayar hafıza kartlarının
   yazılı yüzüne de uygulanıyor. Motora dokunulmadı; initMemoryGrid
   sarılıyor (kelimeler.js onu her çağrıda bu adla buluyor). */
(function () {
    function hafizaSigdir(key) {
        var g = document.getElementById('grid-' + key);
        if (!g || !g.classList.contains('memory-mode') || typeof kartYuzuSigdir !== 'function') return;
        [].forEach.call(g.querySelectorAll('.memory-card-back'), function (y) {
            try { kartYuzuSigdir(y); } catch (e) { }
        });
    }
    /* Oyun başlayınca panel tam ekrana o anda geçiyor; ölçü yerleşim
       oturduktan sonra alınıyor (kapalı panelde ölçü yok, ayar kendini
       iptal eder). */
    function sonra(key) {
        requestAnimationFrame(function () { requestAnimationFrame(function () { hafizaSigdir(key); }); });
        setTimeout(function () { hafizaSigdir(key); }, 300);
    }
    var asil = window.initMemoryGrid;
    if (typeof asil === 'function') {
        window.initMemoryGrid = function (key) {
            var r = asil.apply(this, arguments);
            try { sonra(key); } catch (e) { }
            return r;
        };
    }
    var z = null;
    window.addEventListener('resize', function () {
        clearTimeout(z);
        z = setTimeout(function () {
            [].forEach.call(document.querySelectorAll('.thematic-words-grid.memory-mode'), function (g) {
                if (g.id) hafizaSigdir(g.id.replace(/^grid-/, ''));
            });
        }, 200);
    });
})();
</script>
<script>
/* ---- GERİ DÖNÜŞ ----
   donus=tablo        → kalıplar tablosuna
   liste=ih-N…        → index'te İmam Hatip, o sınıf açık (kalınan yer)
   ötekiler           → index'te Öğretmen Özel bölümü               */
/* ÇOK DİLLİ SİTE (15.10.2026) — kodun yazdığı yazılar seçilen dilde.
   Yazı sistem/dil.js sözlüğünden gelir; dil Türkçeyse, sözlük henüz
   yüklenmemişse ya da çeviri yoksa Türkçesi kalır.
     kdMetin(anahtar, türkçe, {ad: değer})  yazıyı verir, {…} yerlerini doldurur
     kdYaz(öğe, anahtar, türkçe, {…})        öğeye anahtarıyla yazar; sözlük sonradan
                                             yüklense de dil değişse de yazı döner
     kdIsaretli(anahtar, türkçe)             innerHTML içine konacak işaretli <span>
     kdSerbest(öğe)                          öğenin işaretini kaldırır (kod oraya her
                                             an başka yazı yazıyorsa)
     kdDil()                                 sayfanın o anki dili */
function kdDoldur(m, yer) {
    if (!yer || m == null) return m;
    return String(m).replace(/\{([A-Za-z0-9_]+)\}/g, function (t, ad) {
        return Object.prototype.hasOwnProperty.call(yer, ad) ? String(yer[ad]) : t;
    });
}
function kdMetin(k, tr, yer) {
    var m = (window.KidefDil && window.KidefDil.metin) ? window.KidefDil.metin(k, tr) : tr;
    return kdDoldur(m, yer);
}
function kdYaz(el, k, tr, yer) {
    if (!el) return;
    if (window.KidefDil && window.KidefDil.yaz) { window.KidefDil.yaz(el, k, tr, yer); return; }
    el.setAttribute('data-i18n', k);
    el.setAttribute('data-i18n-tr', tr);
    if (yer) el.setAttribute('data-i18n-yer', JSON.stringify(yer)); else el.removeAttribute('data-i18n-yer');
    el.textContent = kdDoldur(tr, yer);
}
function kdIsaretli(k, tr) {
    var e = function (x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };
    return '<span data-i18n="' + k + '" data-i18n-tr="' + e(tr) + '">' + e(kdMetin(k, tr)) + '</span>';
}
function kdSerbest(el) {
    if (el && el.removeAttribute) el.removeAttribute('data-i18n');
    return el;
}
function kdDil() {
    return document.documentElement.getAttribute('lang') || 'tr';
}
function kdHedef() {
    var p = new URLSearchParams(location.search);
    if (p.get('donus') === 'tablo') return { url: 'kaliplartablosu.html', ad: 'Kalıplar Tablosu', k: 'kt.ad' };
    var l = p.get('liste') || '';
    var m = /^ih-(\d+)/.exec(l);
    if (m) return { url: 'index.html?ihsinif=' + m[1] + '#imam-hatip', ad: m[1] + '. Sınıf', k: 'sin.' + m[1] };
    return { url: 'index.html#ogretmen-ozel', ad: 'Ana Sayfa', k: 'nav.anasayfa' };
}
/* ÇIKIŞTA SEKMEYİ KAPAT. Bu sayfa index'ten YENİ SEKMEDE açılıyor;
   geri gitmek yerine yönlendirince ikinci bir index açılıyordu ve
   ilkindeki (İmam Hatip sınıfı gibi) durum boşa gidiyordu. Sekme
   kapatılamıyorsa — adres çubuğundan açılmış ya da kalıplar
   tablosundan aynı sekmede gelinmişse — eski davranış sürüyor. */
function kdGeri() {
    var h = kdHedef();
    if (window.opener && !window.opener.closed) {
        try { window.opener.focus(); } catch (e) { }
        window.close();
        /* close() engellendiyse hâlâ buradayız: yönlendirerek çık. */
        setTimeout(function () { location.href = h.url; }, 200);
        return;
    }
    location.href = h.url;
}
(function () {
    var h = kdHedef();
    var y = document.getElementById('kd-geri-yazi');
    if (y) kdYaz(y, h.k, h.ad);
    /* İmam Hatip kipinde alt başlık sınıfı söylesin */
    var m = /^ih-(\d+)/.exec(new URLSearchParams(location.search).get('liste') || '');
    var alt = document.getElementById('kd-alt');
    if (m && alt) kdYaz(alt, 'kl.alt_sinif', '{n}. Sınıf müfredatı — ünite ve ders listeleri', { n: m[1] });
    /* İmam Hatip kipi kendi açılışını yapıyor; öteki girişlerde listeyi
       burada çiziyoruz. */
    if (!m && typeof renderThematicLists === 'function') renderThematicLists();
})();
/* Motor tablo sayfasında bu ikisini kaplamayı açıp kapatmak için
   çağırıyor; burada sayfa zaten liste, ikisi de zararsızlaşıyor. */
window.showThematicView = window.showThematicView || function () {};
window.openVerbModal = function () { if (typeof renderThematicLists === 'function') renderThematicLists(); };
window.closeVerbModal = function () { kdGeri(); };
/* Esc = geri. AMA test açıkken Esc önce TESTTEN çıkarır, sayfadan değil;
   yoksa oyunun ortasında tuşa basan doğrudan ana sayfaya düşüyordu.
   Testten çıkışı sarf/kelimetest.js'in kendi dinleyicisi yapıyor. */
document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (window.KidefKelimeTest && KidefKelimeTest.acikVar && KidefKelimeTest.acikVar()) return;
    kdGeri();
});
</script>
