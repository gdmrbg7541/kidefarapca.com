<html lang="tr">
<head>

<body>
<div id="game-wrapper">
    <button id="fullscreen-btn" title="Tam Ekran">
        <svg class="icon-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M5 10h2V7h3V5H5v5zM14 5v2h3v3h2V5h-5zM5 19v-5h2v3h3v2H5zM14 19v-2h3v-3h2v5h-5z"/>
        </svg>
        <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
        </svg>
    </button>

    <div class="screen active" id="start-screen">
        <div class="back-button-container">
            <a href="index.html" onclick="return kidefGeriDon(event)" class="back-button" title="Siteye Dön" data-kidef-done="1">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </a>
        </div>

        <div class="start-options">
            <div class="option-group">
                <label for="player-select">Oyuncu Sayısı:</label>
                <div class="player-buttons" id="player-select">
                    <button class="player-button" data-players="1">Tek Kişilik</button>
                    <button class="player-button" data-players="2">İki Kişilik</button>
                </div>
            </div>
            <div class="option-group">
                <label for="lesson-select">Ders Seçimi:</label>
                <select id="lesson-select" disabled required>
                    <option value="" disabled selected>Önce Oyuncu Modu Seçin</option>
                </select>
            </div>
            <button disabled id="start-game-btn">Başla</button>
        </div>
    </div>

    <div class="screen" id="quiz-screen">
        <div class="back-button-container">
            <button class="back-button" id="quiz-back-btn" title="Ana Menüye Dön">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="screen results-screen" id="results-screen"></div>
</div>

<script src="gorevkopru.js?v=2"></script>
    <script src="testkapismasi.js?v=7"></script>
    <script src="geri.js"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
</html>
