<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arapça Simultane & Diyalog 7.1</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FV9JD15KLW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FV9JD15KLW');
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;300&family=Amiri:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="simultane_7_1.css">
</head>
<body>

<div id="keyboard-overlay" class="keyboard-overlay">
    <div class="keyboard-container" dir="rtl">
        <div onclick="closeKeyboard()" style="position: absolute; top: 10px; right: 15px; color: #fff; font-size: 1.5rem; cursor: pointer; font-weight: bold; padding: 5px 10px; background: #444; border-radius: 5px;">✕</div>
        <div id="temp-root-display"></div>
        <div class="keyboard-inner">
            <div class="kb-row">
                <div class="key" onclick="addLetter('ذ')">ذ</div>
                <div class="key" onclick="addLetter('ض')">ض</div>
                <div class="key" onclick="addLetter('ص')">ص</div>
                <div class="key" onclick="addLetter('ث')">ث</div>
                <div class="key" onclick="addLetter('ق')">ق</div>
                <div class="key" onclick="addLetter('ف')">ف</div>
                <div class="key" onclick="addLetter('غ')">غ</div>
                <div class="key" onclick="addLetter('ع')">ع</div>
                <div class="key" onclick="addLetter('ه')">ه</div>
                <div class="key" onclick="addLetter('خ')">خ</div>
                <div class="key" onclick="addLetter('ح')">ح</div>
                <div class="key" onclick="addLetter('ج')">ج</div>
                <div class="key" onclick="addLetter('د')">د</div>
            </div>
            <div class="kb-row">
                <div class="key" onclick="addLetter('ش')">ش</div>
                <div class="key" onclick="addLetter('س')">س</div>
                <div class="key" onclick="addLetter('ي')">ي</div>
                <div class="key" onclick="addLetter('ب')">ب</div>
                <div class="key" onclick="addLetter('ل')">ل</div>
                <div class="key" onclick="addLetter('ا')">ا</div>
                <div class="key" onclick="addLetter('ت')">ت</div>
                <div class="key" onclick="addLetter('ن')">ن</div>
                <div class="key" onclick="addLetter('م')">م</div>
                <div class="key" onclick="addLetter('ك')">ك</div>
                <div class="key" onclick="addLetter('ط')">ط</div>
            </div>
            <div class="kb-row">
                <div class="key" onclick="addLetter('ئ')">ئ</div>
                <div class="key" onclick="addLetter('ء')">ء</div>
                <div class="key" onclick="addLetter('ؤ')">ؤ</div>
                <div class="key" onclick="addLetter('ر')">ر</div>
                <div class="key" onclick="addLetter('ى')">ى</div>
                <div class="key" onclick="addLetter('ة')">ة</div>
                <div class="key" onclick="addLetter('و')">و</div>
                <div class="key" onclick="addLetter('ز')">ز</div>
                <div class="key" onclick="addLetter('ظ')">ظ</div>
                <div class="key" onclick="addLetter('لا')">لا</div>
                <div class="key key-special" onclick="handleBackspace()" style="min-width: 80px; background: #600;">⌫</div>
            </div>
        </div>
    </div>
</div>

<div id="popup-overlay" class="overlay" onclick="closePopup(event)">
    <div class="popup" onclick="event.stopPropagation()">
        <div class="popup-header">
            <h2 id="popup-title">Bilgi Paneli</h2>
            <button class="close-popup" onclick="togglePopup(false)">×</button>
        </div>
        <div id="popup-content" class="popup-body"></div>
    </div>
</div>

<div id="entry-panel">
    <button class="entry-back-btn" onclick="window.location.href='muhadese.html'">❮</button>
    <h1 style="color:var(--pdf-red); font-size: 3rem; margin-bottom: 20px;">ARAPÇA PRATİK</h1>
    <button class="mode-btn" onclick="startMode('sentence')">CÜMLE PRATİĞİ</button>
    <button class="mode-btn" onclick="startMode('dialog')">DİYALOG PRATİĞİ</button>
</div>

<nav class="navbar">
    <button class="back-btn" onclick="goHome()">❮</button>

    <div class="pdf-links">
        <button class="nav-trigger" onclick="showPopup('prepositions')">Harfler</button>
        <button class="nav-trigger" onclick="showPopup('soruedatlari')">Edatlar & Zarflar</button>
        <button class="nav-trigger" onclick="showPopup('pronouns')">Zamirler</button>
        <button class="nav-trigger" onclick="showPopup('suffix')">Fiil Kipleri</button>
        <button class="nav-trigger" onclick="showPopup('tamlamalar')">Tamlamalar</button>
        <button class="nav-trigger" onclick="showPopup('mezid')">3+</button>
    </div>

    <div class="switch-wrapper">
        <span class="switch-text active-lang" id="lang-tr">TR</span>
        <label class="switch">
            <input type="checkbox" id="direction-toggle" onchange="toggleDirection()">
            <span class="slider"></span>
        </label>
        <span class="switch-text" id="lang-ar">AR</span>
    </div>
</nav>

<main class="workspace">
    <div id="sentence-mode">
        <div id="s-tr" class="tr-container"></div>
        <div id="s-ar" class="ar-output"></div>
    </div>
    <div id="dialog-mode">
        <div class="dialog-row p1-row" id="p1-area">
            <div id="p1-tr" class="tr-container"></div>
            <div id="p1-ar" class="ar-output"></div>
        </div>
        <div class="dialog-row p2-row" id="p2-area">
            <div id="p2-tr" class="tr-container"></div>
            <div id="p2-ar" class="ar-output"></div>
        </div>
    </div>
</main>

<div class="controls">
    <button class="nav-btn" onclick="changeSentence(-1)">
        <span>❮</span> Geri
    </button>
    <button id="next-btn" class="nav-btn" onclick="changeSentence(1)">
        İleri <span>❯</span>
    </button>
</div>

<script src="simultane_7_2.js"></script>
</body>
</html>
