        <div class="header-navigation"><button class="back-btn" data-i18n-title="nav.anasayfa_don" title="Ana sayfaya dön" onclick="kidefGeriIndex()"><svg viewBox="0 0 24 24"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"></path></svg></button></div>
        <script>
        /* kidefarapca.com: bu sayfa index'ten YENI SEKMEDE acilir (target="_blank"
           rel="opener"); yeni sekmenin gecmisi olmadigi icin history.back() calismaz.
           Ilk ekrandaki geri tusu: index sekmesine odaklan ve BU SEKMEYI KAPAT;
           kapatmaya izin verilmezse / dogrudan acildiysa index.html'e don. */
        function kidefGeriIndex(){
            try{
                if (window.opener && !window.opener.closed){
                    try{ window.opener.focus(); }catch(e){}
                    window.close();
                    setTimeout(function(){ if(!window.closed) location.href='index.html'; }, 250);
                    return;
                }
            }catch(e){}
            location.href='index.html';
        }
        </script>

        </div>

<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
