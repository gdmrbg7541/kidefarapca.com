<!-- Bu sayfa sarf motorunun "tek oyun" kipidir: body üzerindeki

<div class="floating-emojis">

    <span class="fe-3">🖼️</span>

<!-- Menü yok: ekranlar sarf.js tarafından yönetilir, oyun 1 doğrudan açılır.
     Boş main'ler sarf.js'in ekran listesiyle uyum için duruyor. -->
<main class="screen" id="start-screen"></main>
<main class="screen" id="game1-screen"></main>
<main class="screen" id="game2-screen"></main>
<main class="screen" id="game3-screen"></main>

        <div class="emoji" id="done-emoji">🎉</div>
        <h2 id="done-text">أَحْسَنْتَ!</h2>
        <div class="done-buttons">
            <button class="btn-primary" id="done-replay">مِنْ جَدِيدٍ 🔄</button>
            <button class="btn-secondary" id="done-menu">الْقَائِمَةُ ↩</button>
        </div>
    </div>
</div>

<!-- Kök verisi merkezî dosyalardan gelir (sarf.html ile aynı). -->
<script src="veri/veri_vezin_numaralari.js"></script>

     sarf.js'ten ONCE yuklenmeli; yuklenmezse sayfa eskisi gibi calisir. -->
<script src="veri/veri_kok_numaralari.js?v=132"></script>
<script src="sarf/sarf.js?v=125"></script>
<script src="sistem/geri.js?v=20260808a"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
