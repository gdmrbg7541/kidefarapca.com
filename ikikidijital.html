    <script>
      // Geri butonu: oyun ekranındaysa menüye (intro) dön; menüdeyse index'e (yoksa siteye)
      function ikikiGeri(e){
        var arena = document.getElementById('screen-arena');
        if (arena && arena.classList.contains('active')) {
          if (typeof exitArena === 'function') exitArena();
          if (e && e.preventDefault) e.preventDefault();
          return false;
        }
        return (typeof kidefGeriDon === 'function') ? kidefGeriDon(e) : true;
      }
    </script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
