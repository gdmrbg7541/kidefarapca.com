<html lang="tr">
<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>

      
        :root {
            --pdf-red: #b30b00;
            --pdf-dark: #8b0000;
            --p1-color: #2563eb; 
            --p2-color: #059669; 
            --bg-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
    font-family: 'Inter', sans-serif; 
    background: var(--bg-color); 
    /* Mobil tarayıcı çubukları için dvh kullanımı: */
    height: 100vh; /* Eski tarayıcılar için yedek */
    height: 100dvh; /* Modern mobil tarayıcılar için tam uyum */
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
}

        /* Üst Bar */
       .navbar { 
    display: none; /* Başlangıçta gizle */
    background: var(--pdf-red); 
    min-height: 60px; 
    align-items: center; 
    padding: 5px 15px; 
    z-index: 3000; 
}
        .back-btn { background: var(--pdf-dark); color: white; text-decoration: none; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-weight: normal; cursor: pointer; border: none; font-size: 1.5rem; }
        .pdf-links { display: flex; gap: 10px; overflow-x: auto; flex-grow: 1; justify-content: center; }
        .pdf-links::-webkit-scrollbar { display: none; }
        .pdf-link, .nav-trigger { color: white; text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 4px; background: rgba(0,0,0,0.2); white-space: nowrap; cursor: pointer; border: none; }

        /* POPUP SİSTEMİ */
       /* Paneli ekranın ortasına değil, navbar'ın hemen altına sabitliyoruz */
.overlay { 
    position: fixed; 
    top: 60px; /* Navbar yüksekliği kadar üstten boşluk */
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 2000; 
    display: none; 
    justify-content: center;
    align-items: flex-start; /* Üstten başlaması için */
}
        .popup-header { background: var(--pdf-red); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .close-popup { background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
        /* POPUP SİSTEMİ GÜNCELLEME */
          .popup { 
    background: rgba(255, 255, 255, 0.52); /* %92 opaklık - Arkası hafif görünür */
    backdrop-filter: blur(5px);
    width: 100%;            
    height: 100vh; /* Ekranın %70'ini kaplasın, alt taraf çalışma alanı kalsın */
    margin: 0; 
    border-radius: 0 0 20px 20px; /* Sadece alt köşeler yuvarlak */
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
    position: relative; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* İçerik alanını biraz daha genişletelim */
.popup-body { 
    flex: 1; 
    padding: 15px; 
    overflow-y: auto; 
}
/* PDF iframe'inin kutuyu tam kaplamaya devam etmesi için */
#popup-content iframe {
    width: 100% !important;
    height: 100% !important;
    border: none;
    flex: 1; /* Esnemeyi sağlar */
}
        

        /* Tablo Stilleri */
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f8fafc; font-weight: normal; }
       .ar-txt { 
    font-family: 'IBM Plex Sans Arabic', sans-serif; 
    font-size: 1.3rem; 
    direction: rtl;
    line-height: 1.6; /* Harf çıkıntıları için alan açar */
}

        /* Kelimeler Özel Bölümü */
        .verbs-col { flex: 2; border-right: 2px solid #eee; padding-right: 15px; }
        .nouns-col { flex: 1; }

        /* Giriş Paneli */
        #entry-panel { position: fixed; inset: 0; background: white; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
        .mode-btn { width: 350px; padding: 50px 20px; border-radius: 25px; border: 4px solid var(--pdf-red); background: white; color: var(--pdf-red); font-size: 2rem; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .mode-btn:hover { background: var(--pdf-red); color: white; transform: scale(1.05); }

        /* Çalışma Alanı Hizalama */
        .workspace { 
    flex: 1; /* Kalan tüm boşluğu kapla */
    display: flex; 
    flex-direction: column; 
    padding: 10px; 
    gap: 10px; 
    /* Sabit yükseklik yerine kaydırma özelliği veriyoruz */
    overflow-y: auto; 
    width: 100%;
}
        #sentence-mode { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; }
        .tr-container { display: flex; flex-wrap: wrap; gap: 30px; margin-bottom: 40px; justify-content: center; width: 100%; }
       .ar-output { 
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    font-size: 1.3rem;
    direction: rtl; 
    display: block; /* Flex yerine block kullanarak kelime akışını doğal bırakıyoruz */
    text-align: center;
    width: 100%; 
    min-height: 1.2em;
}

.ar-output span {
    display: inline-block;
    margin-left: 8px; /* Kelimeler arası boşluk */
}

        #sentence-mode .word { font-size: clamp(2.5rem, 6vw, 6rem); font-weight: 500; cursor: pointer; transition: 0.2s; }
        #sentence-mode .ar-output { font-size: clamp(2.5rem, 6vw, 6rem); color: #1e293b; margin-top: 10px; }

        #dialog-mode { display: none; flex-direction: column; height: 100%; gap: 15px; }
        .dialog-row { flex: 1; display: flex; flex-direction: column; border-radius: 20px; padding: 20px; justify-content: center; align-items: center; }
        .p1-row { background: #f0f7ff; border: 3px solid var(--p1-color); }
        .p2-row { background: #ecfdf5; border: 3px solid var(--p2-color); }
        #dialog-mode .word { font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 400; }
        #dialog-mode .ar-output { font-size: clamp(2rem, 4vw, 3.2rem); margin-top: 20px; }

        .passive { color: #e2e8f0; pointer-events: none; }
        .active { color: #000; transform: scale(1.1); animation: bounce 1.2s infinite; }
        .completed { color: var(--pdf-red); }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .controls { 
    display: flex; 
    justify-content: center; 
    gap: 40px; 
    padding: 20px; 
    background: #f8fafc; 
    border-top: 2px solid #eee;
    flex-shrink: 0; /* Bu alanın sıkışmasını engeller */
    /* iPhone alt çubuğu için güvenli boşluk: */
    padding-bottom: max(20px, env(safe-area-inset-bottom)); 
}
        .nav-btn { padding: 15px 40px; border-radius: 40px; border: 3px solid var(--pdf-red); background: white; color: var(--pdf-red); font-weight: 900; cursor: pointer; font-size: 1.2rem; }

        .entry-back-btn { position: absolute; top: 15px; left: 15px; background: var(--pdf-dark); color: white; width: 45px; height: 45px; border-radius: 50%; border: none; font-size: 1.5rem; cursor: pointer; }

.word.active {
    border: 2.5px solid #64748b !important;
    transform: scale(1.05);
    color: #475569 !important; /* Sırası geldiğinde biraz daha koyu gri */
}
.word.completed {
    background-color: transparent !important;
    font-weight: normal;
    transform: scale(1);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
   
.word.passive, .word.active {
    background-color: transparent !important;
    color: #94a3b8 !important;            /* Gri yazı rengi */
    border: none !important;
}
/* --- GENİŞLETİLMİŞ MOBİL YAMA (Giriş, Popup, Tablolar) --- */
@media screen and (max-width: 768px), 
       screen and (orientation: landscape) and (max-height: 600px) {

    /* 1. GİRİŞ SAYFASI (Entry Panel) */
    #entry-panel {
        padding: 10px !important;
        gap: 15px !important; /* Öğeler arası boşluğu azalt */
    }
    
    #entry-panel h1 {
        font-size: 1.8rem !important; /* Başlığı küçült */
        margin-bottom: 10px !important;
    }

    .mode-btn {
        width: 90% !important; /* Ekranı tam kaplamasın */
        padding: 15px !important; /* Buton şişkinliğini al */
        font-size: 1.2rem !important; /* Buton yazısını küçült */
        border-width: 3px !important;
    }
    
    .entry-back-btn {
        width: 35px !important;
        height: 35px !important;
        font-size: 1rem !important;
        top: 10px !important;
        left: 10px !important;
    }

    /* 2. POPUP PENCERESİ */
    .popup-header {
        padding: 8px 15px !important; /* Başlık alanını daralt */
        min-height: 45px !important;
    }

    .popup-header h2 {
        font-size: 1.1rem !important; /* Başlık fontunu küçült */
    }

    .close-popup {
        font-size: 1.8rem !important;
        line-height: 1 !important;
    }

    /* 3. TABLOLAR VE İÇERİK */
    /* Tablo hücre boşluklarını sıkıştır */
    th, td {
        padding: 4px !important; 
        font-size: 0.85rem !important; /* Türkçe metinleri küçült */
    }

    /* HTML içinde 'style="font-size:2.2rem"' gibi verilen inline stilleri EZMEK için: */
    /* Tablo içindeki Arapça yazılar */
    .popup-body .ar-txt, 
    .popup-body span[style*="font-size"] { 
        font-size: 1.3rem !important; /* Hepsini standart boyuta getir */
        line-height: 1.3 !important;
    }
    
    /* Tablo altındaki küçük açıklamalar (Hastalar, Doktorlar vb.) */
    .popup-body small {
        font-size: 0.65rem !important;
        color: #555 !important;
    }

    /* Popup içindeki başlıklar (H3) */
    .popup-body h3 {
        font-size: 1.1rem !important;
        margin: 10px 0 5px 0 !important;
        padding-bottom: 5px !important;
    }
    
    /* Yan yana duran (flex) kutuları alt alta al veya sıkıştır */
    .popup-body > div[style*="display: flex"] {
        flex-direction: column-reverse !important; /* Mobilde alt alta olsun */
        gap: 15px !important;
    }
    
    /* Sütun çizgilerini düzelt */
    .verbs-col, .nouns-col {
        border: none !important; /* Dikey çizgiyi kaldır */
        border-bottom: 2px solid #eee !important; /* Yatay çizgi ekle */
        padding: 0 !important;
    }
}
/* --- YAMA SONU --- */
/* Kelime Paneli Yan Yana Dizilim ve Kaydırma */
.words-container {
    display: flex !important;
    flex-direction: row-reverse !important;
    gap: 20px !important;
    width: 100% !important;
    /* Mobilde dikey kaydırmayı ana kapsayıcıya veriyoruz */
    height: auto !important; 
    max-height: 85vh !important;
    overflow-y: auto !important; 
    overflow-x: auto !important;
    padding: 10px !important;
    -webkit-overflow-scrolling: touch;
}
.words-container .verbs-col, 
.words-container .nouns-col {
    min-width: 320px !important; /* Mobilde sütun genişliği */
    flex-shrink: 0 !important;
    display: block !important; /* Flex dikeyde sorun çıkarabilir, block daha güvenli */
}

/* Tablo içindeki ekstra kaydırma alanlarını iptal edin (çakışmayı önler) */
.words-container div[style*="overflow-y: auto"] {
    overflow-y: visible !important;
    height: auto !important;
}

/* Mobil için özel dikey yükseklik ayarı */
@media screen and (max-width: 768px) {
    .words-container {
        max-height: 75vh !important;
    }
}
/* Mobil Cihazlar İçin Yazı Boyutu Düzenlemesi */
@media screen and (max-width: 768px) {
    /* Cümle Modu Ayarları */
    #sentence-mode .word { 
        font-size: 1.5rem !important; /* Türkçe kelimeleri küçültür */
    }
    #sentence-mode .ar-output { 
        font-size: 2.2rem !important; /* Arapça cümleyi küçültür */
    }

    /* Diyalog Modu Ayarları */
    #dialog-mode .word { 
        font-size: 1.2rem !important; /* Diyalogdaki Türkçe kelimeler */
    }
    #dialog-mode .ar-output { 
        font-size: 1.8rem !important; /* Diyalogdaki Arapça cümleler */
    }
    
    /* Satır aralarını ve kutu boşluklarını daraltma */
    .dialog-row {
        padding: 10px !important;
        gap: 5px !important;
    }
    .tr-container {
        gap: 10px !important;
        margin-bottom: 15px !important;
    }
}
/* Popup açıkken kontrolleri tamamen yok eden yardımcı sınıf */
.controls-hidden {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
}
/* Popup açıkken butonları tamamen devre dışı bırakan kilit sınıfı */
.force-hide {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
}
/* Mobil Kontrol Butonları Düzenlemesi */
@media screen and (max-width: 768px) {
    .controls {
        gap: 15px !important; /* Butonlar arası boşluğu azaltır */
        padding: 10px !important; /* Alt panelin yüksekliğini daraltır */
    }

    .nav-btn {
        padding: 10px 20px !important; /* Butonun iç boşluğunu küçültür */
        font-size: 0.9rem !important; /* Yazı boyutunu küçültür */
        border-width: 2px !important; /* Çerçeveyi inceltir */
        border-radius: 25px !important; /* Köşeleri daha oval yapar */
        min-width: 100px; /* Butonlara minimum genişlik verir */
    }
}

/* Sağ taraftaki switch alanı */
.switch-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    margin-left: 20px; /* Diğer butonlarla arasına boşluk */
}

/* Switch (Toggle) Tasarımı */
.switch {
    position: relative;
    display: inline-block;
    width: 54px;
    height: 28px;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: var(--p1-color); /* TR tarafı mavi */
    transition: .4s;
    border-radius: 34px;
    border: 1px solid rgba(255,255,255,0.2);
}

.slider:before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    left: 4px;
    bottom: 3px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
}

input:checked + .slider {
    background-color: var(--p2-color); /* AR tarafı yeşil */
}

input:checked + .slider:before {
    transform: translateX(26px);
}

.switch-text {
    color: white;
    font-size: 13px;
    font-weight: 800;
    opacity: 0.6;
    transition: 0.3s;
}

/* Aktif olan dil parlasın */
.switch-text.active-lang {
    opacity: 1;
    text-shadow: 0 0 8px rgba(255,255,255,0.8);
}

/* Ateş ve Kıvılcım Parlama Animasyonu */
@keyframes tr-fire-glow {
    0% { box-shadow: 0 0 8px #ff4500, 0 0 15px #ff8c00; transform: scale(1); }
    50% { box-shadow: 0 0 20px #ff4500, 0 0 35px #ff0000, 0 0 10px #fff700; transform: scale(1.05); }
    100% { box-shadow: 0 0 8px #ff4500, 0 0 15px #ff8c00; transform: scale(1); }
}

/* Sayfa açıldığında ve TR aktifken slider (yuvarlak tuş) */
.fire-mode .slider:before {
    content: "🔥" !important; /* İçine emoji ekler */
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    animation: tr-fire-glow 0.7s infinite alternate;
    background-color: #ff4500 !important;
}

/* TR Yazısı için kıvılcım rengi */
.fire-mode #lang-tr {
    color: white !important; /* Artık hep beyaz */
    text-shadow: 0 0 10px #ff8c00, 2px 2px 5px rgba(0,0,0,0.3);
    font-weight: bold;
    position: relative;
}

/* TR yanına küçük bir emoji eklemek isterseniz */
.fire-mode #lang-tr::after {
    content: "✨";
    font-size: 10px;
    position: absolute;
    top: -5px;
    right: -10px;
}

/* Navbar Genel Yapısı */
.navbar {
    background-color: var(--pdf-red) !important; /* Mevcut kırmızı değişkeniniz */
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    padding: 12px 20px;
    border-bottom: 2px solid var(--pdf-dark);
}

/* Navbar İçindeki Butonlar */
.nav-trigger {
    background: rgba(255, 255, 255, 0.1) !important; /* Hafif transparan beyaz */
    border: 1px solid rgba(255, 255, 255, 0.2) !important;
    color: white !important;
    border-radius: 8px;
    padding: 8px 15px;
    font-weight: 500;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) !important;
}

/* Butonun Üzerine Gelince (Hover) */
.nav-trigger:hover {
    background-color: white !important; /* Arka plan beyaza döner */
    color: var(--pdf-red) !important; /* Yazı kırmızıya döner */
    transform: translateY(-3px); /* Hafif yukarı zıplar */
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3); /* Gölgesi derinleşir */
}

/* Geri Butonu (❮) */
.back-btn {
    background: white !important;
    color: var(--pdf-red) !important;
    border-radius: 50% !important;
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
}

.back-btn:hover {
    transform: scale(1.1) translateX(-3px);
    background-color: #f0f0f0 !important;
}

/* Kaydırılabilir Link Alanı (Mobilde rahatlık sağlar) */
.pdf-links {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 5px 0;
    scrollbar-width: none; /* Scroll barı gizler */
}
.pdf-links::-webkit-scrollbar {
    display: none;
}

/* İleri-Geri Buton Grubu Konteynırı */
.controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
}

/* Genel Buton Tasarımı */
.nav-btn {
    background-color: #f8f9fa;
    border: 2px solid #dee2e6;
    color: #495057;
    padding: 12px 25px;
    border-radius: 50px; /* Oval yapı */
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}

/* Hover Efekti */
.nav-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    background-color: #fff;
    border-color: var(--pdf-red);
    color: var(--pdf-red);
}

/* Cümle Bittiğinde İleri Butonu Vurgusu */
.highlight-next {
    background-color: var(--pdf-red) !important;
    color: white !important;
    border-color: var(--pdf-dark) !important;
    animation: pulse-red 1.5s infinite;
    transform: scale(1.1);
}

@keyframes pulse-red {
    0% { box-shadow: 0 0 0 0 rgba(179, 11, 0, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(179, 11, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(179, 11, 0, 0); }
}

 </style>

<body>

<div id="popup-overlay" class="overlay" onclick="closePopup(event)">
    <div class="popup" onclick="event.stopPropagation()">
        <div class="popup-header">
            <h2 id="popup-title">Bilgi Paneli</h2>
            <button class="close-popup" onclick="togglePopup(false)">×</button>
        </div>
        <div id="popup-content" class="popup-body">
            </div>
    </div>
</div>

<div id="entry-panel">
    <button class="entry-back-btn" onclick="window.location.href='muhadese.html'">❮</button>
    <h1 style="color:var(--pdf-red); font-size: 3rem; margin-bottom: 20px;">ARAPÇA PRATİK</h1>
    <button class="mode-btn" onclick="startMode('sentence')">CÜMLE PRATİĞİ</button>
    <button class="mode-btn" onclick="startMode('dialog')">DİYALOG PRATİĞİ</button>
</div>

<nav class="navbar">
    <button class="back-btn" onclick="goHome()">❮</button>

    <div class="pdf-links">
        <button class="nav-trigger" onclick="showPopup('words')">Konu Kelimeleri</button> 
        <button class="nav-trigger" onclick="showPopup('prepositions')">Harfler</button>
        <button class="nav-trigger" onclick="showPopup('soruedatlari')">Edatlar & Zarflar</button>
        <button class="nav-trigger" onclick="showPopup('pronouns')">Zamirler</button>
        <button class="nav-trigger" onclick="showPopup('suffix')">Fiil Kipleri</button>
        <button class="nav-trigger" onclick="showPopup('tamlamalar')">Tamlamalar</button>
        <button class="nav-trigger" onclick="showPopup('sulasi')">3</button>
        <button class="nav-trigger" onclick="showPopup('mezid')">+3</button>
    </div>

    <div class="switch-wrapper">
        <span class="switch-text active-lang" id="lang-tr">TR</span>
        <label class="switch">
            <input type="checkbox" id="direction-toggle" onchange="toggleDirection()">
            <span class="slider"></span>
        </label>
        <span class="switch-text" id="lang-ar">AR</span>
    </div>
</nav>

function showPopup(type) {
    const titles = { 
        words: 'Kelime Listesi', 
        prepositions: 'Harf-i Cerler', 
        soruedatlari: 'Soru Edatları', 
        pronouns: 'Zamir Tablosu',

        mezid: 'Mezid' 
    };

    const content = popupData[type];
    if (content) {
        const popupBody = document.getElementById('popup-content');
        
        // İçeriği yerleştiriyoruz
        popupBody.innerHTML = content;
        document.getElementById('popup-title').innerText = titles[type] || 'Bilgi Paneli';
        
        // --- KAYDIRMA SIFIRLAMA (EKLEME) ---
        // Popup ana gövdesini en yukarı çek
        popupBody.scrollTop = 0; 
        
        // Eğer "Kelime Listesi" açıldıysa, içindeki özel kapsayıcıyı da en yukarı çek
        const wordsContainer = popupBody.querySelector('.words-container');
        if (wordsContainer) {
            wordsContainer.scrollTop = 0;
        }
        // ----------------------------------

        // Paneli aç ve butonları gizle
        togglePopup(true);
        
        // Navigasyon butonunu vurgula
        setActiveButton(type);
    }
}

function togglePopup(show) {
    const overlay = document.getElementById('popup-overlay');
    const controls = document.querySelector('.controls');
    
    // Popup'ı göster/gizle
    overlay.style.display = show ? 'flex' : 'none';
    
    if (controls) {
        if (show) {
            // Popup açıldığında ileri/geri panelini tamamen yok et
            controls.classList.add('controls-hidden');
            controls.style.display = 'none'; 
        } else {
            // Popup kapandığında ileri/geri panelini tekrar göster
            controls.classList.remove('controls-hidden');
            controls.style.display = 'flex'; 
        }
    }
    
    // Kapatma anında üst menüdeki buton vurgularını temizle
    if (!show) {
        document.querySelectorAll('.nav-trigger').forEach(btn => {
            btn.style.border = "none";
            btn.style.boxShadow = "none";
        });
    }
}

function closePopup(e) { 
    // Dış siyah alana (overlay) tıklandığında kapatma işlemini tetikle
    if (e.target.id === 'popup-overlay') {
        togglePopup(false); 
    }
}

function setActiveButton(type) {
    // Tüm butonların stilini sıfırla
    document.querySelectorAll('.nav-trigger').forEach(btn => {
        btn.style.border = "none";
        btn.style.boxShadow = "none";
    });
    
    // Eğer tetikleyici bir event varsa ilgili butonu vurgula
    if (event && event.currentTarget && event.currentTarget.classList.contains('nav-trigger')) {
        event.currentTarget.style.border = "2px solid white";
        event.currentTarget.style.boxShadow = "0 0 10px rgba(255,255,255,0.5)";
    }
}

// --- 1. GLOBAL DEĞİŞKENLER ---
var mode = 'sentence'; 
var currentIdx = 0;
var step = 1;
var pTurn = 1;
var colorCounter = 0;
var currentDirection = 'tr-to-ar'; 

const wordColors = [
    '#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', 
    '#46f0f0', '#f032e6', '#008080', '#e6beff', '#9a6324', 
    '#800000', '#aaffc3', '#808000', '#000075', '#d2691e'
];

// Font Tanımlamaları
const AR_FONT = "'IBM Plex Sans Arabic', sans-serif";
const TR_FONT = "'Inter', sans-serif";

// --- 2. MOD VE NAVİGASYON ---
function startMode(m) {
    if (typeof togglePopup === "function") togglePopup(false); 
    mode = m;
    document.getElementById('entry-panel').style.display = 'none';
    document.querySelector('.navbar').style.display = 'flex';
    document.getElementById('sentence-mode').style.display = (m === 'sentence' ? 'flex' : 'none');
    document.getElementById('dialog-mode').style.display = (m === 'dialog' ? 'flex' : 'none');
    render();
}

function goHome() {
    document.getElementById('entry-panel').style.display = 'flex';
    document.querySelector('.navbar').style.display = 'none';
    currentIdx = 0;
}

// Sayfa yüklendiğinde TR modu varsayılan olduğu için ateşi yak
window.onload = function() {
    // Diğer onload fonksiyonların varsa buraya ekleyebilirsin
    const wrapper = document.querySelector('.switch-wrapper');
    const toggle = document.getElementById('direction-toggle');
    
    if (!toggle.checked) { // Eğer checkbox seçili değilse (yani TR tarafındaysa)
        wrapper.classList.add('fire-mode');
    }
};

function toggleDirection() {
    const toggle = document.getElementById('direction-toggle');
    const wrapper = document.querySelector('.switch-wrapper');
    const langTr = document.getElementById('lang-tr');
    const langAr = document.getElementById('lang-ar');

    if (!toggle.checked) {
        currentDirection = 'tr-to-ar';
        wrapper.classList.add('fire-mode'); // Ateşi yak
        langTr.classList.add('active-lang');
        langAr.classList.remove('active-lang');
    } else {
        currentDirection = 'ar-to-tr';
        wrapper.classList.remove('fire-mode'); // Ateşi söndür
        langAr.classList.add('active-lang');
        langTr.classList.remove('active-lang');
    }

    render();
}

function changeSentence(dir) {
    if (!data[mode]) return;
    currentIdx = (currentIdx + dir + data[mode].length) % data[mode].length;
    render();
}

// --- 3. ANA ÇİZİM (RENDER) ---
function render() {
    step = 1;
    pTurn = 1;
    colorCounter = 0;

    // Yeni cümleye geçince vurguyu kaldır
    const nextBtn = document.getElementById('next-btn');
    if (nextBtn) nextBtn.classList.remove('highlight-next');

    if (mode === 'sentence') {
        renderContent(data.sentence[currentIdx].words, 's-tr', 's-ar');
    } else {
        renderContent(data.dialog[currentIdx].p1, 'p1-tr', 'p1-ar', 1);
        renderContent(data.dialog[currentIdx].p2, 'p2-tr', 'p2-ar', 2);
    }
}

function renderContent(words, trId, arId, playerNum = null) {
    const trCont = document.getElementById(trId);
    const arOutput = document.getElementById(arId);
    if (!trCont || !arOutput) return;

    trCont.innerHTML = '';
    arOutput.innerHTML = '';
    
    let displayWords = [...words];

    if (currentDirection === 'ar-to-tr') {
        displayWords.sort((a, b) => a.order - b.order);
        trCont.style.direction = 'rtl';
        arOutput.style.direction = 'ltr'; 

        words.forEach((_, i) => {
            const slot = document.createElement('span');
            slot.id = `${arId}-slot-${i}`; 
            slot.style.marginRight = "12px";
            slot.style.fontFamily = TR_FONT;
            slot.innerText = ""; 
            arOutput.appendChild(slot);
        });
    } else {
        trCont.style.direction = 'ltr';
        arOutput.style.direction = 'rtl';
    }

    displayWords.forEach((w, index) => {
        const span = document.createElement('span');
        const isActive = (playerNum === null || playerNum === 1) && w.order === 1;
        
        span.className = `word ${isActive ? 'active' : 'passive'}`;
        span.id = `${trId}-item-${index}`;
        span.setAttribute('data-order', w.order);
        span.setAttribute('data-container', trId);
        
        const originalIndex = words.indexOf(w);

        if (currentDirection === 'tr-to-ar') {
            span.innerText = w.tr;
            span.style.fontFamily = TR_FONT;
            span.onclick = () => handleMove(w.order, w.ar, trId, arId, playerNum, -1);
        } else {
            span.innerText = w.ar;
            span.style.fontFamily = AR_FONT;
            span.onclick = () => handleMove(w.order, w.tr, trId, arId, playerNum, originalIndex);
        }
        trCont.appendChild(span);
    });
}

// --- 4. TIKLAMA VE YERLEŞİM (HANDLEMOVE) ---
function handleMove(order, outputText, trId, arId, playerNum, originalIndex) {
    if (order !== step) return;
    
    const allWords = document.querySelectorAll(`[data-container="${trId}"][data-order="${order}"]`);
    if (allWords.length === 0) return;

    const activeColor = wordColors[colorCounter % wordColors.length];

    allWords.forEach(wordEl => {
        wordEl.className = 'word completed';
        wordEl.style.color = activeColor;
        wordEl.style.borderColor = activeColor;
        wordEl.onclick = null;
    });

    if (currentDirection === 'ar-to-tr') {
        const targetSlot = document.getElementById(`${arId}-slot-${originalIndex}`);
        if (targetSlot) {
            targetSlot.innerText = outputText;
            targetSlot.style.color = activeColor;
            targetSlot.style.fontFamily = TR_FONT;
        }
    } else {
        const outArea = document.getElementById(arId);
        if (outArea) {
            outArea.innerHTML += `<span style="color: ${activeColor}; font-family: ${AR_FONT}; margin-left:8px;">${outputText}</span> `;
        }
    }

    step++;
    colorCounter++;
    
    const nextWords = document.querySelectorAll(`[data-container="${trId}"][data-order="${step}"]`);
    if (nextWords.length > 0) {
        nextWords.forEach(next => next.className = 'word active');
    } else if (mode === 'dialog' && playerNum === 1) {
        pTurn = 2; 
        step = 1;
        document.querySelectorAll(`[data-container="p2-tr"][data-order="1"]`).forEach(w => w.className = 'word active');
    }
  // Cümle veya Diyalog bitti mi kontrol et
    let isFinished = false;
    if (mode === 'sentence') {
        if (step > data.sentence[currentIdx].words.length) isFinished = true;
    } else {
        // Diyalog modu: P2'nin de son kelimesi bitti mi?
        if (pTurn === 2 && step > data.dialog[currentIdx].p2.length) isFinished = true;
    }

    if (isFinished) {
        // İleri butonunu bul ve vurgula (HTML'de ID'si 'next-btn' olmalı)
        const nextBtn = document.getElementById('next-btn');
        if (nextBtn) nextBtn.classList.add('highlight-next');
    }
}
