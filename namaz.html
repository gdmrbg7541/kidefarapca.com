<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Zaman ve Zırh Yönetimi | Profesyonel Eğitim Paneli</title>
    <style>
        :root {
            --bg: #f8faff;
            --card-bg: #ffffff;
            --primary: #2d3436;
            --accent: #0984e3;
            --success: #00b894;
            --danger: #d63031;
            --gold: #fdcb6e;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--primary);
            overflow: hidden;
        }

        .container {
            max-width: 1200px;
            height: 90vh;
            margin: auto;
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .nav-header {
            display: flex;
            background: #f1f2f6;
            padding: 10px;
            border-radius: 30px 30px 0 0;
            gap: 10px;
        }

        .nav-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            background: none;
            color: #636e72;
        }

        .nav-btn.active {
            color: var(--accent);
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: none;
        }

        .content.active {
            display: flex;
            flex-direction: column;
        }

        /* --- HİKAYE BÖLÜMÜ (SÜTUNSUZ TAM ORTALI) --- */
        #story {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
        }

        #story.active {
            display: flex !important;
        }

        .slide-text-wrapper {
            width: 100%;
            max-width: 1000px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #slide-box {
            font-size: 2.8rem;
            line-height: 1.5;
            color: #2d3436;
            width: 100%;
            display: block; /* Sütunlaşmayı engellemek için block yapıldı */
        }

        .fade-in {
            animation: fadeInSlide 0.5s ease-in-out;
        }

        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .highlight { color: var(--accent); font-weight: 800; display: inline; }

        /* --- ZAMAN PLANLAYICI --- */
        .planner-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 40px;
            height: 100%;
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .act-card {
            padding: 15px;
            border: 2px solid #f1f2f6;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .act-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #eee !important;
            pointer-events: none;
        }

        .grid-24 {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
        }

        .hour-jeton {
            background: #f1f2f6;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: #b2bec3;
        }

        .hour-jeton.filled { color: white; transform: scale(1.02); }

        /* --- LİSTELER --- */
        .list-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .info-card {
            background: #f8faff;
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .info-card:hover { border-color: var(--accent); }

        .answer, .meal {
            max-height: 0;
            overflow: hidden;
            transition: 0.3s;
            color: var(--success);
            font-size: 1.1rem;
            margin-top: 10px;
            font-weight: bold;
        }

        .footer-controls {
            padding: 15px 40px;
            background: #fff;
            border-top: 2px solid #f1f2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 30px 30px;
        }

        .stats-badge {
            padding: 8px 20px;
            background: #e17055;
            color: white;
            border-radius: 50px;
            font-weight: bold;
        }

        .btn-main {
            padding: 12px 30px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <button class="nav-btn active" onclick="showTab('story')">📖 HİKAYE</button>
        <button class="nav-btn" onclick="showTab('planner')">⏳ ZAMAN YÖNETİMİ</button>
        <button class="nav-btn" onclick="showTab('quiz')">❓ DEĞERLENDİRME</button>
        <button class="nav-btn" onclick="showTab('wisdom')">📜 HİKMET HAZİNESİ</button>
    </div>

    <div id="story" class="content active">
        <div class="slide-text-wrapper">
            <div id="slide-box" class="fade-in">
                </div>
        </div>
        <div style="margin-top: 30px; display: flex; gap: 20px;">
            <button class="btn-main" onclick="changeSlide(-1)" style="background:#b2bec3; width: 140px;">❮ GERİ</button>
            <button class="btn-main" onclick="changeSlide(1)" style="background:var(--accent); width: 140px;">İLERİ ❯</button>
        </div>
    </div>

    <div id="planner" class="content">
        <div class="planner-container">
            <div class="activity-list">
                <div class="act-card" id="act-uyku" onclick="fillTime(8, '#2d3436', 'UYKU', 'act-uyku')"><span>😴 Uyku</span> <span>8 Jeton</span></div>
                <div class="act-card" id="act-okul" onclick="fillTime(6, '#0984e3', 'OKUL', 'act-okul')"><span>📚 Okul / Eğitim</span> <span>6 Jeton</span></div>
                <div class="act-card" id="act-yemek" onclick="fillTime(2, '#00b894', 'YEMEK', 'act-yemek')"><span>🍔 Yemek</span> <span>2 Jeton</span></div>
                <div class="act-card" id="act-bakim" onclick="fillTime(1, '#a29bfe', 'BAKIM', 'act-bakim')"><span>🧼 Kişisel Bakım</span> <span>1 Jeton</span></div>
                <div class="act-card" id="act-oyun" onclick="fillTime(4, '#d63031', 'OYUN', 'act-oyun')"><span>🎮 Oyun / Eğlence</span> <span>4 Jeton</span></div>
                <div class="act-card" id="act-diger" onclick="fillTime(2, '#636e72', 'DİĞER', 'act-diger')"><span>🚌 Yol / Diğer</span> <span>2 Jeton</span></div>
                <div class="act-card" id="act-zirh" style="background:var(--gold); border:none;" onclick="fillTime(1, '#f39c12', 'ZIRH', 'act-zirh')">
                    <span>🛡️ İBADET / ZIRH</span> <span>1 JETON</span>
                </div>
                <button class="btn-main" style="background:#fab1a0; color:#d63031; margin-top:auto;" onclick="resetPlanner()">↺ SIFIRLA</button>
            </div>
            <div class="grid-24" id="jetonGrid"></div>
        </div>
    </div>

    <div id="quiz" class="content">
        <div class="list-container" id="quiz-list"></div>
    </div>

    <div id="wisdom" class="content">
        <div class="list-container" id="wisdom-list"></div>
    </div>

    <div class="footer-controls">
        <div id="footer-status" style="font-size: 1rem; font-weight: 600;">Derse Hoş Geldiniz!</div>
        <div class="stats-badge" id="remainder">24 Jeton Boşta</div>
    </div>
</div>

<script>
    function showTab(tabId) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        if(tabId === 'planner') initGrid();
    }

    const storySlides = [
    // Giriş: 24 Altın Hikayesi
    "👋 Merhaba küçük dostum! Hayal et ki cebinde harcaman için sana verilmiş tam <span class='highlight'>24 altın</span> var. 💰✨",
    "Bir bakkal amca çıkıyor ve diyor ki: 🏪 'Bana bu altınlardan <span class='highlight'>sadece 1 tanesini</span> ver, sana sarayın kapısını açacak <span class='highlight'>sihirli bir bilet</span> vereyim.' 🎫🗝️",
    "Geriye kalan 23 altını dondurmaya 🍦 veya oyunlara 🎮 harcayabilirsin. Ama o 1 saati namaza ayırmak, işte o <span class='highlight'>sihirli bileti</span> almak gibidir. 🕌",
    
    // Neden 5 Vakit? (Günün Renkleri)
    "🌅 <strong>Sabah Namazı:</strong> Güneş doğarken her şey uyanır. <br>Bu, Rabbimize <span class='highlight'>'Yeni gün için teşekkür ederim'</span> demektir. 🐦",
    "☀️ <strong>Öğle Namazı:</strong> Güneş en tepede, işler yoğun. <br>'Dünya işlerinden yoruldum, <span class='highlight'>Senin huzurunda dinlenmeye geldim</span>' molasıdır. 💆‍♂️",
    "🌇 <strong>İkindi Namazı:</strong> Güneş yavaşça batar. <br>Giden güne veda ederken, sonsuz olan <span class='highlight'>Allah'a sığınmaktır.</span> 🤲",
    "🌆 <strong>Akşam Namazı:</strong> Her yer kararır, gün biter. <br>Biz korkmayız, çünkü <span class='highlight'>'Sen varsın, Sen bakisin'</span> deriz. 🕯️",
    "🌌 <strong>Yatsı Namazı:</strong> Herkes uyur, dünya sessizleşir. <br>'Bugünü bitirdim, <span class='highlight'>huzurla uyumaya hazırım</span>' demektir. 😴💤",

 "Karnın zil çalınca 'Of, yine mi yemek yiyeceğim!' der misin? 😋 Asla! En sevdiğin yemeği görünce gözlerin parlar, lezzet alırsın. 🍔🍕",
    "İşte namaz da <span class='highlight'>kalbimizin ve ruhumuzun yemeğidir.</span> 🍯 Bedenin yemekle lezzet alır, ruhun da namazla doyar ve tatlanır! 🍬✨",

    // Nefise İkazlar
    "Bazen canın istemezse şunu hatırla: 🧸 Namaz yük değil, <span class='highlight'>büyük bir rahatlıktır.</span>",
    "Kocaman bir çantayı tek başına taşımak mı 🎒, yoksa onu çok güçlü bir babaya vermek mi? 💪 <br>Namaz, dertleri Allah’a emanet edip <span class='highlight'>hafiflemektir.</span> 🪶",
    "Oyun saatleri uçup gider ⏳ ama namazda geçirdiğin o kısacık zaman, senin için <span class='highlight'>sonsuz bir hazineye</span> dönüşür. 💎✨",

    // Namazın Anlamı ve Kapanış
    "Hareketlerin sırrı: <br>El bağlamak 🧍 <strong>'Huzurundayım'</strong>, Eğilmek 🙇 <strong>'Sen büyüksün'</strong>, Secde ise <strong>'Sana en yakın benim'</strong> demektir. ❤️",
    "Tıpkı bir çiçeğin güneşe dönmesi gibi 🌻, namazla kalbimizi Allah'a açarız. <br>İşte o zaman <span class='highlight'>dünyanın en mutlu çocuğu</span> oluruz. 🥰🎈"
];
    let currentSlide = 0;

    function updateSlide() {
        const slideBox = document.getElementById('slide-box');
        slideBox.classList.remove('fade-in');
        void slideBox.offsetWidth;
        slideBox.classList.add('fade-in');
        slideBox.innerHTML = storySlides[currentSlide];
    }

    function changeSlide(n) {
        let next = currentSlide + n;
        if (next >= 0 && next < storySlides.length) {
            currentSlide = next;
            updateSlide();
        }
    }
    updateSlide();

    let filled = 0;
    function initGrid() {
        const grid = document.getElementById('jetonGrid');
        if(grid.children.length > 0) return;
        for(let i=1; i<=24; i++) {
            let div = document.createElement('div');
            div.className = 'hour-jeton';
            div.innerText = i;
            grid.appendChild(div);
        }
    }

    function fillTime(num, color, label, btnId) {
        const boxes = document.querySelectorAll('.hour-jeton');
        let count = 0;
        for (let box of boxes) {
            if (count < num && !box.classList.contains('filled')) {
                box.classList.add('filled');
                box.style.background = color;
                box.innerText = label;
                box.style.fontSize = "0.8rem";
                count++;
                filled++;
            }
        }
        document.getElementById(btnId).classList.add('disabled');
        updateDisplay();
    }

    function updateDisplay() {
        const rem = 24 - filled;
        document.getElementById('remainder').innerText = rem + " Jeton Boşta";
        const status = document.getElementById('footer-status');
        if(filled >= 24) status.innerHTML = "<span style='color:var(--danger)'>GÜN BİTTİ! Zırhını alabildin mi?</span>";
    }

    function resetPlanner() {
        filled = 0;
        document.getElementById('jetonGrid').innerHTML = '';
        document.querySelectorAll('.act-card').forEach(c => c.classList.remove('disabled'));
        initGrid();
        updateDisplay();
    }

    const questions = [
        ["24 jeton neyi temsil eder?", "Günün 24 saatini."],
        ["1 jeton karşılığı alınan zırh nedir?", "Beş vakit namazdır."],
        ["Namazı plana en son koyarsak ne olur?", "Vakit yetmeyebilir ve zırhsız kalabiliriz."],
        ["Zırhın (namazın) pilleri nasıl dolar?", "Her vakit bağlantı kurarak (namaz kılarak)."],
        ["Sonsuz mutluluk bölgesi neresidir?", "Ebedi hayat olan Cennettir."],
        ["Namaz ağır bir yük müdür?", "Hayır, ruhu dinlendiren bir moladır."],
        ["Namaz için toplam ne kadar vakit gider?", "Günde sadece yaklaşık 1 saat."],
        ["Zırh bizi neden şarj eder?", "Rabbimizle bağ kurmak ruhumuza enerji verir."],
        ["Zırhsız gezmek neden zordur?", "Dertler ve korkular karşısında tek başımıza kalırız."],
        ["Zamanın sahibi kimdir?", "Onu bize her sabah hediye eden Allah'tır."]
    ];

    const wisdoms = [
        ["Bakara Suresi, 45. Ayet", "Sabır ve namazla Allah'tan yardım isteyin."],
        ["Hadis-i Şerif", "Namaz dinin direğidir."],
        ["Hadis-i Şerif", "Kulun Rabbine en yakın olduğu an secde anıdır."],
        ["Hadis-i Şerif", "Namaz gözümün nurudur."],
        ["Ankebut Suresi, 45. Ayet", "Muhakkak ki namaz, hayasızlıktan ve kötülükten alıkoyar."],
        ["Hadis-i Şerif", "Cennetin anahtarı namazdır."]
    ];

    function loadData() {
        const qList = document.getElementById('quiz-list');
        questions.forEach(q => {
            qList.innerHTML += `<div class="info-card" onclick="toggleInfo(this)">
                <b>${q[0]}</b><div class="answer">${q[1]}</div></div>`;
        });
        const wList = document.getElementById('wisdom-list');
        wisdoms.forEach(w => {
            wList.innerHTML += `<div class="info-card" onclick="toggleInfo(this)">
                <b>${w[0]}</b><div class="meal">${w[1]}</div></div>`;
        });
    }

    function toggleInfo(el) {
        const content = el.querySelector('.answer') || el.querySelector('.meal');
        content.style.maxHeight = content.style.maxHeight === '100px' ? '0' : '100px';
    }

    loadData();
</script>
</body>
</html>
