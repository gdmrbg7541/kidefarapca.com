    <link rel="stylesheet" href="namaz.css">
    <style>
      /* Geri (index'e donus) tusu: sitedeki diger sayfalarla ayni desen.
         data-kidef-done="1" sayesinde geri.js buraya ayrica ev (Anasayfa)
         tusu EKLEMEZ; tek geri tusu yeterli. */
      a.back-btn.kidef-siteye{
        position:fixed; top:16px; left:16px; z-index:1000;
        width:44px; height:44px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        background:#fff; color:var(--accent); text-decoration:none;
        box-shadow:0 4px 12px rgba(0,0,0,.15); border:2px solid #e6ecf5;
        transition:all .2s;
      }
      a.back-btn.kidef-siteye:hover{ background:var(--accent); color:#fff; transform:scale(1.08); }
      a.back-btn.kidef-siteye svg{ width:55%; height:55%; fill:currentColor; }
    </style>
    <link rel="stylesheet" href="arakom.css?v=1">
</head>
<body>

<a href="index.html" class="back-btn kidef-siteye" id="start-back-button"
   data-kidef-done="1" onclick="return kidefGeriDon(event)" title="Geri" aria-label="Geri">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
</a>

<div class="container">
    <div class="nav-header">

    </div>

    <div id="story" class="content active">
        <div class="slide-text-wrapper">
            <div id="slide-box" class="fade-in">
                </div>
        </div>

            <button class="btn-main" onclick="changeSlide(-1)" style="background:#b2bec3; width: 140px;">❮ GERİ</button>
            <button class="btn-main" onclick="changeSlide(1)" style="background:var(--accent); width: 140px;">İLERİ ❯</button>
        </div>
    </div>

    <div id="planner" class="content">
        <div class="planner-container">
            <div class="activity-list">
                <div class="act-card" id="act-uyku" onclick="fillTime(7, '#2d3436', 'UYKU', 'act-uyku')">
    <span>😴 Uyku</span> <span>7 Jeton</span>
</div>

<div class="act-card" id="act-okul" onclick="fillTime(7, '#0984e3', 'OKUL', 'act-okul')">
    <span>📚 Okul / Eğitim</span> <span>7 Jeton</span>
</div>
                <div class="act-card" id="act-yemek" onclick="fillTime(2, '#00b894', 'YEMEK', 'act-yemek')"><span>🍔 Yemek</span> <span>2 Jeton</span></div>
                <div class="act-card" id="act-bakim" onclick="fillTime(1, '#a29bfe', 'BAKIM', 'act-bakim')"><span>🧼 Kişisel Bakım</span> <span>1 Jeton</span></div>
                <div class="act-card" id="act-oyun" onclick="fillTime(4, '#d63031', 'OYUN', 'act-oyun')"><span>🎮 Oyun / Eğlence</span> <span>4 Jeton</span></div>
                <div class="act-card" id="act-diger" onclick="fillTime(2, '#636e72', 'DİĞER', 'act-diger')"><span>🚌 Yol / Diğer</span> <span>2 Jeton</span></div>
                <div class="act-card" id="act-zirh" style="background:var(--gold); border:none;" onclick="fillTime(1, '#f39c12', 'ZIRH', 'act-zirh')">
                    <span>🛡️ İBADET / ZIRH</span> <span>1 JETON</span>
                </div>
                <button class="btn-main" style="background:#fab1a0; color:#d63031; margin-top:auto;" onclick="resetPlanner()">↺ SIFIRLA</button>
            </div>
            <div class="grid-24" id="jetonGrid"></div>
        </div>
    </div>

    <div id="quiz" class="content">
        <div class="list-container" id="quiz-list"></div>
    </div>

    <div id="wisdom" class="content">
        <div class="list-container" id="wisdom-list"></div>
    </div>

    <div class="footer-controls">
        <div id="footer-status" style="font-size: 1rem; font-weight: 600;">Derse Hoş Geldiniz!</div>
        <div class="stats-badge" id="remainder">24 Jeton Boşta</div>
    </div>
</div>

<script src="namaz.js"></script>
<script src="geri.js"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
