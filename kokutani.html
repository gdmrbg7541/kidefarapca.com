<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Kelimenin Serüveni - Seviye 1 (Tüm Modlar)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Harmattan:wght@400;700&family=Marhey:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="sarf/kokutani.css?v=20260731a">
    <link rel="stylesheet" href="arakom.css?v=1">
</head>
<body class="lang-tr">
    <div id="game-container">
        
        <div class="back-button hidden" id="back-button-donut">◀</div>
        <div class="back-button hidden" id="back-button-versus">◀</div>
        
        <main id="level1-donut-container" class="main-game-panel hidden">
            <div id="l1-main-instruction">Hangi kelimeler bu kökten geliyor?</div>
            <div id="l1-root-display-mobile">H-K-M</div>
            <div id="l1-choices-grid"></div>
            <div id="l1-feedback-area">&nbsp;</div>
            <div id="l1-bottom-area">
                <button id="next-button" class="hidden">İlerle ▶</button>
            </div>
        </main>

        <main id="level1-versus-container" class="main-game-panel hidden">
            <div id="versus-progress-bar-container"></div>
            <div id="versus-player-wrapper">
                <div id="player1-screen" class="player-screen">
                    <div class="score-animation-container" id="p1-score-animation-container"></div>
                    <div class="player-score" id="p1-score-display">⭐ 0</div>
                    <div class="question-area-vs">
                        <h3><svg viewBox="0 0 24 24" class="player-icon p1-icon"><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"></path></svg></h3>
                        <div class="root-display-vs" id="p1-root"></div>
                        <div class="question-text-vs" id="p1-question"></div>
                    </div>
                    <div class="options-area-vs" id="p1-options"></div>
                </div>
                <div id="player2-screen" class="player-screen">
                    <div class="score-animation-container" id="p2-score-animation-container"></div>
                    <div class="player-score" id="p2-score-display">⭐ 0</div>
                     <div class="question-area-vs">
                        <h3><svg viewBox="0 0 24 24" class="player-icon p2-icon"><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"></path></svg></h3>
                        <div class="root-display-vs" id="p2-root"></div>
                        <div class="question-text-vs" id="p2-question"></div>
                    </div>
                    <div class="options-area-vs" id="p2-options"></div>
                </div>
            </div>
            <div id="vs-feedback-area">Oyuncular bekleniyor...</div>
        </main>

        <div id="start-screen" class="overlay"> 
            <div class="overlay-content"> 
                
                <div class="back-button" id="back-button-start">◀</div>
                
                <h1 id="start-title">Kelimenin Serüveni</h1> 
                <h2 id="start-subtitle">Seviye 1: Kökü Tanı</h2> 
                
                <p style="margin-top: 20px; font-size: 2.0em;" id="start-p-lang">
                    Oyun dilini seçin:
                </p>
                <div class="start-options-group" id="lang-select-group"> 
                    <button class="selection-button" data-lang="tr" id="lang-button-tr">Türkçe Kelimeler</button> 
                    <button class="selection-button" data-lang="ar" id="lang-button-ar">Arapça Kelimeler</button> 
                </div> 

                <p style="margin-top: 25px; font-size: 2.0em;" id="start-p-mode">
                    Oyun modunu seçin:
                </p>
                <div class="start-options-group" id="mode-select-group"> 
                    <button class="selection-button" data-mode="donut" id="mode-button-1p">Tek Kişilik</button> 
                    <button class="selection-button" data-mode="versus" id="mode-button-2p">İki Kişilik</button> 
                </div> 

                <button id="start-game-button" disabled>
                    <span id="start-button-fill"></span>
                    <span id="start-button-text">Başla</span>
                </button>
            </div> 
        </div>
        
        <div id="results-screen" class="overlay hidden"> 
            <div class="overlay-content"> 
                <h2 id="results-title">Oyun Bitti!</h2> 
                <div id="results-details"></div> 
                <button id="play-again-button">Ana Menüye Dön</button> 
            </div> 
        </div>
    
        <div id="orientation-warning" class="overlay">
            <div class="overlay-content">
                <h2 id="orientation-title">Lütfen Cihazı Dik Tutun</h2>
                <p id="orientation-p">Bu oyun en iyi dikey modda çalışır.</p>
            </div>
        </div>
    </div>

<script src="sistem/gorevkopru.js?v=7"></script>
    <script src="sarf/kokutani.js?v=20260801b"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
</html>
