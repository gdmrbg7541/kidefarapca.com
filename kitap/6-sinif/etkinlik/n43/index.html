<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>كَيْفَ الْجَوّ؟ – مع صوت</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: "Arakom", "Amiri", "Scheherazade New", serif;
      background: radial-gradient(circle at 0% 0%, #fee2e2 0, transparent 55%),
                  radial-gradient(circle at 100% 0%, #e0f2fe 0, transparent 55%),
                  radial-gradient(circle at 0% 100%, #dcfce7 0, transparent 55%),
                  radial-gradient(circle at 100% 100%, #fef9c3 0, transparent 55%),
                  linear-gradient(135deg,#fecaca,#fed7aa,#bbf7d0,#bfdbfe,#e9d5ff);
      background-size: 200% 200%;
      animation: bgMove 12s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      direction: rtl;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .game-wrapper {
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15,23,42,0.35);
      padding: 22px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
      z-index: 1;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .title {
      font-size: 2.4rem;
      font-weight: 800;
      color: #1e293b;
    }

    .progress {
      font-size: 1.6rem;
      padding: 6px 16px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 2px solid #bfdbfe;
    }

    .question-box {
      font-size: 2.1rem;
      text-align: center;
      padding: 16px;
      border-radius: 18px;
      background: #fef3c7;
      border: 2px solid #facc15;
      color: #92400e;
      font-weight: 800;
    }

    .images-row {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      align-items: center;
    }

    .img-option {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      background: #e5e7eb;
      cursor: pointer;
      border: 4px solid transparent;
      box-shadow: 0 4px 12px rgba(15,23,42,0.22);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .img-option:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(15,23,42,0.30);
    }

    .img-option img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-option.correct {
      border-color: #22c55e;
      box-shadow: 0 0 0 4px rgba(34,197,94,0.5);
    }

    .img-option.wrong {
      border-color: #ef4444;
      box-shadow: 0 0 0 4px rgba(239,68,68,0.5);
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .buttons {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }


    .feedback {
      min-height: 1.8em;
      font-size: 1.7rem;
      font-weight: 800;
    }

    .feedback.good { color: #16a34a; }
    .feedback.bad  { color: #dc2626; }

    button {
      font-family: "Arakom", "Amiri", "Scheherazade New", serif;
      font-size: 1.6rem;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      padding: 10px 24px;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg,#22c55e,#0ea5e9);
      color: #fff;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    button:disabled {
      opacity: .5;
    }

    .finish-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.45);
      border-radius: 20px;
      z-index: 5;
    }

    .finish-overlay.show { display: flex; }

    .finish-card {
      width: min(90%, 520px);
      background: #fff;
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(15,23,42,0.28);
      border: 3px solid #bfdbfe;
    }

    .finish-card h2 {
      margin: 0 0 12px;
      font-size: 2.2rem;
      color: #0f172a;
    }

    .finish-card p {
      margin: 0 0 18px;
      font-size: 1.5rem;
      color: #334155;
      font-weight: 700;
    }
  </style>
</head>

<body>

<div class="game-wrapper">
  <header class="game-header">
    <div class="title">كَيْفَ الْجَوّ؟</div>
    <div class="progress" id="progressText">اَلسُّؤال 1 / 4</div>
  </header>

  <div class="question-box" id="questionText">
    اضغط على الصورة المناسبة للجملة.
  </div>

  <div class="images-row" id="imagesRow">
    <div class="img-option" data-id="sunny"><img src="v/01.jpg" alt="sunny"></div>
    <div class="img-option" data-id="rainy"><img src="v/03.png" alt="rainy"></div>
    <div class="img-option" data-id="snowy"><img src="v/04.jpg" alt="snowy"></div>
    <div class="img-option" data-id="mild"><img src="v/02.jpg" alt="mild"></div>
  </div>

  <div class="bottom-bar">
    <div class="feedback" id="feedback"></div>

    <div class="buttons">
      <button class="btn-secondary" id="resetBtn">إِعادَة اللُّعْبَة</button>
      <button class="btn-secondary" id="retryBtn" disabled>أَعِدِ الْمُحاوَلَة</button>
      <button class="btn-primary" id="nextBtn" disabled>اَلتّالي ⟵</button>
    </div>
  </div>

  <div class="finish-overlay" id="finishOverlay">
    <div class="finish-card">
      <h2>أَكْمَلْتَ اللُّعْبَةَ</h2>
      <p>أَحْسَنْتَ. لَقَدْ أَنْهَيْتَ جَميعَ الأَسْئِلَةِ.</p>
      <button class="btn-primary" id="restartBtn">إِعادَةُ اللَّعِب</button>
    </div>
  </div>
</div>

<script>
  const questions = [
    { sentence: 'اَلْجَوّ مُشْمِس.', correctId: 'sunny' },
    { sentence: 'اَلْجَوّ مُمْطِر.', correctId: 'rainy' },
    { sentence: 'اَلْجَوّ مُثْلِج.', correctId: 'snowy' },
    { sentence: 'اَلْجَوّ مُعْتَدِل.', correctId: 'mild' }
  ];

  const imagesRow = document.getElementById('imagesRow');
  const options = [...document.querySelectorAll('.img-option')];
  const questionText = document.getElementById('questionText');
  const progressText = document.getElementById('progressText');
  const feedback = document.getElementById('feedback');
  const nextBtn = document.getElementById('nextBtn');
  const retryBtn = document.getElementById('retryBtn');
  const resetBtn = document.getElementById('resetBtn');
  const finishOverlay = document.getElementById('finishOverlay');
  const restartBtn = document.getElementById('restartBtn');

  const correctSound = document.getElementById('sound-correct');
  const wrongSound = document.getElementById('sound-wrong');

  let currentIndex = 0;
  let answered = false;
  let attempts = 0;

  function shuffleOptions() {
    const shuffled = [...options].sort(() => Math.random() - 0.5);
    shuffled.forEach(opt => imagesRow.appendChild(opt));
  }

  function resetOptionMarks() {
    options.forEach(opt => opt.classList.remove('correct', 'wrong'));
  }

  function loadQuestion() {
    const q = questions[currentIndex];
    questionText.textContent = q.sentence;
    progressText.textContent = `اَلسُّؤال ${currentIndex + 1} / ${questions.length}`;
    feedback.textContent = '';
    feedback.className = 'feedback';
    answered = false;
    attempts = 0;
    nextBtn.disabled = true;
    retryBtn.disabled = true;

    resetOptionMarks();
    shuffleOptions();
  }

  function safePlay(audioEl) {
    if (!audioEl) return;
    try {
      audioEl.currentTime = 0;
      const playPromise = audioEl.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {});
      }
    } catch (e) {}
  }

  function enableRetryState() {
    answered = true;
    retryBtn.disabled = false;
    nextBtn.disabled = true;
  }

  function unlockSecondAttempt() {
    answered = false;
    retryBtn.disabled = true;
    resetOptionMarks();
  }

  function finishQuestion() {
    answered = true;
    retryBtn.disabled = true;
    nextBtn.disabled = false;
  }

  function handleOption(e) {
    if (answered) return;

    const clicked = e.currentTarget;
    const chosenId = clicked.dataset.id;
    const correctId = questions[currentIndex].correctId;
    attempts += 1;

    if (chosenId === correctId) {
      clicked.classList.add('correct');
      feedback.textContent = 'أَحْسَنْت! إِجابَة صَحيحَة 👍';
      feedback.className = 'feedback good';
      safePlay(correctSound);
      finishQuestion();
      return;
    }

    clicked.classList.add('wrong');
    safePlay(wrongSound);
    feedback.textContent = 'إِجابَة غَيْر صَحيحَة. أَعِدِ الْمُحاوَلَة.';
    feedback.className = 'feedback bad';
    enableRetryState();
  }

  function showFinishCard() {
    finishOverlay.classList.add('show');
    nextBtn.disabled = true;
    retryBtn.disabled = true;
  }

  function restartGame() {
    currentIndex = 0;
    finishOverlay.classList.remove('show');
    loadQuestion();
  }

  options.forEach(opt => opt.addEventListener('click', handleOption));

  retryBtn.onclick = unlockSecondAttempt;

  nextBtn.onclick = () => {
    if (currentIndex >= questions.length - 1) {
      showFinishCard();
      return;
    }
    currentIndex++;
    loadQuestion();
  };

  resetBtn.onclick = restartGame;
  restartBtn.onclick = restartGame;

  loadQuestion();
</script>
