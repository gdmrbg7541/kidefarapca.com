<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استمع واختر الكلمات</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Arakom", sans-serif;
      background: #fff4fb;
    }

    .page {
      min-height: 100vh;
      padding: 1.2rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      width: 100%;
      max-width: 1000px;
      background: #ffffff;
      border-radius: 30px;
      padding: 2rem 1.6rem 2.3rem;
      box-shadow: 0 12px 38px rgba(0,0,0,0.14);
      position: relative;
      overflow: hidden;
    }

    /* Arka plan süsü */
    .content::before,
    .content::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffd6f5, #ff8fd8);
      opacity: 0.23;
      z-index: -1;
      animation: bubbleFloat 10s ease-in-out infinite;
    }
    .content::before { top: -80px; left: -60px; }
    .content::after  { bottom: -80px; right: -60px; animation-delay: 2.5s; }

    @keyframes bubbleFloat {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(14px); }
    }

    /* Yönerge */
    .instruction-box {
      border-radius: 24px;
      border: 3px solid #ff9ad7;
      background: linear-gradient(135deg, #fff1ff, #ffe1fa);
      padding: 1.2rem 1.1rem 1.5rem;
      margin-bottom: 1.8rem;
      text-align: center;
    }

    .instruction-text {
      font-size: clamp(1.6rem, 1.7vw + 1rem, 2.2rem);
      font-weight: 700;
      color: #7d006c;
      margin-bottom: 1.1rem;
    }

    audio {
      width: 100%;
      max-width: 400px;
      margin-inline: auto;
      border-radius: 14px;
    }

    /* Kelime kartları */
    .words-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.1rem 1.3rem;
      justify-content: center;
    }

    @keyframes floatCard {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-4px); }
    }

    .word-item {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 0.8rem 0.5rem 0.5rem;
      border-radius: 999px;
      border: 3px solid #ffb6ec;
      background: linear-gradient(135deg,#ffe3f9,#ffd3f1);
      box-shadow: 0 6px 14px rgba(0,0,0,0.14);
      user-select: none;
      transition: 0.18s;
      animation: floatCard 3.6s ease-in-out infinite;
    }

    .word-item:nth-child(2n)   { animation-duration: 4s;   animation-delay: .2s; }
    .word-item:nth-child(3n)   { animation-duration: 4.4s; animation-delay: .4s; }
    .word-item:nth-child(5n+1) { animation-duration: 3.8s; animation-delay: .6s; }

    .word-item:hover {
      animation-play-state: paused;
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 9px 20px rgba(0,0,0,0.18);
    }

    .word-label {
      padding: 0.45rem 1.7rem;
      border-radius: 999px;
      font-size: clamp(1.6rem,1.9vw + 1rem,2.4rem);
      color: #4a0046;
      font-weight: 700;
      white-space: nowrap;
    }

    .tick-box {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 3px solid #ff73b1;
      background: #ffffff;
      position: relative;
      box-shadow: 0 0 0 3px #ffe1f1;
      flex-shrink: 0;
      margin-inline-start: 0.5rem;
    }

    .word-item.checked {
      border-color: #ff6fba;
      background: linear-gradient(135deg,#ffbee8,#ff93d3);
      box-shadow: 0 0 0 5px #ffd2f2;
    }

    .word-item.checked .tick-box {
      background: #ff6fba;
      border-color: #ff6fba;
      box-shadow: 0 0 0 3px #ffc0e4;
    }

    .word-item.checked .tick-box::after {
      content: "✔";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 800;
    }

    /* Alt butonlar */
    .buttons-area {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn {
      font-family: "Arakom";
      font-size: clamp(1.3rem, 1.5vw + .8rem, 1.8rem);
      padding: 0.7rem 2rem;
      border-radius: 50px;
      cursor: pointer;
      border: none;
      color: white;
      font-weight: 700;
      transition: 0.18s;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }

    .btn-check {
      background: linear-gradient(135deg,#34d399,#3b82f6);
    }

    .btn-replay {
      background: linear-gradient(135deg,#f472b6,#ec4899);
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.22);
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="content">

      <!-- Tek yönerge + ses -->
      <div class="instruction-box">
        <div class="instruction-text">
          ٣- اِسْتَمِعْ إِلى الْكَلِمات وَاخْتَرْ ما تَسْمَعُ مِنَ الْكَلِمات.
        </div>

        <audio controls id="listeningAudio">
          <source src="ses.mp3" type="audio/mpeg" />
        </audio>
      </div>

      <!-- Kelime listesi -->
      <div class="words-grid">

        <div class="word-item"><span class="word-label">مِعْطَف</span><span class="tick-box"></span></div>
        <div class="word-item"><span class="word-label">مُشْمِس</span><span class="tick-box"></span></div>
        <div class="word-item"><span class="word-label">شِبْشِب</span><span class="tick-box"></span></div>
        <div class="word-item"><span class="word-label">مُثْلِج</span><span class="tick-box"></span></div>
        <div class="word-item"><span class="word-label">اَلْيَوْم</span><span class="tick-box"></span></div>
        <div class="word-item"><span class="word-label">مِظَلَّة</span><span class="tick-box"></span></div>
        <div class="word-item"><span class="word-label">وِشاح</span><span class="tick-box"></span></div>
        <div class="word-item"><span class="word-label">قَميص</span><span class="tick-box"></span></div>
        <div class="word-item"><span class="word-label">مُمْطِر</span><span class="tick-box"></span></div>
        <div class="word-item"><span class="word-label">أَحْمَر</span><span class="tick-box"></span></div>

      </div>

      <!-- ✔ Kontrol Et + Tekrar Oyna butonları -->
      <div class="buttons-area">
        <button class="btn btn-check" id="checkBtn">تَحَقَّقْ</button>
        <button class="btn btn-replay" id="replayBtn">اِلْعَبْ مَرَّةً أُخْرى</button>
      </div>

    </div>
  </div>

  <script>
    // Tik aç/kapa
    document.querySelectorAll(".word-item").forEach(function(item) {
      item.addEventListener("click", function () {
        item.classList.toggle("checked");
      });
    });

    // ✔ TEKRAR OYNA
    document.getElementById("replayBtn").addEventListener("click", function(){
      document.querySelectorAll(".word-item").forEach(i => i.classList.remove("checked"));
      window.scrollTo({top:0, behavior:"smooth"});
    });

    // ✔ KONTROL ET (şimdilik sadece temel kontrol)
    document.getElementById("checkBtn").addEventListener("click", function(){
      alert("🎧 أَحْسَنْت! يُمْكِنُك الْاِنْتِقال أَوْ إِعادَة الْاِسْتِماع.");  
    });
  </script>

</body>
</html>
