<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>لعبة العائلة</title>
  <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Scheherazade New", serif;
      background:#fff;
      color:#111;
      overflow-x:hidden;
    }
    .wrap{
      width:100%;
      max-width:720px;
      margin:0 auto;
      padding:14px 14px calc(14px + env(safe-area-inset-bottom));
      min-height:100svh;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .top{
      background:#fff;
      border:2px solid #e5e7eb;
      border-radius:18px;
      padding:12px 12px;
      display:flex;
      flex-direction: column;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .instr-row {
      display: flex;
      align-items: center;
      gap: 15px;
      justify-content: center;
      width: 100%;
    }
    .instr{
      font-size:30px;
      font-weight:700;
      line-height:1.2;
      margin:0;
      text-align: center;
    }
    .audioBtn {display:none !important;
      background: #f3f4f6;
      border: 2px solid #e5e7eb;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 24px;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .audioBtn:hover { background: #e5e7eb; }

    .card{
      flex:1;
      background:#fff;
      border:2px solid #e5e7eb;
      border-radius:22px;
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
      justify-content:center;
      align-items:stretch;
      position: relative;
    }
    .imgBox{
      width:100%;
      border:2px solid #f3f4f6;
      border-radius:18px;
      overflow:hidden;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      height:min(52vh, 360px);
    }
    .imgBox img{
      max-width:100%;
      max-height:100%;
      width:auto;
      height:auto;
      object-fit:contain;
      display:block;
    }
    .label{
      font-size:46px;
      font-weight:700;
      text-align:center;
      border:2px solid #e5e7eb;
      border-radius:18px;
      padding:6px 14px;
    }
    .btnRow{
      display:flex;
      gap:12px;
      width:100%;
    }
    button.game-btn{
      flex:1;
      border:none;
      border-radius:18px;
      padding:14px 12px;
      font-size:34px;
      font-family:inherit;
      font-weight:700;
      cursor:pointer;
      min-height:62px;
    }
    .ok{background:#16a34a;color:#fff;}
    .bad{background:#dc2626;color:#fff;}

    .nav{
      display:flex;
      gap:10px;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      border:2px solid #e5e7eb;
      border-radius:18px;
      padding:10px 12px;
      background:#fff;
    }
    .progress{
      font-size:24px;
      font-weight:700;
    }
    .smallBtn{
      flex:0 0 auto;
      font-size:22px;
      padding:10px 14px;
      min-height:44px;
      border-radius:14px;
      background:#111827;
      color:#fff;
      border: none;
      font-family: inherit;
      cursor: pointer;
    }

    .toast{
      position:fixed;
      inset:auto 50% 22px auto;
      transform:translateX(50%);
      color:#fff;
      border-radius:18px;
      display:none;
      z-index:999;
      max-width:92vw;
      text-align:center;
      font-weight:900;
      font-size:64px;
      padding:18px 24px;
      line-height:1;
      box-shadow:0 18px 45px rgba(0,0,0,.22);
    }
    .toast.good{background:#16a34a;}
    .toast.bad{background:#dc2626;}

    .end{
      text-align:center;
      font-size:72px;
      font-weight:900;
      padding:18px 10px;
      border:2px solid #e5e7eb;
      border-radius:22px;
    }

    /* ✅ NEW: Son sayfa çözüm paneli (ek) */
    .end-screen{
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:stretch;
      justify-content:center;
      text-align:center;
    }
    .solution-btn{
      border:none;
      border-radius:18px;
      padding:14px 12px;
      font-size:30px;
      font-family:inherit;
      font-weight:900;
      cursor:pointer;
      min-height:62px;
      background:#4f46e5;
      color:#fff;
    }
    .solution-panel{
      display:none;
      text-align:right;
      background:#fff;
      border-radius:18px;
      padding:12px;
      border:2px solid #e5e7eb;
      max-height: 420px;
      overflow-y:auto;
    }
    .wrong-item{
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 6px;
      border-bottom:1px solid #eef2f7;
    }
    .wrong-item:last-child{border-bottom:none;}
    .mini-img{
      width:86px;
      height:86px;
      border-radius:14px;
      object-fit:cover;
      background:#f3f4f6;
      border:1px solid #e5e7eb;
      display:block;
      flex:0 0 auto;
    }
    .wrong-info{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:6px;
      text-align:right;
    }
    .wrong-text{font-size:26px;font-weight:900;}
    .correct-ans{font-size:22px;font-weight:900;color:#16a34a;}
    .your-ans{font-size:22px;font-weight:900;color:#dc2626;}
    .end-title{font-size:40px;font-weight:900;}

    @media (max-width:420px){
      .instr{font-size:26px}
      .label{font-size:42px}
      button.game-btn{font-size:32px}
      .solution-btn{font-size:28px}
    }
  </style>
<style id="startOverlayPatch">
    .audioBtn,.audio-trigger,.audio-btn,#playAudioBtn{display:none !important;}
    #startOverlay{
      position:fixed;
      inset:0;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#dbeafe 0%, #fef3c7 50%, #dcfce7 100%);
      padding:12px;
    }
    #startCard{
      width:min(98vw,1180px);
      background:#ffffff;
      border:3px solid #e5e7eb;
      border-radius:28px;
      padding:16px 10px;
      box-shadow:0 14px 40px rgba(0,0,0,.16);
      text-align:center;
      direction:rtl;
      overflow:visible;
    }
    #startInstruction{
      font-family:"Scheherazade New", serif;
      font-size:clamp(12px,2.8vw,30px);
      font-weight:700;
      line-height:1.15;
      color:#0f172a;
      margin:0 0 16px;
      white-space:nowrap;
      display:block;
      width:100%;
      max-width:none;
      overflow:visible;
      text-align:center;
      letter-spacing:0;
      transform-origin:center center;
    }
    #startBtn{
      font-family:"Scheherazade New", serif;
      font-size:clamp(28px,4vw,36px);
      font-weight:700;
      border:none;
      border-radius:20px;
      padding:14px 32px;
      background:#2563eb;
      color:#fff;
      cursor:pointer;
      min-height:56px;
      min-width:160px;
      box-shadow:0 8px 20px rgba(37,99,235,.28);
    }
    #startBtn:active{transform:scale(.98);}
  </style>

</head>

<body>

  <div id="startOverlay" aria-label="start screen">
    <div id="startCard">
      <p id="startInstruction">اُنْظُرْ إِلى الصّورَة ثُمَّ أَجِبْ بِـ (صَحيح) أَوْ (خَطَأ).</p>
      <button id="startBtn" type="button">اِبْدَأْ</button>
    </div>
  </div>

  <div class="wrap">
    <div class="top">
      <div class="instr-row">
        <div class="audioBtn" onclick="playMainAudio()" title="استمع">🔊</div>
        <p class="instr">اُنْظُرْ إِلى الصّورَة ثُمَّ أَجِبْ بِـ (صَحيح) أَوْ (خَطَأ).</p>
      </div>
      <audio id="audioElement" preload="auto"></audio>
    </div>

    <div id="gameCard" class="card"></div>

    <div class="nav">
      <div id="progress" class="progress">١ / ٨</div>
      <button id="retryBtn" class="smallBtn" type="button">حاوِلْ مَرَّةً أُخْرى</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const IMG_EXTS = ["png","jpg","jpeg","webp"];
    const AUD_EXTS = ["mp3","wav","ogg"];

    const items = [
      { id: 1, imgBase: "images/1", text: "أَب", correct: false },
      { id: 2, imgBase: "images/2", text: "أَب", correct: true  },
      { id: 3, imgBase: "images/3", text: "أُخْت", correct: true },
      { id: 4, imgBase: "images/4", text: "أَخي الْكَبير", correct: true },
      { id: 5, imgBase: "images/5", text: "أُخْتي الْكَبيرَة", correct: true },
      { id: 6, imgBase: "images/6", text: "أُمّ", correct: true },
      { id: 7, imgBase: "images/7", text: "عائِلَة / أُسْرَة", correct: true },
      { id: 8, imgBase: "images/8", text: "أَخ", correct: false }
    ];

    let index = 0;

    // ✅ NEW: yanlış kayıtları (ek)
    let mistakes = []; // {id,imgBase,text,correct,choiceTrue}

    const gameCard = document.getElementById("gameCard");
    const progressEl = document.getElementById("progress");
    const retryBtn = document.getElementById("retryBtn");
    const toast = document.getElementById("toast");
    const mainAudio = document.getElementById("audioElement");

    const toArabicDigits = (str) => String(str).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

    /* ✅ NEW: Doğru/yanlış sesleri (ek) — dosya gerektirmez (WebAudio) */
    let _audioCtx = null;
    function getAudioCtx(){
      if(!_audioCtx){
        _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if(_audioCtx.state === "suspended"){
        _audioCtx.resume().catch(()=>{});
      }
      return _audioCtx;
    }

    // "dırırtı" gibi kısa yükselen/chirp sesi
    function playCorrectSound(){
      try{
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(980, now + 0.14);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);

        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.20);

        // kısa "trrr" hissi için çok hafif tremolo
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.type = "square";
        lfo.frequency.setValueAtTime(28, now);
        lfoGain.gain.setValueAtTime(18, now);
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfo.start(now);
        lfo.stop(now + 0.20);
      }catch(e){}
    }

    // "dınk" gibi kısa bell sesi
    function playWrongSound(){
      try{
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(740, now);

        // zarf
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.45, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.30);

        // hafif üst harmonik
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(1480, now);
        gain2.gain.setValueAtTime(0.0001, now);
        gain2.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

        osc.connect(gain).connect(ctx.destination);
        osc2.connect(gain2).connect(ctx.destination);

        osc.start(now);  osc.stop(now + 0.32);
        osc2.start(now); osc2.stop(now + 0.24);
      }catch(e){}
    }

    function playMainAudio() {
      if (!mainAudio.src || mainAudio.src === window.location.href) {
        loadWithFallback(mainAudio, "audio1", AUD_EXTS, () => {
          console.error("Ses dosyası bulunamadı.");
        });
      }
      mainAudio.currentTime = 0;
      mainAudio.play().catch(e => {
        console.warn("Ses çalma işlemi başarısız oldu:", e);
      });
    }

    function showMark(ok){
      toast.textContent = ok ? "✓" : "✗";
      toast.className = "toast " + (ok ? "good" : "bad");
      toast.style.display = "block";
      setTimeout(()=> toast.style.display="none", 650);
    }

    function setProgress(){
      progressEl.textContent = `${toArabicDigits(index+1)} / ${toArabicDigits(items.length)}`;
    }

    function loadWithFallback(el, base, exts, finalFail){
      let i = 0;
      const tryNext = () => {
        if(i >= exts.length){ if(finalFail) finalFail(); return; }
        el.src = `${base}.${exts[i++]}`;
      };
      el.onerror = tryNext;
      tryNext();
    }

    function goNext(){
      if(index < items.length-1){
        index++;
        render();
      }else{
        showEnd();
      }
    }

    function render(){
      const it = items[index];

      gameCard.innerHTML = `
        <div class="imgBox">
          <img id="qImg" alt="صورة ${toArabicDigits(it.id)}">
        </div>
        <div class="label">${it.text}</div>
        <div class="btnRow">
          <button class="game-btn ok" id="trueBtn" type="button">صَحيح</button>
          <button class="game-btn bad" id="falseBtn" type="button">خَطَأ</button>
        </div>
      `;

      const imgEl = document.getElementById("qImg");
      loadWithFallback(imgEl, it.imgBase, IMG_EXTS, () => {
        imgEl.replaceWith(Object.assign(document.createElement("div"), {
          style: "font-size:22px;font-weight:700;color:#dc2626;text-align:center;padding:10px;",
          innerHTML: `لَمْ تُوجَد الصُّورَةُ`
        }));
      });

      const trueBtn = document.getElementById("trueBtn");
      const falseBtn = document.getElementById("falseBtn");

      const answer = (choiceTrue)=>{
        const isCorrect = (choiceTrue === it.correct);

        // ✅ NEW: doğru/yanlış sesini çal (ek)
        if(isCorrect) playCorrectSound();
        else playWrongSound();

        // ✅ NEW: yanlışları kaydet (ek)
        if(!isCorrect){
          mistakes.push({
            id: it.id,
            imgBase: it.imgBase,
            text: it.text,
            correct: it.correct,
            choiceTrue
          });
        }

        showMark(isCorrect);
        setTimeout(()=> goNext(), 500);
      };

      trueBtn.onclick = () => answer(true);
      falseBtn.onclick = () => answer(false);

      setProgress();
    }

    function showEnd(){
      // Son sayfa: çözümü göster butonu + panel (ek)
      const mistakesHtml = (mistakes.length > 0)
        ? mistakes.map(m => `
            <div class="wrong-item">
              <img class="mini-img" data-base="${m.imgBase}" alt="صورة ${toArabicDigits(m.id)}">
              <div class="wrong-info">
                <div class="wrong-text">${m.text}</div>
                <div class="your-ans">إِجابَتُك: ${m.choiceTrue ? "صَحيح" : "خَطَأ"}</div>
                <div class="correct-ans">الْجَواب الصَّحيح: ${m.correct ? "صَحيح" : "خَطَأ"}</div>
              </div>
            </div>
          `).join("")
        : `<div style="text-align:center;font-size:26px;font-weight:900;padding:14px;">
             أَحْسَنْت! .
           </div>`;

      gameCard.innerHTML = `
        <div class="end-screen">
          <div class="end">✓</div>
          <div class="end-title"></div>

          <button class="solution-btn" type="button" onclick="toggleSolutions()">أَظْهِر الْحَلّ</button>

          <div id="solutionPanel" class="solution-panel">
            ${mistakesHtml}
          </div>
      `;

      progressEl.textContent = "اِنْتَهى";

      // ✅ NEW: çözüm görsellerini soru görselleriyle aynı şekilde yükle (ek)
      const thumbs = gameCard.querySelectorAll(".mini-img[data-base]");
      thumbs.forEach(img => {
        const base = img.getAttribute("data-base");
        loadWithFallback(img, base, IMG_EXTS, () => {
          img.src = "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2286%22 height=%2286%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23eee%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2216%22>🖼️</text></svg>";
        });
      });
    }

    // ✅ NEW: panel aç/kapat (ek)
    window.toggleSolutions = function(){
      const panel = document.getElementById("solutionPanel");
      if(!panel) return;
      panel.style.display = (panel.style.display === "block") ? "none" : "block";
    };

    // ✅ NEW: resetGame (ek) — retryBtn bunu çağırıyor
    window.resetGame = function(){
      index = 0;
      mistakes = [];
      render();
    };

    retryBtn.onclick = () => { window.resetGame(); };

    window.onload = () => {
      loadWithFallback(mainAudio, "audio1", AUD_EXTS, () => {
        loadWithFallback(mainAudio, "audio/1", AUD_EXTS);
      });
      render();
    };
  </script>





<script id="startOverlayScript">
(function(){
  const overlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');
  const instructionAudio = document.getElementById('audio1') || document.getElementById('audioElement');
  let started = false;

  function fitStartInstruction(){
    const el = document.getElementById('startInstruction');
    const card = document.getElementById('startCard');
    if(!el || !card) return;

    el.style.whiteSpace = 'nowrap';
    el.style.transform = '';
    el.style.width = '100%';
    el.style.display = 'block';

    const available = Math.max(160, card.clientWidth - 20);
    let size = 30;
    const min = 10;

    while(size >= min){
      el.style.fontSize = size + 'px';
      if(el.scrollWidth <= available) break;
      size -= 0.5;
    }

    if(el.scrollWidth > available){
      const rawWidth = el.scrollWidth || 1;
      const scale = Math.max(0.72, available / rawWidth);
      el.style.display = 'inline-block';
      el.style.width = rawWidth + 'px';
      el.style.transform = 'scale(' + scale + ')';
    }
  }

  async function playInstruction(){
    if(!instructionAudio) return;
    try{
      instructionAudio.pause();
      instructionAudio.currentTime = 0;
      await instructionAudio.play();
    }catch(e){
      console.warn('Instruction audio could not play.', e);
    }
  }

  async function hideOverlayAndPlay(ev){
    if(ev){ ev.preventDefault(); }
    if(started) return;
    started = true;
    if(overlay){ overlay.style.display = 'none'; }
    await playInstruction();
  }

  fitStartInstruction();
  window.addEventListener('resize', fitStartInstruction);
  window.addEventListener('load', fitStartInstruction);
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(fitStartInstruction).catch(function(){});
  }
  setTimeout(fitStartInstruction, 150);
  setTimeout(fitStartInstruction, 600);

  if(startBtn){
    startBtn.addEventListener('click', hideOverlayAndPlay);
    startBtn.addEventListener('touchstart', hideOverlayAndPlay, {passive:false});
  }
})();
</script>

</body>
</html>
