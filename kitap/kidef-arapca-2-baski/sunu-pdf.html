<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sunu — Kidef Arapça</title>
<!--
  KİDEF ARAPÇA — PDF SUNU GÖSTERİCİ (20.10.2026)
  Öğretmen: "kidefarapca 2. baskı sunuları ileri geri tuşu pdf leri html olarak açtığımız
  şekilde açılsın" · "site ismi hep görünsün istiyorum".
  Sunuların PDF'i tarayıcının PDF okuyucusunda değil, burada slayt slayt açılır: sayfa
  kidefarapca.com'da (adres çubuğunda site adı), PDF'in her sayfası pdf.js ile ekranı
  kaplayacak kadar büyük çizilir. Düzen sunum.html'deki gibi (akıllı tahta için): iki büyük
  ok sağda alt alta (üstte İLERİ, altta GERİ), parmakla kaydırma, ekranın sağına/soluna
  dokunma, klavye ve sunum kumandası (← → ↑ ↓ Boşluk PageUp/PageDown Home End F H).
  3 sn dokunulmazsa çubuklar kaybolur; tuşla ilerlenince oklar da kaybolur.
  PDF parça parça yüklenir (Range): ilk slayt hemen gelir, büyük desteler bütünüyle inmez;
  sonraki iki slayt arkada hazırlanır.
  Adres:  sunu-pdf.html?pdf=<PDF adresi>&a=<sunu adı>&s=<slayt>
  PDF yalnız sitenin kendi depolarından açılır (kidefarapca.com/kidefarapca-materyal-…,
  gdmrbg7541.github.io/kidefarapca-materyal-… ya da sitedeki göreli bir yol).
  kidefarapca.com'dan alınamazsa aynı dosya GitHub'dan denenir.
  pdf.js 3.11.174 (Mozilla, Apache-2.0): 02_cekirdek/js/pdfjs/
-->
<script src="02_cekirdek/js/pdfjs/pdf.min.js?v=4d9cc6ff"></script>
<style>
  :root{--gold:#E3A02A;--ink:#122040;--zemin:#0C1220}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--zemin);color:#fff;overflow:hidden;
    font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent}
  button,input{font:inherit;color:inherit;touch-action:manipulation}
  button{background:none;border:0;cursor:pointer}
  .ust{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:12px;
    padding:0 14px;background:linear-gradient(rgba(8,12,22,.82),rgba(8,12,22,0));z-index:5;
    transition:opacity .35s}
  .ust h1{flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ust .rozet{font-size:11px;font-weight:800;letter-spacing:.04em;padding:4px 10px;
    border-radius:99px;background:var(--gold);color:#221503;white-space:nowrap}
  .tus{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#D6DEEC}
  .tus:active{transform:scale(.92);background:rgba(255,255,255,.15)}
  .tus[hidden]{display:none}
  .tus svg,.ok svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sahne{position:fixed;inset:0;display:grid;place-items:center;touch-action:pan-y;background:#000}
  /* slayt ekrana sığar (16:9 slayt yatayda kenardan kenara; başka oranda siyah pay kalır) */
  .sahne > canvas{display:block;user-select:none;-webkit-user-select:none;grid-area:1/1;transition:opacity .12s}
  .sahne.yukleniyor > canvas{opacity:.35}
  /* ileri/geri: geniş, açık renkli, slaydın üstünde. Görünen düğme 88×180, basılabilen alan
     ekran kenarından ortaya doğru 150 px. İKİ OK DA SAĞDA, ALT ALTA (koca tahtada öğretmen
     bir sağa bir sola yürümesin): üstte İLERİ, altta GERİ. */
  .ok{position:fixed;width:88px;height:180px;border-radius:22px;display:grid;
    place-items:center;background:rgba(255,255,255,.30);border:2px solid rgba(18,32,64,.16);z-index:6;color:var(--ink);
    box-shadow:0 2px 10px rgba(0,0,0,.08);transition:opacity .35s,background .15s}
  .ok::before{content:'';position:absolute;right:-10px;width:150px;height:calc(100% + 40px)}
  .ok.sag::before{top:-30px}.ok.sol::before{bottom:-30px}
  .ok:active{background:var(--gold);border-color:var(--gold);color:#221503;transform:scale(.93)}
  .ok:disabled{opacity:.15;pointer-events:none}
  .ok.sag{right:12px;top:calc(50% - 196px)}   /* İLERİ — üstte */
  .ok.sol{right:12px;top:calc(50% + 16px)}    /* GERİ — altta */
  .ok svg{width:38px;height:38px;stroke-width:2.6}
  .alt{position:fixed;left:0;right:0;bottom:0;height:68px;display:flex;align-items:center;gap:14px;padding:0 18px;
    background:linear-gradient(rgba(8,12,22,0),rgba(8,12,22,.82));z-index:5;transition:opacity .35s}
  .sayac{font-size:13px;font-weight:700;color:#9FB0CC;white-space:nowrap;font-variant-numeric:tabular-nums}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;outline:none;
    background:linear-gradient(90deg,var(--gold) var(--dolu,0%),rgba(255,255,255,.16) var(--dolu,0%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--gold)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--gold)}
  /* bir süre dokunulmazsa düğmeler kaybolur, slayt tek başına kalır (PDF tam ekran gibi) */
  body.sakin .ust,body.sakin .alt{opacity:0;pointer-events:none}
  body.sakin .ok{opacity:.35}
  /* klavye / sunum kumandası ile ilerlenirken oklar TAMAMEN kaybolur; ekrana dokununca geri gelir */
  body.tusla .ok{opacity:0;pointer-events:none}
  body.sakin{cursor:none}
  body.tamekran .ust .rozet,body.tamekran .ust h1{visibility:hidden}
  /* yükleniyor / hata */
  .durum{position:fixed;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none;text-align:center;padding:30px}
  .durum[hidden]{display:none}
  .durum .ic{display:flex;flex-direction:column;align-items:center;gap:16px;color:#C9D3E6;font-size:15px;line-height:1.6}
  .durum .ic b{color:#fff;font-size:17px}
  .donen{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.18);border-top-color:var(--gold);
    animation:don 1s linear infinite}
  @keyframes don{to{transform:rotate(360deg)}}
  .durum.hata .donen{display:none}
  .durum.hata{pointer-events:auto}
  .durum .yeniden{display:none;margin-top:4px;padding:10px 18px;border-radius:12px;background:var(--gold);color:#221503;font-weight:800}
  .durum.hata .yeniden{display:inline-block}
  @media (max-width:700px){.ok{width:52px;height:110px}.ok svg{width:26px;height:26px}.ok::before{width:80px}
    .ok.sag{top:calc(50% - 120px)}.ok.sol{top:calc(50% + 10px)}}
  @media (prefers-reduced-motion: reduce){.donen{animation-duration:3s}}
</style>
</head>
<body>
<header class="ust">
  <span class="rozet" id="rozet">kidefarapca.com</span>
  <h1 id="baslik">—</h1>
  <button class="tus" id="tSakin" title="Çubukları gizle (H)" aria-label="Çubukları gizle">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button class="tus" id="tTam" title="Tam ekran (F)" aria-label="Tam ekran">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="tus" id="tKapat" title="Sekmeyi kapat" aria-label="Kapat">
    <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
</header>

<main class="sahne yukleniyor" id="sahne" aria-live="polite"></main>

<div class="durum" id="durum"><div class="ic"><span class="donen"></span><b id="durumBas">Sunu açılıyor…</b><span id="durumYazi"></span>
  <button type="button" class="yeniden" id="yeniden">Yeniden dene</button></div></div>

<button class="ok sol" id="geri" aria-label="Önceki slayt" disabled><svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg></button>
<button class="ok sag" id="ileri" aria-label="Sonraki slayt" disabled><svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg></button>

<footer class="alt">
  <span class="sayac" id="sayac">– / –</span>
  <input type="range" id="kaydirac" min="1" max="1" value="1" aria-label="Slayt seç">
</footer>

<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var $ = function (s) { return document.querySelector(s); };
  var ad = (q.get('a') || 'Sunu').slice(0, 160);
  function adYaz(x) { ad = x; document.title = ad + ' — Kidef Arapça'; $('#baslik').textContent = ad; }
  adYaz(ad);

  /* ---------- hangi PDF? yalnız sitenin kendi depoları ---------- */
  var KA = 'https://kidefarapca.com/', GH = 'https://gdmrbg7541.github.io/';
  var DEPO = /^(?:https:\/\/kidefarapca\.com|https:\/\/gdmrbg7541\.github\.io)\/kidefarapca-materyal-[a-z0-9-]+\/[^?#]+\.pdf$/i;
  var GORELI = /^(?!\/\/)[A-Za-z0-9_.\-\/%]+\.pdf$/;
  var pdf = q.get('pdf') || '';
  if (!(DEPO.test(pdf) || (GORELI.test(pdf) && pdf.indexOf('..') < 0))) {
    hata('Sunu bulunamadı.', 'Kitaptaki bir sunu damgasına ya da Sunular listesine dokunarak açın.', false);
    return;
  }
  /* kidefarapca.com'dan alınamazsa aynı yol GitHub'da denenir (ve tersi değil) */
  var adresler = [pdf];
  if (pdf.indexOf(KA + 'kidefarapca-materyal-') === 0) adresler.push(GH + pdf.slice(KA.length));
  /* ad verilmemişse (eski bağlantı, karekod) kitabın listesinden bulunur */
  if (!q.get('a')) {
    fetch('03_veri/kitap.json', { credentials: 'omit' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      var yolu = function (u) { return String(u || '').replace(/^https:\/\/[^\/]+\//, ''); }, ara = yolu(pdf), bulunan = null;
      (function gez(o) {
        if (bulunan || !o || typeof o !== 'object') return;
        if (typeof o.sitePdf === 'string' && yolu(o.sitePdf) === ara && o.ad) { bulunan = o.ad; return; }
        for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) gez(o[k]);
      })(j);
      if (bulunan) adYaz(String(bulunan).slice(0, 160));
    }).catch(function () {});
  }

  var ilk = Math.max(1, parseInt(q.get('s'), 10) || 1);
  var i = ilk, adet = 0, belge = null;
  var sahne = $('#sahne'), kay = $('#kaydirac');

  /* ---------- pdf.js ---------- */
  if (!window.pdfjsLib) { hata('Sunu göstericisi yüklenemedi.', 'Sayfayı yenileyin.', true); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = '02_cekirdek/js/pdfjs/pdf.worker.min.js?v=4d4106b4';
  var PARCA = 65536, ILK = 262144;         /* 64 KB'lık parçalar; ilk istek 256 KB */

  function parcaAl(url, bas, son) {         /* son dahil */
    return fetch(url, { headers: { Range: 'bytes=' + bas + '-' + son }, credentials: 'omit', cache: 'default' })
      .then(function (r) {
        if (r.status !== 206 && r.status !== 200) throw new Error('HTTP ' + r.status);
        return r.arrayBuffer().then(function (b) { return { durum: r.status, veri: new Uint8Array(b) }; });
      });
  }
  /* PDF'i parça parça (Range) açar; sunucu parça vermezse bütün dosyayı alır */
  function ac(url) {
    return fetch(url, { method: 'HEAD', credentials: 'omit' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var boy = parseInt(r.headers.get('content-length'), 10) || 0;
      var tur = (r.headers.get('content-type') || '').toLowerCase();
      if (tur && tur.indexOf('pdf') < 0 && tur.indexOf('octet') < 0) throw new Error('PDF değil: ' + tur);
      if (!boy) return pdfjsLib.getDocument({ url: url, isEvalSupported: false }).promise;
      return parcaAl(url, 0, Math.min(boy, ILK) - 1).then(function (p) {
        if (p.durum === 200 || p.veri.length >= boy) {               /* parça yok: bütün dosya geldi */
          return pdfjsLib.getDocument({ data: p.veri, isEvalSupported: false }).promise;
        }
        if (p.veri.length !== Math.min(boy, ILK)) throw new Error('parça boyu tutmuyor');
        var tasi = new pdfjsLib.PDFDataRangeTransport(boy, p.veri);
        /* parça üç kez alınamazsa (ya da boyu tutmazsa) bütün dosya bir kez indirilip verilir */
        var butun = null;
        function butunAl() {
          if (!butun) butun = fetch(url, { credentials: 'omit' }).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.arrayBuffer();
          }).then(function (b) {
            var v = new Uint8Array(b);
            if (v.length !== boy) throw new Error('boy tutmuyor');
            tasi.onDataRange(0, v);
            return v;
          });
          return butun;
        }
        tasi.requestDataRange = function (b, s) {
          if (butun) return;                                   /* bütün dosya geliyor / geldi */
          var dene = function (kalan) {
            parcaAl(url, b, s - 1).then(function (x) {
              if (x.durum === 200 && x.veri.length === boy) x.veri = x.veri.subarray(b, s);   /* parça yerine bütün dosya */
              if (x.veri.length !== s - b) throw new Error('parça boyu tutmuyor');
              if (!butun) tasi.onDataRange(b, x.veri);
            }).catch(function (e) {
              if (kalan > 0) setTimeout(function () { dene(kalan - 1); }, 700);
              else { console.warn('parça alınamadı, bütün dosya alınıyor', b, s, e); butunAl().catch(function (x) { console.warn(x); }); }
            });
          };
          dene(2);
        };
        return pdfjsLib.getDocument({ range: tasi, length: boy, rangeChunkSize: PARCA,
          disableAutoFetch: true, disableStream: true, isEvalSupported: false }).promise;
      });
    });
  }
  function yukle(k) {
    durumGoster('Sunu açılıyor…', '');
    return ac(adresler[k]).catch(function (e) {
      console.warn('sunu açılamadı:', adresler[k], e);
      if (k + 1 < adresler.length) return yukle(k + 1);
      throw e;
    });
  }

  /* ---------- çizim: ekrana sığdır, yakındakileri önceden hazırla ---------- */
  var onbellek = {}, sira = [], cizim = {}, gosterilen = 0;
  function olcu() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    return { w: Math.max(1, window.innerWidth), h: Math.max(1, window.innerHeight), dpr: dpr };
  }
  var olcuAnahtar = '';
  function anahtar() { var o = olcu(); return o.w + 'x' + o.h + '@' + o.dpr; }
  function hazirla(n) {
    if (onbellek[n]) return Promise.resolve(onbellek[n]);
    if (cizim[n]) return cizim[n];
    cizim[n] = belge.getPage(n).then(function (sayfa) {
      var o = olcu(), v1 = sayfa.getViewport({ scale: 1 });
      var css = Math.min(o.w / v1.width, o.h / v1.height);
      var olc = css * o.dpr;
      /* çok büyük ekranda tuvali sınırla (bellek) */
      var enCok = 8.3e6, alan = v1.width * v1.height * olc * olc;
      if (alan > enCok) olc *= Math.sqrt(enCok / alan);
      var vp = sayfa.getViewport({ scale: olc });
      var c = document.createElement('canvas');
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      c.style.width = Math.round(v1.width * css) + 'px';
      c.style.height = Math.round(v1.height * css) + 'px';
      c.setAttribute('role', 'img');
      c.setAttribute('aria-label', ad + ' — slayt ' + n);
      var ctx = c.getContext('2d', { alpha: false });
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height);
      return sayfa.render({ canvasContext: ctx, viewport: vp }).promise.then(function () {
        sakla(n, c);
        return c;
      });
    }).then(function (c) { delete cizim[n]; return c; }, function (e) { delete cizim[n]; throw e; });
    return cizim[n];
  }
  /* en çok 6 çizilmiş slayt bellekte; ekrandaki ve yeni çizilen atılmaz */
  function sakla(n, c) {
    onbellek[n] = c;
    sira = sira.filter(function (x) { return x !== n; }); sira.push(n);
    var fazla = sira.length - 6;
    for (var k = 0; k < sira.length && fazla > 0;) {
      if (sira[k] !== gosterilen && sira[k] !== n) { delete onbellek[sira[k]]; sira.splice(k, 1); fazla--; }
      else k++;
    }
  }
  var istek = 0;
  function goster(n) {
    if (!belge) return;
    clearTimeout(kayZ);                       /* sürgüden bekleyen bir geçiş bunu ezmesin */
    i = Math.max(1, Math.min(adet, n));
    var benim = ++istek;
    sayacYaz();
    if (!onbellek[i]) sahne.classList.add('yukleniyor');
    hazirla(i).then(function (c) {
      if (benim !== istek) return;
      gosterilen = i;
      if (sahne.firstChild !== c) { sahne.textContent = ''; sahne.appendChild(c); }
      sahne.classList.remove('yukleniyor');
      durumGizle();
      onceden();
    }).catch(function (e) {
      if (benim !== istek) return;
      console.warn('slayt çizilemedi', i, e);
      sahne.classList.remove('yukleniyor');
    });
    try { var u = new URLSearchParams(location.search); u.set('s', i); history.replaceState(null, '', '?' + u); } catch (e) {}
  }
  var oncedenZ = 0;
  function onceden() {
    clearTimeout(oncedenZ);
    oncedenZ = setTimeout(function () {
      var j = i, adim = function (k) {
        if (k > 2 || j + k > adet) return;
        hazirla(j + k).then(function () { if (j === i) adim(k + 1); }, function () {});
      };
      adim(1);
      if (i > 1 && !onbellek[i - 1]) setTimeout(function () { if (j === i) hazirla(i - 1).catch(function () {}); }, 400);
    }, 120);
  }
  function sayacYaz() {
    $('#sayac').textContent = i + ' / ' + (adet || '–');
    kay.max = Math.max(1, adet); kay.value = i;
    kay.style.setProperty('--dolu', ((i - 1) / Math.max(1, adet - 1) * 100) + '%');
    $('#geri').disabled = !belge || i <= 1;
    $('#ileri').disabled = !belge || i >= adet;
  }
  function ileri() { if (belge && i < adet) goster(i + 1); }
  function geri() { if (belge && i > 1) goster(i - 1); }
  var boyZ = 0;
  window.addEventListener('resize', function () {
    clearTimeout(boyZ);
    boyZ = setTimeout(function () {
      if (!belge || anahtar() === olcuAnahtar) return;
      olcuAnahtar = anahtar(); onbellek = {}; sira = []; goster(i);
    }, 150);
  });

  /* ---------- durum ---------- */
  function durumGoster(bas, yazi) {
    var d = $('#durum'); d.hidden = false; d.classList.remove('hata');
    $('#durumBas').textContent = bas; $('#durumYazi').textContent = yazi || '';
  }
  function durumGizle() { $('#durum').hidden = true; }
  function hata(bas, yazi, yeniden) {
    var d = $('#durum'); d.hidden = false; d.classList.add('hata');
    $('#durumBas').textContent = bas; $('#durumYazi').textContent = yazi || '';
    $('#yeniden').style.display = yeniden ? '' : 'none';
    $('#sahne').classList.remove('yukleniyor');
  }
  $('#yeniden').onclick = function () { baslat(); };

  /* ---------- düğmeler, dokunma, klavye (sunum.html ile aynı) ---------- */
  $('#geri').onclick = geri;
  $('#ileri').onclick = ileri;
  var kayZ = 0;
  kay.oninput = function () { var v = +kay.value; i = v; sayacYaz(); clearTimeout(kayZ); kayZ = setTimeout(function () { goster(v); }, 60); };
  function tam() {
    var d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { var e = d.documentElement; var f = e.requestFullscreen || e.webkitRequestFullscreen; if (f) { var p = f.call(e); if (p && p.catch) p.catch(function () {}); } }
  }
  $('#tTam').onclick = tam;
  $('#tSakin').onclick = function () { document.body.classList.toggle('sakin'); };
  var cerceve = false;
  try { cerceve = window.self !== window.top; } catch (e) { cerceve = true; }
  if (cerceve) $('#tKapat').hidden = true;          /* kitabın penceresinde: pencerenin kendi kapatma düğmesi var */
  $('#tKapat').onclick = function () { window.close(); setTimeout(function () { history.back(); }, 150); };

  var s = null;
  sahne.addEventListener('pointerdown', function (e) { s = { x: e.clientX, y: e.clientY }; });
  sahne.addEventListener('pointerup', function (e) {
    if (!s) return;
    var dx = e.clientX - s.x, dy = e.clientY - s.y; s = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) { if (dx < 0) ileri(); else geri(); return; }
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
