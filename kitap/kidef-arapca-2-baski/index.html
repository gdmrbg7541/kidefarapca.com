<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>Kidef Arapça 2. Baskı — Flipbook</title>
<!-- Google Analytics (GA4) — yalnız siteden açılınca yüklenir; bilgisayardaki kopyada (file://) yüklenmez -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  if (/^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    var gaB = document.createElement('script'); gaB.async = true;
    gaB.src = 'https://www.googletagmanager.com/gtag/js?id=G-FV9JD15KLW';
    document.head.appendChild(gaB);
    gtag('js', new Date());
    gtag('config', 'G-FV9JD15KLW');
  }
</script>
<meta name="description" content="Kidef Arapça 2. Baskı — etkileşimli dijital kitap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="02_cekirdek/css/flipbook.css">
<link rel="stylesheet" href="02_cekirdek/css/sayfa-html.css">
<link rel="stylesheet" href="02_cekirdek/css/yazi.css">
</head>
<body>

<div class="serit"></div>

<!-- ======================= ÜST ÇUBUK ======================= -->
<header class="ust">
  <div class="marka"><b>Kidef Arapça</b><span>2. Baskı</span></div>

  <div class="konum">
    <span class="u" id="uniteEt">Ünite —</span>
    <span class="d" id="dersEt">—</span>
  </div>

  <div class="araclar">
    <button class="tus etiketli" id="tSozluk" title="Sözlük (S)" aria-label="Sözlük">
      <svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19.5A2 2 0 0 0 6 21.5h13"/><circle cx="12" cy="10" r="3"/><line x1="14.2" y1="12.2" x2="16" y2="14"/></svg>
      <span>Sözlük</span>
    </button>
    <button class="tus etiketli" id="tAraclar" title="Araçlar ve oyunlar (A)" aria-label="Araçlar">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
      <span>Araçlar</span>
    </button>
    <span class="ayrac gizle-kucuk"></span>
    <button class="tus" id="tIcindekiler" title="İçindekiler (I)" aria-label="İçindekiler">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1.4"/><circle cx="3.5" cy="12" r="1.4"/><circle cx="3.5" cy="18" r="1.4"/></svg>
    </button>
    <button class="tus gizle-kucuk" id="tUzaklas" title="Uzaklaş (−)" aria-label="Uzaklaş">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <span class="sayac gizle-kucuk" id="zoomEt">%100</span>
    <button class="tus gizle-kucuk" id="tYaklas" title="Yaklaş (+)" aria-label="Yaklaş">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/></svg>
    </button>
    <button class="tus" id="tIpucu" title="Tıklanabilir alanları göster/gizle (H)" aria-label="İpuçları">
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg>
    </button>
    <button class="tus" id="tTamEkran" title="Tam ekran (F)" aria-label="Tam ekran">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</header>

<!-- ======================= SAHNE ======================= -->
<main class="sahne" id="sahne" tabindex="-1">
  <div class="kaydir" id="kaydir"></div>
</main>

<button class="ok sol" id="okSol" aria-label="Önceki sayfa">
  <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
</button>
<button class="ok sag" id="okSag" aria-label="Sonraki sayfa">
  <svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg>
</button>

<div class="zoom-bilgi" id="zoomBilgi">%100 — sürükleyerek gezin, çift dokunarak çık</div>
<div class="tost" id="tost"></div>

<!-- ======================= ALT ÇUBUK ======================= -->
<footer class="alt">
  <div class="kaydirac">
    <span class="sayac" id="sayfaEt">1 / 231</span>
    <input type="range" id="kaydiracInput" min="1" max="231" value="1" aria-label="Sayfa seç">
  </div>
  <div class="git">
    <label for="gitInput">Sayfaya git</label>
    <input type="text" id="gitInput" inputmode="numeric" placeholder="75">
  </div>
</footer>

<!-- ======================= PERDE ======================= -->
<div class="perde" id="perde"></div>

<!-- ======================= İÇİNDEKİLER ======================= -->
<aside class="panel yan" id="pIcindekiler" aria-hidden="true">
  <div class="pbas">
    <h2>İçindekiler</h2>
    <button class="kapat" data-kapat aria-label="Kapat">&times;</button>
  </div>
  <div class="pgovde">
    <input class="arama" id="aramaInput" type="search" placeholder="Ders, konu veya sayfa ara…" autocomplete="off">
    <div id="tocListe"></div>
  </div>
</aside>

<!-- ======================= SAYFA KAYNAKLARI ======================= -->
<aside class="panel yan" id="pKaynak" aria-hidden="true">
  <div class="pbas">
    <h2 id="kaynakBaslik">Bu sayfanın kaynakları</h2>
    <button class="kapat" data-kapat aria-label="Kapat">&times;</button>
  </div>
  <div class="pgovde"><div class="kaynaklar" id="kaynakListe"></div></div>
</aside>

<!-- ======================= SUNUM ======================= -->
<section class="panel orta" id="pSunum" aria-hidden="true">
  <div class="pbas">
    <span class="rozet">Ders Sunusu</span>
    <h2 id="sunumBaslik">—</h2>
    <a class="dg kucuk pdf-ac" id="sunumPdf" target="_blank" rel="noopener" hidden title="Sununun PDF'ini yeni sekmede aç">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14h6M9 17h4"/></svg>
      <span>PDF</span></a>
    <button class="kapat" data-kapat aria-label="Kapat">&times;</button>
  </div>
  <div class="pgovde">
    <div class="slayt-alan">
      <img id="slaytGorsel" alt="Sunum slaydı">
      <button class="slayt-ok s" id="slaytGeri" aria-label="Önceki slayt">
        <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg></button>
      <button class="slayt-ok g" id="slaytIleri" aria-label="Sonraki slayt">
        <svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg></button>
    </div>
  </div>
  <div class="palt">
    <span class="slayt-sayac" id="slaytSayac">1 / 1</span>
    <input type="range" id="slaytKaydirac" min="1" max="1" value="1" aria-label="Slayt seç">
    <button class="dg" id="slaytTamEkran">Tam ekran</button>
  </div>
</section>

<!-- ======================= CEVAP ANAHTARI ======================= -->
<section class="panel orta" id="pCevap" aria-hidden="true">
  <div class="pbas">
    <span class="rozet">Cevap Anahtarı</span>
    <h2 id="cevapBaslik">—</h2>
    <button class="kapat" data-kapat aria-label="Kapat">&times;</button>
  </div>
  <div class="pgovde"><div class="cevap-alan" id="cevapAlan"><img id="cevapGorsel" alt="Cevap anahtarı"></div></div>
  <div class="palt">
    <div class="cevap-serit" id="cevapSerit"></div>
    <button class="dg altin" id="cevapBindir" title="Cevabı kitap sayfasının üstüne bindir">Sayfaya bindir</button>
  </div>
</section>

<!-- ======================= VİDEO ======================= -->
<section class="panel orta" id="pVideo" aria-hidden="true">
  <div class="pbas">
    <span class="rozet">Video</span>
    <h2 id="videoBaslik">—</h2>
    <button class="kapat" data-kapat aria-label="Kapat">&times;</button>
  </div>
  <div class="pgovde"><div class="video-alan"><video id="videoOyn" controls preload="metadata" playsinline></video></div></div>
</section>

<!-- ======================= ETKİNLİK ======================= -->
<section class="panel orta" id="pEtkinlik" aria-hidden="true">
  <div class="pbas">
    <span class="rozet">Alıştırma</span>
    <h2 id="etkinlikBaslik">—</h2>
    <button class="kapat" data-kapat aria-label="Kapat">&times;</button>
  </div>
  <div class="pgovde" style="padding:0">
    <iframe id="etkinlikCerceve" style="width:100%;height:100%;border:0;display:block" title="Alıştırma"></iframe>
  </div>
</section>

<!-- ======================= SÖZLÜK (sitedeki sozluk.html) ======================= -->
<section class="panel orta" id="pSozluk" aria-hidden="true">
  <div class="pbas">
    <span class="rozet mor">Sözlük</span>
    <h2>Kök ve kelime sözlüğü</h2>
    <span class="pbas-ipucu gizle-kucuk">Arapça ya da Türkçe yaz</span>
    <button class="kapat" data-kapat aria-label="Kapat">&times;</button>
  </div>
  <div class="pgovde" style="padding:0">
    <!-- src ilk açılışta verilir; panel kapanınca da canlı kalır (arama ve favoriler korunur) -->
    <iframe id="sozlukCerceve" style="width:100%;height:100%;border:0;display:block" title="Sözlük"></iframe>
  </div>
</section>

<!-- ======================= ARAÇLAR (sitedeki oyun ve çalışmalar) ======================= -->
<aside class="panel yan genis" id="pAraclar" aria-hidden="true">
  <div class="pbas">
    <h2>Araçlar ve oyunlar</h2>
    <button class="kapat" data-kapat aria-label="Kapat">&times;</button>
  </div>
  <div class="pgovde">
    <input class="arama" id="aracAra" type="search" placeholder="Araç ara… (ör. mezid, kelime, YDT)" autocomplete="off">
    <div id="aracListe"></div>
  </div>
</aside>

<!-- veri: file:// altında fetch CORS'a takıldığı için script olarak yüklenir -->
<script src="03_veri/kitap.js"></script>
<script src="03_veri/html_sayfalar.js"></script>
<script src="03_veri/metin/liste.js"></script>
<script src="02_cekirdek/js/metin.js"></script>
<script src="02_cekirdek/js/flip.js"></script>
<script src="02_cekirdek/js/uygulama.js"></script>
</body>
</html>
