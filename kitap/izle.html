<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Video · Kidef Arapça</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='16' rx='3' fill='%2320C997'/%3E%3Cpath d='M10 9l5 3-5 3z' fill='%23fff'/%3E%3C/svg%3E">
<!--
  KİTAP VİDEOSU YENİ SEKMEDE (22.10.2026)
  Öğretmen: "FLİPBOOK MOTORUNDA VİDEO VE ETKİNLİKLERDE TAM EKRAN VE AYRI SEKMEDE
  ÖZELLİĞİ YOK MU". Kitaplardaki video penceresinin «Yeni sekmede» düğmesi bu
  sayfayı açar: ?v=<site içi yol> &b=<başlık> &t=<saniye>. Yalnız sitenin kendi
  dosyaları ve materyal depoları oynatılır.
-->
<style>
  html,body{margin:0;height:100%;background:#0b1220;color:#e8eef8;
    font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column}
  .ust{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#0f1b30;
    border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
  .marka{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-weight:800;font-size:15px;white-space:nowrap}
  .marka i{width:10px;height:10px;border-radius:50%;background:#20C997;box-shadow:0 0 0 4px rgba(32,201,151,.18)}
  h1{flex:1;min-width:0;margin:0;font-size:15px;font-weight:700;color:#cbd6e6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);
    color:#fff;border-radius:99px;padding:8px 14px;font:700 13px/1 inherit;cursor:pointer;white-space:nowrap}
  button:hover{background:rgba(255,255,255,.14)}
  button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .alan{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
  video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .hata{padding:28px;text-align:center;color:#fecaca;font-size:15px;line-height:1.6}
  .hata a{color:#7dd3fc}
  @media (max-width:560px){ .marka span{display:none} button span{display:none} }
</style>
</head>
<body>
<div class="ust">
  <a class="marka" href="/" title="Kidef Arapça ana sayfa"><i></i><span>Kidef Arapça</span></a>
  <h1 id="baslik">Video</h1>
  <button id="tam" type="button" title="Tam ekran"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Tam ekran</span></button>
</div>
<div class="alan" id="alan"><video id="v" controls playsinline preload="metadata"></video></div>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var ham = q.get('v') || '', b = (q.get('b') || '').slice(0, 160), t = Math.max(0, parseInt(q.get('t'), 10) || 0);
  var v = document.getElementById('v'), alan = document.getElementById('alan');
  if (b) { document.getElementById('baslik').textContent = b; document.title = b + ' · Kidef Arapça'; }

  /* yalnız sitenin kendi dosyaları ve materyal depoları */
  function izinli(u) {
    var x;
    try { x = new URL(u, location.href); } catch (e) { return null; }
    if (x.origin === location.origin && /^\/(kitap|kidefarapca-materyal-)/.test(x.pathname)) return x.href;
    if (x.protocol === 'https:' && x.hostname === 'kidefarapca.com' && /^\/(kitap|kidefarapca-materyal-)/.test(x.pathname)) return x.href;
    if (x.protocol === 'https:' && x.hostname === 'gdmrbg7541.github.io' && /^\/kidefarapca-materyal-[^\/]+\//.test(x.pathname)) return x.href;
    return null;
  }
  var adres = izinli(ham);
  if (!adres || !/\.(mp4|webm|m4v|mov|ogv)(\?|#|$)/i.test(adres)) {
    alan.innerHTML = '<div class="hata">Bu video açılamadı.<br><a href="/">Kidef Arapça ana sayfaya dön</a></div>';
    document.getElementById('tam').hidden = true;
    return;
  }
  v.addEventListener('loadedmetadata', function () {
    if (t && t < (v.duration || 0)) { try { v.currentTime = t; } catch (e) { } }
  }, { once: true });
  v.addEventListener('error', function () {
    alan.innerHTML = '<div class="hata">Video yüklenemedi · internet bağlantını denetle.<br><a href="' + location.href.replace(/"/g, '&quot;') + '">Yeniden dene</a></div>';
  });
  v.src = adres;
  var p = v.play(); if (p && p.catch) p.catch(function () { });

  document.getElementById('tam').addEventListener('click', function () {
    var f = document.fullscreenElement || document.webkitFullscreenElement;
    if (f) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    var iste = v.requestFullscreen || v.webkitRequestFullscreen;
    if (iste) { try { var s = iste.call(v); if (s && s.catch) s.catch(function () { }); return; } catch (e) { } }
    if (v.webkitEnterFullscreen) { try { v.webkitEnterFullscreen(); } catch (e) { } }
  });
})();
</script>
</body>
</html>
