<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arapça Eğitim Portalı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pdf-red: #b30b00;
            --pdf-dark: #8b0000;
            --bg-light: #f1f5f9;
            --text-main: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-light); color: var(--text-main); line-height: 1.6; }

        /* Header */
        header {
            background: var(--pdf-red);
            color: white;
            padding: 50px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        header h1 { font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; }

        /* Sınıf Seçici */
        .class-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: -30px;
            padding: 0 15px;
            z-index: 100;
            position: relative;
        }

        .class-btn {
            background: white;
            border: 2px solid var(--pdf-red);
            color: var(--pdf-red);
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 1rem;
        }

        .class-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .class-btn.active { background: var(--pdf-red); color: white; }

        /* İçerik Konteynırı */
        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        /* Ünite Kartları */
        .unit-card {
            background: white;
            border-radius: 20px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .unit-header {
            padding: 20px 25px;
            background: #fafafa;
            color: var(--pdf-red);
            font-weight: 900;
            font-size: 1.3rem;
            border-bottom: 2px solid #f1f1f1;
            display: flex;
            align-items: center;
        }
        .unit-header::before {
            content: "";
            width: 10px;
            height: 25px;
            background: var(--pdf-red);
            margin-right: 15px;
            border-radius: 4px;
        }

        /* Ders Listesi */
        .lesson-list { padding: 10px 0; }

        .lesson-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 25px;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.2s;
        }
        .lesson-item:hover { background: #f8fafc; }
        .lesson-item:last-child { border-bottom: none; }

        .lesson-info { display: flex; flex-direction: column; }
        .lesson-name { font-weight: 700; color: #334155; font-size: 1.1rem; }

        /* Aksiyon Butonları */
        .btn-group { display: flex; gap: 10px; }

        .action-btn {
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.2s ease;
            text-align: center;
            min-width: 110px;
        }

        .btn-kelime { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .btn-kelime:hover { background: #e2e8f0; color: #1e293b; }

        .btn-simultane { background: var(--pdf-red); color: white; }
        .btn-simultane:hover { background: var(--pdf-dark); }

        /* Mobil Düzenleme */
        @media (max-width: 600px) {
            .lesson-item { flex-direction: column; align-items: flex-start; gap: 15px; }
            .btn-group { width: 100%; }
            .action-btn { flex: 1; font-size: 0.8rem; padding: 12px 5px; }
            header h1 { font-size: 1.6rem; }
        }
/* --- YENİ EKLENEN YEŞİL STİLLER --- */
        
        /* Hazır olan Kelime butonu (Yeşil Çerçeve) */
        .btn-kelime.hazir {
            border-color: #16a34a; /* Yeşil Çerçeve */
            color: #16a34a;       /* Yeşil Yazı */
            background-color: #f0fdf4; /* Çok açık yeşil zemin */
        }
        .btn-kelime.hazir:hover {
            background-color: #dcfce7;
        }

        /* Hazır olan Simültane butonu (Yeşil Zemin) */
        .btn-simultane.hazir {
            background-color: #16a34a; /* Yeşil Zemin */
        }
        .btn-simultane.hazir:hover {
            background-color: #15803d; /* Koyu Yeşil (hover) */
        }
/* --- HAZIR SINIF (YEŞİL) TASARIMI --- */
        
        /* 10. Sınıf gibi hazır olan butonların normal hali (Yeşil Çerçeve) */
        .class-btn.hazir-sinif {
            border-color: #16a34a;  /* Yeşil Çerçeve */
            color: #16a34a;         /* Yeşil Yazı */
            background-color: #f0fdf4; /* Çok hafif yeşil zemin */
        }

        /* Üzerine gelince (Hover) */
        .class-btn.hazir-sinif:hover {
            background-color: #dcfce7; /* Biraz daha koyu yeşil zemin */
            box-shadow: 0 6px 12px rgba(22, 163, 74, 0.25); /* Yeşil gölge */
        }

        /* Buton seçildiğinde (Active) - İçi tamamen yeşil olsun */
        .class-btn.hazir-sinif.active {
            background-color: #16a34a;
            color: white;
            border-color: #16a34a;
        }
    </style>
</head>

/**
 * Belirlenen ünite isimlerine göre her üniteye 4 ders atayan yardımcı fonksiyon.
 * Ders isimlerini daha sonra manuel olarak değiştirebilirsiniz.
 */
function createClassData(classLevel, unitNames) {
    return unitNames.map((uName, uIdx) => {
        let uNum = uIdx + 1;
        return {
            unitName: `${uNum}. Ünite: ${uName}`,
            lessons: [
                { name: `1. Ders: Kelime ve Kavramlar`, kelimeUrl: `kelime_${classLevel}_${uNum}_1.html`, simultaneUrl: `simultane_${classLevel}_${uNum}_1.html` },
                { name: `2. Ders: Okuma ve Anlama`, kelimeUrl: `kelime_${classLevel}_${uNum}_2.html`, simultaneUrl: `simultane_${classLevel}_${uNum}_2.html` },
                { name: `3. Ders: Dilbilgisi ve Pratik`, kelimeUrl: `kelime_${classLevel}_${uNum}_3.html`, simultaneUrl: `simultane_${classLevel}_${uNum}_3.html` },
                { name: `4. Ders: Diyalog ve Konuşma`, kelimeUrl: `kelime_${classLevel}_${uNum}_4.html`, simultaneUrl: `simultane_${classLevel}_${uNum}_4.html` }
            ]
        };
    });
}

   
// Sınıf Butonlarını Oluşturma Fonksiyonu (GÜNCELLENMİŞ)
    function renderClassButtons() {
        const btnContainer = document.getElementById('class-buttons');
        // Hafızada seçim yoksa, hazır olduğu için varsayılan olarak 10 açılsın
        const lastClass = localStorage.getItem('lastSelectedClass') || "10"; 
        
        Object.keys(educationData).forEach(classLevel => {
            const btn = document.createElement('button');
            btn.className = 'class-btn'; // Standart sınıfı ekle
            btn.innerText = classLevel + ". Sınıf";
            
            // --- KİLİT NOKTA BURASI ---
            // Eğer sınıf "10" ise, ona özel 'hazir-sinif' etiketini yapıştır.
            // İleride 11. sınıf hazır olursa burayı: if (classLevel === "10" || classLevel === "11") yapabilirsiniz.
            if (classLevel === "10") {
                btn.classList.add('hazir-sinif');
            }
            // ---------------------------

            // Tıklama olaylarını ayarla
            btn.onclick = () => selectClass(classLevel, btn);

            // Eğer bu buton en son seçilen ise 'active' yap
            if (classLevel === lastClass) {
                // Sayfa ilk açıldığında seçili butonu boyamak için selectClass'ı çağırıyoruz
                btnContainer.appendChild(btn);
                selectClass(classLevel, btn); 
            } else {
                btnContainer.appendChild(btn);
            }
        });
    }

    // Sınıf Seçildiğinde İçeriği Göster
    function selectClass(level, btnElement) {
         localStorage.setItem('lastSelectedClass', level);
        // Buton Aktiflik Durumu
        document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');

        const container = document.getElementById('unit-container');
        container.innerHTML = ''; // Temizle

        const units = educationData[level];

        units.forEach(unit => {
            const unitCard = document.createElement('div');
            unitCard.className = 'unit-card';
            
            let lessonsHTML = unit.lessons.map(lesson => {
                // Eğer veride 'aktif: true' varsa 'hazir' sınıfını ekle, yoksa boş bırak
                const statusClass = lesson.aktif ? 'hazir' : '';
                
                return `
                <div class="lesson-item">
                    <div class="lesson-info">
                        <span class="lesson-name">${lesson.name}</span>
                    </div>
                    <div class="btn-group">
                        <a href="${lesson.kelimeUrl}" class="action-btn btn-kelime ${statusClass}">Kelimeler</a>
                        <a href="${lesson.simultaneUrl}" class="action-btn btn-simultane ${statusClass}">Simültane</a>
                    </div>
                </div>
            `}).join('');

            unitCard.innerHTML = `
                <div class="unit-header">${unit.unitName}</div>
                <div class="lesson-list">${lessonsHTML}</div>
            `;
            container.appendChild(unitCard);
        });

        // Sayfa başına yumuşak kaydır
        window.scrollTo({ top: headerHeight(), behavior: 'smooth' });
    }

    function headerHeight() {
        return document.querySelector('header').offsetHeight - 50;
    }

    // Başlat
    renderClassButtons();
</script>
