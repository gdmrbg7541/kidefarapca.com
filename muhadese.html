    <style>
        :root {
            --pdf-red: #b30b00;
            --pdf-dark: #8b0000;
            --bg-light: #f1f5f9;
            --text-main: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-light); color: var(--text-main); line-height: 1.6; }

        /* Header */
        header {
            background: var(--pdf-red);
            color: white;
            padding: 50px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative; /* Ana sayfa butonu için gerekli */
        }
        header h1 { font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; }

        /* --- YENİ EKLENEN ANA SAYFA BUTONU --- */
        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2); /* Yarı saydam beyaz */
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .home-btn:hover {
            background: white;
            color: var(--pdf-red);
        }

        /* Sınıf Seçici */
        .class-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: -30px;
            padding: 0 15px;
            z-index: 100;
            position: relative;
        }

        .class-btn {
            background: white;
            border: 2px solid var(--pdf-red);
            color: var(--pdf-red);
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 1rem;
        }

        .class-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .class-btn.active { background: var(--pdf-red); color: white; }

        /* İçerik Konteynırı */
        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        /* Ünite Kartları */
        .unit-card {
            background: white;
            border-radius: 20px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .unit-header {
            padding: 20px 25px;
            background: #fafafa;
            color: var(--pdf-red);
            font-weight: 900;
            font-size: 1.3rem;
            border-bottom: 2px solid #f1f1f1;
            display: flex;
            align-items: center;
        }
        .unit-header::before {
            content: "";
            width: 10px;
            height: 25px;
            background: var(--pdf-red);
            margin-right: 15px;
            border-radius: 4px;
        }

        /* Ders Listesi */
        .lesson-list { padding: 10px 0; }

        .lesson-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 25px;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.2s;
        }
        .lesson-item:hover { background: #f8fafc; }
        .lesson-item:last-child { border-bottom: none; }

        .lesson-info { display: flex; flex-direction: column; }
        .lesson-name { font-weight: 700; color: #334155; font-size: 1.1rem; }

        /* Aksiyon Butonları */
        .btn-group { display: flex; gap: 10px; }

        .action-btn {
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.2s ease;
            text-align: center;
            min-width: 110px;
        }

        .btn-kelime { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .btn-kelime:hover { background: #e2e8f0; color: #1e293b; }

        .btn-simultane { background: var(--pdf-red); color: white; }
        .btn-simultane:hover { background: var(--pdf-dark); }

        /* Mobil Düzenleme */
        @media (max-width: 600px) {
            .lesson-item { flex-direction: column; align-items: flex-start; gap: 15px; }
            .btn-group { width: 100%; }
            .action-btn { flex: 1; font-size: 0.8rem; padding: 12px 5px; }
            header h1 { font-size: 1.6rem; }
            
            /* Mobilde ana sayfa butonu */
            .home-btn {
                position: static;
                display: inline-block;
                margin-bottom: 15px;
            }
        }

        /* --- HAZIR KELİME & SİMULTANE TASARIMI --- */
        .btn-kelime.hazir {
            border-color: #16a34a; 
            color: #16a34a;       
            background-color: #f0fdf4; 
        }
        .btn-kelime.hazir:hover { background-color: #dcfce7; }

        .btn-simultane.hazir { background-color: #16a34a; }
        .btn-simultane.hazir:hover { background-color: #15803d; }

        /* --- HAZIR SINIF (YEŞİL) TASARIMI --- */
        .class-btn.hazir-sinif {
            border-color: #16a34a;  
            color: #16a34a;         
            background-color: #f0fdf4; 
        }
        .class-btn.hazir-sinif:hover {
            background-color: #dcfce7; 
            box-shadow: 0 6px 12px rgba(22, 163, 74, 0.25); 
        }
        .class-btn.hazir-sinif.active {
            background-color: #16a34a;
            color: white;
            border-color: #16a34a;
        }

/* Eğer ders ismi boşsa satırı daha derli toplu göster */

/* 7. Sınıfa özel veya genel buton genişletme */
.lesson-item:has(.lesson-name:empty) .btn-group {

    display: grid;
    grid-template-columns: 1fr 1fr; /* Yan yana iki dev buton */
    gap: 15px;
}

.lesson-item:has(.lesson-name:empty) .action-btn {
    padding: 15px;
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
}

// Sınıf Butonlarını Oluşturma
    function renderClassButtons() {
        const btnContainer = document.getElementById('class-buttons');
        const lastClass = localStorage.getItem('lastSelectedClass') || "10"; 
        
        Object.keys(educationData).forEach(classLevel => {
            const btn = document.createElement('button');
            btn.className = 'class-btn';
            btn.innerText = classLevel + ". Sınıf";
            
            // 10. Sınıf butonu yeşil
           if (classLevel === "10" || classLevel === "7") {
                btn.classList.add('hazir-sinif');
            }

            btn.onclick = () => selectClass(classLevel, btn);

            if (classLevel === lastClass) {
                btnContainer.appendChild(btn);
                selectClass(classLevel, btn); 
            } else {
                btnContainer.appendChild(btn);
            }
        });
    }

    // Sınıf Seçildiğinde İçeriği Göster
    function selectClass(level, btnElement) {
        localStorage.setItem('lastSelectedClass', level);
        document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');

        const container = document.getElementById('unit-container');
        container.innerHTML = '';

        const units = educationData[level];

        units.forEach(unit => {
            const unitCard = document.createElement('div');
            unitCard.className = 'unit-card';
            
let lessonsHTML = unit.lessons.map(lesson => {
    const statusClass = lesson.aktif ? 'hazir' : '';
    const nameSpan = lesson.name ? `<span class="lesson-name">${lesson.name}</span>` : '<span class="lesson-name" style="display:none"></span>';
    
    return `
    <div class="lesson-item">
        <div class="lesson-info">
            ${nameSpan}
        </div>
        <div class="btn-group">
            <a href="${lesson.kelimeUrl}" class="action-btn btn-kelime ${statusClass}">📚 KELİMELER</a>
            <a href="${lesson.simultaneUrl}" class="action-btn btn-simultane ${statusClass}">🎧 SİMÜLTANE</a>
        </div>
    </div>
`}).join('');

            unitCard.innerHTML = `
                <div class="unit-header">${unit.unitName}</div>
                <div class="lesson-list">${lessonsHTML}</div>
            `;
            container.appendChild(unitCard);
        });

        window.scrollTo({ top: headerHeight(), behavior: 'smooth' });
    }

    function headerHeight() {
        return document.querySelector('header').offsetHeight - 50;
    }

    // Başlat
    renderClassButtons();
