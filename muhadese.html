<script>
/* TEK KAPI — bu dosya iki isi birden gorur:
   .  muhadese.html                 -> LISTE modu (sekmeler / basliklar / dersler)
   .  muhadese.html?ders=10_1_1     -> OYNATICI modu (okul dersi)
   .  muhadese.html?ders=kalip_selam-> OYNATICI modu (kalip ifade basligi)
   .  muhadese.html?ders=alan_saglik-> OYNATICI modu (alan konusu)
   Ilgili CSS/JS yalnizca o moda gore yuklenir; iki tasarim birbirine karismaz.
   Ek parametreler:  kaynak=liste|index  (geri tusu nereye donecek)
                     kat=okul|kalip|alan (liste moduna donerken acilacak sekme)
                     konu=<anahtar>      (liste moduna donerken acilacak baslik)
                     sinif=N             (eski baglantilar icin; kat=okul demek)
                     yer=<id>            (index'e donerken gidilecek bolum)
   TUM MUHADESE DOSYALARI  muhadese/  klasorunde, ders verileri  muhadese/veri/ icinde. */
(function(){
  var KOK = 'muhadese/';           /* klasor yolu tek yerden yonetilsin */
  var S   = '?v=20260816f';        /* onbellek surumu */
  var p = new URLSearchParams(location.search);
  var d = p.get('ders') || '';
  /* Gecerli bicimler: 10_1_1 (okul) | kalip_xxx | alan_xxx */
  if (!/^([0-9]+(_[0-9]+)+|(kalip|alan)_[a-z0-9]+)$/.test(d)) d = '';
  window.KIDEF_DERS = d;
  document.documentElement.className += (d ? ' kd-oyun' : ' kd-liste');

  /* Hangi veri dosyasi yuklenecek? */
  var veri = '';
  if (d){
    var t = /^(kalip|alan)_/.exec(d);
    veri = KOK + 'veri/' + (t ? t[1] : d) + '.js';
  }

  var y = [];
  if (d){
    document.title = 'Arapça Simultane & Diyalog';
    y.push('<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;300&family=Amiri:wght@400&display=swap" rel="stylesheet">');
    y.push('<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">');
    /* Site arayuz yazi tipi: Turkce kabuk yazilari Marhey ile gosterilsin.
       Arapca metinler Arakom'da kalir (bkz. simultane.css). */
    y.push('<link href="https://fonts.googleapis.com/css2?family=Marhey:wght@300;400;500;600;700&display=swap" rel="stylesheet">');
    y.push('<link rel="stylesheet" href="' + KOK + 'simultane.css' + S + '">');
  } else {
    y.push('<link rel="preconnect" href="https://fonts.googleapis.com">');
    y.push('<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>');
    y.push('<link href="https://fonts.googleapis.com/css2?family=Marhey:wght@300;400;500;600;700&family=Harmattan:wght@400;700&display=swap" rel="stylesheet">');
    y.push('<link rel="stylesheet" href="' + KOK + 'muhadese.css' + S + '">');
  }
  y.push('<link rel="stylesheet" href="arakom.css?v=1">');
  if (d){
    y.push('<scr'+'ipt src="' + veri + S + '"><\/scr'+'ipt>');
    /* SARF KÖPRÜSÜ: kökü bilinen kelimelerin altına rozet konur, tıklanınca
       kalıplar tablosu sekmesine geçilir. Harita küçük (35 KB), sarf motoru
       burada YÜKLENMEZ. Yeni ünite eklenince kok_haritasi.js yeniden üretilmeli. */
    y.push('<scr'+'ipt src="' + KOK + 'veri/kok_haritasi.js' + S + '"><\/scr'+'ipt>');
    y.push('<scr'+'ipt src="' + KOK + 'sarfkopru.js' + S + '"><\/scr'+'ipt>');
    y.push('<scr'+'ipt src="' + KOK + 'simultane.js' + S + '"><\/scr'+'ipt>');
  } else {
    /* Liste modu: kalip ve alan basliklarini da bu iki dosyadan okur */
    y.push('<scr'+'ipt src="' + KOK + 'veri/kalip.js' + S + '"><\/scr'+'ipt>');
    y.push('<scr'+'ipt src="' + KOK + 'veri/alan.js'  + S + '"><\/scr'+'ipt>');
  }
  document.write(y.join(''));
})();
</script>

<script>
/* GERİ TUŞU — nereden gelindiyse oraya döner.
   kaynak=liste  -> muhadese.html liste moduna (o sınıf açık)
   kaynak=index  -> index.html'de geldiği bölüme (yeni sekmede açıldıysa sekme kapanır,
                    index sekmesi zaten ilgili kartta açık kalır) */
function muhGeri(e){
  if (e && e.preventDefault) e.preventDefault();
  var p = new URLSearchParams(location.search);
  var kaynak = p.get('kaynak') || '';
  var sinif  = p.get('sinif')  || '';

  if (kaynak === 'liste'){
    /* Listeye dön: hangi sekme ve hangi başlık açıksa oraya.
       'sinif' eski (okul) bağlantılarla uyum için korunuyor. */
    var kat  = (p.get('kat')  || '').replace(/[^a-z]/g, '');
    var konu = (p.get('konu') || '').replace(/[^A-Za-z0-9_-]/g, '');
    var sor  = [];
    if (kat)   sor.push('kat='  + encodeURIComponent(kat));
    if (konu)  sor.push('konu=' + encodeURIComponent(konu));
    if (sinif) sor.push('sinif='+ encodeURIComponent(sinif));
    window.location.href = 'muhadese.html' + (sor.length ? ('?' + sor.join('&')) : '');
    return false;
  }

  var yer = (p.get('yer') || '').replace(/[^A-Za-z0-9_-]/g, '');
  var hedef = 'index.html' + (yer ? ('#' + yer) : '');

  /* index.html'in "vitrin kapısı" bizi indeks.html'e atmasın: dersten çıkan
     kullanıcı zaten site içindedir, doğrudan ilgili bölüme dönmelidir. */
  try { sessionStorage.setItem('kidefVitrin', '1'); } catch (_) {}

  try {
    if (window.opener && !window.opener.closed){        /* index'ten yeni sekmede açıldı */
      window.close();
      setTimeout(function(){ if (!window.closed) window.location.href = hedef; }, 250);
      return false;
    }
  } catch (_) {}

  /* eski bağlantılar için emniyet: listeden gelinmişse geri git */
  if (!kaynak && document.referrer && document.referrer.indexOf('muhadese.html') !== -1
      && window.history.length > 1){
    window.history.back();
    return false;
  }
  window.location.href = hedef;
  return false;
