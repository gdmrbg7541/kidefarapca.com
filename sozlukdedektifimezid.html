<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arapça Sözlük Dedektifi - Kök Bulma</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap');

    :root {
        --primary: #2c3e50;
        --secondary: #2980b9;
        --bg-body: #2d3436;
        --bg-panel: #fdfdfd;
    }

    body {
        font-family: 'Rubik', sans-serif;
        background-color: var(--bg-body);
        margin: 0;
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* --- MASAÜSTÜ VARSAYILAN --- */
    #game-stage {
        background-color: var(--bg-panel);
        width: 95vw;
        aspect-ratio: 16/9;
        max-height: 95vh;
        border-radius: 20px;
        box-shadow: 0 0 50px rgba(0,0,0,0.5);
        display: grid;
        grid-template-columns: 6fr 4fr;
        overflow: hidden;
        padding: 20px;
        gap: 20px;
        box-sizing: border-box;
    }

    #left-panel {
        background: #f1f2f6;
        border-radius: 15px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
        border: 2px solid #dfe6e9;
    }

    .accordion-btn {
        background: var(--primary);
        color: white;
        padding: 4px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        text-align: center;
        font-size: 1.6rem;
        display: flex; justify-content: space-between; align-items: center;
    }
    .accordion-content {
        background: white; border-radius: 0 0 8px 8px; overflow: hidden;
        max-height: 0; transition: max-height 0.4s ease-out; margin-bottom: 5px; border: 1px solid #dfe6e9;
    }
    .accordion-content.open { max-height: 800px; }

    .verb-table { width: 100%; border-collapse: separate; border-spacing: 4px; direction: rtl; }
    .verb-table td {
        background: white; border: 1px solid #b2bec3;
        font-family: 'Noto Naskh Arabic', serif; font-size: 2.8rem; 
        color: var(--primary); text-align: center; border-radius: 4px;
        height: 45px; vertical-align: middle; position: relative;
    }
    .highlight-cell {
        background-color: #ffeaa7 !important; border: 3px solid #fdcb6e !important;
        color: #d35400 !important; transform: scale(1.05); z-index: 5;
    }
    .frozen-cell::after {
        content: '?'; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #81ecec, #74b9ff); display: flex;
        align-items: center; justify-content: center; color: rgba(255,255,255,0.8);
        font-size: 2rem; border-radius: 4px; z-index: 10;
    }
    .frozen-cell.crack-1::after { background: repeating-linear-gradient(45deg, #81ecec, #81ecec 10px, #74b9ff 10px, #74b9ff 20px); opacity: 0.8; }
    .frozen-cell.crack-2::after { opacity: 0; pointer-events: none; }

    #right-panel { display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
    
    #section-question {
        flex: 0.4; display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; background: #ecf0f1;
        border-radius: 15px; margin-bottom: 20px; padding: 15px; border: 2px dashed #bdc3c7;
    }

    .question-highlight {
        font-family: 'Noto Naskh Arabic', serif; font-weight: 700; 
        font-size: 3.5rem; /* Masaüstü Font */
        color: var(--primary); margin: 5px 0; background: white; padding: 5px 80px;
        border-radius: 10px; box-shadow: 0 4px 0 #dfe6e9;
    }

    .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; flex: 1; }

    .det-opt-btn {
        font-family: 'Noto Naskh Arabic', serif; font-size: 3rem; background: white;
        border: 3px solid #e0e6ed; border-radius: 15px; cursor: pointer; color: var(--primary);
        height: 100%; box-shadow: 0 5px 0 #b2bec3;
    }
    .det-opt-btn:last-child { grid-column: 1 / -1; width: 60%; justify-self: center; }

    /* İpucu ve İkon Varsayılanları */
    .mobile-hint { display: block; }
    .mobile-home-btn { display: none; position: absolute; left: 10px; top: 10px; color: #b2bec3; }

    /* ========================================= */
    /* MOBİL DİKEY (PORTRAIT) */
    /* ========================================= */
    @media screen and (max-width: 900px) {
        #game-stage {
            grid-template-columns: 1fr; grid-template-rows: 1fr;
            aspect-ratio: auto; height: 85dvh; width: 95vw; padding: 10px;
        }

        #left-panel, .mobile-hint { display: none !important; }
        .mobile-home-btn { display: block; }

        #right-panel { justify-content: flex-start; gap: 5px; }
        #section-question { flex: 0 0 auto; margin-bottom: 5px; padding: 10px; }
        
        .question-highlight { 
            font-size: 2rem !important; 
            padding: 5px 20px; 
            width: auto;
        }

        #section-question > div:nth-child(2),
        #section-question > div:nth-child(4) { font-size: 1rem !important; margin-top: 5px !important; }

        .options-container { flex: 1; gap: 8px; padding-bottom: 10px; }
        .det-opt-btn { font-size: 1.8rem; border-width: 2px; }
    }

    /* ========================================= */
    /* MOBİL YATAY (LANDSCAPE) - FİNAL DÜZELTME */
    /* ========================================= */
    @media screen and (max-height: 500px) and (orientation: landscape) {
        #game-stage {
            height: 100dvh; /* Ekranı tam kapla */
            padding: 5px;
            grid-template-columns: 1fr; 
        }

        #left-panel, .mobile-hint { display: none !important; }
        .mobile-home-btn { display: block; top: 5px; left: 5px; } /* İkonu biraz köşeye çek */

        #right-panel {
            flex-direction: column;
            justify-content: center; /* Ortala */
            gap: 5px;
            height: 100%;
            padding: 0 5px; /* Yanlardan biraz boşluk */
        }

        /* --- Üst Kısım: Soru Kutusu --- */
        #section-question {
            flex: 0 0 auto; /* İçerik kadar yer kapla, esneme */
            width: 100%;
            margin: 0; 
            padding: 5px; /* İç boşluğu azalttık */
            min-height: auto;
            background: #ecf0f1; /* Arkaplan rengi */
        }

        /* Soru Kelimesi (Kutuya Sığdırma Ayarları) */
        .question-highlight { 
            font-size: 2.5rem !important; /* İstenen Boyut */
            line-height: 1.1; /* Satır aralığını sıkılaştır */
            margin: 2px 0 !important; 
            padding: 0 15px !important;
            box-shadow: none; /* Gölge yer kaplamasın */
            border: 1px solid #dfe6e9; /* Hafif sınır */
        }
        
        /* Diğer küçük yazılar */
        #section-question > div:nth-child(2) { display: none; } /* "Aranan Kelime" yazısını kaldır (yer açmak için) */
        
        #section-question > div:nth-child(4) { 
            font-size: 0.8rem !important; 
            margin-top: 2px !important;
            line-height: 1;
        }

        /* --- Alt Kısım: Şıklar (1 Satır 5 Sütun) --- */
        .options-container {
            flex: 0 0 auto; /* Esnemesin, buton boyu kadar olsun */
            display: grid;
            grid-template-columns: repeat(5, 1fr) !important;
            gap: 5px;
            width: 100%;
            margin-top: 5px;
        }
        
        .det-opt-btn:last-child { grid-column: auto; width: 100%; }
        
        /* Buton Stili */
        .det-opt-btn { 
            font-size: 2rem; 
            height: 60px; /* SABİT YÜKSEKLİK - Artık uzamayacak */
            border-radius: 8px; 
            padding: 0;
            line-height: 1;
            display: flex; align-items: center; justify-content: center;
        }
    }
</style>
</head>

    // --- VERİ DÖNÜŞTÜRÜCÜ VE SENARYO HAZIRLAYICI ---
    function generateScenarios(data) {
        const gameScenarios = [];

        Object.keys(data).forEach(root => {
            const verbData = data[root];

            // 1. Tabloları Oluştur (5x3 ve 2x3 formatı)
            const maziTable = [
                verbData.mazi.slice(0, 3), // Müfred, Tesniye, Cemi
                verbData.mazi.slice(3, 6),
                verbData.mazi.slice(6, 9),
                verbData.mazi.slice(9, 12),
                [verbData.mazi[12], verbData.mazi[13], verbData.mazi[13]]
            ];

            const muzariTable = [
                verbData.muzari.slice(0, 3),
                verbData.muzari.slice(3, 6),
                verbData.muzari.slice(6, 9),
                verbData.muzari.slice(9, 12),
                [verbData.muzari[12], verbData.muzari[13], verbData.muzari[13]]
            ];

            const emirTable = [
                verbData.emir.slice(0, 3),
                verbData.emir.slice(3, 6)
            ];

            // 2. Rastgele Bir Hedef Kelime Seç (Soru)
            // Tüm kelimeler havuzu
            const allForms = [...verbData.mazi, ...verbData.muzari, ...verbData.emir];
            
            // Hedef kelime olarak KÖK kelimeyi hariç tutuyoruz (ki soru direk cevap olmasın)
            // Soru: Yektubu -> Cevap: Ketebe olsun.
            const possibleTargets = allForms.filter(word => word !== root);
            const target = possibleTargets.length > 0 
                ? possibleTargets[Math.floor(Math.random() * possibleTargets.length)] 
                : root;

            // 3. DOĞRU CEVAP: Her zaman KÖK kelime (Mazi 1. Hücre)
            const correctAnswer = root; 

            // 4. Şıkları Oluştur (Doğru Cevap + 4 Yanıltıcı)
            let options = new Set();
            options.add(correctAnswer); // Doğru cevabı ekle

            // Yanıltıcıları ekle (Aynı fiilin diğer çekimlerinden seçelim)
            while(options.size < 5) {
                const randomDistractor = allForms[Math.floor(Math.random() * allForms.length)];
                options.add(randomDistractor);
            }

            // Senaryoyu ekle
            gameScenarios.push({
                root: root,           // Kök (Doğru Cevap)
                target: target,       // Soru (Görünen kelime)
                tables: {
                    mazi: maziTable,
                    muzari: muzariTable,
                    emir: emirTable
                },
                opts: Array.from(options)
            });
        });

        // Karıştır
        return gameScenarios.sort(() => Math.random() - 0.5);
    }

    // --- OYUN DEĞİŞKENLERİ ---
    let scenarios = [];
    let currentIdx = 0;

    // --- TABLO HTML OLUŞTURUCU ---
    function generateTableHTML(dataRows, type, targetWord) {
        let html = `<table class="verb-table">
            <tr>
                <th>Müfred</th>
                <th>Tesniye</th>
                <th>Cemi</th>
            </tr>`;
        
        dataRows.forEach((row, rowIndex) => {
            html += "<tr>";
            row.forEach((word, colIndex) => {
                let cellClass = "";
                
                // Buzlu Hücre: SADECE Mazi tablosunun ilk hücresi (Kök/Cevap)
                if(type === 'mazi' && rowIndex === 0 && colIndex === 0) {
                    cellClass = "frozen-cell";
                }

                // Vurgulu Hücre: Aranan (Sorulan) kelime
                if (word === targetWord) {
                    cellClass += " highlight-cell";
                }

                if (cellClass.includes("frozen-cell")) {
                    html += `<td class="${cellClass}" data-clicks="0" onclick="crackIce(this)">${word}</td>`;
                } else {
                    html += `<td class="${cellClass}">${word}</td>`;
                }
            });
            html += "</tr>";
        });
        html += "</table>";
        return html;
    }

    // --- OYUN YÖNETİMİ ---
    function loadScenario() {
        if (scenarios.length === 0) {
            scenarios = generateScenarios(rawVerbs);
        }

        const data = scenarios[currentIdx];

        // 1. Soru Gösterimi (Target)
        document.getElementById('target-word-display').innerText = data.target;
        
        const optsArea = document.getElementById('options-area');
        optsArea.innerHTML = "";
        
        // 2. Şıkları Karıştır
        const shuffledOpts = [...data.opts].sort(() => Math.random() - 0.5);
        
        shuffledOpts.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'det-opt-btn';
            btn.innerText = opt;
            // DİKKAT: Artık data.root (kök kelime) ile karşılaştırıyoruz
            btn.onclick = () => checkAnswer(opt, data.root, btn); 
            optsArea.appendChild(btn);
        });

        // 3. Tabloları Yükle
        document.getElementById('table-mazi-area').innerHTML = generateTableHTML(data.tables.mazi, 'mazi', data.target);
        document.getElementById('table-muzari-area').innerHTML = generateTableHTML(data.tables.muzari, 'muzari', data.target);
        document.getElementById('table-emir-area').innerHTML = generateTableHTML(data.tables.emir, 'emir', data.target);

        // 4. İpucu Dosyasını Aç (Vurgulu kelime neredeyse orayı aç)
        closeAllPanels();
        let foundType = null;
        if (checkIfWordInTable(data.tables.mazi, data.target)) foundType = 'mazi';
        else if (checkIfWordInTable(data.tables.muzari, data.target)) foundType = 'muzari';
        else if (checkIfWordInTable(data.tables.emir, data.target)) foundType = 'emir';

        if (foundType) toggleTable(foundType);
    }

    function checkIfWordInTable(tableData, word) {
        return tableData.some(row => row.includes(word));
    }

    // --- ARAYÜZ ---
    function toggleTable(type) {
        const content = document.getElementById(`content-${type}`);
        const btn = document.getElementById(`btn-${type}`);
        const isOpen = content.classList.contains('open');

        closeAllPanels();

        if (!isOpen) {
            content.classList.add('open');
            btn.classList.add('active');
        }
    }

    function closeAllPanels() {
        document.querySelectorAll('.accordion-content').forEach(el => el.classList.remove('open'));
        document.querySelectorAll('.accordion-btn').forEach(el => el.classList.remove('active'));
    }

    function crackIce(element) {
        let clicks = parseInt(element.getAttribute('data-clicks') || 0);
        clicks++;
        if (clicks === 1) element.classList.add('crack-1');
        else if (clicks === 2) element.classList.add('crack-2');
        element.setAttribute('data-clicks', clicks);
    }

    function checkAnswer(selected, correct, btnElement) {
        if (selected === correct) {
            btnElement.style.background = "#00b894";
            btnElement.style.color = "white";
            btnElement.style.borderColor = "#00b894";
            setTimeout(() => {
                currentIdx++;
                if (currentIdx < scenarios.length) loadScenario();
                else { 
                    alert("Harika! Tüm kökleri buldun. Oyun yeniden başlıyor."); 
                    currentIdx = 0;
                    scenarios = generateScenarios(rawVerbs);
                    loadScenario(); 
                }
            }, 1000);
        } else {
            btnElement.style.background = "#ff7675";
            btnElement.style.color = "white";
            btnElement.style.borderColor = "#d63031";
            btnElement.disabled = true;
        }
    }

    window.onload = loadScenario;

</script>
</body>
</html>
