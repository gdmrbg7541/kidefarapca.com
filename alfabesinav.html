     NİÇİN AYRI SAYFA? Görev/ilerleme köprüsü (sistem/gorevkopru.js)
     kaydın anahtarını SAYFA ADINDAN üretir. alfabe.html'de zaten
     "Alfabe Yarışması (Tek Kişilik)" puanı raporlanıyor; sınav da aynı
     sayfadan raporlansaydı iki ayrı etkinlik tek kayda karışırdı.
     Bu sayfa sayesinde sınav, öğretmen panelinde AYRI bir puanlı görev
     olarak gönderilebiliyor ve ayrı ölçülüyor.

     İçeriği tamamen alfabe/alfabe_sinav.js kurar (#asSar kutusuna).
     alfabe_birlestir.js yalnız harf çözümleyicisi (coz) için yüklenir;
     o dosya #abSar bulamazsa hiçbir şey çizmez.
     ================================================================= -->

<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
