<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meslekler · اَلْمِهَن</title>
<!-- =====================================================================
     MESLEKLER — sınıf oyunu                            (meslekler.html)
     ---------------------------------------------------------------------
     TAHTAYA YANSITILMAK İÇİN yazıldı. Tasarım kararları bundan çıkıyor:
       · yazılar ekran genişliğine göre büyüyor (clamp + vw), arka
         sıradan okunsun;
       · giriş yok, kayıt yok — öğretmen açar açmaz oynanır;
       · boşluk / ok tuşları ile ilerler, yani sunum kumandası da çalışır;
       · iki takım skoru var, tahtadan tek dokunuşla artar.

     Dört kip:
       ikiz  ة İkizleri       — müzekker → müennes (+ةَ) kuralı
       kim   مَنْ أَنا؟        — canlandırmadan mesleği bilme
       tren  Cümle Treni       — 7. sınıfın kendi cümle kalıbı
       cark  Meslek Çarkı      — çarkın durduğu meslekle cümle

     Veri  : meslek/veri_meslek.js   (16 meslek, kitaplardan)
     Çizim : meslek/sahne.js         (canlandırmalı SVG sahneler)
     ===================================================================== */ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Yalnız YEDEK zincir: sitenin yazısı Arakom, bunlar Arakom'da
     bulunmayan işaretler ve font yüklenemezse devreye girer. -->
<link href="https://fonts.googleapis.com/css2?family=Marhey:wght@400;600;700&family=Harmattan:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --zemin:#F5F8FC; --kart:#fff; --yazi:#1F2A37; --soluk:#6B7A8D;
    --cizgi:#E2E8F0; --vurgu:#0E9E86;
    --takimA:#2563EB; --takimB:#EE5253
  }
  html,body{height:100%}
  body{
    font-family:'Arakom','Marhey',system-ui,sans-serif;
    background:var(--zemin); color:var(--yazi);
    display:flex; flex-direction:column; overflow:hidden
  }
  .ar{font-family:'Arakom','Harmattan',serif; direction:rtl; unicode-bidi:isolate}

  /* ---------------- üst şerit ---------------- */
  .ust{
    flex:none; display:flex; align-items:center; gap:14px;
    padding:10px 16px; background:var(--kart); border-bottom:1px solid var(--cizgi)
  }
  .geri{
    display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--yazi);
    font-size:15px;padding:8px 12px;border-radius:10px;border:1px solid var(--cizgi)
  }
  .geri:hover{background:var(--zemin)}
  .modlar{display:flex;gap:8px;flex:1;flex-wrap:wrap}
  .mod{
    font:inherit;font-size:15px;cursor:pointer;
    padding:9px 16px;border-radius:999px;border:2px solid var(--cizgi);
    background:var(--kart);color:var(--soluk)
  }
  .mod[aria-selected="true"]{background:var(--vurgu);border-color:var(--vurgu);color:#fff}
  .skorlar{display:flex;gap:8px}
  .takim{
    display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:12px;
    border:2px solid var(--cizgi);background:var(--kart);cursor:pointer;font:inherit
  }
  .takim b{font-size:22px;min-width:26px;text-align:center}
  .takim.a{border-color:var(--takimA);color:var(--takimA)}
  .takim.b{border-color:var(--takimB);color:var(--takimB)}
  .araclar{display:flex;gap:8px}
  .kucuk{
    font:inherit;font-size:14px;cursor:pointer;padding:9px 13px;
    border-radius:10px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi)
  }
  .kucuk:hover{background:var(--zemin)}
  #ses{display:inline-flex;align-items:center;justify-content:center;min-width:42px}

  /* ---------------- sahne ---------------- */
  .sahne{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0}
  .kip{display:none;width:100%;height:100%;min-height:0;align-items:center;
       justify-content:center;flex-direction:column;gap:2.4vh;overflow:auto}
  .kip.acik{display:flex;justify-content:center}

  .msn{width:clamp(150px,23vh,290px);height:clamp(150px,23vh,290px)}
  .devar{font-family:'Arakom','Harmattan',serif;direction:rtl;unicode-bidi:isolate;
         line-height:1.22;
         font-size:clamp(54px,15vh,190px)}
  .ortaar{font-family:'Arakom','Harmattan',serif;direction:rtl;unicode-bidi:isolate;
          font-size:clamp(30px,7vh,86px)}
  .devtr{font-family:'Arakom','Marhey',system-ui;font-size:clamp(24px,5vh,62px)}
  .etiket{font-size:clamp(18px,3vh,36px);color:var(--soluk);
          display:flex;gap:.35em;align-items:baseline;flex-wrap:wrap;justify-content:center}

  /* Aşağıdan yukarı geliş — ögeler yerine "otururken" yükselir.
     Sırayla gecikmeli tetiklenince ekran canlı, takip etmesi kolay olur. */
  @keyframes yukselt{from{opacity:0;transform:translateY(34px) scale(.96)}
                       to{opacity:1;transform:translateY(0) scale(1)}}
  .yuksel{animation:yukselt .5s cubic-bezier(.2,.8,.25,1) both}

  /* Ana eylem tuşları: tahtadan parmakla basılacak, büyük olmalı.
     .kucuk üst şeritteki yardımcı tuşlar için kaldı. */
  .buyuk{font:inherit;cursor:pointer;
         font-size:clamp(19px,2.9vh,32px);padding:clamp(10px,1.7vh,18px) clamp(22px,3vw,40px);
         border-radius:999px;border:3px solid var(--cizgi);background:var(--kart);
         color:var(--yazi);transition:transform .12s ease,background .12s ease}
  .buyuk:hover{background:var(--zemin)}
  .buyuk:active{transform:scale(.95)}
  .buyuk.ana{background:var(--vurgu);border-color:var(--vurgu);color:#fff}

  /* tüm meslekler — üç sütun, aşağı kayar; sahne üstte, kelime altta */
  #kipTum{justify-content:flex-start;align-items:stretch;padding-top:4px}
  .tumzg{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.6vw,22px);
         width:100%;max-width:1500px;margin:0 auto}
  @media (max-width:760px){ .tumzg{grid-template-columns:repeat(2,1fr)} }
  .tumh{background:var(--kart);border:3px solid var(--cizgi);border-radius:20px;
        padding:clamp(12px,2vh,24px) 12px;text-align:center;
        display:flex;flex-direction:column;align-items:center;gap:4px}
  .tumh .msn{width:clamp(90px,12vh,150px);height:clamp(90px,12vh,150px)}
  /* İki biçim ALT ALTA: tek satıra sığdırmaya çalışınca punto küçük
     kalmak zorundaydı (مُتَقاعِد / مُتَقاعِدَة sütuna sığmıyordu).
     Ayrı satırlar hem çok daha büyük yazıya izin veriyor hem de
     müzekker/müennes ayrımını görsel olarak netleştiriyor. */
  .tumh .ad{font-family:'Arakom','Harmattan',serif;direction:rtl;unicode-bidi:isolate;
            font-size:clamp(38px,7vh,86px);line-height:1.22;
            color:var(--takimA)}
  .tumh .adk{display:block;font-family:'Arakom','Harmattan',serif;direction:rtl;
             unicode-bidi:isolate;color:#E84393;
             font-size:clamp(31px,5.8vh,72px);line-height:1.22}
  .tumh .tr{font-family:'Arakom','Marhey',system-ui;
            font-size:clamp(22px,3.4vh,44px);color:var(--yazi);margin-top:2px}
  /* ة ikizleri */
  .ikizkutu{display:flex;align-items:center;gap:clamp(18px,5vw,70px);flex-wrap:wrap;justify-content:center}
  .yan{display:flex;flex-direction:column;align-items:center;gap:6px;
       padding:clamp(12px,2.4vh,26px) clamp(18px,3vw,44px);border-radius:22px;background:var(--kart);
       border:3px solid var(--cizgi);min-width:clamp(230px,30vw,460px)}
  .yan.e{border-color:var(--takimA)} .yan.k{border-color:#E84393}
  .yan .rol{font-size:clamp(13px,1.9vh,20px);letter-spacing:.04em}
  .yan.e .rol{color:var(--takimA)} .yan.k .rol{color:#E84393}
  .gizli{visibility:hidden}
  /* ة'nin inmeden önce yerini tutan görünmez kopya */
  .tayeri{visibility:hidden}
  /* uçan ة */
  .ucanta{
    position:absolute;font-family:'Arakom','Harmattan',serif;color:#E84393;
    font-size:clamp(50px,11vh,140px);pointer-events:none;opacity:0
  }
  /* ة İNİŞİ — yavaş ve DİK.
     Kelime önce ة'siz beliriyor; ة yukarıdan, tam birleşeceği noktanın
     üstünden süzülüp iniyor. Yatay kayma YOK: sol/üst konumu JS
     ölçerek veriyor, canlandırma yalnız dikeyde çalışıyor. Sona doğru
     hafif yaylanma, "oturdu" hissi için. */
  @keyframes tainis{
      0%{opacity:0;  transform:translateY(-32vh) scale(1.45)}
     14%{opacity:1}
     72%{            transform:translateY(4px)   scale(1.06)}
     88%{            transform:translateY(-3px)  scale(.99)}
    100%{opacity:1;  transform:translateY(0)     scale(1)}
  }
  .ucanta.oyna{animation:tainis 1.45s cubic-bezier(.38,.02,.3,1) forwards}
  @keyframes parla{0%{background:#FFF3C4}100%{background:var(--kart)}}
  .parla{animation:parla 1.1s ease-out}

  /* «مَنْ أَنا؟» TEK EKRANA SIĞAR — kaydırma yok.
     Kip dikeyde bölüşülüyor: sahne esner, öbür satırlar kendi
     boylarında kalır. Cevap satırı da yüksekliğe göre sınırlı. */
  #kipKim{overflow:hidden;justify-content:space-evenly;gap:.8vh;padding:2px 0}
  #kipKim .msn{width:clamp(110px,26vh,300px);height:clamp(110px,26vh,300px)}
  #kipKim #kimCevap{font-size:clamp(34px,10vh,120px)}
  #kipKim .devtr{font-size:clamp(18px,3.4vh,44px)}
  #kipKim .ipucu{font-size:clamp(18px,3.6vh,44px);padding:clamp(7px,1.2vh,15px) clamp(14px,2.2vw,28px)}

  /* مَنْ أَنا؟ */
  .ipuclari{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .ipucu{padding:clamp(10px,1.8vh,20px) clamp(18px,2.6vw,34px);border-radius:999px;
         background:var(--kart);border:3px solid var(--cizgi);
         font-size:clamp(24px,5vh,56px);line-height:1.15}
  .ipucu .ar{font-size:1.35em}
  /* ipucu etiketi ("İlk harf", "Kalıp") değerin yanında küçük kalsın */
  .ipucu .et{color:var(--soluk);font-size:.5em;margin-inline-end:.4em}

  /* cümle treni */
  .secimler{display:flex;gap:clamp(8px,1.4vw,18px);flex-wrap:wrap;justify-content:center;flex:none}
  /* MESLEK sütunu 14 satır: sınırsız bırakınca sayfa taşıp üstteki
     başlığı ve alttaki cümleyi kırpıyordu. Sütun kendi içinde kayar. */
  .grup{background:var(--kart);border:2px solid var(--cizgi);border-radius:16px;padding:8px;
        min-width:132px;max-height:38vh;overflow-y:auto}
  .grup h3{font-size:12.5px;color:var(--soluk);text-align:center;margin-bottom:6px;letter-spacing:.03em}
  .sec{display:block;width:100%;font:inherit;font-size:clamp(14px,2vh,22px);
       padding:7px 10px;border-radius:9px;border:2px solid transparent;background:transparent;
       cursor:pointer;color:var(--yazi);text-align:center}
  .sec[aria-pressed="true"]{background:var(--vurgu);color:#fff}
  .vagonlar{display:flex;direction:rtl;unicode-bidi:isolate;gap:clamp(6px,1vw,14px);flex-wrap:wrap;justify-content:center;align-items:center}
  .vagon{background:var(--kart);border:3px solid var(--cizgi);border-radius:16px;
         direction:rtl;unicode-bidi:isolate;
         padding:clamp(8px,1.6vh,18px) clamp(12px,1.8vw,26px);
         font-family:'Arakom','Harmattan',serif;font-size:clamp(24px,5.6vh,64px);
         opacity:0;transform:translateX(30px)}
  @keyframes vagongel{to{opacity:1;transform:translateX(0)}}
  .vagon.gel{animation:vagongel .45s ease-out forwards}
  .vagon .alt{display:block;font-family:'Arakom','Marhey',system-ui;font-size:clamp(11px,1.5vh,17px);
              color:var(--soluk);direction:ltr;unicode-bidi:isolate}

  #kipTren .devtr{font-size:clamp(18px,3.4vh,40px);text-align:center;padding:0 10px}
  #kipTren .vagon{font-size:clamp(20px,4.6vh,52px)}

  .trad{font-family:'Arakom','Marhey',system-ui}

  /* çark */
  .carkkutu{position:relative;display:flex;flex-direction:column;align-items:center;gap:1.4vh}
  .cark{width:min(62vh,62vw);height:min(62vh,62vw);transition:transform 4.2s cubic-bezier(.17,.67,.2,1)}
  .ibre{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:34px;z-index:2;color:#E74C3C}

  .alt{flex:none;text-align:center;padding:7px;color:var(--soluk);font-size:13px;
       background:var(--kart);border-top:1px solid var(--cizgi)}
  kbd{background:var(--zemin);border:1px solid var(--cizgi);border-bottom-width:2px;
      border-radius:6px;padding:1px 7px;font:inherit;font-size:12px}

  /* ================== KALINLIK YOK ==================
     Arakom'un TEK yüzü var: usWeightClass 400, fontun bold biti kapalı,
     ailede ikinci bir dosya yok. Bir yerde font-weight:700 görünce
     tarayıcı harfi KENDİ şişiriyor (sentetik/sahte kalın). Tarayıcıda
     ölçtük: aynı metin, aynı punto, %65.85 daha fazla mürekkep —
     Arapça'da bu, harekeleri ve ince kuyrukları yutuyor.

     İki katman:
       1) Hiçbir ögede kalınlık istemiyoruz  → font-weight:400
       2) Yine de bir yerden 700 sızarsa (SVG'nin font-weight="700"
          sunum özniteliği, tarayıcının <b>/<strong>/<h1> öntanımı…)
          tarayıcı sahte kalın ÜRETMESİN → font-synthesis:none.
          Ölçüldü: sentez kapalıyken mürekkep 400 ile birebir aynı.
     font-synthesis-weight ayrıca yazıldı: Safari kısaltmayı değil
     uzun biçimi tanıyor. Eğik yazı bu sayfada hiç kullanılmıyor,
     kısaltmanın eğikliği de kapatması bir şeyi bozmuyor.
     ================================================== */
  html, body, body *, body *::before, body *::after {
    font-weight:400 !important;
    font-synthesis-weight:none !important;
    font-synthesis:none !important;
  }
  /* Vurgu kaybolmasın: öğretici <b>'ler artık kalınlıkla değil RENKLE
     ayrılıyor («…mesleğin kadını…», «kişi kadınsa meslek de kadın olur»).
     Takım düğmelerindeki sayı <b>'si kendi rengini korur. */
  b, strong{ color:var(--vurgu) }
  .takim b{ color:inherit }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
<!-- arakom.css EN SON: sitenin ortak yazı tipini (arakom.ttf) her şeye
     uygular ve yukarıdaki kuralları ezer. Sürüm diğer sayfalarla aynı. -->
<link rel="stylesheet" href="arakom.css?v=2">

<body>

<header class="ust">
  <a class="geri" href="index.html">‹ Kidef</a>
  <nav class="modlar" role="tablist" aria-label="Oyun kipleri">
    <button class="mod" role="tab" data-kip="tum"   aria-selected="true">Tüm Meslekler</button>
    <button class="mod" role="tab" data-kip="ikiz"  aria-selected="false">ة İkizleri</button>
    <button class="mod" role="tab" data-kip="kim"   aria-selected="false">مَنْ أَنا؟</button>
    <button class="mod" role="tab" data-kip="tren"  aria-selected="false">Cümle Treni</button>
    <button class="mod" role="tab" data-kip="cark"  aria-selected="false">Meslek Çarkı</button>
  </nav>
  <div class="skorlar">
    <button class="takim a" id="skorA" title="A takımına puan (1)">A <b>0</b></button>
    <button class="takim b" id="skorB" title="B takımına puan (2)">B <b>0</b></button>
  </div>
  <div class="araclar">
    <button class="kucuk" id="ses" title="Sesi aç/kapa" aria-pressed="true"></button>
    <button class="kucuk" id="sifirla">Sıfırla</button>
    <button class="kucuk" id="tamekran">⛶ Tam ekran</button>
  </div>
</header>

<main class="sahne">

  <!-- ══════════ 0 · TÜM MESLEKLER ══════════ -->
  <section class="kip acik" id="kipTum">
    <div class="tumzg" id="tumZg"></div>
  </section>

  <!-- ══════════ 1 · ة İKİZLERİ ══════════ -->
  <section class="kip" id="kipIkiz">
    <div class="etiket" id="ikizSoru">Bu mesleğin <b>kadını</b> nasıl söylenir?</div>
    <div class="ikizkutu">
      <div class="yan e">
        <span class="rol"><bdi dir="rtl" class="ar">مُذَكَّر</bdi><bdi dir="ltr"> · ERKEK</bdi></span>
        <span class="devar" id="ikizE">—</span>
      </div>
      <div id="ikizSahne"></div>
      <div class="yan k" style="position:relative">
        <span class="rol"><bdi dir="rtl" class="ar">مُؤَنَّث</bdi><bdi dir="ltr"> · KADIN</bdi></span>
        <span class="devar" id="ikizK">؟</span>
        <span class="ucanta" id="ucanTa">ة</span>
      </div>
    </div>
    <div class="devtr" id="ikizTr">—</div>
    <div class="ipuclari">
      <button class="buyuk ana" id="ikizAc">Göster</button>
      <button class="buyuk" id="ikizSonraki">Sonraki ›</button>
    </div>
  </section>

  <!-- ══════════ 2 · مَنْ أَنا؟ ══════════ -->
  <section class="kip" id="kipKim">
    <div class="etiket"><bdi dir="rtl" class="ar">مَنْ أَنا؟</bdi><bdi dir="ltr"> — Bu meslek hangisi?</bdi></div>
    <div id="kimSahne"></div>
    <div class="ipuclari" id="kimIpuclari"></div>
    <div class="devar" id="kimCevap">؟</div>
    <div class="devtr" id="kimTr"></div>
    <div class="ipuclari">
      <button class="buyuk" id="kimIpucu">İpucu ver</button>
      <button class="buyuk ana" id="kimAc">Cevabı göster</button>
      <button class="buyuk" id="kimSonraki">Sonraki ›</button>
    </div>
  </section>

  <!-- ══════════ 3 · CÜMLE TRENİ ══════════ -->
  <section class="kip" id="kipTren">
    <div class="etiket">Seç, cümle kendiliğinden kurulsun — <b>kişi kadınsa meslek de kadın olur</b></div>
    <div class="secimler">
      <div class="grup"><h3>KİŞİ</h3><div id="trenKisi"></div></div>
      <div class="grup"><h3>MESLEK</h3><div id="trenMeslek"></div></div>
      <div class="grup"><h3>ARAÇ</h3><div id="trenArac"></div></div>
      <div class="grup"><h3>ŞEHİR</h3><div id="trenYer"></div></div>
    </div>
    <div class="vagonlar" id="trenVagon"></div>
    <div class="devtr" id="trenTr"></div>
    <div class="ipuclari"><button class="buyuk ana" id="trenKur">Cümleyi kur</button>
      <button class="buyuk" id="trenRastgele">Rastgele seç</button></div>
  </section>

  <!-- ══════════ 4 · MESLEK ÇARKI ══════════ -->
  <section class="kip" id="kipCark">
    <div class="carkkutu">
      <div class="ibre">▼</div>
      <svg class="cark" id="cark" viewBox="0 0 400 400" aria-hidden="true"></svg>
    </div>
    <div class="ortaar" id="carkCumle">&nbsp;</div>
    <div class="ipuclari"><button class="buyuk ana" id="carkDondur">Çarkı çevir</button></div>
  </section>

</main>

<footer class="alt">
  <kbd>Boşluk</kbd> göster / çevir · <kbd>→</kbd> sonraki · <kbd>1</kbd> A takımı · <kbd>2</kbd> B takımı · <kbd>F</kbd> tam ekran
</footer>

<script src="meslek/sahne.js?v=1"></script>
<script src="meslek/ses.js?v=1"></script>
<script>
(function () {
  'use strict';
  var M = window.KidefMeslek, SH = window.KidefMeslekSahne;
  var SES = window.KidefSes || { tik:function(){}, sec:function(){}, ucus:function(){},
    konsun:function(){}, dogru:function(){}, carkTik:function(){}, carkDur:function(){},
    puan:function(){}, gelis:function(){}, acikMi:function(){return false;}, ayarla:function(){} };
  var $ = function (i) { return document.getElementById(i); };
  function karistir(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------------- kip anahtarı ---------------- */
  var kip = 'tum';
  function kipAc(ad) {
    kip = ad;
    [].forEach.call(document.querySelectorAll('.mod'), function (b) {
      b.setAttribute('aria-selected', String(b.dataset.kip === ad));
    });
    [].forEach.call(document.querySelectorAll('.kip'), function (s) { s.classList.remove('acik'); });
    $('kip' + ad.charAt(0).toUpperCase() + ad.slice(1)).classList.add('acik');
    if (ad === 'cark') carkCiz();
    if (ad === 'tum') tumCiz();
  }
  [].forEach.call(document.querySelectorAll('.mod'), function (b) {
    b.addEventListener('click', function () { SES.tik(); kipAc(b.dataset.kip); });
  });

  /* ---------------- takım skoru ---------------- */
  var skor = { a: 0, b: 0 };
  function skorYaz() { $('skorA').querySelector('b').textContent = skor.a;
                       $('skorB').querySelector('b').textContent = skor.b; }
  $('skorA').addEventListener('click', function () { skor.a++; skorYaz(); SES.puan(); });
  $('skorB').addEventListener('click', function () { skor.b++; skorYaz(); SES.puan(); });
  $('sifirla').addEventListener('click', function () { skor.a = skor.b = 0; skorYaz(); });
  function sesSvg(acik) {
    return '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="none"' +
      ' stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/>' +
      (acik ? '<path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>'
            : '<path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>') + '</svg>';
  }
  function sesYaz() {
    var a = SES.acikMi();
    $('ses').innerHTML = sesSvg(a);
    $('ses').setAttribute('aria-pressed', String(a));
    $('ses').style.color = a ? 'var(--vurgu)' : 'var(--soluk)';
  }
  $('ses').addEventListener('click', function () { SES.ayarla(!SES.acikMi()); sesYaz(); });
  $('tamekran').addEventListener('click', tamEkran);
  function tamEkran() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  /* ══════════ 0 · TÜM MESLEKLER ══════════ */
  /* Dosyanın açılış sekmesi: bütün meslekler tek ekranda, sahne
     üstte kelime altta. Öğretmen dersе buradan giriyor, sonra
     oyunlara geçiyor. */
  function tumCiz() {
    var k = $('tumZg');
    if (k.childElementCount) return;             /* bir kez çizilir */
    M.hepsi.forEach(function (m, i) {
      var d = document.createElement('div');
      d.className = 'tumh';
      d.innerHTML =
        SH.sahne(m.id, m.renk) +
        '<div class="ad">' + (m.e || m.k) + '</div>' +
        (m.e ? '<div class="adk">' + m.k + '</div>' : '') +
        '<div class="tr">' + m.tr + '</div>';
      k.appendChild(d);
      /* sıra sıra yükselerek gelir — hepsi birden patlamasın */
      d.style.animationDelay = (i * 45) + 'ms';
      d.classList.add('yuksel');
    });
  }

  /* ══════════ 1 · ة İKİZLERİ ══════════ */
  var ikizSira = karistir(M.ikizler()), ikizNo = 0, ikizAcik = false;
  function ikizCiz() {
    var m = ikizSira[ikizNo % ikizSira.length];
    $('ikizE').textContent = m.e;
    $('ikizK').textContent = '؟';
    $('ikizK').classList.remove('gizli');
    $('ikizTr').textContent = m.tr;
    $('ikizSahne').innerHTML = SH.sahne(m.id, m.renk);
    $('ucanTa').classList.remove('oyna');
    $('ucanTa').style.opacity = 0;
    $('ucanTa').style.left = ''; $('ucanTa').style.top = '';
    ikizAcik = false;
    yukselt([$('ikizSahne'), $('ikizE').parentNode, $('ikizTr')]);
  }
  /* verilen ögeleri sırayla aşağıdan yukarı getirir */
  function yukselt(ogeler) {
    ogeler.forEach(function (e, i) {
      if (!e) return;
      e.classList.remove('yuksel'); void e.offsetWidth;
      e.style.animationDelay = (i * 70) + 'ms';
      e.classList.add('yuksel');
    });
  }
  /* Üç perdelik açılış:
       1) kelime ة'SİZ belirir (gövde = müzekker biçim),
       2) ة, kelimenin SONUNA (RTL'de sol ucuna) doğru yavaşça iner,
       3) inince kelime tamamlanır ve parlar.
     ة'nin ineceği nokta ÖLÇÜLEREK bulunuyor; sabit bir yere düşseydi
     uzun kelimede kelimenin ortasına, kısa kelimede dışına konardı. */
  var IKIZ_BEKLE = 300, IKIZ_INIS = 1450;
  function ikizGoster() {
    if (ikizAcik) { ikizNo++; ikizCiz(); return; }
    ikizAcik = true;
    var m = ikizSira[ikizNo % ikizSira.length];
    var kutu = $('ikizK'), ta = $('ucanTa');

    /* 1) kelime belirir — henüz ة yok. Ama ة'nin YERİ baştan ayrılıyor:
       sona görünmez bir ة konuyor. İki faydası var — inen ة kartın
       dışına taşmıyor, ve birleşme anında kelime yana zıplamıyor. */
    kutu.innerHTML = m.e + '<span class="tayeri">ة</span>';
    kutu.classList.remove('yuksel'); void kutu.offsetWidth; kutu.classList.add('yuksel');
    SES.sec();

    /* 2) ة'yi TAM o ayrılmış yerin üstüne koyup indir */
    setTimeout(function () {
      var kap = kutu.parentNode.getBoundingClientRect();
      var yer = kutu.querySelector('.tayeri');
      var hedef = (yer || kutu).getBoundingClientRect();
      ta.style.font = getComputedStyle(kutu).font;
      ta.classList.remove('oyna'); ta.style.opacity = 1;
      ta.style.left = (hedef.left - kap.left) + 'px';
      ta.style.top  = (hedef.top - kap.top) + 'px';
      void ta.offsetWidth; ta.classList.add('oyna');
      SES.ucus();
    }, IKIZ_BEKLE);

    /* 3) birleşme */
    setTimeout(function () {
      kutu.textContent = m.k;
      kutu.parentNode.classList.remove('parla'); void kutu.offsetWidth;
      kutu.parentNode.classList.add('parla');
      /* Sınıfı KALDIRMAK gerekiyor: animasyonun `forwards` dolgusu
         son karedeki opacity:1'i satır içi stilden üstün tutuyor,
         ta.style.opacity=0 yazmak ة'yi kaybetmiyordu. */
      ta.classList.remove('oyna'); ta.style.opacity = 0;
      SES.konsun(); SES.dogru();
    }, IKIZ_BEKLE + IKIZ_INIS);
  }
  $('ikizAc').addEventListener('click', ikizGoster);
  $('ikizSonraki').addEventListener('click', function () { SES.tik(); ikizNo++; ikizCiz(); });

  /* ══════════ 2 · مَنْ أَنا؟ ══════════ */
  var kimSira = karistir(M.hepsi), kimNo = 0, kimKat = 0, kimAcik = false;
  function kimCiz() {
    var m = kimSira[kimNo % kimSira.length];
    $('kimSahne').innerHTML = SH.sahne(m.id, m.renk);
    $('kimCevap').textContent = '؟';
    $('kimTr').textContent = '';
    $('kimIpuclari').innerHTML = '';
    kimKat = 0; kimAcik = false;
    yukselt([$('kimSahne')]);
  }
  function kimIpucuVer() {
    var m = kimSira[kimNo % kimSira.length];
    var ad = (m.e || m.k);
    var kat = [
      { et: 'İlk harf', d: '<span class="ar">' + ad.charAt(0) + ' …</span>' },
      { et: 'Kalıp',    d: '<span class="ar">' + m.kalip + '</span>' },
      { et: 'Harf sayısı', d: ad.replace(/[ً-ْٰـ]/g, '').length + '' }
    ];
    if (kimKat >= kat.length) return;
    var k = kat[kimKat++];
    var d = document.createElement('div');
    d.className = 'ipucu';
    d.innerHTML = '<span class="et">' + k.et + '</span>' + k.d;
    d.classList.add('yuksel');
    $('kimIpuclari').appendChild(d);
    SES.sec();
  }
  function kimGoster() {
    if (kimAcik) { kimNo++; kimCiz(); return; }
    var m = kimSira[kimNo % kimSira.length];
    $('kimCevap').textContent = m.e ? (m.e + ' / ' + m.k) : m.k;
    $('kimTr').textContent = m.tr;
    yukselt([$('kimCevap'), $('kimTr')]);
    SES.dogru();
    kimAcik = true;
  }
  $('kimIpucu').addEventListener('click', kimIpucuVer);
  $('kimAc').addEventListener('click', kimGoster);
  $('kimSonraki').addEventListener('click', function () { SES.tik(); kimNo++; kimCiz(); });

  /* ══════════ 3 · CÜMLE TRENİ ══════════ */
  var sec = { kisi: 0, meslek: 0, arac: 0, yer: 0 };
  function dugmeler(kap, dizi, alan, etiket) {
    var k = $(kap); k.innerHTML = '';
    dizi.forEach(function (x, i) {
      var b = document.createElement('button');
      b.className = 'sec'; b.type = 'button';
      b.innerHTML = etiket(x);
      b.setAttribute('aria-pressed', String(i === sec[alan]));
      b.addEventListener('click', function () {
        sec[alan] = i;
        [].forEach.call(k.children, function (c, j) { c.setAttribute('aria-pressed', String(j === i)); });
        SES.sec();
        trenKur();
      });
      k.appendChild(b);
    });
  }
  /* Ev hanımının erkeği yok; trende kişi cinsi mesleği belirlediği için
     yalnız ikiz meslekler kullanılır. */
  var trenMeslekler = M.ikizler();
  function trenKurDugmeler() {
    dugmeler('trenKisi', M.kisiler, 'kisi', function (x) {
      return '<span class="ar">' + x.ar + '</span>';
    });
    dugmeler('trenMeslek', trenMeslekler, 'meslek', function (x) { return x.tr; });
    dugmeler('trenArac', M.araclar, 'arac', function (x) { return x.tr; });
    dugmeler('trenYer', M.yerler, 'yer', function (x) { return x.tr; });
  }
  function trenKur() {
    var ki = M.kisiler[sec.kisi], me = trenMeslekler[sec.meslek],
        ar = M.araclar[sec.arac], ye = M.yerler[sec.yer];
    var meslekAr = (ki.cins === 'k') ? me.k : me.e;
    var fiil = (ki.cins === 'k') ? 'تُسافِرُ' : 'يُسافِرُ';
    var parca = [
      { ar: ki.ar,          tr: ki.tr },
      { ar: meslekAr + '،', tr: me.tr + (ki.cins === 'k' ? ' (kadın)' : ' (erkek)') },
      { ar: ki.zamir,       tr: ki.cins === 'k' ? 'o (kadın)' : 'o (erkek)' },
      { ar: fiil,           tr: 'yolculuk eder' },
      { ar: 'إِلى ' + ye.ar, tr: ye.tr + "'ya" },
      { ar: ar.ar,          tr: ar.tr }
    ];
    var k = $('trenVagon'); k.innerHTML = '';
    parca.forEach(function (p, i) {
      var d = document.createElement('div');
      d.className = 'vagon';
      d.innerHTML = p.ar + '<span class="alt">' + p.tr + '</span>';
      k.appendChild(d);
      setTimeout(function () { d.classList.add('gel'); SES.konsun(); }, i * 170);
    });
    $('trenTr').textContent = ki.tr + ' ' + ekle(me.tr.toLocaleLowerCase('tr')) + ', o ' +
      ye.tr + "'ya " + ar.tr + ' yolculuk eder.';
  }
  $('trenKur').addEventListener('click', trenKur);
  $('trenRastgele').addEventListener('click', function () {
    sec.kisi = Math.floor(Math.random() * M.kisiler.length);
    sec.meslek = Math.floor(Math.random() * trenMeslekler.length);
    sec.arac = Math.floor(Math.random() * M.araclar.length);
    sec.yer = Math.floor(Math.random() * M.yerler.length);
    trenKurDugmeler(); trenKur();
  });

  /* Türkçe bildirme eki — ÜNLÜ UYUMU.
     Düz 'dir' eklemek "doktordir" gibi yanlışlar üretiyordu; son ünlüye
     göre dır/dir/dur/dür, sert ünsüzden sonra da t- olur. */
  function ekle(kelime) {
    var k = String(kelime), son = k.replace(/[^aeıioöuüAEIİOÖUÜ]/g, '').slice(-1).toLocaleLowerCase('tr');
    var unlu = ({ a: 'ı', 'ı': 'ı', e: 'i', i: 'i', o: 'u', u: 'u', 'ö': 'ü', 'ü': 'ü' })[son] || 'i';
    var sert = /[pçtkfhsş]$/i.test(k) ? 't' : 'd';
    return k + sert + unlu + 'r';
  }

  /* ══════════ 4 · MESLEK ÇARKI ══════════ */
  var carkAci = 0, carkDonuyor = false, carkListe = M.hepsi;
  function carkCiz() {
    var n = carkListe.length, s = $('cark'), ic = '', i, a0, a1, r = 190, cx = 200, cy = 200;
    for (i = 0; i < n; i++) {
      a0 = (360 / n) * i - 90; a1 = (360 / n) * (i + 1) - 90;
      var x0 = cx + r * Math.cos(a0 * Math.PI / 180), y0 = cy + r * Math.sin(a0 * Math.PI / 180);
      var x1 = cx + r * Math.cos(a1 * Math.PI / 180), y1 = cy + r * Math.sin(a1 * Math.PI / 180);
      ic += '<path d="M' + cx + ' ' + cy + ' L' + x0.toFixed(1) + ' ' + y0.toFixed(1) +
            ' A' + r + ' ' + r + ' 0 0 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Z" fill="' +
            carkListe[i].renk + '" opacity="' + (i % 2 ? '.82' : '1') + '"/>';
      /* Etiketler YARIÇAP boyunca dizilir (merkezden dışa okunur).
         Teğet dizilimde 16 dilimin yazısı birbirine giriyordu.
         Sol yarıdaki yazılar baş aşağı düşmesin diye 180° çevrilir. */
      var am = (a0 + a1) / 2;
      var ters = (((am % 360) + 360) % 360) > 90 && (((am % 360) + 360) % 360) < 270;
      var ry = r * 0.90;
      var tx = cx + ry * Math.cos(am * Math.PI / 180),
          ty = cy + ry * Math.sin(am * Math.PI / 180);
      /* font-weight yazılmıyor: Arakom'un kalın yüzü yok, 700 istenince
         tarayıcı sahte kalın üretiyordu. Beyaz yazı zaten renkli dilimin
         üstünde; kalınlığa ihtiyacı yok. */
      ic += '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" fill="#fff" font-size="15.5"' +
            ' text-anchor="' + (ters ? 'start' : 'end') +
            '" dominant-baseline="middle" font-family="Arakom,Marhey,system-ui"' +
            ' transform="rotate(' + (ters ? am + 180 : am).toFixed(1) +
            ' ' + tx.toFixed(1) + ' ' + ty.toFixed(1) + ')">' + carkListe[i].tr + '</text>';
    }
    ic += '<circle cx="200" cy="200" r="34" fill="#fff" stroke="#E2E8F0" stroke-width="4"/>';
    s.innerHTML = ic;
  }
  function carkCevir() {
    if (carkDonuyor) return;
    carkDonuyor = true;
    var n = carkListe.length;
    var secilen = Math.floor(Math.random() * n);
    /* ibre tepede: seçilen dilimin ORTASI tepeye gelsin */
    var dilim = 360 / n;
    var hedef = 360 * 5 - (secilen * dilim + dilim / 2);
    carkAci = hedef;
    $('cark').style.transform = 'rotate(' + carkAci + 'deg)';
    $('carkCumle').innerHTML = '&nbsp;';
    /* Dönüş yavaşladıkça tıkırtılar seyrekleşir — çark hissi bundan gelir. */
    (function tikirdat(t, ara) {
      if (t > 4100) return;
      SES.carkTik();
      setTimeout(function () { tikirdat(t + ara, ara * 1.17); }, ara);
    })(0, 70);
    setTimeout(function () {
      var m = carkListe[secilen];
      /* Müzekker biçimi OLMAYAN meslekte هُوَ denemez: رَبَّةُ الْبَيْت
         zaten müennes, «هُوَ رَبَّةُ الْبَيْت» hatalı olurdu. */
      var cumle = m.e
        ? '<span class="ar">هُوَ ' + m.e + '</span>' +
          ' <span style="color:var(--soluk)">·</span> ' +
          '<span class="ar">هِيَ ' + m.k + '</span>'
        : '<span class="ar">هِيَ ' + m.k + '</span>';
      $('carkCumle').innerHTML = cumle +
        ' <span class="trad" style="font-size:.62em;color:var(--soluk)">' + m.tr + '</span>';
      SES.carkDur();
      yukselt([$('carkCumle')]);
      carkDonuyor = false;
    }, 4300);
  }
  $('carkDondur').addEventListener('click', carkCevir);

  /* ---------------- klavye (sunum kumandası da çalışır) ---------------- */
  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var k = e.key;
    if (k === ' ' || k === 'Enter' || k === 'PageDown') {
      e.preventDefault();
      if (kip === 'ikiz') ikizGoster();
      else if (kip === 'kim') kimGoster();
      else if (kip === 'tren') trenKur();
      else carkCevir();
    } else if (k === 'ArrowRight') {
      e.preventDefault();
      if (kip === 'ikiz') { ikizNo++; ikizCiz(); }
      else if (kip === 'kim') { kimNo++; kimCiz(); }
    } else if (k === 'ArrowLeft' || k === 'PageUp') {
      e.preventDefault();
      if (kip === 'ikiz') { ikizNo = (ikizNo + ikizSira.length - 1) % ikizSira.length; ikizCiz(); }
      else if (kip === 'kim') { kimNo = (kimNo + kimSira.length - 1) % kimSira.length; kimCiz(); }
    } else if (k === '1') { skor.a++; skorYaz(); SES.puan(); }
    else if (k === '2') { skor.b++; skorYaz(); SES.puan(); }
    else if (k === 'h' || k === 'H') { if (kip === 'kim') kimIpucuVer(); }
    else if (k === 'f' || k === 'F') { tamEkran(); }
  });

  /* ---------------- açılış ---------------- */
  tumCiz(); ikizCiz(); kimCiz(); trenKurDugmeler(); trenKur(); skorYaz(); sesYaz();
  /* kip=… ile doğrudan bir oyuna açılabilir (kart bağlantısı bunu kullanır) */
  var p = new URLSearchParams(location.search).get('kip');
  if (p && /^(tum|ikiz|kim|tren|cark)$/.test(p)) kipAc(p);
})();
</script>
</body>
</html>
