    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YDT 2025 - Tam Sürüm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">

<body>

<div class="smartboard-screen">
    
    <div class="header">
    <div class="back-button-container">
        <a href="ydtarapca.html" class="back-button" title="Geri Dön">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/>
            </svg>
        </a>
    </div>
    
    <div class="main-header-title">YDT 2025</div>
    
    <div class="stats">
        <div class="stat-box">SORU <span id="q-num">1</span></div>
        <div class="stat-box">PUAN <span id="score">0</span></div>
    </div>
</div>

    <div class="timer-track">
        <div id="timer-bar" class="timer-fill"></div>
    </div>

    <div class="game-area">
        <div class="question-container">
            <div id="q-text" class="big-text">Kelime Avı...</div>
        </div>
        
        <div id="top-grid" class="top-options-grid"></div>

        <div class="bottom-nav-row">
            <button id="btn-prev" class="nav-btn" onclick="navigate(-1)" aria-label="Önceki">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </button>

            <div id="bottom-option-container"></div>

            <button id="btn-next" class="nav-btn" onclick="navigate(1)" aria-label="Sonraki">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="start-screen" class="overlay">
       
        
        <button class="start-btn" onclick="startGame()">BAŞLAT</button>
    </div>

    <div id="end-screen" class="overlay hidden">
        <h1>TUR BİTTİ</h1>
        <div style="font-size: clamp(4rem, 10vw, 8rem); font-weight: bold; margin: 1rem 0; color:var(--accent);" id="final-score">0</div>
        <button class="start-btn" onclick="startGame()">TEKRAR OYNA</button>
    </div>

</div>
