        :root {
            --bg-dark: #2c3e50;
            --board-bg: #fdfefe;
            --text-color: #2c3e50;
            --accent: #8e44ad;
            --correct: #27ae60;
            --wrong: #c0392b;
            --btn-bg: #ffffff;
            --border-color: #dfe6e9;
            --shadow-color: #bdc3c7;
            --gap-size: 1rem;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rubik', sans-serif;
            overflow: hidden;
        }

        /* --- ANA EKRAN --- */
        .smartboard-screen {
            background-color: var(--board-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        @media (min-width: 769px) {
            .smartboard-screen {
                width: 95vw;
                aspect-ratio: 16/9;
                max-height: 95vh;
                border-radius: 15px;
                box-shadow: 0 0 50px rgba(0,0,0,0.5);
                border: 10px solid #ecf0f1;
            }
            .header { height: 12%; font-size: 2.5vh; padding: 0 10px; }
            .big-text { font-size: 4vw; }
            .option-content { font-size: 1.6vw; }
            .nav-btn { width: 90px; height: 100%; }
            .game-area { padding: 2rem; gap: 1.5rem; }
            .nav-icon { width: 32px; height: 32px; }
            :root { --gap-size: 1.5rem; }
        }

        @media (max-width: 768px) {
            .smartboard-screen {
                width: 100%;
                height: 100%;
                border-radius: 0;
                border: none;
            }
            .header { height: 8%; font-size: 1.8vh; padding: 0 1rem; }
            .stats { gap: 0.8rem; }
            .stat-box { padding: 4px 8px; font-size: 0.9em; }
            .game-area { padding: 0.8rem; gap: 0.8rem; }
            .big-text { font-size: 7.5vw; } 
            .option-content { font-size: 4vw; line-height: 1.2; } 
            .nav-btn { width: 60px; height: 100%; }
            .top-options-grid { gap: 0.5rem !important; }
            .bottom-nav-row { gap: 0.5rem !important; height: 16% !important; }
            .nav-icon { width: 24px; height: 24px; }
            :root { --gap-size: 0.5rem; }
        }

        /* --- ORTAK BİLEŞENLER --- */
        .header {
            background: #ecf0f1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #bdc3c7;
            flex-shrink: 0;
        }

       .stats {
    display: flex;
    gap: 20px; /* Buradaki değeri artırarak boşluğu istediğiniz kadar büyütebilirsiniz */
    align-items: center;
}
        .stat-box { background: white; border-radius: 8px; font-weight: bold; display: flex; align-items: center; justify-content: center; padding: 5px 15px; box-shadow: 0 2px 0 rgba(0,0,0,0.05); }
        .stat-box span { color: var(--accent); margin-left: 5px; }

        .timer-track { height: 1.5%; background: #dfe6e9; width: 100%; flex-shrink: 0; }
        .timer-fill { height: 100%; background: var(--accent); width: 100%; transform-origin: left; }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0; 
        }

        .question-container {
            flex: 3;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
        }

        .big-text {
            font-family: 'Noto Naskh Arabic', serif;
            font-weight: 700;
            color: #2c3e50;
            direction: rtl;
            width: 100%;
        }
        .big-text.voweled-active { color: var(--accent); }

        .top-options-grid {
            flex: 5;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: var(--gap-size);
            min-height: 0;
        }

        .bottom-nav-row {
            flex: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0;
            min-height: 0;
            position: relative;
        }

        #bottom-option-container {
            width: calc(50% - (var(--gap-size) / 2));
            height: 100%;
            flex-shrink: 0; 
        }

        .option-btn, .nav-btn {
            background: var(--btn-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            box-shadow: 0 4px 0 var(--shadow-color);
            height: 100%;
            overflow: hidden;
        }
        
        #bottom-option-container .option-btn { width: 100%; height: 100%; }

        .option-content {
            font-weight: 600;
            color: #34495e;
            text-align: center;
            word-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .option-btn:active, .nav-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--shadow-color);
        }

        .option-btn.correct { background-color: var(--correct) !important; border-color: var(--correct) !important; color: white !important; box-shadow: 0 4px 0 #1e8449 !important; }
        .option-btn.correct .option-content { color: white !important; }
        
        .option-btn.wrong { background-color: var(--wrong) !important; border-color: var(--wrong) !important; opacity: 0.6; box-shadow: 0 4px 0 #922b21 !important; }
        .option-btn.wrong .option-content { color: white !important; }

        .nav-btn svg { fill: var(--text-color); transition: fill 0.2s; }
        .nav-btn:hover svg { fill: var(--accent); }
        
        .nav-btn:disabled { 
            opacity: 0.3 !important; 
            cursor: not-allowed !important; 
            transform: none !important; 
            box-shadow: none !important; 
            border-color: #ecf0f1 !important;
            background-color: #f8f9fa !important;
        }
        .nav-btn:disabled svg { fill: #bdc3c7 !important; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.5);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; text-align: center;
            backdrop-filter: blur(5px);
        }
        .overlay.hidden { display: none; }
        
        .start-btn {
            margin-top: 2rem; padding: 1rem 3rem; 
            font-size: clamp(1rem, 2.5vw, 2rem);
            background: var(--accent); color: white; border: none;
            border-radius: 50px; cursor: pointer; font-weight: bold;
            box-shadow: 0 6px 0 #6c3483;
            transition: transform 0.1s;
        }
        .start-btn:active { transform: translateY(4px); box-shadow: none; }

    /* --- Geri Tuşu Tasarımı --- */
.back-button-container {
    display: flex;
    align-items: center;
}

.back-button {
    background: #ffffff;
    color: var(--text-color);
    border: 2px solid var(--border-color);
    border-radius: 10px;
    cursor: pointer;
    width: 45px;
    height: 45px;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    box-shadow: 0 2px 0 var(--shadow-color);
    margin-right: 15px; /* Başlık metniyle arasına boşluk */
}

.back-button:hover {
    background: #f8f9fa;
    color: var(--accent);
}

.back-button:active {
    transform: translateY(2px);
    box-shadow: none;
}

.back-button svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
}

/* Mobil için ufak boyut ayarı */
@media (max-width: 768px) {
    .back-button {
        width: 35px;
        height: 35px;
        margin-right: 8px;
    }
    .back-button svg {

        height: 20px;
    }
}
.header {
    background: #ecf0f1;

/* Geri tuşu kabı */
.back-button-container {
    flex: 1;
    display: flex;
    justify-content: flex-start;
}

/* Yeni Başlık Stili */
.main-header-title {
    flex: 2; /* Orta kısmın geniş alan kaplamasını sağlar */
    text-align: center;
    font-weight: 900;
    color: var(--accent);
    font-size: 2.2rem; /* Başlığı büyüttük */
    letter-spacing: 1px;
    text-transform: uppercase;
}

/* İstatistikler kabı */
.stats {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

/* Mobil uyum için başlık boyutunu küçültme */
@media (max-width: 768px) {
    .main-header-title {
        font-size: 1.4rem;
    }
}

    let currentQIndex = 0;
    let score = 0;
    let currentRoundQs = [];
    let timer;
    let isAnswered = false;
    const totalQuestionsPerRound = 10;

    function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

    function startGame() {
        score = 0;
        currentQIndex = 0;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        currentRoundQs = shuffle([...questionPool]).slice(0, totalQuestionsPerRound);
        updateScore();
        loadQ();
    }

    function loadQ() {
        isAnswered = false;
        
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        btnPrev.disabled = (currentQIndex === 0);
        
        // --- İLERİ TUŞU KİLİDİ ---
        // Son soruda veya cevap verilmediyse kilitli
        if (currentQIndex < currentRoundQs.length - 1) {
            btnNext.disabled = true; 
        } else {
            btnNext.disabled = true; // Son soru mantığı
        }
        
        if(currentQIndex >= currentRoundQs.length) {
            endGame();
            return;
        }

        const q = currentRoundQs[currentQIndex];
        const qEl = document.getElementById('q-text');
        
        document.getElementById('q-num').innerText = currentQIndex + 1;

        qEl.innerText = q.text;
        qEl.classList.remove('voweled-active');

        let wrongs = shuffle([...q.wrongs]).slice(0, 4);
        let opts = [{t: q.correct, ok: true}, ...wrongs.map(w=>({t:w, ok:false}))];
        shuffle(opts);

        const topGrid = document.getElementById('top-grid');
        const bottomContainer = document.getElementById('bottom-option-container');
        topGrid.innerHTML = "";
        bottomContainer.innerHTML = "";

        opts.forEach((opt, index) => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            
            const span = document.createElement('div');
            span.className = 'option-content';
            span.innerText = opt.t;
            btn.appendChild(span);
            
            btn.onclick = () => check(opt.ok, btn, opts, q);

            if (index < 4) {
                topGrid.appendChild(btn);
            } else {
                bottomContainer.appendChild(btn);
            }
        });

        startTimer(q.text);
    }

    function startTimer(text) {
        clearInterval(timer);
        const bar = document.getElementById('timer-bar');
        bar.style.transition = "none";
        bar.style.width = "100%";
        
        const wordCount = text.trim().split(/\s+/).length;
        let duration = Math.max(15, Math.min(30, wordCount * 5 + 10)); 
        
        setTimeout(() => {
            if(!isAnswered) {
                bar.style.transition = `width ${duration}s linear`;
                bar.style.width = "0%";
            }
        }, 50);

        let left = duration;
        timer = setInterval(() => {
            if(isAnswered) {
                clearInterval(timer);
                return;
            }
            left--;
            if(left < 0) {
                clearInterval(timer);
                handleTimeout();
            }
        }, 1000);
    }

    function check(isCorrect, btn, allOpts, currentQData) {
        if(isAnswered) return;
        isAnswered = true;
        clearInterval(timer);
        
        document.getElementById('timer-bar').style.transition = "none";

        const qEl = document.getElementById('q-text');
        qEl.innerText = currentQData.voweled || currentQData.text;
        qEl.classList.add('voweled-active');

        // Şıklara tıklamayı kapat
        const allButtons = document.querySelectorAll('.option-btn');
        allButtons.forEach(b => b.style.pointerEvents = 'none');

        if(isCorrect) {
            btn.classList.add('correct');
            score += 10;
        } else {
            btn.classList.add('wrong');
            // --- YANLIŞ CEVAPTA DOĞRUYU GÖSTERME KODU ---
            allButtons.forEach(b => {
                // Metni kırpıp (trim) karşılaştırıyoruz ki boşluklardan etkilenmesin
                if (b.innerText.trim() === currentQData.correct.trim()) {
                     b.classList.add('correct');
                }
            });
        }
        updateScore();

        // Kilitli ileri tuşunu aç (son soru değilse)
        if (currentQIndex < currentRoundQs.length - 1) {
            document.getElementById('btn-next').disabled = false;
        } else {
            setTimeout(endGame, 2000);
        }
    }

    function handleTimeout() {
        isAnswered = true;
        const qData = currentRoundQs[currentQIndex];
        const qEl = document.getElementById('q-text');
        qEl.innerText = qData.voweled || qData.text;
        qEl.classList.add('voweled-active');

        const allButtons = document.querySelectorAll('.option-btn');
        allButtons.forEach(b => {
            b.style.pointerEvents = 'none';
            b.style.opacity = 0.5;
            // Süre dolunca da doğruyu gösterelim
            if (b.innerText.trim() === qData.correct.trim()) {
                 b.classList.add('correct');
                 b.style.opacity = 1;
            }
        });

        if (currentQIndex < currentRoundQs.length - 1) {
            document.getElementById('btn-next').disabled = false;
        } else {
            setTimeout(endGame, 2000);
        }
    }

    function navigate(direction) {
        const newIndex = currentQIndex + direction;
        if(newIndex >= 0 && newIndex < currentRoundQs.length) {
            currentQIndex = newIndex;
            loadQ();
        } else if (newIndex >= currentRoundQs.length) {
            endGame();
        }
    }

    function updateScore() {
        document.getElementById('score').innerText = score;
    }

    function endGame() {
        const screen = document.getElementById('end-screen');
        screen.classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
    }
