<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, type, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Diziyi karıştırmak için yardımcı fonksiyon (Fisher-Yates Shuffle)
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// Uygulama başlangıcında soruları karıştır
shuffleArray(quranQuestions);

let currentIdx = 0;
let userAnswers = new Array(quranQuestions.length).fill(null);

function updateUI() {
    const data = quranQuestions[currentIdx];
    document.getElementById('counter').innerText = `Soru: ${currentIdx + 1} / ${quranQuestions.length}`;
    document.getElementById('verse').innerHTML = data.verse;
    document.getElementById('meal-display').innerText = data.meal;

    const hintBox = document.getElementById('hint-box');
    const optionsEl = document.getElementById('options');
    optionsEl.innerHTML = '';

    if (userAnswers[currentIdx]) {
        hintBox.style.display = 'block';
        hintBox.innerHTML = `<small>${data.hint}</small>`;
    } else {
        hintBox.style.display = 'none';
    }

    // Şıkları da soru her görüntülendiğinde karıştırıyoruz
    // (Ancak kullanıcının verdiği cevabı korumak için sadece ilk seferde karıştırmak daha iyidir)
    if (!data.shuffledOptions) {
        data.shuffledOptions = shuffleArray([...data.options]);
    }

    data.shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        
        if (userAnswers[currentIdx]) {
            if (opt === data.correctPattern) btn.classList.add('correct');
            else if (opt === userAnswers[currentIdx]) btn.classList.add('wrong');
            btn.disabled = true;
        }

        btn.onclick = () => {
            userAnswers[currentIdx] = opt;
            if (opt === data.correctPattern) {
                playTone(880, 'sine', 0.3);
            } else {
                playTone(200, 'triangle', 0.15);
            }
            updateUI();
            document.getElementById('next-btn').disabled = false;
        };
        optionsEl.appendChild(btn);
    });
    
    document.getElementById('next-btn').disabled = !userAnswers[currentIdx];
    document.getElementById('prev-btn').disabled = currentIdx === 0;
}

document.getElementById('next-btn').onclick = () => { 
    if (currentIdx < quranQuestions.length - 1) {
        currentIdx++; 
        updateUI(); 
    }
};

document.getElementById('prev-btn').onclick = () => { 
    if (currentIdx > 0) {
        currentIdx--; 
        updateUI(); 
    }
};

updateUI();
</script>
</body>
</html>
