<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>Kidef Arapça - Profesyonel Dizilim</title>

    <style>
        @font-face {
            font-family: 'arakom';
            src: url('arakom.ttf') format('truetype');
            font-weight: normal; font-style: normal;
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #f3f0ff 0%, #e5dbff 100%);
            --primary: #5c7cfa;
            --accent: #ff922b;
            --p1: #4dabf7;
            --p2: #ff8787;
            --shadow: 0 12px 25px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'arakom', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            padding: 10px;
            text-align: center;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 1000;
        }

        h1 { margin: 0 0 5px 0; color: #4b2cc5; font-size: 1.5rem; font-weight: normal; }
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

        .btn {
            border: none; padding: 8px 14px; border-radius: 10px; cursor: pointer;
            font-family: 'arakom'; background: white; box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: 0.3s; font-size: 0.9rem;
        }
        .btn.active { background: var(--primary); color: white; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .game-area { flex-grow: 1; padding: 15px; display: flex; justify-content: center; align-items: stretch; }

        .score-board {
            display: flex; flex-direction: row; align-items: flex-start; justify-content: center;
            gap: 15px; width: 100%; max-width: 1400px; margin: 0 auto; height: auto; overflow: visible;
        }

        .player-box {
            flex: 0 0 80px; display: none; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.9); border-radius: 20px; box-shadow: var(--shadow);
            transition: all 0.4s; border: 3px solid transparent; padding: 10px 5px;
            align-self: flex-start; position: sticky; top: 20px; height: 55vh;
        }

        .p-label { font-size: 1.1rem; font-weight: bold; opacity: 0.6; }
        .p-score { font-size: 2.5rem; font-weight: 900; margin-top: 5px; }

        .active-p { background: #fff; border-color: currentColor; transform: scale(1.06); box-shadow: 0 0 30px rgba(0,0,0,0.2); }

        .grid { display: grid; gap: 10px; flex-grow: 1; width: 100%; }

        .grid:not(.memory-mode) {
            grid-template-columns: repeat(5, 1fr) !important;
            grid-auto-rows: 180px;
        }

        .grid.memory-mode { grid-auto-rows: minmax(140px, 1fr); align-content: start; height: auto; }
        .grid.memory-mode[data-total="12"] { grid-template-columns: repeat(4, 1fr); }
        .grid.memory-mode[data-total="18"] { grid-template-columns: repeat(6, 1fr); }
        .grid.memory-mode[data-total="20"] { grid-template-columns: repeat(5, 1fr); }
        .grid.memory-mode[data-total="24"] { grid-template-columns: repeat(6, 1fr); }

        .card { perspective: 1000px; cursor: pointer; width: 100%; height: 100%; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px;
            display: flex; align-items: center; justify-content: center; font-size: clamp(1.1rem, 4vw, 2.2rem);
            box-shadow: var(--shadow); border: 4px solid white; box-sizing: border-box; text-align: center; padding: 10px;
        }
        .card-front { color: white; }
        .card-back { transform: rotateY(180deg); background: #ffffff; color: #333; }
        .memory-mode .card-front::after { content: "؟"; font-size: 2rem; opacity: 0.3; }
        .matched { opacity: 0; pointer-events: none; transition: 0.6s; transform: scale(0.8); }

        /* Switch Tasarımı */
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--p2) !important; }
        input:checked + .slider:before { transform: translateX(22px); }

        @media (max-width: 768px) {
            .score-board { flex-direction: column; align-items: center; }
            .player-box { flex-direction: row; flex: none; width: 90%; height: 45px; gap: 15px; margin: 5px 0; }
            .p-score { font-size: 1.4rem; margin-top: 0; }
            .p-label { font-size: 0.8rem; }
            .grid:not(.memory-mode) { grid-template-columns: repeat(3, 1fr) !important; grid-auto-rows: 110px; }

            @media (orientation: portrait) {
                #pair-selection-area { display: none !important; }
                .grid.memory-mode { grid-template-columns: repeat(3, 1fr) !important; grid-auto-rows: minmax(75px, 1fr) !important; gap: 5px !important; }
                .card-face { font-size: 0.9rem !important; border-width: 2px !important; padding: 4px !important; }
                .memory-mode .card-front::after { font-size: 1.2rem; }
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="controls" style="display: flex; align-items: center; justify-content: center; position: relative; width: 100%; min-height: 50px;">
        
        <button class="btn" id="btn-back" onclick="location.href='muhadese.html'" style="position: absolute; left: 10px; background: #f1f3f5; font-weight: bold; display: flex; align-items: center; gap: 5px;">
            <span>❮</span>
        </button>

        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="btn active" id="btn-study" onclick="setMode('study')">Kartlar</button>
            <button class="btn" id="lang-btn-main" onclick="toggleLang()" style="background:var(--accent); color:white;"> T ⇄ ع</button>
            <button class="btn" id="btn-memory-start" onclick="setMode('mem1')" style="background: #e9ecef;">Hafıza Oyunu</button>

            <div id="memory-controls" style="display: none; align-items: center; gap: 8px;">
                <button class="btn" onclick="setMode('study')" style="background:#dee2e6; font-weight: bold;">Kartlar</button>
                
                <div class="switch-wrapper" style="display: flex; align-items: center; background: white; padding: 4px 8px; border-radius: 50px; border: 2px solid #eee; gap: 5px;">
                    <span style="font-size: 1.1rem; cursor: pointer;" onclick="toggleSwitch(false)">👤</span>
                    <label class="switch" style="position: relative; display: inline-block; width: 44px; height: 22px;">
                        <input type="checkbox" id="mode-toggle" onchange="toggleMemoryMode(this)" style="opacity:0; width:0; height:0;">
                        <span class="slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--p1); transition: .4s; border-radius: 34px;"></span>
                    </label>
                    <span style="font-size: 1.1rem; cursor: pointer;" onclick="toggleSwitch(true)">👥</span>
                </div>

                <div id="pair-selection-area">
                    <select id="pairCount" class="btn" onchange="init()" style="border: 2px solid var(--primary); padding: 4px 6px;">
                        <option value="6">6</option>
                        <option value="9" selected>9</option>
                        <option value="12">12</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="game-area">
    <div id="score-board-container" class="score-board">
        <div id="p1-box" class="player-box" style="color: var(--p1)">
            <span class="p-label">P1</span>
            <span id="s1" class="p-score">0</span>
        </div>
        <div id="grid" class="grid"></div>
        <div id="p2-box" class="player-box" style="color: var(--p2)">
            <span class="p-label">P2</span>
            <span id="s2" class="p-score">0</span>
        </div>
    </div>
</div>

<audio id="snd-flip" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
<audio id="snd-match" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>

<script>
    const allWords = [
        { ar: "بَيْت", tr: "Ev" }, { ar: "غُرْفَة", tr: "Oda" }, { ar: "بَاب", tr: "Kapı" },
        { ar: "نَافِذَة", tr: "Pencere" }, { ar: "مَطْبَخ", tr: "Mutfak" }, { ar: "حَمَّام", tr: "Banyo" },
        { ar: "حَدِيقَة", tr: "Bahçe" }, { ar: "سَطْح", tr: "Çatı" }, { ar: "دَرَج", tr: "Merdiven" },
        { ar: "مِصْعَد", tr: "Asansör" }, { ar: "سَرِير", tr: "Yatak" }, { ar: "خِزَانَة", tr: "Dolap" },
        { ar: "طَاوِلَة", tr: "Masa" }, { ar: "كُرْسِيّ", tr: "Sandalye" }, { ar: "أَرِيكَة", tr: "Koltuk" },
        { ar: "سِجَّادَة", tr: "Halı" }, { ar: "رَفّ", tr: "Raf" }, { ar: "مَكْتَب", tr: "Masa" },
        { ar: "وِسَادَة", tr: "Yastık" }, { ar: "سِتَارَة", tr: "Perde" }
    ];

    const cardColors = ["#364fc7", "#63e6be", "#ff922b", "#f06595", "#845ef7", "#51cf66", "#fcc419", "#339af0"];
    let mode = 'study', isAr = true, scores = [0, 0], currentPlayer = 1, activeFlipped = [];

    function playSound(id) {
        const s = document.getElementById(id);
        s.volume = 0.15; s.currentTime = 0;
        s.play().catch(() => {});
    }

    function toggleLang() {
        isAr = !isAr;
        init();
    }

    function init() {
        const isPortrait = window.innerHeight > window.innerWidth;
        const isMobile = window.innerWidth <= 768;
        
        // Mobilde otomatik 9 çifti ayarla
        if (isMobile && isPortrait && mode !== 'study') {
            document.getElementById('pairCount').value = "9";
        }

        const grid = document.getElementById('grid');
        const p1Box = document.getElementById('p1-box');
        const p2Box = document.getElementById('p2-box');
        const pairCount = parseInt(document.getElementById('pairCount').value);
        grid.innerHTML = '';
        
        const isStudy = mode === 'study';
        const isMem2 = mode === 'mem2';

        p1Box.style.display = isMem2 ? 'flex' : 'none';
        p2Box.style.display = isMem2 ? 'flex' : 'none';

        grid.className = `grid ${isStudy ? '' : 'memory-mode'}`;

        let selectedWords = isStudy ? allWords : allWords.slice(0, pairCount);
        let displayList = [];

        if (isStudy) {
            displayList = selectedWords;
            grid.setAttribute('data-total', selectedWords.length);
        } else {
            selectedWords.forEach(w => {
                displayList.push({ text: w.ar, pairId: w.ar });
                displayList.push({ text: w.tr, pairId: w.ar });
            });
            displayList.sort(() => Math.random() - 0.5);
            grid.setAttribute('data-total', displayList.length);
        }

        displayList.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = isStudy ? item.ar : item.pairId;
            
            const frontText = isStudy ? (isAr ? item.ar : item.tr) : "";
            const backText = isStudy ? (isAr ? item.tr : item.ar) : item.text;
            const color = isStudy ? cardColors[index % cardColors.length] : cardColors[0];

            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-face card-front" style="background-color: ${color}">${frontText}</div>
                    <div class="card-face card-back">${backText}</div>
                </div>`;
            
            card.onclick = () => handleFlip(card);
            grid.appendChild(card);
        });
        updateUI();
    }

    function handleFlip(card) {
        if (card.classList.contains('matched') || (mode !== 'study' && activeFlipped.length >= 2)) return;

        if (mode === 'study') {
            if (card.classList.contains('flipped')) {
                clearTimeout(card.studyTimer);
                card.classList.remove('flipped');
            } else {
                playSound('snd-flip');
                card.classList.add('flipped');
                card.studyTimer = setTimeout(() => card.classList.remove('flipped'), 3000);
            }
            return;
        }

        if (card.classList.contains('flipped')) return;

        playSound('snd-flip');
        card.classList.add('flipped');
        activeFlipped.push(card);
        
        if (activeFlipped.length === 2) checkMatch();
    }

    function checkMatch() {
        const [a, b] = activeFlipped;
        const isMatch = a.dataset.id === b.dataset.id;

        setTimeout(() => {
            if (isMatch) {
                playSound('snd-match');
                a.classList.add('matched');
                b.classList.add('matched');
                if (mode === 'mem2') scores[currentPlayer - 1]++;
            } else {
                a.classList.remove('flipped');
                b.classList.remove('flipped');
                if (mode === 'mem2') currentPlayer = (currentPlayer === 1) ? 2 : 1;
            }
            activeFlipped = [];
            updateUI();
        }, 800);
    }

    function updateUI() {
        document.getElementById('s1').innerText = scores[0];
        document.getElementById('s2').innerText = scores[1];
        document.getElementById('p1-box').classList.toggle('active-p', currentPlayer === 1);
        document.getElementById('p2-box').classList.toggle('active-p', currentPlayer === 2);
    }

    function setMode(m) {
        mode = m; scores = [0, 0]; currentPlayer = 1; activeFlipped = [];
        
        const studyBtn = document.getElementById('btn-study');
        const mainLangBtn = document.getElementById('lang-btn-main');
        const memStartBtn = document.getElementById('btn-memory-start');
        const memControls = document.getElementById('memory-controls');
        const toggle = document.getElementById('mode-toggle');

        if (m === 'study') {
            studyBtn.style.display = 'inline-block';
            studyBtn.classList.add('active');
            mainLangBtn.style.display = 'inline-block';
            memStartBtn.style.display = 'inline-block';
            memControls.style.display = 'none';
        } else {
            studyBtn.style.display = 'none';
            mainLangBtn.style.display = 'none';
            memStartBtn.style.display = 'none';
            memControls.style.display = 'flex';
            if (toggle) toggle.checked = (m === 'mem2');
        }
        init();
    }

    function toggleSwitch(isCheck) {
        const toggle = document.getElementById('mode-toggle');
        toggle.checked = isCheck;
        toggleMemoryMode(toggle);
    }

    function toggleMemoryMode(checkbox) {
        const newMode = checkbox.checked ? 'mem2' : 'mem1';
        setMode(newMode);
    }

    window.onload = init;
</script>

</body>
</html>
