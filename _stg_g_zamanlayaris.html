<html lang="tr" dir="ltr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">

    </head>
<body>
    <div id="game-container">
        
       <main id="level2-container" class="hidden">
            
            <div id="l2-top-bar">
                <div class="back-button" id="game-back-button">&#8617;</div>
                <div id="l2-timer">01:00</div>
                <div id="l2-score-display">Puan: <span id="l2-score-value">0</span></div>
                <div id="l2-turkish-word-area"></div>
            </div>
            
            <div id="l2-main-game-area">
                <div id="l2-patterns-wrapper"></div>
                <div id="l2-roots-sidebar"></div>
            </div>
            
            <div id="l2-global-result"></div>
            
        </main>

        <div id="start-screen" class="overlay"> 
            <div class="overlay-content"> 
                <div class="back-button" id="start-back-button" data-kidef-done="1">&#8617;</div>
                <h1>Zamana Karşı! ⏱️</h1>
                <h2>Seviye Seç:</h2> 
                <div class="start-options"> 
                    <button class="start-button-option" data-difficulty="easy">Kolay</button> 
                    <button class="start-button-option" data-difficulty="medium">Orta</button> 
                    <button class="start-button-option" data-difficulty="hard">Zor</button> 
                </div> 
            </div> 
        </div>

        <div id="countdown-overlay" class="overlay hidden">
            <div class="overlay-content">
                <h1 id="countdown-text">3</h1>
            </div>
        </div>

        <div id="results-screen" class="overlay hidden"> 
            <div class="overlay-content"> 
                
                <div id="results-details">
                    </div> 
                
                <div id="results-button-wrapper">
                    <button id="next-round-button">Sonraki Tur ➡️</button>
                    <button id="play-again-button">Seviyeler 📊</button>
                </div>
                
            </div> 
        </div>
    
    </div>

<script src="zamanlayaris.js"></script>
    <script src="geri.js"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
</html>
