<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfabeyi Pekiştir</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FV9JD15KLW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FV9JD15KLW');
    </script>
    <style>
        @font-face {
            font-family: 'arakom';
            src: url('arakom.ttf') format('truetype');
            font-weight: normal; font-style: normal;
        }

        :root {
            --primary: #1e293b;
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --p1-bg: #e0f2fe;
            --p2-bg: #f0fdf4;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'arakom', sans-serif; 
            height: 100vh; width: 100vw;
            background: url('arakom.jpg') center/cover fixed no-repeat, linear-gradient(135deg, #e0e7ff, #c7d2fe);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .main-app { 
            width: 98vw; height: 96vh;
            background: var(--bg-glass); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

         /* --- PROFESYONEL SAYAÇ ANİMASYONLARI --- */
        .pro-countdown {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 140px; height: 140px; display: none; z-index: 100;
        }
        .pro-countdown svg {
            width: 100%; height: 100%; transform: rotate(-90deg);
            filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.6));
        }
        .pro-countdown .track {
            fill: rgba(30, 41, 59, 0.95);
            stroke: rgba(255, 255, 255, 0.05); stroke-width: 8;
        }
        .pro-countdown .progress {
            fill: none; stroke: var(--accent); stroke-width: 8;
            stroke-linecap: round; /* Çizginin uçlarını yumuşatır */
            stroke-dasharray: 264; /* 2 * PI * r(42) */
            stroke-dashoffset: 0;
        }
        .glow-core {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.9) 0%, transparent 70%);
            animation: pulseCore 0.6s infinite alternate ease-in-out;
        }
        @keyframes pulseCore {
            from { transform: translate(-50%, -50%) scale(0.7); opacity: 0.5; }
            to { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
        }
        .pop-out { animation: popOutAnim 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popOutAnim {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            40% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }


        /* Sekmeler */
        .nav-tabs { 
            display: flex; background: var(--primary); padding: 8px 12px 0; gap: 8px; 
            direction: rtl; justify-content: center; border-radius: 20px 20px 0 0;
            position: relative; /* Butonu sabitlemek için eklendi */
        }
        .tab-trigger { 
            padding: 12px 30px; border: none; background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.7); cursor: pointer; font-family: 'arakom'; font-size: 1.2rem;
            border-radius: 12px 12px 0 0; transition: all 0.3s ease;
        }
        .tab-trigger:hover { background: rgba(255,255,255,0.15); color: white; }
        .tab-trigger.active { background: var(--bg-glass); color: var(--primary); font-weight: bold; }

        /* Yeni Anasayfa Butonu Tasarımı */
        .home-link { 
            position: absolute; left: 15px; bottom: 8px; /* En sola sabitlendi */
            display: flex; align-items: center; justify-content: center; 
            text-decoration: none; color: rgba(255,255,255,0.7); 
            background: rgba(255,255,255,0.05); 
            width: 42px; height: 42px; border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }
        .home-link:hover { 
            transform: translateY(-3px); 
            background: var(--accent); 
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }
        .home-link svg {
            width: 22px; height: 22px; 
            stroke: currentColor; stroke-width: 2; fill: none;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .content-area { flex: 1; padding: 15px; overflow: hidden; background: transparent; position: relative; }
        .panel { display: none; height: 100%; width: 100%; animation: fadeIn 0.4s ease; position: relative; }
        .panel.active { display: block; }
        
        /* Flex paneller için display ayarları (Sekme hatasını çözen kısım) */
        #p3.active { display: flex; flex-direction: column; }
        #p4.active { display: flex; flex-direction: column; position: relative; height: 100%; width: 100%; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Harf Tanıtımı */
        .grid-intro { display: grid; gap: 6px; height: 100%; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(4, 1fr); direction: rtl; }
        .char-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 5px; box-shadow: var(--shadow-sm); }
        .arabic-seq { font-size: 2.2rem; display: flex; gap: 12px; position: relative; z-index: 1; }
        .arabic-seq::before { content: ""; position: absolute; left: 0; right: 0; top: 65%; height: 2px; background-color: rgba(0, 0, 0, 0.25); z-index: -1; }
        .b-green { color: #16a34a !important; }
        .o-blue  { color: #2563eb !important; }
        .s-purple { color: #9333ea !important; }
        .n-black { color: #000 !important; }
        .nobind span { color: var(--danger) !important; font-weight: bold; }
        .nobind .arabic-seq::before { background-color: rgba(239, 68, 68, 0.3); }
        .tr-label { font-size: 1.1rem; color: #64748b; font-weight: bold; margin-top: 5px; }

        /* Kartlar (Flip) */
        .grid-flip { display: grid; gap: 12px; height: 100%; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(4, 1fr); direction: rtl; }
        .flip-box { perspective: 1000px; cursor: pointer; height: 100%; }
        .flip-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flip-box:hover .flip-inner { transform: translateY(-5px); }
        .flip-box.is-flipped .flip-inner { transform: rotateY(180deg); }
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; border: 2px solid transparent; background: white; box-shadow: var(--shadow-md); }
        .face-back { background: linear-gradient(135deg, #f59e0b, #ea580c); color: white; transform: rotateY(180deg); font-size: 2rem; }

        /* --- HAFIZA OYUNU ÖZEL --- */
        .memory-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; }
        
        .switch-wrapper { display: flex; align-items: center; background: white; padding: 6px 12px; border-radius: 50px; border: 2px solid #e2e8f0; gap: 10px; box-shadow: var(--shadow-sm); }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3b82f6; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(20px); }

        .select-pair { font-family: 'arakom'; font-size: 1.1rem; padding: 6px 10px; border-radius: 10px; border: 2px solid #e2e8f0; outline: none; cursor: pointer; }

        .score-board { display: flex; align-items: stretch; justify-content: space-between; gap: 15px; flex-grow: 1; height: 100%; position: relative; }
        .player-box { flex: 0 0 110px; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.95); border-radius: 20px; box-shadow: var(--shadow-sm); transition: all 0.4s ease; border: 4px solid transparent; margin: 10px 0; }
        #p1-box { color: #0284c7; }
        #p2-box { color: #16a34a; }
        .p-label { font-size: 1.1rem; font-weight: bold; opacity: 0.8; text-align: center; }
        .p-score { font-size: 2.8rem; font-weight: bold; margin-top: 5px; }
        .active-p { background: #fff; transform: scale(1.05); box-shadow: 0 0 25px rgba(0,0,0,0.15); border-color: currentColor; }

        .grid-memory { display: grid; gap: 12px; flex-grow: 1; direction: rtl; }
        .mem-item { background: linear-gradient(135deg, var(--primary), #334155); border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: transparent; font-size: 2.2rem; box-shadow: var(--shadow-md); transition: transform 0.6s, opacity 0.6s, background 0.3s; border: 2px solid transparent; }
        .mem-item:hover { transform: translateY(-3px); }
        .mem-item.show { background: white; color: var(--primary); border: 2px solid var(--primary); transform: rotateY(0deg); }
        .mem-item.matched { opacity: 0 !important; pointer-events: none !important; transform: scale(0.8) !important; box-shadow: none !important; border: none !important; }
        .mem-item.p1-turn { background: #e0f2fe !important; color: #0284c7 !important; border-color: #38bdf8 !important; }
        .mem-item.p2-turn { background: #dcfce7 !important; color: #16a34a !important; border-color: #4ade80 !important; }

        .reset-area { text-align: center; margin-top: 10px; display: none; }
        .reset-btn { font-size: 1.2rem; font-family: 'arakom'; cursor: pointer; background: var(--primary); color: white; padding: 10px 20px; border-radius: 10px; border: none; transition: 0.3s; }
        .reset-btn:hover { background: #334155; transform: scale(1.05); }

        /* --- YARIŞMA (TEST) --- */
        #duel-stage-container { display: none; flex-direction: column; flex: 1; height: 100%; width: 100%; }
        .duel-stage { display: flex; flex: 1; margin-bottom: 10px; gap: 15px; }
        .player-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 25px; position: relative; border-radius: 20px; box-shadow: var(--shadow-sm); transition: background-color 0.4s; }
        #z1 { background-color: var(--p1-bg); border: 2px solid #bae6fd; }
        #z2 { background-color: var(--p2-bg); border: 2px solid #bbf7d0; }
        .q-display { font-size: 9rem; font-weight: bold; color: var(--primary); text-shadow: 2px 4px 10px rgba(0,0,0,0.1); }
        .ans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; height: 35%; }
        .btn-ans { border: none; background: white; border-radius: 12px; font-family: 'arakom'; font-size: 2rem; cursor: pointer; box-shadow: 0 4px 0 #cbd5e1; transition: all 0.1s; color: var(--primary); }
        .btn-ans:active { transform: translateY(4px); box-shadow: 0 0 0 #cbd5e1; }
        .btn-ans.selected { background: #94a3b8; color: white; box-shadow: 0 0 0 #cbd5e1; transform: translateY(4px); }
        
        .zone-correct { background-color: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .zone-wrong { background-color: var(--danger) !important; color: white !important; border-color: var(--danger) !important; animation: shake 0.4s; }
        .zone-correct .q-display, .zone-wrong .q-display { color: white; }

        .puan-popup { position: absolute; font-size: 3rem; font-weight: bold; color: #fbbf24; z-index: 100; animation: floatUp 1s forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { transform: translateY(-20px) scale(1.2); opacity: 1; } 100% { transform: translateY(-120px) scale(1); opacity: 0; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        
        .next-btn { height: 60px; width: 100%; background: var(--primary); color: white; font-family: 'arakom'; font-size: 1.8rem; border: none; border-radius: 15px; cursor: pointer; display: none; margin-top: 10px; }

        /* Yarışma Başlatma Ekranı */
        #startInfo {
            display: flex; align-items: center; justify-content: center; flex: 1; height: 100%; width: 100%;
        }

        /* Mobil Optimizasyon */
        @media (max-width: 768px) {
            .nav-tabs { 
                padding-left: 65px !important; /* Solda buton için boşluk bırakır */
                justify-content: flex-start !important; 
                overflow-x: auto; white-space: nowrap; padding-bottom: 5px; scrollbar-width: none; 
            }

             .home-link {
                position: sticky !important; /* Sağa kaydırsan bile buton solda sabit kalır */
                left: 10px;
                bottom: 5px;
            } 
            .nav-tabs::-webkit-scrollbar { display: none; }
            .tab-trigger { padding: 10px 15px; flex-shrink: 0; }
            .content-area { overflow-y: auto !important; }
            #p1 { overflow-x: auto !important; overflow-y: auto !important; }
            #p1.active { display: block !important; }
            .grid-intro { display: grid !important; grid-template-columns: repeat(4, 1fr) !important; grid-template-rows: auto !important; height: auto !important; min-width: 650px !important; padding-bottom: 15px; }
            .grid-flip { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(7, 1fr); }
            
            .score-board { flex-direction: column; align-items: center; }
            .player-box { flex-direction: row; flex: none; width: 90%; height: 50px; gap: 10px; margin: 15px 0 5px 0; padding: 5px; }
            .p-score { font-size: 1.8rem; margin-top: 0; }
            .p-label { font-size: 0.9rem; margin-top: 0; }
            
            .grid-memory { height: auto !important; padding-bottom: 10px; }
            .mem-item { font-size: 1.6rem !important; }
            .duel-stage { flex-direction: column; }
            .q-display { font-size: 5rem !important; }
            .btn-ans { font-size: 1.4rem !important; }
        }
    </style>
</head>
<body>

<div class="main-app">
    <nav class="nav-tabs">
        <a href="https://kidefarapca.com" target="_blank" class="home-link" title="Ana Sayfa">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
        <button class="tab-trigger active" onclick="ui.tab(event, 'p1')">Harf Tanıtımı</button>
        <button class="tab-trigger" onclick="ui.tab(event, 'p2')">Kartlar</button>
        <button class="tab-trigger" onclick="ui.tab(event, 'p3')">Hafıza</button>
        <button class="tab-trigger" onclick="ui.tab(event, 'p4')">Yarışma</button>
    </nav>

    <main class="content-area">
        <section id="p1" class="panel active"><div class="grid-intro" id="g1"></div></section>
        
        <section id="p2" class="panel"><div class="grid-flip" id="g2"></div></section>
        
        <section id="p3" class="panel">
            <div class="memory-controls">
                <div class="switch-wrapper">
                    <span style="font-size:1.2rem; cursor:pointer;" onclick="memoryGame.toggleSwitch(false)">👤</span>
                    <label class="switch">
                        <input type="checkbox" id="mem-toggle" onchange="memoryGame.toggleSwitch(this.checked)">
                        <span class="slider"></span>
                    </label>
                    <span style="font-size:1.2rem; cursor:pointer;" onclick="memoryGame.toggleSwitch(true)">👥</span>
                </div>
                <select id="pairCount" class="select-pair" onchange="memoryGame.init()">
                    <option value="6">6 Çift</option>
                    <option value="9" selected>9 Çift</option>
                    <option value="12">12 Çift</option>
                    <option value="14">14 Çift</option>
                </select>
            </div>

            <div class="score-board" id="score-board-area">
                <div id="p1-box" class="player-box">
                    <span class="p-label" id="p1-title">SKOR</span>
                    <span id="msc1" class="p-score">0</span>
                </div>
                <div class="grid-memory" id="g3"></div>
                <div id="p2-box" class="player-box">
                    <span class="p-label">OYUNCU 2</span>
                    <span id="msc2" class="p-score">0</span>
                </div>
            </div>
            <div id="resetArea" class="reset-area"><button class="reset-btn" onclick="memoryGame.init()">🔄 Yeniden Başlat</button></div>
        </section>

   <section id="p4" class="panel">
            <div id="duel-stage-container" style="position: relative;">
                <div style="width: 100%; display: flex; gap: 15px; margin-bottom: 10px;">
                    <div style="flex: 1; background: var(--p1-bg); height: 20px; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #bae6fd;">
                        <div id="pb1" style="height: 100%; width: 0%; background: #0284c7; transition: 0.4s ease-out;"></div>
                        <div style="position:absolute; top:0; left:0; width:100%; height:100%; background: repeating-linear-gradient(to right, transparent, transparent calc(10% - 1px), rgba(255,255,255,0.9) calc(10% - 1px), rgba(255,255,255,0.9) 10%); pointer-events: none;"></div>
                    </div>
                    <div style="flex: 1; background: var(--p2-bg); height: 20px; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #bbf7d0;">
                        <div id="pb2" style="height: 100%; width: 0%; background: #16a34a; transition: 0.4s ease-out;"></div>
                        <div style="position:absolute; top:0; left:0; width:100%; height:100%; background: repeating-linear-gradient(to right, transparent, transparent calc(10% - 1px), rgba(255,255,255,0.9) calc(10% - 1px), rgba(255,255,255,0.9) 10%); pointer-events: none;"></div>
                    </div>
                </div>

                <div class="duel-stage">
                    <div id="z1" class="player-zone">
                        <div style="font-size:1.4rem; margin-bottom:5px; font-weight:bold; color:var(--primary);">SKOR: <b id="sc1">0</b></div>
                        <div class="q-display" id="dq1">?</div>
                        <div class="ans-grid" id="ag1"></div>
                    </div>
                    <div id="z2" class="player-zone">
                        <div style="font-size:1.4rem; margin-bottom:5px; font-weight:bold; color:var(--primary);">SKOR: <b id="sc2">0</b></div>
                        <div class="q-display" id="dq2">?</div>
                        <div class="ans-grid" id="ag2"></div>
                    </div>
                </div>

                <div id="countdown-overlay" class="pro-countdown">
                    <div class="glow-core"></div>
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="42" class="track"></circle>
                        <circle id="countdown-circle" cx="50" cy="50" r="42" class="progress"></circle>
                    </svg>
                </div>

                <button id="nextBtn" class="next-btn" onclick="game.start()">SONRAKİ SORU ➔</button>
            </div>
            
            <div id="startInfo">
                <button onclick="game.start()" style="padding:20px 50px; font-family:'arakom'; font-size:2rem; cursor:pointer; background:var(--accent); color:white; border:none; border-radius:15px; box-shadow: var(--shadow-md);">YARIŞMAYI BAŞLAT</button>
            </div>
        </section>
    </main>
</div>

<script>
    const harfler = [
        {h: 'ا', tr: 'Elif', b:'ا', o:'ـا', s:'ـا', nobind: true}, 
        {h: 'ب', tr: 'Be', b:'بـ', o:'ـبـ', s:'ـب'},
        {h: 'ت', tr: 'Te', b:'تـ', o:'ـتـ', s:'ـت'}, 
        {h: 'ث', tr: 'Peltek S̱e', b:'ثـ', o:'ـثـ', s:'ـث'},
        {h: 'ج', tr: 'Cim', b:'جـ', o:'ـجـ', s:'ـج'}, 
        {h: 'ح', tr: 'Ḥa', b:'حـ', o:'ـحـ', s:'ـح'},
        {h: 'خ', tr: 'Ḫa (Hırıltılı)', b:'خـ', o:'ـخـ', s:'ـخ'}, 
        {h: 'د', tr: 'Dal', b:'د', o:'ـد', s:'ـد', nobind: true},
        {h: 'ذ', tr: 'Ẕel (Peltek)', b:'ذ', o:'ـذ', s:'ـذ', nobind: true}, 
        {h: 'ر', tr: 'Ra', b:'ر', o:'ـر', s:'ـر', nobind: true},
        {h: 'ز', tr: 'Ze', b:'ز', o:'ـز', s:'ـز', nobind: true}, 
        {h: 'س', tr: 'Sin', b:'سـ', o:'ـسـ', s:'ـس'},
        {h: 'ش', tr: 'Şın', b:'شـ', o:'ـشـ', s:'ـش'}, 
        {h: 'ص', tr: 'Ṣad (Kalın S)', b:'صـ', o:'ـصـ', s:'ـص'},
        {h: 'ض', tr: 'Ḍad', b:'ضـ', o:'ـضـ', s:'ـض'}, 
        {h: 'ط', tr: 'Ṭa', b:'طـ', o:'ـطـ', s:'ـط'},
        {h: 'ظ', tr: 'Ẓa (Peltek, Kalın)', b:'ظـ', o:'ـظـ', s:'ـظ'}, 
        {h: 'ع', tr: 'Ayn (Boğazdan) (ʿ)', b:'عـ', o:'ـعـ', s:'ـع'},
        {h: 'غ', tr: 'Ğayn', b:'غـ', o:'ـغـ', s:'ـغ'}, 
        {h: 'ف', tr: 'Fe', b:'فـ', o:'ـفـ', s:'ـف'},
        {h: 'ق', tr: 'Qaf (Boğazdan)', b:'قـ', o:'ـقـ', s:'ـق'}, 
        {h: 'ك', tr: 'Kef', b:'كـ', o:'ـكـ', s:'ـك'},
        {h: 'ل', tr: 'Lam', b:'لـ', o:'ـلـ', s:'ـل'}, 
        {h: 'م', tr: 'Mim', b:'مـ', o:'ـمـ', s:'ـم'},
        {h: 'ن', tr: 'Nun', b:'نـ', o:'نـ', s:'ـن'}, 
        {h: 'و', tr: 'Waw', b:'و', o:'ـو', s:'ـو', nobind: true},
        {h: 'ه', tr: 'He', b:'هـ', o:'ـهـ', s:'ـه'}, 
        {h: 'ي', tr: 'Ye', b:'يـ', o:'ـيـ', s:'ـي'}
    ];
// --- WEB AUDIO API İLE SİNÜS DALGASI (SINE WAVE) SES ÜRETECİ ---
let audioCtx;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSineTone(freq1, freq2, duration) {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine'; // Sinüs Dalgası
    
    osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
    if(freq2) {
        osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
    }

    // Sesi yumuşak başlat ve bitir (Çıt sesini önler)
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Özel Ses Fonksiyonları
const playClick = () => { playSineTone(600, null, 0.1); };

const playCorrect = () => {
    playSineTone(440, null, 0.1); // La
    setTimeout(() => playSineTone(554.37, null, 0.1), 100); // Do#
    setTimeout(() => playSineTone(659.25, null, 0.3), 200); // Mi
};

const playWrong = () => {
    playSineTone(250, null, 0.15); // Kalın bip
    setTimeout(() => playSineTone(200, null, 0.25), 150); // Daha kalın bip
};

window.handleFlipBox = function(el) {
    playClick();
    if (el.classList.contains('is-flipped')) {
        clearTimeout(el.studyTimer);
        el.classList.remove('is-flipped');
    } else {
        el.classList.add('is-flipped');
        el.studyTimer = setTimeout(() => {
            el.classList.remove('is-flipped');
        }, 3000);
    }
};

const ui = {
    tab: (e, id) => {
        if (e) e.preventDefault(); 
        playClick(); 
        
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-trigger').forEach(t => t.classList.remove('active'));
        
        const target = document.getElementById(id);
        if(target) target.classList.add('active');
        
        if(e && e.currentTarget) e.currentTarget.classList.add('active');
    },
    init: () => {
        const g1 = document.getElementById('g1');
        g1.innerHTML = "";
        harfler.forEach(i => {
            const nc = i.nobind ? 'nobind' : '';
            g1.innerHTML += `
                <div class="char-card ${nc}">
                    <div class="arabic-seq" style="display: flex; justify-content: space-around; width: 100%; padding: 0 5px;">
                        <span class="b-green">${i.b}</span>
                        <span class="o-blue">${i.o}</span>
                        <span class="s-purple">${i.s}</span>
                        <span class="n-black">${i.h}</span>
                    </div>
                    <div class="tr-label">${i.tr}</div>
                </div>`;
        });
        
        const g2 = document.getElementById('g2');
        g2.innerHTML = "";
        harfler.forEach(i => {
            const nc = i.nobind ? 'nobind' : '';
            g2.innerHTML += `<div class="flip-box ${nc}" onclick="handleFlipBox(this)"><div class="flip-inner"><div class="face">${i.h}</div><div class="face face-back">${i.tr}</div></div></div>`;
        });
        
        if(typeof memoryGame !== 'undefined') memoryGame.init();
    }
};

const memoryGame = {
    mode: 'single', turn: 1, opened: [], matchedCount: 0, targetPairs: 9, scores: { p1: 0, p2: 0 },
    
    toggleSwitch: function(isMulti) {
        document.getElementById('mem-toggle').checked = isMulti;
        playClick();
        this.mode = isMulti ? 'multi' : 'single';
        this.init();
    },

    init: function() {
        const g3 = document.getElementById('g3');
        if (!g3) return;
        
        this.targetPairs = parseInt(document.getElementById('pairCount').value);
        g3.innerHTML = "";
        document.getElementById('resetArea').style.display = 'none';
        this.opened = []; this.matchedCount = 0; this.turn = 1; this.scores = { p1: 0, p2: 0 };
        
        document.getElementById('msc1').innerText = "0";
        document.getElementById('msc2').innerText = "0";
        
        this.updateTurnUI();

        let items = [];
        [...harfler].sort(() => Math.random() - 0.5).slice(0, this.targetPairs).forEach(h => {
            items.push({ text: h.h, match: h.tr });
            items.push({ text: h.tr, match: h.tr });
        });

        items.sort(() => Math.random() - 0.5).forEach(item => {
            const card = document.createElement('div');
            card.className = 'mem-item'; card.innerText = item.text; card.dataset.match = item.match;
            card.onclick = () => this.handleFlip(card);
            g3.appendChild(card);
        });

        let totalCards = this.targetPairs * 2;
        let cols = 4; 
        if (totalCards > 12) cols = 6; 
        if (totalCards > 24) cols = 7; 
        if (window.innerWidth <= 768) cols = (totalCards <= 12) ? 3 : 4;

        g3.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    },
    
    updateTurnUI: function() {
        const p1Box = document.getElementById('p1-box');
        const p2Box = document.getElementById('p2-box');
        const title1 = document.getElementById('p1-title');

        if (this.mode === 'single') {
            title1.innerText = "SKOR";
            p1Box.style.display = 'flex';
            p1Box.classList.remove('active-p'); 
            p2Box.style.display = 'none';
        } else {
            title1.innerText = "OYUNCU 1";
            p1Box.style.display = 'flex';
            p2Box.style.display = 'flex';
            p1Box.classList.toggle('active-p', this.turn === 1);
            p2Box.classList.toggle('active-p', this.turn === 2);
        }
    },
    
    handleFlip: function(card) {
        if (this.opened.length < 2 && !card.classList.contains('show') && !card.classList.contains('matched')) {
            playClick();
            const turnClass = this.turn === 1 ? 'p1-turn' : 'p2-turn';
            card.classList.add('show', turnClass);
            this.opened.push(card);
            if (this.opened.length === 2) setTimeout(() => this.checkMatch(), 600);
        }
    },
    
    checkMatch: function() {
        const [c1, c2] = this.opened;
        if (c1.dataset.match === c2.dataset.match) {
            playCorrect(); // Sinüs Dalgası ile Doğru Sesi
            
            c1.classList.add('matched'); c2.classList.add('matched');

            let activePlayer = this.mode === 'multi' ? this.turn : 1;
            this.scores['p' + activePlayer]++;
            document.getElementById('msc' + activePlayer).innerText = this.scores['p' + activePlayer];
            
            this.matchedCount++; this.opened = [];
            
            if (this.matchedCount === this.targetPairs) {
                document.getElementById('resetArea').style.display = 'block';
                setTimeout(() => {
                    let msg = "Tebrikler!";
                    if (this.mode === 'multi') msg = this.scores.p1 > this.scores.p2 ? "OYUNCU 1 KAZANDI! 🎉" : (this.scores.p2 > this.scores.p1 ? "OYUNCU 2 KAZANDI! 🎉" : "BERABERE! 🤝");
                    alert(msg);
                }, 400);
            }
        } else {
            playWrong(); // Sinüs Dalgası ile Yanlış Sesi
            
            setTimeout(() => {
                c1.classList.remove('show', 'p1-turn', 'p2-turn');
                c2.classList.remove('show', 'p1-turn', 'p2-turn');
                this.opened = [];
                if (this.mode === 'multi') { 
                    this.turn = this.turn === 1 ? 2 : 1; 
                    this.updateTurnUI(); 
                }
            }, 800);
        }
    }
};

const game = {
    score: {p1:0, p2:0}, cur: "", p1S: null, p2S: null, t1: 0, t2: 0, questionPool: [],
    fillPool: function() { this.questionPool = [...harfler].sort(() => Math.random() - 0.5); },
    start: function() {
        playClick(); 
        
        document.getElementById('startInfo').style.display = 'none'; 
        document.getElementById('duel-stage-container').style.display = 'flex';
        
        document.getElementById('z1').classList.remove('zone-correct', 'zone-wrong');
        document.getElementById('z2').classList.remove('zone-correct', 'zone-wrong');
        
        document.getElementById('countdown-overlay').style.display = 'none';
        const nBtn = document.getElementById('nextBtn');
        nBtn.style.display = 'none'; 
        
        this.p1S = this.p2S = null;
        if(this.questionPool.length === 0) this.fillPool();
        const target = this.questionPool.pop(); 
        this.cur = target.tr;
        
        ['1','2'].forEach(p => {
            document.getElementById(`dq${p}`).innerText = target.h;
            const grid = document.getElementById(`ag${p}`); 
            grid.innerHTML = "";
            let opts = [this.cur]; 
            while(opts.length < 4) { 
                let r = harfler[Math.floor(Math.random()*harfler.length)].tr; 
                if(!opts.includes(r)) opts.push(r); 
            }
            opts.sort(() => Math.random() - 0.5).forEach(o => { 
                grid.innerHTML += `<button class="btn-ans" onclick="game.select('${p}',this,'${o}')">${o}</button>`; 
            });
        });
    },
    select: function(p, btn, val) { 
        if(this[`p${p}S`] !== null) return; 
        playClick(); 
        this[`p${p}S`] = val; this[`t${p}`] = Date.now(); 
        btn.classList.add('selected'); 
        if(this.p1S && this.p2S) this.reveal(); 
    },
    reveal: function() {
        let p1Correct = (this.p1S === this.cur);
        let p2Correct = (this.p2S === this.cur);
        
        ['1','2'].forEach(p => {
            const z = document.getElementById(`z${p}`);
            const isCorrect = this[`p${p}S`] === this.cur;
            
            if(isCorrect) {
                z.classList.add('zone-correct'); 
                const popup = document.createElement('div'); 
                popup.className = 'puan-popup'; popup.innerText = "+5"; 
                z.appendChild(popup); setTimeout(() => popup.remove(), 1000);
                this.score[`p${p}`] += 5;
            } else { 
                z.classList.add('zone-wrong'); 
            }
        });

        if(p1Correct || p2Correct) playCorrect(); else playWrong();

        // 10 PUANLIK SİSTEM (Rakip Hatası Bonusu veya Hız Bonusu)
        if(p1Correct && !p2Correct) {
            this.score.p1 += 5;
            const p1Bonus = document.createElement('div'); 
            p1Bonus.className = 'puan-popup'; p1Bonus.innerText = "HATA BONUSU! +5"; p1Bonus.style.color = "#38bdf8"; p1Bonus.style.top = "15%";
            document.getElementById('z1').appendChild(p1Bonus); setTimeout(() => p1Bonus.remove(), 1000);
        } else if(p2Correct && !p1Correct) {
            this.score.p2 += 5;
            const p2Bonus = document.createElement('div'); 
            p2Bonus.className = 'puan-popup'; p2Bonus.innerText = "HATA BONUSU! +5"; p2Bonus.style.color = "#4ade80"; p2Bonus.style.top = "15%";
            document.getElementById('z2').appendChild(p2Bonus); setTimeout(() => p2Bonus.remove(), 1000);
        } else if(p1Correct && p2Correct) {
            if(this.t1 < this.t2) {
                this.score.p1 += 5;
                const p1Bonus = document.createElement('div'); 
                p1Bonus.className = 'puan-popup'; p1Bonus.innerText = "HIZLI! +5"; p1Bonus.style.color = "#38bdf8"; p1Bonus.style.top = "15%";
                document.getElementById('z1').appendChild(p1Bonus); setTimeout(() => p1Bonus.remove(), 1000);
            } else if(this.t2 < this.t1) {
                this.score.p2 += 5;
                const p2Bonus = document.createElement('div'); 
                p2Bonus.className = 'puan-popup'; p2Bonus.innerText = "HIZLI! +5"; p2Bonus.style.color = "#4ade80"; p2Bonus.style.top = "15%";
                document.getElementById('z2').appendChild(p2Bonus); setTimeout(() => p2Bonus.remove(), 1000);
            }
        }

        if(this.score.p1 > 100) this.score.p1 = 100;
        if(this.score.p2 > 100) this.score.p2 = 100;

        document.getElementById('sc1').innerText = this.score.p1; 
        document.getElementById('sc2').innerText = this.score.p2; 
        document.getElementById('pb1').style.width = this.score.p1 + '%';
        document.getElementById('pb2').style.width = this.score.p2 + '%';

        if(this.score.p1 >= 100 || this.score.p2 >= 100) {
            const nBtn = document.getElementById('nextBtn');
            nBtn.innerText = "🏆 YENİDEN BAŞLAT";
            nBtn.onclick = () => this.resetGame();
            nBtn.style.display = 'block'; 
            
            setTimeout(() => {
                if(this.score.p1 === 100 && this.score.p2 === 100) alert("İNANILMAZ! BERABERE BİTTİ! 🤝");
                else if(this.score.p1 >= 100) alert("OYUNCU 1 KAZANDI! 🎉");
                else alert("OYUNCU 2 KAZANDI! 🎉");
            }, 500);
        } else {
            // Animasyonlu Sayacı Başlat
            this.startCountdown();
        }
    },
    startCountdown: function() {
        const overlay = document.getElementById('countdown-overlay');
        const circle = document.getElementById('countdown-circle');
        
        // Önceki patlama animasyonunu temizle ve göster
        overlay.classList.remove('pop-out');
        overlay.style.display = 'block';
        
        // Çizgiyi sıfırla
        circle.style.transition = 'none';
        circle.style.strokeDashoffset = '0';
        
        // CSS'i yenile (Reflow)
        void circle.offsetWidth;
        
        // Saat yönünde (264 tam tur uzunluğudur) yavaşça erimesini sağla
        circle.style.transition = 'stroke-dashoffset 2s linear';
        circle.style.strokeDashoffset = '264'; 
        
        setTimeout(() => {
            // Süre dolduğunda patlama animasyonunu ekle
            overlay.classList.add('pop-out');
            
            // Patlama animasyonu bittikten sonra (0.4s) yeni soruya geç
            setTimeout(() => {
                overlay.style.display = 'none';
                this.start();
            }, 400); 
            
        }, 2000);
    },
    resetGame: function() {
        this.score = {p1:0, p2:0};
        document.getElementById('sc1').innerText = "0";
        document.getElementById('sc2').innerText = "0";
        document.getElementById('pb1').style.width = '0%';
        document.getElementById('pb2').style.width = '0%';
        this.start();
    }
};

ui.init();
