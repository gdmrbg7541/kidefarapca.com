<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfabeyi Pekiştir</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FV9JD15KLW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FV9JD15KLW');
    </script>
    <link rel="stylesheet" href="alfabe.css?v=7">
</head>
<body>

<div class="main-app">
    <nav class="nav-tabs">
        <a href="index.html" onclick="return kidefGeriDon(event)" target="_blank" class="home-link" title="Ana Sayfa">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
        <button class="tab-trigger active" onclick="ui.tab(event, 'p1')">Harf Tanıtımı</button>
        <button class="tab-trigger" onclick="ui.tab(event, 'p2')">Kartlar</button>
        <button class="tab-trigger" onclick="ui.tab(event, 'p3')">Hafıza</button>
        <button class="tab-trigger" onclick="ui.tab(event, 'p4')">Yarışma</button>
    </nav>

    <main class="content-area">
        <section id="p1" class="panel active"><div class="grid-intro" id="g1"></div></section>
        
        <section id="p2" class="panel"><div class="grid-flip" id="g2"></div></section>
        
        <section id="p3" class="panel">
            <div class="memory-controls">
                <div class="switch-wrapper">
                    <span style="font-size:1.2rem; cursor:pointer;" onclick="memoryGame.toggleSwitch(false)">👤</span>
                    <label class="switch">
                        <input type="checkbox" id="mem-toggle" onchange="memoryGame.toggleSwitch(this.checked)">
                        <span class="slider"></span>
                    </label>
                    <span style="font-size:1.2rem; cursor:pointer;" onclick="memoryGame.toggleSwitch(true)">👥</span>
                </div>
                <select id="pairCount" class="select-pair" onchange="memoryGame.init()">
                    <option value="6">6 Çift</option>
                    <option value="9" selected>9 Çift</option>
                    <option value="12">12 Çift</option>
                    <option value="14">14 Çift</option>
                </select>
            </div>

            <div class="score-board" id="score-board-area">
                <div id="p1-box" class="player-box">
                    <span class="p-label" id="p1-title">SKOR</span>
                    <span id="msc1" class="p-score">0</span>
                </div>
                <div class="grid-memory" id="g3"></div>
                <div id="p2-box" class="player-box">
                    <span class="p-label">OYUNCU 2</span>
                    <span id="msc2" class="p-score">0</span>
                </div>
            </div>
            <div id="resetArea" class="reset-area"><button class="reset-btn" onclick="memoryGame.init()">🔄 Yeniden Başlat</button></div>
        </section>

  <section id="p4" class="panel">
            <div id="duel-stage-container" style="position: relative;">
                
                <div style="width: 100%; display: flex; align-items: center; gap: 15px; margin-bottom: 10px;">
                    <button onclick="game.showMenu()" style="background: white; border: 2px solid var(--primary); color: var(--primary); border-radius: 10px; padding: 5px 15px; font-family: 'arakom'; font-size: 1.2rem; cursor: pointer; box-shadow: var(--shadow-sm); transition: 0.2s;">❮ GERİ</button>
                    
                    <div style="flex: 1; display: flex; gap: 15px;">
                        <div id="pb1-container" style="flex: 1; background: var(--p1-bg); height: 20px; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #bae6fd;">
                            <div id="pb1" style="height: 100%; width: 0%; background: #0284c7; transition: 0.4s ease-out;"></div>
                            <div style="position:absolute; top:0; left:0; width:100%; height:100%; background: repeating-linear-gradient(to right, transparent, transparent calc(10% - 1px), rgba(255,255,255,0.9) calc(10% - 1px), rgba(255,255,255,0.9) 10%); pointer-events: none;"></div>
                        </div>
                        <div id="pb2-container" style="flex: 1; background: var(--p2-bg); height: 20px; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #bbf7d0;">
                            <div id="pb2" style="height: 100%; width: 0%; background: #16a34a; transition: 0.4s ease-out;"></div>
                            <div style="position:absolute; top:0; left:0; width:100%; height:100%; background: repeating-linear-gradient(to right, transparent, transparent calc(10% - 1px), rgba(255,255,255,0.9) calc(10% - 1px), rgba(255,255,255,0.9) 10%); pointer-events: none;"></div>
                        </div>
                    </div>
                </div>

                <div class="duel-stage">
                    <div id="z1" class="player-zone">
                        <div id="z1-title" style="font-size:1.4rem; margin-bottom:5px; font-weight:bold; color:var(--primary);">SKOR: <b id="sc1">0</b></div>
                        <div class="q-display" id="dq1">?</div>
                        <div class="ans-grid" id="ag1"></div>
                    </div>
                    <div id="z2" class="player-zone">
                        <div id="z2-title" style="font-size:1.4rem; margin-bottom:5px; font-weight:bold; color:var(--primary);">SKOR: <b id="sc2">0</b></div>
                        <div class="q-display" id="dq2">?</div>
                        <div class="ans-grid" id="ag2"></div>
                    </div>
                </div>

                <div id="countdown-overlay" class="pro-countdown">
                    <div class="glow-core"></div>
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="42" class="track"></circle>
                        <circle id="countdown-circle" cx="50" cy="50" r="42" class="progress"></circle>
                    </svg>
                </div>

                <button id="nextBtn" class="next-btn" onclick="game.start()">SONRAKİ SORU ➔</button>
            </div>
            
            <div id="startInfo" style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; height: 100%; gap: 30px;">
                <h2 style="color: var(--primary); font-size: 2.5rem; margin-bottom: -10px;">OYUN MODU</h2>
                
                <div class="switch-wrapper" style="padding: 15px 30px; border-radius: 50px; background: white; box-shadow: var(--shadow-md); border: 2px solid #e2e8f0; gap: 20px;">
                    <span style="font-size:2.5rem; cursor:pointer; user-select: none;" onclick="game.toggleMode('single')">👤</span>
                    <label class="switch switch-large">
                        <input type="checkbox" id="yarisma-toggle" onchange="game.toggleMode(this.checked ? 'multi' : 'single')" checked>
                        <span class="slider"></span>
                    </label>
                    <span style="font-size:2.5rem; cursor:pointer; user-select: none;" onclick="game.toggleMode('multi')">👥</span>
                </div>

                <button onclick="game.start()" style="padding:20px 60px; font-family:'arakom'; font-size:2.2rem; cursor:pointer; background:var(--accent); color:white; border:none; border-radius:20px; box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4); transition: transform 0.2s;">BAŞLA</button>
            </div>
        </section>
    </main>
</div>

<script src="alfabe_harf_detay.js?v=14"></script>
<script src="alfabe.js?v=4"></script>
    <script src="geri.js"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
</html>
