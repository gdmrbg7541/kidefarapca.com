<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arapça Akademi - Profesyonel Panel</title>
    <style>
        @font-face {
            font-family: 'arakom';
            src: url('arakom.ttf') format('truetype');
            font-weight: normal; font-style: normal;
        }

        :root {
            --primary: #0f172a;
            --accent: #d97706;
            --success: #10b981;
            --danger: #ef4444;
            --p1-bg: #e0f2fe;
            --p2-bg: #f0fdf4;
            --bg-glass: rgba(255, 255, 255, 0.93);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'arakom', sans-serif; 
            height: 100vh; width: 100vw;
            background: url('arakom.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .main-app { 
            width: 98vw; height: 96vh;
            background: var(--bg-glass); 
            backdrop-filter: blur(12px);
            border-radius: 15px;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* Sekmeler Ortalandı */
        .nav-tabs { display: flex; background: var(--primary); padding: 5px 10px 0; gap: 4px; direction: rtl; justify-content: center; }
        .tab-trigger { 
            padding: 12px 25px; border: none; background: rgba(255,255,255,0.1);
            color: white; cursor: pointer; font-family: 'arakom'; font-size: 1.2rem;
            border-radius: 8px 8px 0 0;
        }
        .tab-trigger.active { background: var(--bg-glass); color: var(--primary); font-weight: bold; }

        .content-area { flex: 1; padding: 10px; overflow: hidden; }
        .panel { display: none; height: 100%; width: 100%; }
        .panel.active { display: block; }

        /* Harf Tanıtımı */
        .grid-intro { 
            display: grid; gap: 6px; height: 100%; 
            grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(4, 1fr);
            direction: rtl;
        }
        .char-card {
            background: white; border: 1px solid #e2e8f0; border-radius: 8px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 5px;
        }
        .arabic-seq { font-size: 2.2rem; color: var(--primary); display: flex; gap: 15px; }
        .tr-label { font-size: 1.1rem; color: #64748b; font-weight: bold; margin-top: 5px; }

        /* Kartlar */
        .grid-flip { 
            display: grid; gap: 6px; height: 100%; 
            grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(7, 1fr);
            direction: rtl;
        }
        .flip-box { perspective: 1000px; cursor: pointer; height: 100%; }
        .flip-inner { position: relative; width: 100%; height: 100%; transition: transform 0.4s; transform-style: preserve-3d; }
        .flip-box.is-flipped .flip-inner { transform: rotateY(180deg); }
        .face { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; border: 2px solid var(--accent); background: white;
        }
        .face-back { background: var(--accent); color: white; transform: rotateY(180deg); font-size: 1.8rem; }

        /* Hafıza Oyunu Stilleri */
        .grid-memory { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; height: 80%; direction: rtl; }
        .mem-item { background: var(--primary); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: transparent; font-size: 2rem; }
        .mem-item.show { background: white; color: var(--primary); border: 3px solid var(--primary); }
        .hidden-card { visibility: hidden; opacity: 0; pointer-events: none; }
        
        .mode-selector { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .mode-btn { padding: 8px 20px; font-family: 'arakom'; cursor: pointer; border-radius: 8px; border: 2px solid var(--primary); background: white; }
        .mode-btn.active { background: var(--primary); color: white; }
        .turn-indicator { text-align: center; font-size: 1.2rem; margin-bottom: 10px; padding: 5px; border-radius: 5px; }
        .turn-p1 { background-color: var(--p1-bg); border: 2px solid #3498db; }
        .turn-p2 { background-color: var(--p2-bg); border: 2px solid #2ecc71; }
        .reset-area { display: none; text-align: center; margin-top: 10px; }
        .reset-btn { font-size: 2rem; cursor: pointer; background: none; border: none; }

        /* Yarışma */
        #p4.active { display: flex; flex-direction: column; }
        .duel-stage { display: flex; flex: 1; margin-bottom: 10px; }
        .player-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 20px; position: relative; }
        #z1 { background-color: var(--p1-bg); border-radius: 15px 0 0 15px; }
        #z2 { background-color: var(--p2-bg); border-radius: 0 15px 15px 0; }
        .q-display { font-size: 8rem; font-weight: bold; color: var(--primary); }
        .ans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; height: 35%; }
        .btn-ans { border: none; background: white; border-radius: 10px; font-family: 'arakom'; font-size: 1.8rem; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .btn-ans.selected { background: #94a3b8; color: white; }
        .zone-correct { background-color: var(--success) !important; color: white !important; }
        .zone-wrong { background-color: var(--danger) !important; color: white !important; animation: shake 0.4s; }
        .puan-popup { position: absolute; font-size: 2.5rem; font-weight: bold; color: #ffd700; animation: floatUp 1s forwards; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .next-btn { height: 50px; width: 100%; background: var(--primary); color: white; font-family: 'arakom'; font-size: 1.5rem; border: none; border-radius: 10px; cursor: pointer; display: none; }
.nobind { color: var(--danger) !important; font-weight: bold; }
/* Harf Konum Renkleri */
.b-green { color: #16a34a !important; } /* Başta: Yeşil */
.o-blue  { color: #2563eb !important; } /* Ortada: Mavi */
.s-purple { color: #9333ea !important; } /* Sonda: Mor */
.n-black { color: var(--primary) !important; } /* Normal: Siyah/Lacivert */

/* Nobind (Asi Harfler) için Kırmızı Vurgusu (Diğer renkleri ezer) */
.nobind span { 
    color: var(--danger) !important; 
    font-weight: bold; 
}

/* Harf arkasındaki kılavuz çizgisi */
.arabic-seq {
    position: relative;
    padding: 10px 5px;
    z-index: 1;
}

/* Çizgiyi oluşturur */
.arabic-seq::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 60%; /* Harflerin hizalanacağı satır yüksekliği biraz aşağı çekildi */
    height: 2px; /* Çizgi kalınlığı 1.5'tan 2'ye çıkarıldı */
    background-color: rgba(0, 0, 0, 0.30); /* Opaklık 0.1'den 0.25'e çıkarılarak koyulaştırıldı */
    z-index: -1;
}

/* Kırmızı harfler (nobind) için çizgiyi de biraz belirginleştirebilirsiniz (isteğe bağlı) */
.nobind .arabic-seq::before {
    background-color: rgba(239, 68, 68, 0.15);
}
/* Ana Sayfa İkonu Stili */
.home-link {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 15px;
    text-decoration: none;
    background: rgba(255, 255, 255, 0.15); /* Hafif şeffaf arka plan */
    border-radius: 12px 12px 0 0;
    margin-right: 10px;
    transition: 0.3s;
}

.home-link:hover {
    background: var(--accent); /* Üzerine gelince vurgu rengi */
    transform: translateY(-2px);
}

.home-icon {
    font-size: 1.5rem;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}

/* Mobilde hizalama düzeltmesi */
/* MOBİL UYARLAMA: 7 Satır x 4 Sütun */
@media (max-width: 768px) {
    .grid-intro { 
        grid-template-columns: repeat(4, 1fr) !important; 
        grid-template-rows: repeat(7, 1fr) !important;
        height: 100% !important; 
    }
    
    .arabic-seq { 
        font-size: 1.5rem !important; /* Mobilde harfler taşmaması için hafif küçültüldü */
        gap: 8px !important;
    }

    .char-card {
        padding: 2px !important;
    }
}
    </style>
</head>
<body>

<div class="main-app">
    <nav class="nav-tabs">
        <a href="https://kidefarapca.com" target="_blank" class="home-link" title="Ana Sayfaya Git">
        <span class="home-icon">🏠</span>
    </a>
        <button class="tab-trigger active" onclick="ui.tab(event, 'p1')">Harf Tanıtımı</button>
        <button class="tab-trigger" onclick="ui.tab(event, 'p2')">Kartlar</button>
        <button class="tab-trigger" onclick="ui.tab(event, 'p3')">Hafıza</button>
        <button class="tab-trigger" onclick="ui.tab(event, 'p4')">Yarışma</button>
    </nav>

    <main class="content-area">
        <section id="p1" class="panel active"><div class="grid-intro" id="g1"></div></section>
        <section id="p2" class="panel"><div class="grid-flip" id="g2"></div></section>
        <section id="p3" class="panel">
            <div class="mode-selector">
                <button id="btn-single" class="mode-btn active" onclick="memoryGame.setMode('single')">TEK KİŞİLİK</button>
                <button id="btn-multi" class="mode-btn" onclick="memoryGame.setMode('multi')">İKİ KİŞİLİK</button>
            </div>
            <div id="turnDisplay" class="turn-indicator" style="display:none;">SIRA: OYUNCU 1</div>
            <div class="grid-memory" id="g3"></div>
            <div id="resetArea" class="reset-area"><button class="reset-btn" onclick="memoryGame.init()">🔄</button></div>
        </section>
        <section id="p4" class="panel">
            <div class="duel-stage">
                <div id="z1" class="player-zone"><div style="font-size:1.5rem">SKOR: <b id="sc1">0</b></div><div class="q-display" id="dq1">?</div><div class="ans-grid" id="ag1"></div></div>
                <div id="z2" class="player-zone"><div style="font-size:1.5rem">SKOR: <b id="sc2">0</b></div><div class="q-display" id="dq2">?</div><div class="ans-grid" id="ag2"></div></div>
            </div>
            <button id="nextBtn" class="next-btn" onclick="game.start()">SONRAKİ SORU ➔</button>
            <div id="startInfo" style="text-align:center; padding: 10px;"><button onclick="game.start()" style="padding:10px 40px; font-family:'arakom'; font-size:1.5rem; cursor:pointer; background:var(--accent); color:white; border:none; border-radius:10px;">YARIŞMAYI BAŞLAT</button></div>
        </section>
    </main>
</div>

<script>
const harfler = [
    {h: 'ا', tr: 'Elif', b:'ا', o:'ـا', s:'ـا', nobind: true}, 
    {h: 'ب', tr: 'Be', b:'بـ', o:'ـبـ', s:'ـب'},
    {h: 'ت', tr: 'Te', b:'تـ', o:'ـتـ', s:'ـت'}, 
    {h: 'ث', tr: 'Se', b:'ثـ', o:'ـثـ', s:'ـث'},
    {h: 'ج', tr: 'Cim', b:'جـ', o:'ـجـ', s:'ـج'}, 
    {h: 'ح', tr: 'Ha', b:'حـ', o:'ـحـ', s:'ـح'},
    {h: 'خ', tr: 'Hı', b:'خـ', o:'ـخـ', s:'ـخ'}, 
    {h: 'د', tr: 'Dal', b:'د', o:'ـد', s:'ـد', nobind: true},
    {h: 'ذ', tr: 'Zel', b:'ذ', o:'ـذ', s:'ـذ', nobind: true}, 
    {h: 'ر', tr: 'Ra', b:'ر', o:'ـر', s:'ـر', nobind: true},
    {h: 'ز', tr: 'Ze', b:'ز', o:'ـز', s:'ـز', nobind: true}, 
    {h: 'س', tr: 'Sin', b:'سـ', o:'ـسـ', s:'ـس'},
    {h: 'ش', tr: 'Şın', b:'شـ', o:'ـشـ', s:'ـش'}, 
    {h: 'ص', tr: 'Sad', b:'صـ', o:'ـصـ', s:'ـص'},
    {h: 'ض', tr: 'Dad', b:'ضـ', o:'ـضـ', s:'ـض'}, 
    {h: 'ط', tr: 'Tı', b:'طـ', o:'ـطـ', s:'ـط'},
    {h: 'ظ', tr: 'Zı', b:'ظـ', o:'ـظـ', s:'ـظ'}, 
    {h: 'ع', tr: 'Ayın', b:'عـ', o:'ـعـ', s:'ـع'},
    {h: 'غ', tr: 'Gayın', b:'غـ', o:'ـغـ', s:'ـغ'}, 
    {h: 'ف', tr: 'Fe', b:'فـ', o:'ـفـ', s:'ـف'},
    {h: 'ق', tr: 'Kaf', b:'قـ', o:'ـقـ', s:'ـق'}, 
    {h: 'ك', tr: 'Kef', b:'كـ', o:'ـكـ', s:'ـك'},
    {h: 'ل', tr: 'Lam', b:'لـ', o:'ـلـ', s:'ـل'}, 
    {h: 'م', tr: 'Mim', b:'مـ', o:'ـمـ', s:'ـم'},
    {h: 'ن', tr: 'Nun', b:'نـ', o:'ـنـ', s:'ـن'}, 
    {h: 'و', tr: 'Vav', b:'و', o:'ـو', s:'ـو', nobind: true},
    {h: 'ه', tr: 'He', b:'هـ', o:'ـهـ', s:'ـه'}, 
    {h: 'ي', tr: 'Ye', b:'يـ', o:'ـيـ', s:'ـي'}
];

    const ui = {
        tab: (e, id) => {
            document.querySelectorAll('.panel, .tab-trigger').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            e.currentTarget.classList.add('active');
        },
init: () => {
    const g1 = document.getElementById('g1');
    g1.innerHTML = ""; 
    harfler.forEach(i => {
        const nobindClass = i.nobind ? 'nobind' : '';
        g1.innerHTML += `
            <div class="char-card ${nobindClass}">
                <div class="arabic-seq">
                    <span class="b-green">${i.b}</span>
                    <span class="o-blue">${i.o}</span>
                    <span class="s-purple">${i.s}</span>
                    <span class="n-black">${i.h}</span>
                </div>
                <div class="tr-label">${i.tr}</div>
            </div>`;
    });
    
    const g2 = document.getElementById('g2');
    g2.innerHTML = ""; 
    harfler.forEach(i => {
        const nobindClass = i.nobind ? 'nobind' : '';
        g2.innerHTML += `
            <div class="flip-box ${nobindClass}" onclick="this.classList.toggle('is-flipped')">
                <div class="flip-inner">
                    <div class="face">${i.h}</div>
                    <div class="face face-back">${i.tr}</div>
                </div>
            </div>`;
    });
    
    memoryGame.init();
}
    };

    const memoryGame = {
        mode: 'single', turn: 1, opened: [], matchedCount: 0,
        setMode: function(m) {
            this.mode = m;
            document.getElementById('btn-single').classList.toggle('active', m === 'single');
            document.getElementById('btn-multi').classList.toggle('active', m === 'multi');
            this.init();
        },
        init: function() {
            const g3 = document.getElementById('g3');
            g3.innerHTML = "";
            document.getElementById('resetArea').style.display = 'none';
            this.opened = []; this.matchedCount = 0; this.turn = 1;
            
            const turnDisplay = document.getElementById('turnDisplay');
            if (this.mode === 'multi') { turnDisplay.style.display = 'block'; this.updateTurnUI(); }
            else { turnDisplay.style.display = 'none'; }

            let selected = [...harfler].slice(0, 9);
            let items = [];
            selected.forEach(h => {
                items.push({ text: h.h, match: h.tr });
                items.push({ text: h.tr, match: h.tr });
            });

            items.sort(() => Math.random() - 0.5).forEach(item => {
                const card = document.createElement('div');
                card.className = 'mem-item';
                card.innerText = item.text;
                card.dataset.match = item.match;
                card.onclick = () => this.handleFlip(card);
                g3.appendChild(card);
            });
        },
        updateTurnUI: function() {
            const td = document.getElementById('turnDisplay');
            td.innerText = `SIRA: OYUNCU ${this.turn}`;
            td.className = `turn-indicator ${this.turn === 1 ? 'turn-p1' : 'turn-p2'}`;
        },
        handleFlip: function(card) {
            if (this.opened.length < 2 && !card.classList.contains('show')) {
                card.classList.add('show');
                this.opened.push(card);
                if (this.opened.length === 2) this.checkMatch();
            }
        },
        checkMatch: function() {
            const [c1, c2] = this.opened;
            if (c1.dataset.match === c2.dataset.match) {
                setTimeout(() => {
                    c1.classList.add('hidden-card'); c2.classList.add('hidden-card');
                    this.matchedCount++; this.opened = [];
                    if (this.matchedCount === 9) document.getElementById('resetArea').style.display = 'block';
                }, 600);
            } else {
                setTimeout(() => {
                    c1.classList.remove('show'); c2.classList.remove('show');
                    this.opened = [];
                    if (this.mode === 'multi') { this.turn = this.turn === 1 ? 2 : 1; this.updateTurnUI(); }
                }, 800);
            }
        }
    };

    const game = {
        score: {p1:0, p2:0}, cur: "", p1S: null, p2S: null, t1: 0, t2: 0,
        start: function() {
            document.getElementById('startInfo').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            this.p1S = this.p2S = null;
            const target = harfler[Math.floor(Math.random()*harfler.length)];
            this.cur = target.tr;
            ['1','2'].forEach(p => {
                const z = document.getElementById(`z${p}`);
                z.className = 'player-zone';
                document.getElementById(`dq${p}`).innerText = target.h;
                const grid = document.getElementById(`ag${p}`); grid.innerHTML = "";
                let opts = [this.cur];
                while(opts.length < 4) { let r = harfler[Math.floor(Math.random()*harfler.length)].tr; if(!opts.includes(r)) opts.push(r); }
                opts.sort(() => Math.random() - 0.5).forEach(o => {
                    grid.innerHTML += `<button class="btn-ans" onclick="game.select('${p}',this,'${o}')">${o}</button>`;
                });
            });
        },
        select: function(p, btn, val) {
            if(this[`p${p}S`] !== null) return;
            this[`p${p}S`] = val;
            this[`t${p}`] = Date.now();
            btn.classList.add('selected');
            if(this.p1S && this.p2S) this.reveal();
        },
        reveal: function() {
            ['1','2'].forEach(p => {
                const z = document.getElementById(`z${p}`);
                if(this[`p${p}S`] === this.cur) {
                    z.classList.add('zone-correct'); 
                    const popup = document.createElement('div');
                    popup.className = 'puan-popup'; popup.innerText = "+5";
                    z.appendChild(popup); setTimeout(() => popup.remove(), 1000);
                    this.score[`p${p}`] += 5;
                } else { z.classList.add('zone-wrong'); }
            });
            if(this.p1S === this.cur && this.p2S === this.cur) {
                if(this.t1 < this.t2) this.score.p1 += 5; else if(this.t2 < this.t1) this.score.p2 += 5;
            }
            document.getElementById('sc1').innerText = this.score.p1;
            document.getElementById('sc2').innerText = this.score.p2;
            document.getElementById('nextBtn').style.display = 'block';
        }
    };

    ui.init();
</script>
</body>
</html>
