<script>
/* ---- SEKME ŞERİDİ AÇ/KAPA ------------------------------------------
   Sınıfta tam ekran kullanabilmek için şerit katlanabiliyor: kumandadaki
   LİSTE simgesine basınca şerit kapanır ve yalnız küçük kumanda kalır,
   tekrar basınca geri gelir. Şerit kapalıyken içerik alanı o kadar büyür.
   Sekme seçmek şeridi KAPATMAZ; art arda sekme gezilebilsin diye açık
   kalır. Kapatma kararı hep kullanıcınındır. */
function navKapat() {
    var k = document.querySelector('.main-app');
    if (!k) return;
    k.classList.add('nav-gizli');
    /* HEMEN SAYDAM: kapatma düğmesine basıldığında imleç hâlâ kumandanın
       üstünde kalıyor ve :hover kuralı onu opak tutuyordu; saydamlaşması
       için fareyi başka yere götürmek gerekiyordu. "nm-donuk" hover'ı
       geçici olarak devre dışı bırakır, imleç kumandadan AYRILINCA kalkar
       (o andan sonra üstüne gelmek yine tam görünür yapar). */
    var m = document.getElementById('navMini');
    if (m) {
        m.classList.add('nm-donuk');
        /* İşaret, kullanıcı imleci İLK KEZ oynattığında kalkar. Böylece
           hem "düğmenin üstünde kalan imleç" hâli çözülür, hem de sonradan
           bilerek üstüne gelindiğinde kumanda yine tam görünür olur.
           (Yalnız pointerleave'e bağlansaydı, imleç hiç kumandanın üstünde
           değilken kapatılan durumlarda işaret takılı kalırdı.) */
        var birak = function () {
            m.classList.remove('nm-donuk');
            document.removeEventListener('pointermove', birak, true);
            document.removeEventListener('mousemove', birak, true);
        };
        document.addEventListener('pointermove', birak, true);
        document.addEventListener('mousemove', birak, true);
    }
    navAdYaz();
}
function navAc(e) {
    var k = document.querySelector('.main-app');
    if (!k) return;
    var m = document.getElementById('navMini');
    if (k.classList.contains('nav-gizli')) {
        k.classList.remove('nav-gizli');
        if (m) m.classList.remove('nm-donuk');
    } else {
        navKapat();
        /* Fare tıklamasıysa odağı bırak: :focus-within de kumandayı opak
           tutuyor. Klavyeyle (Enter/Boşluk) gelindiyse odak korunur. */
        if (e && e.detail > 0 && document.activeElement &&
            m && m.contains(document.activeElement)) {
            try { document.activeElement.blur(); } catch (h) { }
        }
    }
    navAdYaz();
    if (typeof playClick === 'function') { try { playClick(); } catch (h) { } }
}

/* NOT: Şerit kapanırken çalışan "cin" uçuşu (şeridin kopyasının büzülüp
   liste simgesine akması) KALDIRILDI. O animasyonun tek amacı şeridin
   nereye gittiğini göstermekti; artık liste simgesinin yanındaki
   yukarı/aşağı ok bunu anlatıyor, kumanda da kapalıyken saydamlaşarak
   arkasını gösteriyor. Ölçeklenme animasyonuna gerek kalmadı. */

/* ---- ANA SAYFA DÜĞMESİ: KAPALIYKEN İKİ AŞAMALI --------------------
   Kumanda katlıyken çok saydam durduğu için ana sayfa simgesine yanlışlıkla
   dokunmak sayfadan çıkarıyordu. Artık kapalıyken İLK dokunuş yalnız
   kumandayı açar; kullanıcı ne yaptığını görür. Kumanda AÇIKKEN aynı
   simgeye basmak ana sayfaya götürür. */
function navAnaSayfa(e) {
    var k = document.querySelector('.main-app');
    if (k && k.classList.contains('nav-gizli')) {
        if (e && e.preventDefault) e.preventDefault();
        navAc(e);                     /* kapalıydı → açar */
        return false;
    }
    return kidefGeriDon(e);           /* açıktı → ana sayfaya */
}

/* geri.js, YAKALAMA evresinde document'a bir dinleyici koyar ve href'i
   index.html olan bütün bağlantıları keser (sayfa yeni sekmede açıldıysa
   sekmeyi kapatmak için). O dinleyici bizim onclick'imizden ÖNCE çalıştığı
   için "kumanda kapalıyken önce aç" kuralı devreye giremiyordu — fare
   hover'la kumanda tam görünür olsa bile ilk tıklama sayfadan çıkarıyordu.
   Bu dinleyici geri.js'ten ÖNCE kaydedildiğinden ondan da önce çalışır:
   kumanda kapalıysa olayı tamamen durdurur ve yalnız kumandayı açar. */
document.addEventListener('click', function (e) {
    var a = (e.target && e.target.closest) ? e.target.closest('#navEv') : null;
    if (!a) return;
    var k = document.querySelector('.main-app');
    if (!k || !k.classList.contains('nav-gizli')) return;   /* açıkken normal davranış */
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
    navAc(e);
}, true);

function navAdYaz() {
    var ad = document.getElementById('navMiniAd');
    var a = document.querySelector('.tab-trigger.active');
    if (ad && a) {
        var y = a.querySelector('.tab-ad');
        ad.textContent = (y ? y.textContent : a.textContent).trim();
    }
    /* Ekran okuyucu için durum: ok görsel olarak zaten yön gösteriyor. */
    var k = document.querySelector('.main-app');
    var t = document.querySelector('#navMini .nm-menu');
    var gizli = !!(k && k.classList.contains('nav-gizli'));
    if (k && t) t.setAttribute('aria-expanded', gizli ? 'false' : 'true');
    /* Ana sayfa simgesinin ipucu duruma göre: kapalıyken önce kumandayı açar */
    var ev = document.getElementById('navEv');
    if (ev) {
        var ip = gizli ? 'Önce kumandayı açar (tekrar dokun → Ana Sayfa)' : 'Ana Sayfa';
        ev.setAttribute('title', ip);
        ev.setAttribute('aria-label', ip);
    }
}

/* ---- KUMANDAYI SÜRÜKLE ---------------------------------------------
   Kumanda HER AÇILIŞTA SOL ÜST köşede başlar; kullanıcı isterse
   tutamaçtan tutup ekranda istediği yere taşır. Bırakılan yer BİLEREK
   kaydedilmiyor: sayfa yenilendiğinde ya da başka bir sekmeden
   dönüldüğünde kumanda hep aynı, beklenen yerde bulunsun diye. */
(function () {
    function kur() {
        var kap = document.getElementById('navMini');
        var tut = document.getElementById('navMiniTut');
        if (!kap || !tut) return;
        var sx = 0, sy = 0, bx = 0, by = 0, suruk = false;

        function yerle(x, y) {
            var g = kap.getBoundingClientRect();
            var enB = window.innerWidth - g.width - 4;
            var boyB = window.innerHeight - g.height - 4;
            x = Math.max(4, Math.min(x, Math.max(4, enB)));
            y = Math.max(4, Math.min(y, Math.max(4, boyB)));
            kap.style.left = x + 'px'; kap.style.top = y + 'px';
            kap.style.right = 'auto'; kap.style.bottom = 'auto';
            return [x, y];
        }
        tut.addEventListener('pointerdown', function (e) {
            var g = kap.getBoundingClientRect();
            suruk = true; sx = e.clientX; sy = e.clientY; bx = g.left; by = g.top;
            kap.classList.add('nm-tasiniyor');
            try { tut.setPointerCapture(e.pointerId); } catch (h) { }
            e.preventDefault();
        });
        tut.addEventListener('pointermove', function (e) {
            if (!suruk) return;
            yerle(bx + (e.clientX - sx), by + (e.clientY - sy));
            e.preventDefault();
        });
        function bit() {
            if (!suruk) return;
            suruk = false; kap.classList.remove('nm-tasiniyor');
        }
        tut.addEventListener('pointerup', bit);
        tut.addEventListener('pointercancel', bit);
        tut.addEventListener('lostpointercapture', bit);
        /* Emniyet: pointerup tutamaca ulaşmazsa (odak kaybı, dokunma iptali)
           sürükleme durumu takılı kalmasın. */
        window.addEventListener('pointerup', bit);
        window.addEventListener('pointercancel', bit);

        /* Eski sürümlerden kalan kayıtlı konum varsa temizlenir. */
        try { localStorage.removeItem('kidefAlfabeKumanda'); } catch (e) { }
        window.addEventListener('resize', function () {
            var g = kap.getBoundingClientRect(); yerle(g.left, g.top);
        });
        navAdYaz();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', kur);
    else kur();
})();

/* ---- DIŞARIYA DOKUNUNCA ŞERİT KAPANIR ------------------------------
   Şerit açıkken sayfanın herhangi bir yerine (harf kartı, oyun, düğme)
   dokunulduğunda şerit kendiliğinden katlanır ve çalışma alanı serbest
   kalır. Kumandanın KENDİ içine yapılan dokunuşlar sayılmaz: sekme
   seçmek şeridi kapatmaz, art arda sekme gezilebilir.
   Yakalama evresinde dinlenir ki sayfadaki bir öge olayı durdursa bile
   çalışsın. */
document.addEventListener('pointerdown', function (e) {
    var k = document.querySelector('.main-app');
    if (!k || k.classList.contains('nav-gizli')) return;
    var m = document.getElementById('navMini');
    if (m && e.target && (e.target === m || m.contains(e.target))) return;
    navKapat();
}, true);
/* Gömülü çerçevedeki (Dinle ve Yaz) tıklamalar üst sayfaya ulaşmaz;
   odak çerçeveye geçtiğinde de şeridi kapatırız. */
window.addEventListener('blur', function () {
    setTimeout(function () {
        var a = document.activeElement;
        if (a && a.tagName === 'IFRAME') navKapat();
    }, 0);
});

/* Escape: şerit kapalıysa geri getirir.
   AMA harf büyüteci (harfDetay) açıksa Escape önce onu kapatır; aynı
   tuşla şeridin de açılması şaşırtıcı oluyordu. */
document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var ov = document.getElementById('hd-overlay');
    if (ov && getComputedStyle(ov).display !== 'none') return;   /* büyüteç açık */
    var k = document.querySelector('.main-app');
    if (k && k.classList.contains('nav-gizli')) { navAc(); e.preventDefault(); }
});

/* Çerçeveyi ilk açılışta yükler; sekmeye hiç girilmezse boşuna yüklenmez. */
function dvyAc() {
    var f = document.getElementById('dvyCerceve');
    if (f && !f.getAttribute('src')) f.setAttribute('src', 'dinleveyaz.html?gomulu=1');
}
