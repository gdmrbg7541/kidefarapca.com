<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mezid Fiil Maratonu v21</title>
     <script async src="https://www.googletagmanager.com/gtag/js?id=G-FV9JD15KLW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-FV9JD15KLW');
</script>
    <link rel="stylesheet" href="telaffuzmezid.css">

    <link rel="stylesheet" href="arakom.css?v=1">
</head>
<body>

<div id="game-wrapper">
    <div id="top-bar-panel">
        <div class="header-item"><button class="back-nav" onclick="goBack()">❮ GERİ</button></div>
        <div class="header-item"><div id="stage-label" class="stage-badge ui-hidden">MAZİ</div></div>
        <div class="header-item"><button id="chrono-main" class="chrono-btn" onclick="handleChronoClick()">⏱️</button></div>
        <div class="header-item"><button id="pause-btn" class="pause-circle ui-hidden" onclick="togglePause()">||</button></div>
        <div class="header-item"><div class="timer-val ui-hidden" id="timer-display">0.00</div></div>
        <div class="header-item"><div class="score-val ui-hidden" id="live-total-score">100</div></div>
    </div>

    <div class="main-content" style="flex:1; display:flex; position:relative; overflow:hidden;">
        <div id="overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); backdrop-filter: blur(8px); z-index: 100; display: none; align-items: center; justify-content: center;">
            <button id="start-btn-ui" class="back-nav" style="padding: 20px 60px; font-size: 2.2rem; background: var(--success); color: white; border: none; border-radius: 50px;" onclick="startCountdown()">BAŞLA!</button>
            <div id="countdown-text" style="font-size: 12rem; font-weight: bold; color: var(--primary); display: none;">3</div>
        </div>

        <button id="prev-arr" class="nav-arrow" style="left:15px;" onclick="changeStage(-1)">❮</button>
        <button id="next-arr" class="nav-arrow" style="right:15px;" onclick="changeStage(1)">❯</button>

        <div id="game-container" style="flex:1; display:flex;">
            <div id="screen-bap" class="screen active"><div id="bap-list" class="grid-3"></div></div>
            <div id="screen-fiil" class="screen"><div id="fiil-list" class="grid-3"></div></div>
            <div id="screen-play" class="screen"><div id="table-view" class="verb-table"></div></div>
            <div id="screen-result" class="screen" style="text-align:center; overflow-y:auto; padding: 40px;">
                <h1 style="color:var(--primary); font-size: 2.5rem;">Yarış Sonucu</h1>
                <div style="font-size: 7rem; color: var(--success); font-weight: bold;" id="final-score">0</div>
                <p id="final-stats" style="font-size:1.6rem; color: #576574;"></p>
                <h3 style="margin-top:25px; color: var(--danger);">Yanlış Okunanlar:</h3>
                <div id="error-list"></div>
                <button class="back-nav" style="margin-top:40px; background:var(--primary); color:white; padding: 15px 40px;" onclick="resetToFiilSelection()">ÖRNEK FİİLLERE DÖN</button>
            </div>
        </div>
    </div>
</div>

<script src="telaffuzmezid.js"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
</html>
