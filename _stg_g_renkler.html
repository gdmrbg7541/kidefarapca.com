<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport"/>
<title>Arapça Renk Oyunu</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="renkler.css?v=6">
</head>
<body>
<a href="index.html" id="renkler-home-btn" title="Ana Sayfa" aria-label="Ana Sayfa" style="position:fixed; top:12px; left:12px; z-index:1000; background:var(--primary-color,#5E81AC); color:#fff; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.2); text-decoration:none;"><svg viewBox="0 0 24 24" fill="currentColor" style="width:24px;height:24px;pointer-events:none;"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg></a>
<div id="game-wrapper">
    <div class="screen active" id="start-screen">
        <h1 class="start-title">Arapça Renk Oyunu</h1>
        <div class="start-options">
            <div class="option-group">
                <label for="player-select">Oyuncu Sayısı:</label>
                <div class="player-buttons" id="player-select">
                    <button class="player-button" data-players="1">Tek Kişilik</button>
                    <button class="player-button" data-players="2">İki Kişilik</button>
                </div>
            </div>
            <button disabled id="start-game-btn">Başla</button>
        </div>
    </div>
    <div class="screen" id="quiz-screen"></div>
    <div class="screen results-screen" id="results-screen"></div>
</div>

<script src="renkler.js?v=6"></script>
<script id="kidef-koruma">
/* KAYNAK KORUMA (CAYDIRICI) — sag tik + gelistirici araclari kisayollari.
   Not: Tam guvenlik degildir; asil koruma Firestore kurallarindadir. */
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();},false);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase(), m=e.ctrlKey||e.metaKey;
    if(e.keyCode===123||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u')){e.preventDefault();return false;}
  },false);
})();
</script>
</body>
</html>
